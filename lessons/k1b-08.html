<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>第8课 白天与黑夜 · 24小时日月东升西落全景</title>
<style>
:root{--accent:#e56d17;--ink:#2a2218;--line:#e4d5ba;--card:rgba(255,253,248,.94)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c5f4;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.46em;color:#7a6a52;font-weight:600}
body.no-py rt{display:none}

/* 左上标题卡片 */
#hudTL{position:fixed;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 16px rgba(40,30,15,.16)}
#backBtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:#5c4b34;font-size:19px;font-weight:900}
#backBtn:hover{border-color:var(--accent);color:var(--accent)}
.hd-t{font-size:16px;font-weight:900;line-height:1.5}
.hd-sub{font-size:11.5px;color:#7b6c56;font-weight:700}

/* 顶部中央动态分步小助手（U2） */
#guideBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(460px,calc(100vw - 640px));display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:15px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 6px 18px rgba(130,68,12,.18);
  font-size:13.5px;font-weight:800;color:#753a07;cursor:pointer;line-height:1.38;transition:all .2s}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.done{border-color:#16a34a;background:#f0fdf4;color:#166534}
@media (max-width:1180px){
  #guideBar{top:62px;left:12px;transform:none;max-width:min(460px,calc(100vw - 260px))}
  #guideBar:active{transform:scale(.98)}
}

/* 右上工具条 + 顶部防遮挡入口微标签 */
#hudTR{position:fixed;top:12px;right:12px;z-index:7;display:flex;align-items:center;gap:6px}
.tbtn-wrap{position:relative;display:inline-flex}
.tbtn{height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-family:inherit;font-size:13.5px;font-weight:800;color:#4a3c28;cursor:pointer;
  box-shadow:0 3px 0 #d9c8ab;transition:all .14s;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#b8500a;color:#fff;box-shadow:0 3px 0 #b8500a}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid var(--accent);color:#b44908;font-size:10.5px;font-weight:900;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(229,109,23,.24);
  animation:cuePop 1.6s ease-in-out infinite;transition:opacity .25s}
body.interacted .entry-cue{opacity:0;animation:none}
@keyframes cuePop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}

/* 右上可收起窄版发现栏（D3） */
#notes{position:fixed;top:60px;right:12px;z-index:6;width:224px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(40,30,15,.14)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nt-title{font-size:13.5px;font-weight:900}
.nt-cnt{font-size:12.5px;font-weight:900;color:var(--accent)}
.nt-tog{padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:800;color:#6c5c45;cursor:pointer}
.stamps{display:flex;gap:4px;margin-bottom:6px}
.st{flex:1;text-align:center;padding:3px 2px;border-radius:8px;font-size:11px;font-weight:800;
  border:1.5px dashed #d7c5a4;color:#9b8a70;background:#faf4e8;transition:all .2s;line-height:1.45}
.st.lit{border-style:solid;border-color:var(--accent);background:#fff2df;color:#b8500a;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList,#notes.collapsed .stamps{display:none}
#notes.collapsed .nt-head{margin-bottom:0}
.stk{padding:5px 8px;border-radius:10px;background:#fff;border:1px solid #ece0c9;font-size:12px;font-weight:700;line-height:1.42;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* 飘浮反馈词层与单焦点 3D 引导气泡 */
#floatLayer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.cue3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:6px 14px;border-radius:99px;
  background:#fff7ed;border:2px solid #ea580c;color:#9a3412;font-size:13px;font-weight:900;white-space:nowrap;
  box-shadow:0 4px 14px rgba(234,88,12,.30);animation:cueBob 1.3s ease-in-out infinite;display:none;pointer-events:none}
.cue3d.moon-cue{background:#eff6ff;border-color:#2563eb;color:#1e3a8a;box-shadow:0 4px 16px rgba(37,99,235,.38)}
.cue3d.show{display:block}
@keyframes cueBob{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-6px)}}
.fword{position:absolute;transform:translate(-50%,-100%);padding:5px 13px;border-radius:99px;
  background:rgba(255,252,244,.95);border:2px solid var(--accent);color:#9a3c07;
  font-size:14.5px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);
  animation:floatUp 1.85s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.7)}16%{opacity:1;transform:translate(-50%,-100%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-185%) scale(1)}}

/* 底部 24 小时日月大循环渐变滑杆坞（U7：extraBtns === 1） */
#bottomDock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
  width:min(610px,calc(100vw - 24px));padding:9px 14px;border-radius:20px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(30,22,12,.18);
  display:flex;flex-direction:column;gap:6px}
.slider-row{display:flex;align-items:center;gap:9px}
.clock-pill{min-width:124px;padding:4px 10px;border-radius:11px;background:#fff4e2;border:1.5px solid #f0c286;
  text-align:center;font-size:13px;font-weight:900;color:#9a3c07;white-space:nowrap;transition:all .2s}
.clock-pill.night{background:#e0e7ff;border-color:#818cf8;color:#1e3a8a}
.end-ico{font-size:18px;line-height:1;flex:none}
#hourSlider{flex:1;height:12px;-webkit-appearance:none;appearance:none;border-radius:99px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#f7a440 0%,#5cc0f8 25%,#f47a38 50%,#1d2b57 75%,#f7a440 100%);
  border:1.5px solid #d9c7a8}
#hourSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.26);cursor:pointer}
.auto-btn{width:36px;height:34px;border-radius:11px;border:1.5px solid #2b7de9;background:#eff6ff;
  font-family:inherit;font-size:15px;font-weight:900;color:#1d5fc0;cursor:pointer;display:grid;place-items:center;flex:none;
  box-shadow:0 2px 0 #bfdbfe;transition:all .14s}
.auto-btn:hover{background:#dbeafe}
.auto-btn.on{background:#2b7de9;color:#fff;box-shadow:0 2px 0 #1d4ed8}
.period-dots{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pdot{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;
  background:#faf4e8;border:1.5px solid #e6d8be;color:#8c795e;transition:all .18s}
.pdot.active{border-color:var(--accent);background:#fff3e0;color:#b8500a}
.pdot.done{border-color:#16a34a;background:#dcfce7;color:#166534}
.pdot.pulse{border-color:#f59e0b;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}

/* 通关彩带 + 结论与1题巩固弹窗 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#winToast{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(36,24,10,.36);padding:16px}
#winToast.show{display:grid}
.win-card{width:min(460px,100%);max-height:86vh;overflow-y:auto;background:#fffdf8;
  border:2.5px solid var(--accent);border-radius:22px;padding:18px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(40,22,4,.28);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.win-concl{margin:10px 0;padding:10px 12px;border-radius:13px;background:#fff8eb;border:1.5px solid #f2cf9b;
  text-align:left;font-size:13.5px;line-height:1.6;color:#5a3309}
.win-quiz{margin:10px 0;padding:10px 12px;border-radius:13px;background:#f8fafc;border:1.5px solid #d9e2ec;text-align:left}
.win-quiz h4{margin:0 0 7px;font-size:13.5px;color:#2b3a4a}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{padding:8px 11px;border-radius:11px;border:1.5px solid #d9d0be;background:#fff;
  font-family:inherit;font-size:13.5px;font-weight:800;text-align:left;cursor:pointer;transition:all .14s;color:var(--ink)}
.qopt:hover{border-color:var(--accent);background:#fff9f0}
.qopt.ok{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e}
.qopt.bad{border-color:#e03131;background:#fff5f5;color:#c92a2a}
.qfb{margin-top:7px;font-size:12.5px;font-weight:800;min-height:18px;color:#b45309}
.qfb.ok{color:#2b8a3e}
.win-acts{display:flex;justify-content:center;gap:10px;margin-top:12px}

@media (max-width:760px){
  #hudTL{top:8px;left:8px;padding:5px 10px 5px 6px}
  .hd-t{font-size:14px}.hd-sub{display:none}
  #hudTR{top:8px;right:8px;gap:4px}.tbtn{height:32px;padding:0 8px;font-size:12px}
  .entry-cue{display:none}
  #guideBar{top:48px;left:8px;right:8px;max-width:none;font-size:12px;padding:5px 10px}
  #notes{top:auto;bottom:122px;right:8px;width:200px}
  #ntList{max-height:70px}
  #bottomDock{bottom:8px;padding:6px 8px}
  .pdot{padding:2px 6px;font-size:11px}
  .clock-pill{min-width:98px;font-size:12px}
}
</style>

<script>
(function () {
'use strict';

try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}

var LESSON_ID = 'k1b-08';
var BOOK_PROGRESS_KEY = 'xk_k1b_progress';

var $ = function (s) { return document.querySelector(s); };
var HAN = /[\u3400-\u9fff]/;
var pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function ruby(text, py) {
  if (!py) return esc(text);
  var syl = py.trim().split(/\s+/), i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) {
      var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; }
      out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>';
    } else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
document.querySelectorAll('[data-py]').forEach(function (el) { el.innerHTML = ruby(el.textContent, el.dataset.py); });

$('#backBtn').addEventListener('click', function () {
  try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}
});

/* ===== 语音与轻柔音效 ===== */
var voiceOn = true;
function stopVoice() {
  if (window.__xkVoice) window.__xkVoice.stop();
  else if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (e) {}
}
function speak(text, force) {
  if (!text || (!voiceOn && !force)) return;
  if (window.__xkVoice) { window.__xkVoice.speak(text); return; }
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.94; u.pitch = 1.08; window.speechSynthesis.speak(u); } catch (e) {}
}
var audioCtx = null;
function playChime(freqs) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    freqs.forEach(function (f, idx) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, now + idx * 0.09);
      g.gain.setValueAtTime(0.001, now + idx * 0.09);
      g.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.3);
    });
  } catch (e) {}
}

function saveProgress(id, hasFlower) {
  try {
    var d = JSON.parse(localStorage.getItem(BOOK_PROGRESS_KEY) || '{}');
    d[id] = { done: true, flower: !!(hasFlower || (d[id] && d[id].flower)), ts: Date.now() };
    localStorage.setItem(BOOK_PROGRESS_KEY, JSON.stringify(d));
  } catch (e) {}
}

/* ===== 彩带庆祝 ===== */
var cCv = $('#confetti'), cCtx = cCv.getContext('2d'), confettiParts = [];
function resizeConfetti() { cCv.width = window.innerWidth; cCv.height = window.innerHeight; }
function burstConfetti() {
  confettiParts = [];
  var cols = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899', '#eab308'];
  for (var i = 0; i < 85; i++) {
    confettiParts.push({
      x: cCv.width * (0.2 + Math.random() * 0.6), y: cCv.height * 0.3,
      vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 7,
      s: 6 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.25,
      col: cols[i % cols.length], life: 1
    });
  }
}
function tickConfetti() {
  if (!confettiParts.length) return;
  cCtx.clearRect(0, 0, cCv.width, cCv.height);
  for (var i = confettiParts.length - 1; i >= 0; i--) {
    var p = confettiParts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.r += p.vr; p.life -= 0.008;
    if (p.life <= 0 || p.y > cCv.height + 20) { confettiParts.splice(i, 1); continue; }
    cCtx.save(); cCtx.globalAlpha = Math.max(0, p.life);
    cCtx.translate(p.x, p.y); cCtx.rotate(p.r);
    cCtx.fillStyle = p.col; cCtx.fillRect(-p.s * 0.5, -p.s * 0.3, p.s, p.s * 0.6);
    cCtx.restore();

    var sy = Math.sin(ang) * 3.15 + 2.30 - (1 - sunScale) * 0.7;
    sunGroup.position.set(sx, sy, -10.8);
    sunGroup.scale.setScalar(sunScale);
    sunRays.rotation.z = nowSec * 0.55;
    var warmEdge = Math.pow(1 - Math.sin(sunPhase * Math.PI), 1.4);
    lerpCol('#ffe46b', '#ff692b', warmEdge, sunCoreMat.color);
    lerpCol('#ffd066', '#ff4d24', warmEdge, sunHaloMat.color);
    if (ch <= 18.2) {
      sunL.position.set(sx * 1.1, Math.max(2.6, sy * 1.25), 4.5);
      lakeRefl.position.x = sx * 0.45;
      reflMat.color.copy(sunCoreMat.color);
      reflMat.opacity = 0.28 + 0.45 * Math.sin(sunPhase * Math.PI + 0.2);
    }
  }

  // 2) 月亮：18:00 从东(-6.2)冉冉升起 → 24:00 午夜正中最高(0, 5.45) → 30:00 (次日 06:00) 落向西(+6.2)！
  var moonVis = (ch >= 17.45 && ch <= 30.0);
  moonGroup.visible = moonVis;
  var nightAmt = (ch >= 19.2 && ch <= 28.6) ? 1 : (ch > 17.6 && ch < 19.2) ? (ch - 17.6) / 1.6 : (ch > 28.6 && ch < 29.9) ? (29.9 - ch) / 1.3 : 0;
  if (moonVis) {
    var moonPhase = Math.max(0, Math.min(1, (ch - 18.0) / 12.0));
    var moonScale = ch < 18.0 ? Math.max(0.08, (ch - 17.45) / 0.55) : (ch > 29.4 ? Math.max(0.12, (30.0 - ch) / 0.6) : 1);
    var mang = Math.PI * (1 - moonPhase); // PI(East/-X) -> 0(West/+X)
    var mx = Math.cos(mang) * 6.2;
    var my = Math.sin(mang) * 3.10 + 2.30 - (1 - moonScale) * 0.6;
    moonGroup.position.set(mx, my, -10.6);
    moonGroup.scale.setScalar(moonScale);
    moonCore.rotation.y = nowSec * 0.12;
    if (ch > 18.2) {
      sunL.position.set(mx, Math.max(3, my), 5);
      lakeRefl.position.x = mx * 0.44;
      reflMat.color.set('#fff3b0');
      reflMat.opacity = 0.42 * Math.max(0.3, nightAmt);
    }
  }

  arcDotMat.opacity = 0.16 + 0.14 * nightAmt;
  starMeshes.forEach(function (sm) {
    sm.material.opacity = nightAmt * (0.45 + 0.55 * Math.abs(Math.sin(nowSec * 2.2 + sm.userData.phase)));
  });

  // 窗户灯光与路灯在天暗时柔和点亮
  var lightOn = nightAmt > 0.35;
  windowMats.forEach(function (w) {
    var lit = lightOn && (w.seed !== 2 && w.seed !== 7);
    w.mat.color.set(lit ? '#ffe27a' : (nightAmt > 0.5 ? '#2c3d59' : '#6f97b8'));
  });
  lampBulbMats.forEach(function (m) { m.color.set(lightOn ? '#fff2a6' : '#cbd5e1'); });
  lampHaloMats.forEach(function (m) { m.opacity = lightOn ? 0.36 * nightAmt : 0; });

  // 更新时钟显示与时段进度徽章
  var clockEl = $('#clockLabel');
  clockEl.textContent = formatClock(ch);
  clockEl.classList.toggle('night', ch >= 18.2 && ch <= 29.2);
  var pk = getPeriodKey(ch);
  document.querySelectorAll('.pdot').forEach(function (d) { d.classList.toggle('active', d.dataset.p === pk); });

  // 呼吸拖拽光环反馈
  var ringPulse = 1 + Math.sin(nowSec * 4.2) * 0.08;
  sunDragRing.scale.setScalar(draggingOrb === 'sun' ? 1.18 : ringPulse);
  sunDragRingMat.opacity = draggingOrb === 'sun' ? 0.90 : (0.36 + 0.22 * Math.sin(nowSec * 4.2));
  moonDragRing.scale.setScalar(draggingOrb === 'moon' ? 1.18 : ringPulse);
  moonDragRingMat.opacity = draggingOrb === 'moon' ? 0.92 : (0.40 + 0.24 * Math.sin(nowSec * 4.2));
}

var lastLoggedPeriod = null;
function evaluateCycleProgress(ch) {
  if (ch >= 6.0 && ch <= 8.5) {
    if (!found.dawn) addDiscovery('dawn', true);

    if (!found.noon) addDiscovery('noon', true);
  } else if (ch >= 16.8 && ch <= 19.4) {
    if (!found.dusk) addDiscovery('dusk', true);
  } else if (ch >= 22.0 && ch <= 26.2) {

      midNightSeen = true;

      }
    }
  } else if (ch >= 27.0 && ch <= 30.0) {
    midNightSeen = true;
    if (!found.night) addDiscovery('night', true);
  }
}

function recordSweptCycle(cFrom, cTo) {
  var dist = Math.abs(cTo - cFrom);
  var steps = Math.max(1, Math.ceil(dist / 0.4));
  for (var i = 0; i <= steps; i++) {
    var sc = cFrom + (cTo - cFrom) * (i / steps);
    evaluateCycleProgress(sc);
  }
}

function setCycle(ch, recordNow, speakOnRepeat) {
  targetCycle = Math.max(6.0, Math.min(30.0, ch));
  $('#hourSlider').value = targetCycle;
  if (recordNow) {
    var pk = getPeriodKey(targetCycle);
    var wasFound = pk && !!found[pk];
    evaluateCycleProgress(targetCycle);
    if (pk && wasFound && speakOnRepeat && !demo && PERIOD_INFO[pk]) {
      spawnFloat(PERIOD_INFO[pk].fw, 46, 38);
      speak(PERIOD_INFO[pk].spoken);
    }
    lastLoggedPeriod = pk;
  }
}

/* ===== 太阳与月亮同等自由度 3D 直接拖拽（超大优先拾取球，完全无视山体云朵！） ===== */
function markInteracted() { document.body.classList.add('interacted'); }
var CYCLE_STEPS = [6.2, 12.0, 18.25, 24.0, 28.8];
var cycleStepIdx = 0;

var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pickHit(e) {
  var r = cv.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);

  // 1) 绝对优先检测太阳与月亮超大透明拾取球（太阳在西与月亮在东永不重叠）
  var preferMoon = curCycle >= 18.0 && curCycle <= 29.5;
  if (preferMoon) {
    if (moonGroup.visible && ray.intersectObject(moonHit, false).length) return 'moon';
    if (sunGroup.visible && ray.intersectObject(sunHit, false).length) return 'sun';
  } else {
    if (sunGroup.visible && ray.intersectObject(sunHit, false).length) return 'sun';
    if (moonGroup.visible && ray.intersectObject(moonHit, false).length) return 'moon';
  }

  // 2) 检测其余可互动场景元素
  var hits = ray.intersectObjects(live.children, true);
  for (var i = 0; i < hits.length; i++) {
    if (hits[i].object.userData && hits[i].object.userData.hit) return hits[i].object.userData.hit;
  }
  return null;
}

function nextUnexploredCycle() {
  if (!found.dawn) return 6.2;
  if (!found.noon) return 12.0;
  if (!found.dusk) return 18.25;
  if (!midNightSeen) return 24.0;
  if (!found.night) return 28.8;
  cycleStepIdx = (cycleStepIdx + 1) % CYCLE_STEPS.length;
  return CYCLE_STEPS[cycleStepIdx];
}

cv.addEventListener('pointerdown', function (e) {
  markInteracted();
  if (demo) stopDemo();
  var hitTag = pickHit(e);
  if (hitTag === 'sun' || hitTag === 'moon') {
    draggingOrb = hitTag;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    // 若抓住次日刚升起的太阳，无缝归位到 6.0 开启新一轮白天拖拽
    if (hitTag === 'sun' && curCycle >= 29.0) {
      curCycle = 6.0; targetCycle = 6.0;
    } else if (hitTag === 'moon' && curCycle < 18.0) {
      curCycle = 18.0; targetCycle = 18.0;
    }
    dragStartCycle = curCycle;
    prevDragCycle = curCycle;
    dragMoved = false;
    autoCycle = false; $('#autoBtn').classList.remove('on'); $('#autoBtn').textContent = '▶';
    cv.style.cursor = 'grabbing';
    if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  if (!hitTag || hitTag === 'sky') {
    autoCycle = false; $('#autoBtn').classList.remove('on'); $('#autoBtn').textContent = '▶';
    setCycle(nextUnexploredCycle(), true, true);
  } else if (hitTag === 'lamp') {
    var isNight = curCycle >= 18.5 && curCycle <= 29.0;
    spawnFloat(isNight ? '💡 天黑了，路灯亮起照亮道路！' : '💡 白天阳光充足，路灯关着省电！', 55, 56);
    speak(isNight ? '天黑了，公园路灯亮起来，照亮夜晚的道路！' : '白天阳光明亮，路灯休息不开灯！');
  } else if (hitTag === 'building') {
    var isN = curCycle >= 18.5 && curCycle <= 29.0;
    spawnFloat(isN ? '🏠 夜幕降临，小区家家亮灯啦！' : '🏠 白天小楼沐浴在阳光里！', 60, 48);

  } else if (hitTag === 'lake') {
    spawnFloat('🌊 湖面倒映着天色、太阳与月亮！', 45, 62);
    speak('清澈的公园湖面，白天倒映太阳和晚霞，夜晚倒映明亮的月光！');
  } else if (hitTag === 'east') {
    spawnFloat('➡️ 东方：太阳和月亮都从东方升起！', 24, 62);
    speak('这是东方！清晨太阳从东方升起，傍晚月亮也从东方升起！');
  } else if (hitTag === 'west') {
    spawnFloat('⬅️ 西方：太阳和月亮都从西方落下！', 72, 62);
    speak('这是西方！傍晚太阳从西方落下，黎明月亮也从西方落下！');
  }
});

cv.addEventListener('pointermove', function (e) {
  if (!draggingOrb) {
    var hover = pickHit(e);
    cv.style.cursor = (hover === 'sun' || hover === 'moon') ? 'grab' : 'pointer';
    return;
  }
  if (!dragMoved && Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) >= 8) {
    dragMoved = true;
    recordSweptCycle(dragStartCycle, dragStartCycle);
  }
  if (dragMoved) {
    var r = cv.getBoundingClientRect();
    var dx = e.clientX - dragStartX;
    var spanW = Math.max(240, r.width * 0.50);
    var mapped;
    if (draggingOrb === 'sun') {
      // 太阳自由度：06:00 东升 ↔ 12:00 正午 ↔ 18:30 西落（月亮随即从东方升起！）
      mapped = Math.max(6.0, Math.min(18.35, dragStartCycle + (dx / spanW) * 12.8));
    } else {
      // 月亮同等自由度：18:00 东升 ↔ 24:00 午夜正中 ↔ 30:00 (次日06:00) 西落黎明！
      mapped = Math.max(17.85, Math.min(30.0, dragStartCycle + (dx / spanW) * 12.8));
    }
    targetCycle = mapped;
    curCycle = mapped;
    $('#hourSlider').value = mapped.toFixed(2);
    recordSweptCycle(prevDragCycle, mapped);
    prevDragCycle = mapped;
  }
});

function finishOrbDrag(e) {
  if (!draggingOrb) return;
  var orb = draggingOrb;
  draggingOrb = null;
  cv.style.cursor = 'pointer';
  if (cv.releasePointerCapture && e && e.pointerId !== undefined) try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
  if (!dragMoved) {
    var pkNow = getPeriodKey(curCycle);
    if (pkNow && !found[pkNow] && !(pkNow === 'night' && curCycle < 27.0)) {
      evaluateCycleProgress(curCycle);
    } else {
      setCycle(nextUnexploredCycle(), true, true);
    }
  } else {
    evaluateCycleProgress(curCycle);
    // 月亮拖到西边尽头迎来次日黎明，无缝循环衔接回清晨 06:00，太阳已在东边升起！
    if (orb === 'moon' && curCycle >= 29.75) {
      curCycle = 6.0; targetCycle = 6.0;
      $('#hourSlider').value = '6';
    }
  }
}
cv.addEventListener('pointerup', finishOrbDrag);
cv.addEventListener('pointercancel', finishOrbDrag);

$('#hourSlider').addEventListener('input', function () {
  markInteracted();
  if (demo) stopDemo();
  autoCycle = false; $('#autoBtn').classList.remove('on'); $('#autoBtn').textContent = '▶';
  var prev = curCycle;
  var ch = parseFloat(this.value);
  targetCycle = ch; curCycle = ch;
  recordSweptCycle(prev, ch);
});

$('#autoBtn').addEventListener('click', function () {
  markInteracted(); if (demo) stopDemo();
  autoCycle = !autoCycle;
  this.classList.toggle('on', autoCycle);
  this.textContent = autoCycle ? '⏸' : '▶';
  if (autoCycle) speak('开始自动播放 24 小时日月轮换，仔细看太阳和月亮怎么轮流从东边升起、落向西边吧！');
});

$('#voiceBtn').addEventListener('click', function () {
  markInteracted();
  voiceOn = !voiceOn;
  this.classList.toggle('on', voiceOn);
  if (voiceOn) updateGuide(true); else stopVoice();
});
$('#demoBtn').addEventListener('click', startDemo);
$('#guideBar').addEventListener('click', function () { markInteracted(); updateGuide(true); });
$('#resetBtn').addEventListener('click', resetAll);
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
$('#winKeepBtn').addEventListener('click', function () { $('#winToast').classList.remove('show'); });
$('#winAgainBtn').addEventListener('click', resetAll);
$('#qOpts').addEventListener('click', function (e) {
  var b = e.target.closest('.qopt');
  if (!b) return;
  if (b.dataset.ok === '1') {
    b.classList.add('ok');
    $('#qFb').textContent = '🌸 答对啦！太阳西落后月亮从东方升起滑向西方，昼夜周而复始！获得小红花！';
    $('#qFb').className = 'qfb ok';
    saveProgress(LESSON_ID, true);
    playChime([659, 784, 1046]);
    speak('答对啦！获得本课小红花！', true);
  } else {
    b.classList.add('bad');
    var h = b.dataset.hint || '再想想哦！';
    $('#qFb').textContent = h;
    $('#qFb').className = 'qfb';
    speak(h, true);
  }
});

/* ===== 帧循环 ===== */
var introT0 = performance.now(), lastT = performance.now();
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  resizeConfetti();
}
window.addEventListener('resize', fit);
fit();

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (now - lastT) / 1000));
  lastT = now;
  var nowSec = now * 0.001;

  var pop = Math.min(1, (performance.now() - introT0) / 680);
  live.scale.setScalar(0.01 + 0.99 * (1 - Math.pow(1 - pop, 3)));

  if (autoCycle) {
    var prevC = curCycle;
    targetCycle += dt * 2.2;
    if (targetCycle >= 30.0) {
      recordSweptCycle(prevC, 30.0);
      targetCycle = 6.0 + (targetCycle - 30.0);
      curCycle = targetCycle;
    } else {
      curCycle = targetCycle;
      recordSweptCycle(prevC, curCycle);
    }
    $('#hourSlider').value = curCycle.toFixed(2);
  } else if (!draggingOrb) {
    var diff = targetCycle - curCycle;
    curCycle += diff * Math.min(1, dt * 6.5);
  }

  clouds.forEach(function (c) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 9.5) c.position.x = -9.5;
  });

  applyTimeVisuals(curCycle, nowSec);

  // 单焦点 #targetCue 气泡：白天紧贴太阳、黑夜紧贴月亮！
  var cueEl = $('#targetCue');
  var allDone = !!(found.dawn && found.noon && found.dusk && found.night);
  if (demo || celebrated || draggingOrb || allDone) {
    cueEl.classList.remove('show');
  } else {
    var showMoonCue = (curCycle >= 17.85 && curCycle <= 29.6) || (found.dusk && moonGroup.visible);
    var orbPos = showMoonCue ? moonGroup.position : sunGroup.position;
    var pv = new THREE.Vector3(orbPos.x, orbPos.y + 1.62, orbPos.z).project(camera);
    var cx = (pv.x * 0.5 + 0.5) * window.innerWidth;
    var cy = (-pv.y * 0.5 + 0.5) * window.innerHeight;
    if (cy < 280) cx = Math.min(window.innerWidth - 268, cx);
    cx = Math.max(135, Math.min(window.innerWidth - 135, cx));
    cy = Math.max(92, Math.min(window.innerHeight - 135, cy));
    cueEl.classList.toggle('moon-cue', showMoonCue);
    if (!found.dawn) {
      cueEl.textContent = '👆 拖动太阳从东往西滑一滑';
    } else if (!found.noon) {
      cueEl.textContent = '👆 把太阳向右拖到天空正中';
    } else if (!found.dusk) {
      cueEl.textContent = '👆 继续向右拖太阳落向西方';
    } else if (!midNightSeen) {
      cueEl.textContent = '👆 按住大月亮，从东往西拖过夜空！';
    } else {
      cueEl.textContent = '👆 继续把月亮拖向西边迎接次日黎明！';
    }
    cueEl.style.left = cx + 'px';
    cueEl.style.top = cy + 'px';
    cueEl.classList.add('show');
  }

  tickConfetti();
  renderer.render(scene, camera);
}

window.__lesson = {
  pyErrors: pyErrors,
  info: function () {
    return {
      triangles: renderer.info.render.triangles,
      celebrated: celebrated,
      curCycle: curCycle,
      curHour: norm24(curCycle),
      midNightSeen: midNightSeen,
      found: found
    };
  },
  project3D: function (x, y, z) {
    var v = new THREE.Vector3(x, y, z).project(camera);
    return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight };
  },
  getTargets: function () {
    return {
      sun: this.project3D(sunGroup.position.x, sunGroup.position.y, sunGroup.position.z),
      moon: this.project3D(moonGroup.position.x, moonGroup.position.y, moonGroup.position.z),
      sunVisible: sunGroup.visible,
      moonVisible: moonGroup.visible,
      eastSky: this.project3D(-6.2, 3.2, -10.6),
      midSky: this.project3D(0, 6.2, -10.6),
      westSky: this.project3D(6.2, 3.2, -10.6)
    };
  },
  startDemo: startDemo,
  resetAll: resetAll
};
updateGuide(false);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<style>

*{box-sizing:border-box}

#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);

.chip h1{margin:0;font-size:18px;line-height:1.5;font-weight:800}

.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.attn{animation:btnGlow 1.5s ease-in-out infinite}

.tbtn:not(.on).attn{animation:btnGlowWarm 1.6s ease-in-out infinite}
@keyframes btnGlowWarm{0%,100%{box-shadow:0 3px 0 #e2d2b5,0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 3px 0 #e2d2b5,0 0 0 8px rgba(245,158,11,0)}}
.btn-cue{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;

.btn-cue::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#f59e0b}
.btn-cue.ora{background:#e56d17;box-shadow:0 4px 10px rgba(191,84,9,.25)}

body.cues-off .btn-cue{opacity:0;animation:none;transform:translateX(-50%) translateY(-4px)}
body.cues-off .tbtn.attn{animation:none}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;

}

  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:opacity .3s,top .3s}
body.cues-off #notes{top:64px;max-height:calc(100% - 170px)}
.nt-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:6px;gap:6px}
.nt-r{display:flex;align-items:center;gap:6px}

.nt-tgl:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed .stamps,#notes.collapsed #ntList{display:none}

.stamps{display:flex;gap:4px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:9px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:12px;font-weight:800;line-height:1.45}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:152px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

#winToast .medal{font-size:40px;line-height:1}

.concl-box{width:100%;text-align:left;padding:10px 13px;border-radius:14px;background:#fff4e6;border:1.5px solid #f4bc7c;font-size:14px;line-height:1.65;color:#4a3016}

.quiz-fb{margin-top:7px;font-size:13px;font-weight:800;line-height:1.5;min-height:18px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.no{color:#b45309}
#winToast .wacts{display:flex;gap:10px;margin-top:2px}

  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e2d2b5}

/* 4 天气切换条 */
#dock{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;

  box-shadow:0 8px 22px rgba(80,55,20,.16)}
.wbtn{position:relative;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;border:1.5px solid transparent;
  background:#fff;font:inherit;font-size:16px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 #e6d8be;transition:transform .15s,background .15s;white-space:nowrap}
.wbtn svg{width:21px;height:21px;flex:none}
.wbtn:hover{border-color:#f59e0b;transform:translateY(-2px)}
.wbtn.on{background:#e56d17;border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.wbtn.on rt{color:#ffedd5}
.wbtn.done-dot::after{content:"✓";position:absolute;top:-5px;right:-4px;width:16px;height:16px;border-radius:50%;
  background:#16a34a;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.wbtn.guide-pulse{border-color:#f59e0b;animation:wPulse 1.25s ease-in-out infinite}
@keyframes wPulse{0%,100%{box-shadow:0 2px 0 #e6d8be,0 0 0 0 rgba(245,158,11,.65);transform:translateY(0)}50%{box-shadow:0 4px 0 #e6d8be,0 0 0 9px rgba(245,158,11,0);transform:translateY(-3px)}}

#skyTag{position:fixed;left:0;top:0;z-index:4;transform:translate(-50%,-100%);
  padding:4px 12px;border-radius:99px;background:rgba(255,250,240,.94);border:1.5px solid #e56d17;
  color:#b84906;font-size:13px;font-weight:900;white-space:nowrap;cursor:pointer;
  box-shadow:0 4px 12px rgba(80,55,20,.16);transition:opacity .25s,background .2s}
#skyTag:hover{background:#fff3e2}
#skyTag.pulse{background:#e56d17;color:#fff;border-color:#bf5409;animation:skyPulse 1.2s ease-in-out infinite}
@keyframes skyPulse{0%,100%{box-shadow:0 4px 12px rgba(229,109,23,.35),0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 6px 16px rgba(229,109,23,.45),0 0 0 9px rgba(229,109,23,0)}}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12);white-space:nowrap}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:26px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.35s ease-out forwards}
.word.cool{color:#1d5fc0}
.word.ok{color:#15803d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 8px 4px 4px;max-width:calc(100% - 226px)}
  .chip h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{display:none}
  .home{width:30px;height:30px;flex:none}
  .tools{right:8px;top:8px;gap:4px}.tbtn{height:32px;padding:0 8px;font-size:12px}
  .btn-cue{display:none}
  #guideBar{top:46px;left:8px;right:8px;max-width:none;transform:none;padding:5px 10px;font-size:12px}
  #skyTag{font-size:11px;padding:3px 8px}
  #notes,body.cues-off #notes{top:auto;bottom:118px;right:8px;left:8px;width:auto;max-height:102px;padding:7px 10px}
  #ntList{max-height:50px}
  .stk{font-size:14px}
  #dock{bottom:54px;gap:4px;padding:4px 6px;max-width:calc(100% - 12px)}
  .wbtn{padding:4px 8px;font-size:13px;gap:4px}.wbtn svg{width:16px;height:16px}
  #verbs{bottom:8px;gap:6px}.verb{font-size:13px;padding:4px 9px}.verb svg{width:16px;height:16px}
}
</style>

function makeFaceTex(mood) {
  return ctex(256, 256, function (g, w, h) {
    g.fillStyle = mood === 'hot' ? '#ffbfa8' : mood === 'cold' ? '#f6d8cc' : '#ffdfc4';
    g.fillRect(0, 0, w, h);
    // 腮红
    g.fillStyle = mood === 'hot' ? 'rgba(239,68,68,.55)' : 'rgba(244,114,182,.35)';
    g.beginPath(); g.ellipse(76, 148, 22, 13, 0, 0, Math.PI * 2); g.ellipse(180, 148, 22, 13, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#2a3040'; g.fillStyle = '#2a3040'; g.lineWidth = 7; g.lineCap = 'round';
    if (mood === 'joy') {
      // 弯弯笑眼
      g.beginPath(); g.arc(88, 122, 16, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      g.beginPath(); g.arc(168, 122, 16, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      g.fillStyle = '#e11d48'; g.beginPath(); g.arc(128, 152, 24, 0, Math.PI); g.fill();
    } else if (mood === 'hot') {
      g.beginPath(); g.moveTo(74, 114); g.lineTo(100, 126); g.moveTo(182, 114); g.lineTo(156, 126); g.stroke();
      g.beginPath(); g.arc(128, 162, 18, 0, Math.PI * 2); g.stroke();
      // 额头汗珠
      g.fillStyle = '#38bdf8'; g.beginPath(); g.arc(192, 86, 11, 0, Math.PI * 2); g.fill();
    } else if (mood === 'cold') {
      g.beginPath(); g.arc(90, 122, 11, 0, Math.PI * 2); g.arc(166, 122, 11, 0, Math.PI * 2); g.fill();
      // 发抖波浪嘴
      g.beginPath(); g.moveTo(100, 164); g.lineTo(114, 154); g.lineTo(128, 164); g.lineTo(142, 154); g.lineTo(156, 164); g.stroke();
    } else if (mood === 'wet') {
      g.beginPath(); g.moveTo(76, 124); g.lineTo(102, 118); g.moveTo(180, 124); g.lineTo(154, 118); g.stroke();
      g.beginPath(); g.arc(128, 170, 16, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
      g.fillStyle = '#38bdf8'; g.beginPath(); g.arc(68, 92, 9, 0, Math.PI * 2); g.arc(188, 98, 8, 0, Math.PI * 2); g.fill();
    } else {
      g.beginPath(); g.arc(90, 122, 12, 0, Math.PI * 2); g.arc(166, 122, 12, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(94, 117, 4, 0, Math.PI * 2); g.arc(170, 117, 4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(128, 150, 18, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    }
  });
}

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.11, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  skyPanel.scale.set(1, Math.max(0.01, backOut((t - 0.38) / 0.52)), 1);
  stageG.scale.setScalar(Math.max(0.001, backOut((t - 0.48) / 0.55)));

/* ===================== 主循环 ===================== */
var last = performance.now(), cTmp = new THREE.Color(), snowRimOp = 0;
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  // 背景天气色彩与灯光 + 点击天空微弹反馈
  var skyHex = weather === 'sun' ? 0xffcf70 : weather === 'rain' ? 0x6f87a3 : weather === 'wind' ? 0x91cfe0 : 0xcbe0f5;
  skyBgMat.color.lerp(cTmp.setHex(skyHex), dt * 4);
  if (skyPop > 0) {
    skyPop = Math.max(0, skyPop - dt * 4.5);
    var spSc = 1 + Math.sin(skyPop * Math.PI) * 0.045;
    if (intro.done) skyPanel.scale.set(spSc, spSc, 1);
  } else if (intro.done) {
    skyPanel.scale.set(1, 1, 1);
  }
  hemiLight.intensity += ((weather === 'sun' ? 0.48 : weather === 'rain' ? 0.34 : 0.42) - hemiLight.intensity) * dt * 4;
  dirLight.intensity += ((weather === 'sun' ? 0.74 : weather === 'rain' ? 0.32 : 0.5) - dirLight.intensity) * dt * 4;

  bgSun.visible = (weather === 'sun');
  bgSunRays.rotation.z += dt * 1.4;
  bgClouds.visible = (weather !== 'sun');
  bgClMat.color.lerp(cTmp.setHex(weather === 'rain' ? 0x5c6f87 : weather === 'snow' ? 0xe6eff8 : 0xdde7f0), dt * 4);
  snowRimOp += ((weather === 'snow' ? 0.92 : 0) - snowRimOp) * dt * 2.2;
  snowRimMat.opacity = snowRimOp;

  // 雨/雪/风粒子
  rainP.forEach(function (r) {
    r.m.visible = (weather === 'rain');
    if (!r.m.visible) return;
    r.m.position.y -= r.sp * dt;
    var hitUmbrella = wearing === 'rain' && Math.hypot(r.m.position.x, r.m.position.z - STAGE.z) < 0.95 && r.m.position.y < BASE + 2.34;
    if (hitUmbrella || r.m.position.y < BASE + 0.1) {
      r.m.position.y = BASE + 2.65 + Math.random() * 0.4;
      r.m.position.x = (Math.random() - 0.5) * 3.2;
    }
  });
  snowP.forEach(function (s) {
    s.m.visible = (weather === 'snow');
    if (!s.m.visible) return;
    s.m.position.y -= s.sp * dt;
    s.m.position.x += Math.sin(now * 2 + s.ph) * 0.35 * dt;
    if (s.m.position.y < BASE + 0.1) { s.m.position.y = BASE + 2.55 + Math.random() * 0.4; s.m.position.x = (Math.random() - 0.5) * 3.4; }
  });
  windP.forEach(function (w, i) {
    w.m.visible = (weather === 'wind');
    if (!w.m.visible) return;
    w.m.position.x += w.sp * dt;
    w.m.position.y = w.by + Math.sin(now * 6 + i) * 0.12;
    if (w.m.position.x > 2.2) w.m.position.x = -2.2;
  });

  // 反应粒子
  fxP.forEach(function (p) {
    if (p.life <= 0) return;
    p.life -= dt;
    p.v.y -= 5.5 * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.y += dt * 6;
    p.m.scale.setScalar(Math.max(0.01, p.life));
    if (p.life <= 0) p.m.visible = false;
  });

  // 小朋友肢体情绪动画（穿雨衣打伞时右臂稳稳向前抬起握伞柄，小黄伞高举头顶！）
  moodT += dt;
  kidAnim.position.set(0, 0, 0);
  kidAnim.rotation.set(0, 0, 0);
  armL.rotation.set(0, 0, 0.12);
  if (wearing === 'rain') {
    armR.rotation.set(-1.55, 0, 0.14);
    wUmbrella.rotation.set(-0.22, 0, 0.24 + (weather === 'wind' ? Math.sin(now * 8) * 0.1 : 0));
  } else {
    armR.rotation.set(0, 0, -0.12);
  }
  headG.rotation.set(0, 0, 0);

  if (mood === 'joy') {
    var jump = Math.abs(Math.sin(moodT * 6.5)) * (moodT < 2.2 ? 0.28 : 0.08);
    kidAnim.position.y = jump;
    armL.rotation.z = 2.4 + Math.sin(now * 10) * 0.25;
    if (wearing !== 'rain') armR.rotation.z = -2.4 - Math.sin(now * 10) * 0.25;
  } else if (mood === 'hot') {
    // 扇风流汗
    armL.rotation.z = 1.6 + Math.sin(now * 16) * 0.65;
    if (wearing !== 'rain') armR.rotation.z = -1.6 - Math.sin(now * 16) * 0.65;
    headG.rotation.z = Math.sin(now * 6) * 0.1;
  } else if (mood === 'cold') {
    // 瑟瑟发抖
    kidAnim.position.x = Math.sin(now * 46) * 0.045;
    armL.rotation.set(-0.6, 0, -0.55);
    if (wearing !== 'rain') armR.rotation.set(-0.6, 0, 0.55);
  } else if (mood === 'wet') {
    // 摇晃躲雨
    headG.rotation.y = Math.sin(now * 14) * 0.28;
    armL.rotation.z = 2.1;
    if (wearing !== 'rain') armR.rotation.z = -2.1;
  } else {
    kidAnim.position.y = Math.sin(now * 2.5) * 0.02;
  }
  if (weather === 'wind') {
    kidAnim.rotation.z = (wearing === 'wind' ? -0.04 : -0.14) + Math.sin(now * 7) * 0.04;
  }

  // 拖拽高亮圆环
  var nearStage = false;
  if (P && P.mode === 'drag') {
    var liftY = BASE + 1.05;
    var pp = planePoint(P.e, liftY);
    if (pp) P.of.target.set(THREE.MathUtils.clamp(pp.x, BOARD.x0, BOARD.x1), liftY, THREE.MathUtils.clamp(pp.z, BOARD.z0, BOARD.z1));
    nearStage = Math.hypot(P.of.cur.x - STAGE.x, P.of.cur.z - STAGE.z) < 1.65;
  }
  dropGlow.material.opacity += ((nearStage ? 0.88 : 0) - dropGlow.material.opacity) * 0.22;

  // 演示飞行 + 服装更新
  var kk = 1 - Math.exp(-16 * dt);
  OUTFITS.forEach(function (of) {
    if (of.flying) {
      of.flying.t += dt / of.flying.dur;
      var u = Math.min(1, of.flying.t), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      of.cur.lerpVectors(of.flying.from, of.flying.to, e);
      of.cur.y += Math.sin(u * Math.PI) * 0.85;
      if (u >= 1) { of.flying = null; of.cur.copy(of.homeV); wearOutfit(of.id, false); }
    } else {
      of.cur.lerp(of.target, of.dragging ? 1 - Math.exp(-24 * dt) : kk);
    }
    var hv = (hoveredOf === of && !P && of.g.visible) ? 1 : 0;
    of.hover += (hv - of.hover) * 0.22;
    of.g.position.set(of.cur.x, of.cur.y + of.hover * 0.08, of.cur.z);
    of.body.scale.setScalar(of.pop);

    var showL = of.g.visible && (of.introLbl || (hoveredOf === of && !P));
    if (showL) {
      var sp = toScreen(of.cur.clone().add(new THREE.Vector3(0, of.h + 0.14, 0)));
      of.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    of.lbl.classList.toggle('show', !!showL);
  });

  if (hoveredKid && !P) {
    var ksp = toScreen(KID_TOP);
    kidLbl.style.transform = 'translate(' + ksp.x + 'px,' + ksp.y + 'px) translate(-50%,-100%)';
  }
  kidLbl.classList.toggle('show', hoveredKid && !P);

  // 投影天空背景板顶部「点天空换天气 👆」互动标签
  var stp = toScreen(new THREE.Vector3(0, BASE + 2.74, -1.92));
  var skyTagEl = $('#skyTag');
  skyTagEl.style.left = stp.x + 'px';
  skyTagEl.style.top = Math.max(104, stp.y) + 'px';
  skyTagEl.style.opacity = intro.t > 0.85 ? 1 : 0;

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.45 : 1;
  renderer.render(scene, camera);
}

/* ===================== 按钮、小测验与自检 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  if (!greeted) {
    voiceOn = true; greeted = true;
    this.classList.add('on'); $('#voiceLbl').textContent = '🔊 语音';
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  this.classList.toggle('on', voiceOn);
  $('#voiceLbl').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) updateGuide(true);
  else if (window.speechSynthesis) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  voiceOn = true; greeted = true;
  $('#voiceBtn').classList.add('on'); $('#voiceLbl').textContent = '🔊 语音';
  updateGuide(true);
});
document.querySelectorAll('#quizBox .qopt').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio();
    var ok = btn.dataset.ok === '1';
    var fb = $('#quizFb');
    if (ok) {
      btn.classList.add('ok');
      document.querySelectorAll('#quizBox .qopt').forEach(function (b) { b.disabled = true; });
      fb.className = 'quiz-fb ok';
      fb.textContent = '🌸 太棒了！获得本课小红花！下雨出门穿小黄雨衣、打起小黄伞，才不会被淋湿！';
      sCelebrate();
      saveProgress('k1a-10', true);
      speak('太棒了！答对啦！获得本课小红花！外面下大雨时，穿小黄雨衣、打小黄伞才不会淋湿！');
    } else {
      btn.classList.add('no');
      fb.className = 'quiz-fb no';
      fb.textContent = '💡 ' + (btn.dataset.hint || '再想想哦，再试一次吧！');
      sOff();
      speak(btn.dataset.hint || '再想想哦，再试一次吧！');
    }
  });
});
$('#ntTgl').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
$('#winClose').addEventListener('click', hideWinToast);
$('#winReplay').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, weather: weather, wearing: wearing, celebrated: celebrated, umbrellaY: wUmbrella.position.y + uTop.position.y }; },
  startDemo: startDemo
};

updateGuide(false);
fit();
requestAnimationFrame(frame);
})();
</script>

<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#2f9e5b}
*{box-sizing:border-box}

.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}

.tbtn{height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);

.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#207542;color:#fff;box-shadow:0 3px 0 #207542}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#dcfce7;border:1.5px solid #2f9e5b;color:#166534;font-size:10.5px;font-weight:900;white-space:nowrap;

  animation:cueFloat 1.5s ease-in-out infinite;transition:opacity .35s,transform .35s}
.entry-cue::before{display:none}
body.interacted .entry-cue{opacity:0;pointer-events:none;animation:none}
body:not(.interacted) #voiceBtn{animation:btnPulse 1.8s ease-in-out infinite}
@keyframes cueFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
@keyframes btnPulse{0%,100%{box-shadow:0 3px 0 #207542,0 0 0 0 rgba(47,158,91,.45)}50%{box-shadow:0 3px 0 #207542,0 0 0 8px rgba(47,158,91,0)}}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;
  max-width:min(460px,calc(100vw - 520px));padding:8px 16px;border-radius:16px;

  transition:transform .25s,box-shadow .25s}
#guideBar.flash{transform:translateX(-50%) scale(1.04);box-shadow:0 8px 26px rgba(47,158,91,.32)}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:226px;max-height:calc(100% - 140px);overflow:hidden;
  padding:9px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:opacity .3s}
.nt-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:6px;gap:6px}
.nt-r{display:flex;align-items:center;gap:6px}
.nt-tgl{height:24px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;font-weight:800;color:#6e5e46;cursor:pointer}

#notes.collapsed .stamps,#notes.collapsed #ntList{display:none}

.stamps{display:flex;gap:5px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}

#ntList{display:flex;flex-direction:column;gap:5px;max-height:152px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #e6dcc8;
  font-size:15px;font-weight:800;line-height:1.65;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
.stk b{color:#1f7a43}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

  padding:18px 20px;border-radius:22px;background:rgba(255,250,240,.98);border:2.5px solid var(--accent);

#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#winToast .medal{font-size:40px;line-height:1}

.win-concl{width:100%;padding:10px 13px;border-radius:14px;background:#ecfdf3;border:1.5px solid #86efac;text-align:left}
.win-concl-t{font-size:13px;font-weight:900;color:#15803d;margin-bottom:4px}
.win-concl-b{font-size:14px;font-weight:800;color:#1e3a28;line-height:1.6}
.win-quiz{width:100%;padding:11px 13px;border-radius:14px;background:#fff;border:1.5px solid #d9e6d6;text-align:left}
.win-quiz-t{font-size:13px;font-weight:900;color:#2f9e5b;margin-bottom:5px}
.win-quiz-q{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:8px;line-height:1.45}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.qopt{width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:1.5px solid #e3d6bd;background:#fffdf8;
  font:inherit;font-size:14.5px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.qopt:hover{border-color:#2f9e5b;background:#f0fdf4}
.qopt:active{transform:scale(.98)}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}
.qopt.err{border-color:#f97316;background:#ffedd5;color:#9a3412}
.quiz-fb{margin-top:8px;font-size:13.5px;font-weight:800;line-height:1.5;min-height:20px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2410c}
#winToast .wacts{display:flex;gap:10px;margin-top:2px}
#winToast .wact{height:38px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e2d2b5}
#winToast .wact.pri{background:var(--accent);border-color:#207542;color:#fff;box-shadow:0 2px 0 #207542}

#verbs{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12);white-space:nowrap}
.verb svg{width:22px;height:22px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:16px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:26px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#1f7a43;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.25s ease-out forwards}
.word.warm{color:#d97706}
.word.cool{color:#2f5fa8}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:960px){
  #guideBar{top:62px;max-width:min(440px,calc(100vw - 280px));font-size:13px;padding:6px 12px}
}
@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 8px 4px 4px;max-width:calc(100% - 226px)}
  .chip h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{display:none}
  .home{width:30px;height:30px;flex:none}
  .tools{right:8px;top:8px;gap:4px}.tbtn{height:32px;padding:0 8px;font-size:12px}
  .entry-cue{top:36px;font-size:10.5px;padding:2px 6px}
  #guideBar{top:48px;left:8px;right:8px;transform:none;max-width:none;font-size:12.5px;padding:5px 10px}
  #guideBar.flash{transform:scale(1.02)}
  #notes{top:auto;bottom:62px;right:8px;left:8px;width:auto;max-height:112px;padding:8px 10px}
  #ntList{max-height:56px}
  .stk{font-size:14px}
  #verbs{bottom:10px;gap:6px}.verb{font-size:13px;padding:4px 10px}.verb svg{width:17px;height:17px}
}
</style>
</head>

function makeLilyPad(radius, rotY) {
  var notch = 0.28;
  var shp = new THREE.Shape();
  shp.moveTo(0, 0);
  shp.absarc(0, 0, radius, notch, Math.PI * 2 - notch, false);
  shp.closePath();
  var geo = new THREE.ExtrudeGeometry(shp, {
    depth: 0.024, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.01, bevelSegments: 2, curveSegments: 28
  });
  var pos = geo.attributes.position, uv = geo.attributes.uv;
  for (var i = 0; i < pos.count; i++) {
    uv.setXY(i, pos.getX(i) / (2 * radius) + 0.5, pos.getY(i) / (2 * radius) + 0.5);
  }
  uv.needsUpdate = true;
  geo.rotateX(-Math.PI / 2);
  var m = mesh(geo, lilyPadMat, false);
  m.rotation.y = rotY;
  return m;
}

function makeLotusPetalGeo(w, len, cup) {
  var geo = new THREE.PlaneGeometry(1, 1, 6, 10);
  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    var u = pos.getX(i) * 2;        // -1 .. 1
    var v = pos.getY(i) + 0.5;      // 0 (底端) .. 1 (花尖)
    var halfW = Math.sin(Math.pow(v, 0.72) * Math.PI) * (w * 0.5);
    var zCup = (1 - u * u) * cup * Math.sin(v * Math.PI);
    var zArch = Math.sin(v * Math.PI * 0.88) * (len * 0.17) - Math.pow(v, 2.1) * (len * 0.06);
    pos.setXYZ(i, u * halfW, v * len, zCup + zArch);
  }
  geo.computeVertexNormals();
  return geo;
}
function makePetalTex(c0, c1, c2) {
  return ctex(128, 256, function (g, w, h) {
    var gr = g.createLinearGradient(0, h, 0, 0);
    gr.addColorStop(0, c0);
    gr.addColorStop(0.52, c1);
    gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255, 255, 255, 0.28)'; g.lineWidth = 2;
    for (var k = -2; k <= 2; k++) {
      g.beginPath(); g.moveTo(w / 2, h); g.quadraticCurveTo(w / 2 + k * 20, h * 0.5, w / 2 + k * 8, 8); g.stroke();
    }
  });
}

function buildLotusRing(count, radius, w, len, cup, mat, phase, store) {

    rotG.rotation.y = i * Math.PI * 2 / count + phase;

    var pm = mesh(pGeo, mat, false);
    piv.add(pm); rotG.add(piv); lotusG.add(rotG);
    store.push(piv);
  }
}

  var needW = portrait ? 6.8 : 9.4, needH = portrait ? 9.0 : 6.6;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);

function tone(f, dur, type, vol, f2, delay) {
  var a = audio(); if (!a) return;
  var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}

function clearConfetti() {
  if (confRaf) { cancelAnimationFrame(confRaf); confRaf = 0; }
  confPs = [];
  if (confCtx) confCtx.clearRect(0, 0, confC.width, confC.height);
}
function hideWinToast() { $('#winToast').classList.remove('show'); }
function launchConfetti() {
  clearConfetti();
  confC.width = window.innerWidth; confC.height = window.innerHeight;
  var cols = ['#2f9e5b', '#f59e0b', '#38bdf8', '#f43f5e', '#a855f7', '#facc15'];
  for (var i = 0; i < 72; i++) {
    confPs.push({
      x: confC.width * (0.15 + Math.random() * 0.7), y: confC.height * 0.18 + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 7,
      w: 7 + Math.random() * 6, h: 4 + Math.random() * 4,
      a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.28,
      c: cols[i % cols.length], life: 1
    });
  }
  (function tick() {
    confCtx.clearRect(0, 0, confC.width, confC.height);
    var alive = 0;
    confPs.forEach(function (p) {
      if (p.life <= 0) return;
      p.vy += 0.24; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= 0.009;
      if (p.y > confC.height + 20 || p.life <= 0) { p.life = 0; return; }
      alive++;
      confCtx.save(); confCtx.globalAlpha = Math.min(1, p.life * 1.5);
      confCtx.translate(p.x, p.y); confCtx.rotate(p.a);
      confCtx.fillStyle = p.c; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      confCtx.restore();
    });
    if (alive > 0) confRaf = requestAnimationFrame(tick); else confRaf = 0;
  })();
}

function updateGuide(speakIt, immediate) {
  var info = getGuideInfo();
  var changed = info.phase !== guidePhase;
  guidePhase = info.phase;
  guideBarEl.textContent = info.text;
  if (changed) {
    guideBarEl.classList.remove('flash');
    void guideBarEl.offsetWidth;
    guideBarEl.classList.add('flash');
    setTimeout(function () { guideBarEl.classList.remove('flash'); }, 550);
  }
  if (speakIt && (changed || immediate)) {
    if (guideTimer) { clearTimeout(guideTimer); guideTimer = null; }
    var gen = resetGen;
    if (immediate) {
      speak(info.voice, true);
    } else if (!celebrated && info.phase < 5) {
      guideTimer = setTimeout(function () {
        if (gen !== resetGen || celebrated) return;
        speak(info.voice);
      }, 1550);
    }
  }
}

function syncStamps() {
  var nextW = ms.waterReal;
  var nextS = ms.realBloom && ms.pondBloom;

  if (nextF && !kinds.f) { kinds.f = true; $('#stF').classList.add('lit'); }
}

function checkComplete() {
  syncStamps();

}

var P = null, hoveredTool = null, hoveredTarget = null, now = 0;
function setNDC(e) { ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(ndc, camera); }
var toolMeshes = []; TOOLS.forEach(function (tl) { tl.g.traverse(function (o) { if (o.isMesh) toolMeshes.push(o); }); });
var targetMeshes = []; TARGETS.forEach(function (tg) { tg.g.traverse(function (o) { if (o.isMesh) targetMeshes.push(o); }); });

function pickTool(e) {
  setNDC(e); var h = raycaster.intersectObjects(toolMeshes, false)[0];
  if (h) return h.object.userData.tool;
  var best = null, bd = 48;
  TOOLS.forEach(function (tl) {

    var d = Math.hypot(e.clientX - p.x, e.clientY - p.y);
    if (d < bd) { bd = d; best = tl; }
  });
  return best;
}
function pickTarget(e) {
  setNDC(e); var h = raycaster.intersectObjects(targetMeshes, false)[0];
  return h ? h.object.userData.target : null;
}
var plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptmp = new THREE.Vector3();
function planePoint(e, y) { setNDC(e); plane.constant = -y; return raycaster.ray.intersectPlane(plane, ptmp) ? ptmp.clone() : null; }

var demo = null;

  ['move', 'can', -2.07, 1.48, -0.55, 0.75],

  ['end']
];
function getTool(id) { return id === 'can' ? canTool : sunTool; }
function getTarget(id) { return TARGETS.find(function (t) { return t.id === id; }); }
function startDemo() {
  resetAll(true); demo = { i: 0, t: 0 }; ghost.off = true;
  $('#demoBtn').classList.add('on'); $('#demoBtn').textContent = '■ 停止';

  if (!demo) return;

function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  var tl = getTool(s[1]);
  if (s[0] === 'move' || s[0] === 'home') {
    var dur = s[0] === 'move' ? s[5] : s[2];
    var dest = s[0] === 'move' ? new THREE.Vector3(s[2], BASE + s[3], s[4]) : tl.home.clone();
    if (!demo.from) demo.from = tl.cur.clone();
    var u = Math.min(1, demo.t / dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    tl.target.lerpVectors(demo.from, dest, e);
    tl.flying = true;
    if (u >= 1) { demo.from = null; demo.i++; demo.t = 0; }
  } else if (s[0] === 'hold') {
    tl.flying = true;
    applyTool(tl, getTarget(s[2]), dt);
    if (demo.t >= s[3]) { tl.flying = false; demo.i++; demo.t = 0; }
  }
}

/* ===================== 开场动画 ===================== */
var intro = { t: 0, done: false };
function introSkip() {
  if (intro.t < 1.45) intro.t = 1.45;
}
function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4);
  var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift;
  figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.01, backOut((t - 0.3) / 0.5)), 1);
  fenceG.scale.setScalar(Math.max(0.001, backOut((t - 0.45) / 0.5)));
  TARGETS.forEach(function (tg, i) { tg.g.scale.setScalar(Math.max(0.001, backOut((t - 0.5 - i * 0.08) / 0.5))); });
  TOOLS.forEach(function (tl, i) { tl.pop = Math.max(0.001, backOut((t - 0.72 - i * 0.1) / 0.5)); });
  if (t > 0.9 && t < 3.6) { TARGETS.forEach(function (tg) { tg.introLbl = true; }); TOOLS.forEach(function (tl) { tl.introLbl = true; }); }
  if (t >= 3.6) {
    TARGETS.forEach(function (tg) { tg.introLbl = false; tg.g.scale.setScalar(1); });
    TOOLS.forEach(function (tl) { tl.introLbl = false; tl.pop = 1; });
    fenceG.scale.setScalar(1); board.scale.set(1, 1, 1);
    intro.done = true;
  }
}

/* ===================== 更新植物生长与动画 ===================== */
var dryColor = new THREE.Color('#a37b52'), wetColor = new THREE.Color('#53351d');
function updatePlants(dt) {
  // 1. 真花生长曲线
  realState.growth += (realState.goal - realState.growth) * Math.min(1, dt * 3.5);
  var g = realState.growth;
  soilMat.color.copy(dryColor).lerp(wetColor, realState.wet);
  var stemH = 0.22 + g * 0.95;
  stemM.scale.set(0.75 + g * 0.35, stemH, 0.75 + g * 0.35);
  stemM.position.y = stemH * 0.5;
  plantG.rotation.z = Math.sin(now * 2.1) * (0.03 + g * 0.04);

  leaves.forEach(function (lf, idx) {
    var thr = idx < 2 ? 0.06 : 0.38;
    var u = Math.min(1, Math.max(0, (g - thr) / 0.42));
    lf.scale.setScalar(0.15 + u * 0.85);
    lf.position.y = stemH * (idx < 2 ? 0.36 : 0.68);
    lf.rotation.z = 0.95 - u * 0.75;
  });

  realFlowerG.position.y = stemH + 0.04;
  var fu = Math.min(1, Math.max(0, (g - 0.52) / 0.48));
  realFlowerG.scale.setScalar(0.12 + fu * 0.96);
  realFlowerG.rotation.y = now * 0.35;
  realPetals.forEach(function (pg) {
    pg.rotation.z = 1.15 - fu * 1.05;
  });

  // 2. 精致3层睡莲绽放动画（花苞 → 层层舒展盛放 + 金黄花蕊 + 轻柔水波）
  pondState.bloom += (pondState.goal - pondState.bloom) * Math.min(1, dt * 3.4);
  var b = pondState.bloom;
  lotusG.position.y = 0.195 + Math.sin(now * 2.1) * 0.012;
  lotusG.rotation.y = Math.sin(now * 0.7) * 0.08;
  lotusOuter.forEach(function (piv) { piv.rotation.x = 0.22 + b * 1.12; });
  lotusMid.forEach(function (piv)   { piv.rotation.x = 0.13 + b * 0.82; });
  lotusInner.forEach(function (piv) { piv.rotation.x = 0.05 + b * 0.50; });
  lotusStamenG.scale.setScalar(0.65 + b * 0.5);
  babyBudG.position.y = 0.19 + Math.sin(now * 2.4 + 1.2) * 0.008;
  lilyPads.forEach(function (pd, idx) {
    pd.position.y = 0.16 + Math.sin(now * 1.9 + idx * 1.4) * 0.006;
  });
  ambientRipples.forEach(function (arp, idx) {
    var ph = (now * 0.45 + idx * 0.5) % 1;
    arp.scale.setScalar(0.88 + ph * 0.42);
    arp.material.opacity = Math.sin(ph * Math.PI) * 0.24;
  });

  // 3. 塑料花抖动（浇水弹开效果）
  if (fakeState.wobble > 0) {
    fakeState.wobble = Math.max(0, fakeState.wobble - dt * 3.8);
    fakeFlowerG.rotation.z = Math.sin(now * 38) * 0.11 * fakeState.wobble;
  } else fakeFlowerG.rotation.z = 0;

  // 4. 点按小跳
  TARGETS.forEach(function (tg) {
    if (tg.st.hop > 0) {
      tg.st.hop = Math.max(0, tg.st.hop - dt * 3.4);
      tg.g.position.y = BASE + Math.sin(tg.st.hop * Math.PI) * 0.22 * tg.st.hop;
    } else tg.g.position.y = BASE;
  });

  // 5. 水波纹
  ripples.forEach(function (rp) {
    if (!rp.active) return;
    rp.t += dt * 1.35;
    if (rp.t >= 1) { rp.active = false; rp.m.material.opacity = 0; return; }
    rp.m.scale.setScalar(1 + rp.t * 3.6);
    rp.m.material.opacity = (1 - rp.t) * 0.72;
  });

  // 6. 水滴与闪光粒子
  drops.forEach(function (d) {
    if (d.life <= 0) return;
    d.life -= dt;
    d.v.y -= 9.5 * dt;
    d.m.position.addScaledVector(d.v, dt);
    if (d.bounce && d.m.position.y < BASE + 1.05 && d.v.y < 0) {
      d.v.y = 2.4; d.v.x = (Math.random() - 0.5) * 2.6; d.v.z = (Math.random() - 0.5) * 2.6; d.bounce = false;
    }
    if (d.life <= 0 || d.m.position.y < BASE) { d.life = 0; d.m.visible = false; }
  });
  sparks.forEach(function (s) {
    if (s.life <= 0) return;
    s.life -= dt;
    s.m.position.addScaledVector(s.v, dt);
    s.m.rotation.y += dt * 6;
    s.m.scale.setScalar(Math.max(0.01, s.life));
    if (s.life <= 0) s.m.visible = false;
  });
}

/* ===================== 主循环 ===================== */
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  var activeTool = null, activeTarget = null;
  if (P && P.mode === 'drag') {
    activeTool = P.tool;
    var liftY = BASE + (activeTool.id === 'can' ? 1.48 : 1.85);
    var pp = planePoint(P.e, liftY);
    if (pp) {
      activeTool.target.set(
        THREE.MathUtils.clamp(pp.x, BOARD.x0 - 0.2, BOARD.x1 + 0.6),
        liftY,
        THREE.MathUtils.clamp(pp.z, BOARD.z0 - 0.2, BOARD.z1 + 0.4)
      );
    }
    activeTarget = targetUnder(activeTool);
    applyTool(activeTool, activeTarget, dt);
  } else if (demo) {
    TOOLS.forEach(function (tl) { if (tl.flying) { activeTool = tl; activeTarget = targetUnder(tl); } });
  }

  // 高亮目标圆环（结合分步引导脉冲）
  var curGuide = getGuideInfo();
  var pulseBob = 0.5 + 0.5 * Math.sin(now * 5.2);
  TARGETS.forEach(function (tg) {
    var lit = activeTarget === tg;
    var guideLit = !celebrated && curGuide.target === tg.id;
    var isSunCue = (activeTool && activeTool.id === 'sun') || (!activeTool && curGuide.tool === 'sun');
    tg.glow.material.color.setHex(isSunCue ? 0xfbbf24 : 0x38bdf8);
    var targetOp = lit ? 0.85 : (guideLit ? 0.22 + pulseBob * 0.36 : 0);
    tg.glow.material.opacity += (targetOp - tg.glow.material.opacity) * 0.22;
    var showL = tg.introLbl || hoveredTarget === tg || lit || (voiceCueTimer > 0 && guideLit);
    if (showL) {
      var sp = toScreen(tg.g.position.clone().add(new THREE.Vector3(0, tg.h + 0.12, 0)));
      tg.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    tg.lbl.classList.toggle('show', !!showL);
  });

  // 更新工具位置、倾斜、太阳光线（引导工具轻微浮动提示）
  var kk = 1 - Math.exp(-16 * dt);
  TOOLS.forEach(function (tl) {
    tl.cur.lerp(tl.target, tl.dragging ? 1 - Math.exp(-24 * dt) : kk);
    var hv = (hoveredTool === tl && !P) ? 1 : 0;
    tl.hover += (hv - tl.hover) * 0.22;
    var pulseTl = !celebrated && !tl.dragging && !tl.flying && curGuide.tool === tl.id;
    tl.g.position.set(tl.cur.x, tl.cur.y + tl.hover * 0.08 + (pulseTl ? pulseBob * 0.1 : 0), tl.cur.z);
    var s = tl.pop * (1 + (pulseTl ? pulseBob * 0.06 : 0));
    tl.body.scale.setScalar(s);

    var pouring = (activeTool === tl && activeTarget);
    if (tl.id === 'can') {
      var goalTilt = pouring ? 0.56 : (tl.dragging ? 0.14 : 0);
      tl.tilt += (goalTilt - tl.tilt) * 0.18;
      tl.body.rotation.z = tl.tilt;
    } else {
      sunRaysG.rotation.z += dt * (pouring ? 2.8 : 0.7);
      sunBeam.material.opacity += ((pouring ? 0.34 : 0) - sunBeam.material.opacity) * 0.15;
    }

    var showL = tl.introLbl || (hoveredTool === tl && !P) || (voiceCueTimer > 0 && pulseTl);
    if (showL) {
      var sp = toScreen(tl.cur.clone().add(new THREE.Vector3(0, tl.h + 0.22, 0)));
      tl.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    tl.lbl.classList.toggle('show', !!showL);
  });

  updatePlants(dt);
  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.45 : 1;
  renderer.render(scene, camera);
}

  voiceOn = true; greeted = true;

});
$('#ntTgl').addEventListener('click', function () {

});
document.querySelectorAll('#quizOpts .qopt').forEach(function (btn) {

    audio();

    } else {
      this.classList.add('err');
      fb.className = 'quiz-fb err';
      fb.textContent = '再想想哦～刚才我们用哪两件宝贝照顾真花盆，它才发芽开花的？';

      speak('再想想哦，刚才我们用哪两件宝贝照顾真花盆，它才发芽开花的？', true);
    }
  });
});
$('#winClose').addEventListener('click', hideWinToast);
$('#winReplay').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, ms: ms }; },
  startDemo: startDemo
};

updateGuide(false, false);
fit();
requestAnimationFrame(frame);
})();

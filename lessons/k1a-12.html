<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第12课 制作会旋转的纸蜻蜓 · 剪折并放飞纸蜻蜓（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.cue-pulse{animation:cueGlow 1.5s ease-in-out infinite}
.cue-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#e56d17;color:#fff;font-size:10px;font-weight:800;line-height:1.45;white-space:nowrap;
  box-shadow:0 2px 6px rgba(185,78,8,.35);pointer-events:none;transition:opacity .35s,transform .35s}
#demoBtn .cue-tag{background:#2578e5;box-shadow:0 2px 6px rgba(37,120,229,.35)}
.cue-tag.hide{opacity:0;transform:translateX(-50%) translateY(-4px)}
@keyframes cueGlow{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.5)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 7px rgba(229,109,23,0)}}

#guideBar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:8px;max-width:min(460px,calc(100vw - 680px));
  padding:7px 14px;border-radius:16px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 6px 18px rgba(130,68,12,.16);
  font-size:14px;font-weight:800;line-height:1.45;color:#7a3e08;cursor:pointer;transition:transform .2s,border-color .25s}
#guideBar:hover{border-color:#d65b0a}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.pulse{animation:guidePop .45s ease}
.gb-ico{flex:none;font-size:18px;line-height:1}
.gb-txt{flex:1}
@keyframes guidePop{0%{transform:translateX(-50%) scale(.94)}50%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}
@media (max-width:1160px){
  #guideBar{left:14px;top:66px;transform:none;max-width:calc(100vw - 266px)}
  #guideBar:active{transform:scale(.98)}
  @keyframes guidePop{0%{transform:scale(.95)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:234px;overflow:hidden;
  padding:9px 11px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-head-r{display:flex;align-items:center;gap:6px}
.nt-tog{border:1px solid var(--line);background:#fff;color:#7a6544;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stamps{display:flex;gap:6px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:158px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:14px;font-weight:800;line-height:1.6;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.84);z-index:20;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:22px;
  background:linear-gradient(155deg,#fffaf0 0%,#fff1d6 100%);border:2.5px solid #f08a24;
  box-shadow:0 18px 44px rgba(100,52,10,.32);opacity:0;pointer-events:none;
  transition:opacity .32s,transform .38s cubic-bezier(.2,1.5,.4,1)}
#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.win-head{display:flex;align-items:center;gap:12px}
.win-medal{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 35% 30%,#fff3a6,#f59e0b);box-shadow:0 3px 10px rgba(229,109,23,.35)}
.win-txt{display:flex;flex-direction:column;gap:2px}
.win-ttl{font-size:18px;font-weight:900;color:#b84906;line-height:1.5}
.win-sub{font-size:13px;font-weight:800;color:#7a6544;line-height:1.45}
.win-concl{padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid #f2c98a;font-size:13.5px;line-height:1.6;color:#3d3224;font-weight:700}
.win-concl-h{font-size:13px;font-weight:900;color:#c2560c;margin-bottom:3px}
.win-quiz{padding:10px 12px;border-radius:14px;background:#fffdf7;border:1.5px dashed #e58e26;display:flex;flex-direction:column;gap:7px}
.win-quiz-h{font-size:13px;font-weight:900;color:#b84906}
.win-quiz-q{font-size:14px;font-weight:800;color:#2a3040;line-height:1.5}
.win-opts{display:flex;flex-direction:column;gap:6px}
.qopt{width:100%;text-align:left;padding:8px 11px;border-radius:11px;border:1.5px solid #e3d6bd;background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:#2a3040;cursor:pointer;transition:all .16s}
.qopt:hover{border-color:#e56d17;background:#fff7eb}
.qopt.ok{border-color:#16a34a;background:#ecfdf3;color:#15803d}
.qopt.wrong{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
.quiz-fb{font-size:13px;font-weight:800;line-height:1.5;min-height:18px;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2560c}
.win-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.wact{height:36px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.wact.pri{background:var(--accent);border-color:#bf5409;color:#fff}
.wact.pri rt{color:#ffe4c4}

/* 底部操作条：桌面剪折 <-> 去试飞，随时自由切换 */
#actBar{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:18px;background:rgba(255,250,240,.95);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.14);white-space:nowrap}
.abtn{position:relative;display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:12px;border:1.5px solid #e6d7bd;
  background:#fff;font:inherit;font-size:15px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 #e6d7bd;transition:transform .1s,background .18s}
.abtn:active{transform:translateY(1px)}
.abtn.on{background:#fff1df;border-color:#e56d17;color:#c2560c;box-shadow:0 2px 0 #e56d17}
.abtn.pri{background:#e56d17;border-color:#bf5409;color:#fff;box-shadow:0 2px 0 #bf5409}
.abtn.pri rt{color:#ffe4c4}
.abtn.wind.on{background:#e2f3ff;border-color:#2680d9;color:#185da3;box-shadow:0 2px 0 #2680d9}
.abtn.glow-next{border-color:#e56d17;background:#fff4e2;color:#b84906;animation:nextBtnPulse 1.15s ease-in-out infinite}
.abtn.pri.glow-next{background:#e56d17;color:#fff}
.abtn .fly-badge{display:none;position:absolute;top:-22px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:99px;
  background:#e56d17;color:#fff;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 3px 8px rgba(229,109,23,.4)}
.abtn.glow-next .fly-badge{display:block;animation:badgeBob .9s ease-in-out infinite}
@keyframes nextBtnPulse{0%,100%{box-shadow:0 2px 0 #e56d17,0 0 0 0 rgba(229,109,23,.6)}50%{box-shadow:0 2px 0 #e56d17,0 0 0 10px rgba(229,109,23,0)}}
@keyframes badgeBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.sep{width:1.5px;height:24px;background:#e3d6bd}
.stepTag{padding:3px 10px;border-radius:10px;background:#f4ead6;color:#7a6544;font-size:14px;font-weight:800;line-height:1.5}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;line-height:1.5;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:3px 11px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.7;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.lbl.tmr{background:rgba(255,250,240,.95);color:var(--ink);border:2px solid #e56d17;box-shadow:0 4px 12px rgba(80,55,20,.16)}
.lbl.tmr.blue{border-color:#2b8cf0}
.lbl.tmr rt{color:#8a6d4a}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:24px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
.word.ok{color:#15803d}
.word.cool{color:#1d62b5}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-185%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:60px;height:60px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:15px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:5px}.tbtn{height:34px;padding:0 9px;font-size:13px}
  .cue-tag{font-size:9px;top:-9px;padding:0 5px}
  #guideBar{left:8px;top:52px;right:204px;max-width:none;padding:5px 9px;font-size:12px}
  .gb-ico{font-size:15px}
  #notes{top:54px;right:8px;width:190px;padding:7px 9px}
  #ntList{max-height:112px}
  .stk{font-size:13px;padding:4px 7px}
  #winToast{padding:12px 14px;gap:8px}
  .win-medal{width:38px;height:38px;font-size:22px}.win-ttl{font-size:15px}.win-sub{font-size:12px}
  .win-concl,.win-quiz-q,.qopt{font-size:12.5px}
  #actBar{bottom:54px;gap:5px;padding:5px 6px;max-width:96vw;flex-wrap:wrap;justify-content:center}
  .abtn{padding:4px 9px;font-size:13px}.stepTag{display:none}
  #verbs{bottom:10px;gap:5px}.verb{font-size:13px;padding:4px 9px}.verb svg{width:16px;height:16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<canvas id="confettiCanvas"></canvas>

<div id="winToast" aria-live="polite">
  <div class="win-head">
    <div class="win-medal">🏆</div>
    <div class="win-txt">
      <div class="win-ttl" id="winTtl"></div>
      <div class="win-sub" id="winSub"></div>
    </div>
  </div>
  <div class="win-concl">
    <div class="win-concl-h">✨ 科学小结论</div>
    <div id="winConclTxt">把纸条剪开后，两片翅膀一前一后相反折弯、尾巴折起来配重，松手后空气托起翅膀，纸蜻蜓就会稳稳地旋转着慢慢下落，比平纸条落得慢多了！</div>
  </div>
  <div class="win-quiz">
    <div class="win-quiz-h">💡 考考你 · 答对领小红花 🌸</div>
    <div class="win-quiz-q">为了让纸蜻蜓下落时能旋转起来，两片纸翼应该怎么折？</div>
    <div class="win-opts" id="quizOpts">
      <button class="qopt" data-ok="1" type="button">🔄 一片向前、一片向后相反折弯</button>
      <button class="qopt" data-ok="0" type="button">📄 平平的完全不折</button>
      <button class="qopt" data-ok="0" type="button">✂️ 把翅膀全剪掉</button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="win-btns">
    <button class="wact" id="winCloseBtn" type="button"></button>
    <button class="wact pri" id="winReplayBtn" type="button"></button>
  </div>
</div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 47 页「剪折并放飞纸蜻蜓」</small></div>
</div>
<div id="guideBar" title="点我再听一遍玩法提示" aria-live="polite"><span class="gb-ico" id="gbIco">✂️</span><span class="gb-txt" id="gbTxt"></span></div>
<div class="tools">
  <button class="tbtn on cue-pulse" id="voiceBtn" type="button">🔊 语音<span class="cue-tag" id="voiceCue">点我听玩法</span></button>
  <button class="tbtn cue-pulse" id="demoBtn" type="button">▶ 演示<span class="cue-tag" id="demoCue">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><span class="nt-head-r"><span id="ntCount" style="color:#c2560c">0</span><button class="nt-tog" id="ntTog" type="button">收起</button></span></div>
  <div class="stamps"><span class="stamp" data-k="c" id="stC"></span><span class="stamp" data-k="s" id="stS"></span><span class="stamp" data-k="d" id="stD"></span></div>
  <div id="ntList"></div>
</aside>

<div id="actBar">
  <button class="abtn on" id="modeCraftBtn" type="button"></button>
  <button class="abtn" id="modeFlyBtn" type="button"><span id="modeFlyTxt"></span><span class="fly-badge">点我去试飞!</span></button>
  <span class="sep"></span>
  <span class="stepTag" id="stepTag"></span>
  <button class="abtn pri" id="quickFoldBtn" type="button"></button>
  <button class="abtn pri" id="dropBtn" type="button" style="display:none"></button>
  <button class="abtn wind" id="windBtn" type="button" style="display:none"></button>
</div>

<div id="verbs">
  <span class="verb" data-v="cut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/><path d="M8.5 8.5L20 18M8.5 15.5L20 6"/></svg><span id="vb1"></span></span>
  <span class="verb" data-v="fold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l8-11 8 11H4z"/><path d="M12 6v11"/></svg><span id="vb2"></span></span>
  <span class="verb" data-v="fly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M7 9l5-5 5 5"/><path d="M5 14c3 2 11 2 14 0"/></svg><span id="vb3"></span></span>
</div>

<svg id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l3-1c2-6 9-5 9 0 2-3 8-2 8 3 3-1 7 1 7 5v12c0 9-7 15-16 15h-6c-6 0-10-3-13-8L13 41c-2-3 0-7 4-7 2 0 3 1 4 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#2a3040" stroke-width="3" stroke-linejoin="round"/></svg>

<script src="../audio/manifest.js?v=doubao-2"></script>

<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  var syl = py ? py.trim().split(/\s+/) : [], i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) { var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; } out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>'; }
    else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
var $ = function (s) { return document.querySelector(s); };
$('#ttl').innerHTML = ruby('第12课 制作会旋转的纸蜻蜓', 'dì kè zhì zuò huì xuán zhuǎn de zhǐ qīng tíng');
$('#ntTitle').innerHTML = ruby('我的发现', 'wǒ de fā xiàn');
$('#stC').innerHTML = ruby('剪折', 'jiǎn zhé');
$('#stS').innerHTML = ruby('旋转', 'xuán zhuǎn');
$('#stD').innerHTML = ruby('对比', 'duì bǐ');
$('#vb1').innerHTML = ruby('剪一剪', 'jiǎn yi jiǎn');
$('#vb2').innerHTML = ruby('折一折', 'zhé yi zhé');
$('#vb3').innerHTML = ruby('放飞比', 'fàng fēi bǐ');
$('#modeCraftBtn').innerHTML = ruby('桌面剪折', 'zhuō miàn jiǎn zhé');
$('#modeFlyTxt').innerHTML = ruby('去试飞', 'qù shì fēi');
$('#quickFoldBtn').innerHTML = ruby('一键折好', 'yī jiàn zhé hǎo');
$('#dropBtn').innerHTML = ruby('松手试飞', 'sōng shǒu shì fēi');
$('#windBtn').innerHTML = ruby('微风', 'wēi fēng');
$('#winTtl').innerHTML = ruby('太棒啦！全部发现集齐啦！', 'tài bàng la quán bù fā xiàn jí qí la');

var camPos = new THREE.Vector3(), camTgt = new THREE.Vector3();

var portrait = false;
function computeCamGoals() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  portrait = w / h < 0.85;
  var isFly = mode === 'fly';
  var tgt = isFly
    ? new THREE.Vector3(portrait ? 0 : 0.45, portrait ? 1.95 : 2.15, 0)
    : new THREE.Vector3(portrait ? -0.25 : 0.15, 0.45, 0.15);
  var dir = isFly
    ? new THREE.Vector3(0, 0.32, 0.947).normalize()
    : (portrait ? new THREE.Vector3(0.18, 0.82, 0.54).normalize() : new THREE.Vector3(0, 0.78, 0.625).normalize());
  var needW = isFly ? (portrait ? 6.6 : 9.0) : (portrait ? 7.2 : 9.0);
  var needH = isFly ? (portrait ? 7.8 : 6.2) : (portrait ? 7.4 : 5.8);
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max(needW / 2 / Math.tan(hf / 2), needH / 2 / Math.tan(vf / 2) * 0.9);

  camera.updateProjectionMatrix();
}
function fit() {

function launchConfetti() {

  var cols = ['#f59e0b', '#e56d17', '#2b8cf0', '#16a34a', '#ec4899', '#a855f7'];

function stepConfetti(dt) {
  if (!confParts.length) return;

    confC.width = window.innerWidth; confC.height = window.innerHeight;

  confCtx.clearRect(0, 0, confC.width, confC.height);

    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
    confCtx.globalAlpha = Math.min(1, p.life);
    confCtx.fillStyle = p.col; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

function finishDrag() {
  if (!dragState) return;
  if (dragState.kind === 'cut' && !dragState.moved && craftStep === 0) {
    advanceCraftStep();
  } else if (dragState.kind === 'lift') {
    launchDrop();
  }
  dragState = null;
  canvas.style.cursor = 'default';
}
canvas.addEventListener('pointerup', finishDrag);
canvas.addEventListener('pointercancel', finishDrag);

/* ===================== 幽灵手示范 ===================== */
var ghost = { off: false, t: 0 }, handEl = $('#hand');
function updateGhost(dt) {
  if (ghost.off || intro.t < 1.6) { handEl.style.opacity = 0; return; }
  ghost.t = (ghost.t + dt) % 2.4;
  var a, b;
  if (mode === 'craft') {
    if (craftStep === 0) {
      a = toScreen(new THREE.Vector3(-0.75, BASE + 0.15, -1.55));
      b = toScreen(new THREE.Vector3(-0.75, BASE + 0.15, -0.22));
    } else if (craftStep === 1) {
      a = toScreen(new THREE.Vector3(-1.05, BASE + 0.15, -0.9));
      b = toScreen(new THREE.Vector3(-0.45, BASE + 0.15, -0.9));
    } else if (craftStep === 2) {
      a = toScreen(new THREE.Vector3(-0.75, BASE + 0.15, 1.3));
      b = toScreen(new THREE.Vector3(-0.75, BASE + 0.35, 1.0));
    } else {
      var r = $('#modeFlyBtn').getBoundingClientRect();
      a = { x: r.left + r.width / 2, y: r.top + r.height / 2 + 12 };
      b = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
  } else {
    a = toScreen(new THREE.Vector3(0, BASE + 2.2, 0.15));
    b = toScreen(new THREE.Vector3(0, BASE + 3.8, 0.15));
  }
  var u = Math.min(1, Math.max(0, (ghost.t - 0.35) / 1.35));
  var x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u;
  handEl.style.opacity = ghost.t < 2.0 ? 0.92 : 0;
  handEl.style.transform = 'translate(' + (x - 18) + 'px,' + (y - 6) + 'px)';
}

/* ===================== 老师演示 ===================== */
var demo = null;
var DEMO = [
  ['say', '第一步，用剪刀沿红线剪开两片纸翼！'], ['wait', 0.45], ['step'], ['wait', 1.45],
  ['say', '第二步，把左右两片纸翼一前一后反向折弯！'], ['wait', 0.45], ['step'], ['wait', 1.45],
  ['say', '第三步，折起底部小尾巴加上配重，纸蜻蜓做好啦！'], ['wait', 0.45], ['step'], ['wait', 1.55],
  ['say', '现在点去试飞，看看纸蜻蜓和平纸条谁落得慢！'], ['toFly'], ['wait', 1.2],
  ['drop'], ['wait', 4.3],
  ['say', '再打开微风小风扇，看看微风吹来纸蜻蜓怎么飞！'], ['wind'], ['wait', 0.6], ['drop'], ['wait', 4.4],
  ['end']
];
function startDemo() {
  dismissEntryCues();
  resetAll(true); demo = { i: 0, t: 0 }; ghost.off = true;
  $('#demoBtn').classList.add('on'); $('#demoBtn').textContent = '■ 停止';
}
function stopDemo() {
  if (!demo) return; demo = null; clearQuickFold();
  $('#demoBtn').classList.remove('on'); $('#demoBtn').textContent = '▶ 演示';
}
function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  if (s[0] === 'wait') { if (demo.t >= s[1]) { demo.i++; demo.t = 0; } return; }
  if (s[0] === 'say') { speak(s[1]); demo.i++; demo.t = 0; return; }
  if (s[0] === 'step') { advanceCraftStep(); demo.i++; demo.t = 0; return; }
  if (s[0] === 'toFly') { setMode('fly', true); demo.i++; demo.t = 0; return; }
  if (s[0] === 'wind') { toggleWind(true); demo.i++; demo.t = 0; return; }
  if (s[0] === 'drop') { launchDrop(); demo.i++; demo.t = 0; return; }
}

/* ===================== 开场动画 ===================== */
var intro = { t: 0, done: false };
function introSkip() {
  if (intro.done) return;
  intro.t = 3.5; intro.done = true;
  figCard.visible = false;
  board.scale.set(1, 1, 1); craftGrp.scale.setScalar(1);
}
function backOut(t) { var c = 1.65; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4); var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift; figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.02, backOut((t - 0.3) / 0.5)), 1);
  craftGrp.scale.setScalar(Math.max(0.01, backOut((t - 0.52) / 0.55)));
  if (t >= 2.2) introSkip();
}

/* ===================== 重来 ===================== */
function toggleWind(forceOn) {
  windOn = forceOn !== undefined ? forceOn : !windOn;
  $('#windBtn').classList.toggle('on', windOn);
  fanGrp.visible = windOn;
  if (windOn) tone(360, 0.14, 'sine', 0.08, 520);
  updateGuide(!demo && windOn && !found['wind-fly'] && !celebrated);
}
function resetAll(keepDemo) {
  if (!keepDemo) stopDemo();
  found = {}; foundN = 0; kinds = { c: false, s: false, d: false };
  acted = { cut: false, fold: false, fly: false }; actions = 0;
  celebrated = false; hideWinToast(); resetQuizUI();
  resetCraftOnly();
  toggleWind(false);
  setMode('craft', true);
  resetFly(false);
  $('#ntList').innerHTML = ''; $('#ntCount').textContent = '0';
  document.querySelectorAll('.stamp').forEach(function (s) { s.classList.remove('lit'); });
  document.querySelectorAll('.verb').forEach(function (v) { v.classList.remove('done'); });
  $('#verbs').style.opacity = 1;
  updateGuide(false);
}

/* ===================== 主循环 ===================== */
var last = performance.now(), now = 0, whirCD = 0;
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);
  if (guidePulseT > 0) guidePulseT = Math.max(0, guidePulseT - dt);

  // 平滑相机过渡
  computeCamGoals();
  camPos.lerp(camGoalPos, 1 - Math.exp(-6.5 * dt));
  camTgt.lerp(camGoalTgt, 1 - Math.exp(-6.5 * dt));
  camera.position.copy(camPos);
  camera.lookAt(camTgt);

  // ---- PART A: 剪折动画 ----
  if (mode === 'craft') {
    cutProg += (cutGoal - cutProg) * (1 - Math.exp(-10 * dt));
    wingFold += (wingFoldGoal - wingFold) * (1 - Math.exp(-7 * dt));
    tailFold += (tailFoldGoal - tailFold) * (1 - Math.exp(-7 * dt));
    standUp += ((craftStep >= 3 ? 1 : 0) - standUp) * (1 - Math.exp(-4.5 * dt));

    // 两片飞翼剪开略分离 + 反向折起（左翼前倾，右翼后倾）
    wingLPiv.position.x = -cutProg * 0.04;
    wingRPiv.position.x = cutProg * 0.04;
    wingLPiv.rotation.x = wingFold * 0.88;
    wingLPiv.rotation.z = -wingFold * 0.36;
    wingRPiv.rotation.x = -wingFold * 0.88;
    wingRPiv.rotation.z = wingFold * 0.36;

    // 侧片折向中间 + 底部尾尖上折配重
    flapLPiv.rotation.z = -tailFold * 2.85;
    flapRPiv.rotation.z = tailFold * 2.85;
    tailPiv.rotation.x = -tailFold * 2.75;

    // 成型后优雅立起并轻柔自转展示
    paperPivot.rotation.x = -standUp * (Math.PI / 2);
    paperPivot.position.y = BASE + 0.065 + standUp * 1.18;
    paperPivot.rotation.y = standUp > 0.7 ? (now * 2.6) % (Math.PI * 2) : 0;

    // 剪刀跟随剪裁进度咔嚓动画
    if (scisSnipT > 0 || (dragState && dragState.kind === 'cut')) {
      if (scisSnipT > 0) scisSnipT = Math.max(0, scisSnipT - dt);
      var targetZ = -1.65 + cutProg * 1.45;
      scisGrp.position.lerp(new THREE.Vector3(-0.75, BASE + 0.16, targetZ + 0.65), 1 - Math.exp(-14 * dt));
      scisGrp.rotation.y += (0 - scisGrp.rotation.y) * 0.2;
      var snipAng = Math.abs(Math.sin(now * 22)) * 0.42;
      scisBladeA.rotation.y = snipAng;
      scisBladeB.rotation.y = -snipAng;
    } else {
      scisGrp.position.lerp(SCIS_HOME, 1 - Math.exp(-8 * dt));
      scisGrp.rotation.y += (0.45 - scisGrp.rotation.y) * 0.12;
      scisBladeA.rotation.y *= 0.85; scisBladeB.rotation.y *= 0.85;
    }

    // 引导线与剪刀光圈呼吸闪烁（语音提示时更醒目）
    var boost = guidePulseT > 0 ? 1.55 : 1.0;
    scisCueRing.visible = craftStep === 0 && scisSnipT <= 0;
    if (scisCueRing.visible) {
      var sr = 1 + Math.sin(now * 6) * 0.12 * boost;
      scisCueRing.scale.set(sr, sr, 1);
      scisCueRing.material.opacity = 0.45 + Math.sin(now * 6) * 0.3;
    }
    if (cutLineGrp.visible) cutHit.material.opacity = 0.18 + Math.sin(now * 6) * 0.11 * boost;
    if (foldWingGuide.visible) {
      foldWingGuide.scale.set(1 + Math.sin(now * 6) * 0.08 * boost, 1 + Math.sin(now * 6) * 0.4 * boost, 1 + Math.sin(now * 6) * 0.4 * boost);
    }
    if (foldTailGuide.visible) {
      foldTailGuide.scale.set(1 + Math.sin(now * 6) * 0.08 * boost, 1 + Math.sin(now * 6) * 0.4 * boost, 1 + Math.sin(now * 6) * 0.4 * boost);
    }
  }

  // ---- PART B: 放飞对比物理 ----
  if (mode === 'fly') {
    liftBar.position.y = BASE + launchY + 0.72;
    if (windOn) {
      fanBlades.rotation.x += dt * 16;
      windStreams.forEach(function (ws) {
        ws.t = (ws.t + dt * 1.65) % 1;
        ws.m.position.set(0.35 + ws.t * 5.2, ws.y + Math.sin(now * 6 + ws.t * 5) * 0.08, ws.z);
        ws.m.material.opacity = Math.sin(ws.t * Math.PI) * 0.55;
      });
    }

    if (flyState === 'ready') {
      flyDF.position.set(dfPhys.x, BASE + dfPhys.y, 0.15);
      flyDF.rotation.set(0, now * 0.4, 0);
      flyStrip.position.set(stPhys.x, BASE + stPhys.y - 0.15, 0.15);
      flyStrip.rotation.set(0, 0, 0);
      swirlGrp.visible = false;
    } else if (flyState === 'dropping') {
      // 纸蜻蜓：迅速进入稳态自转，慢速垂直下降，微风里滑翔更久
      if (!dfPhys.done) {
        dfPhys.t += dt;
        var termVy = windOn ? -0.92 : -1.12;
        dfPhys.vy += (termVy - dfPhys.vy) * (1 - Math.exp(-5.5 * dt));
        dfPhys.y += dfPhys.vy * dt;
        dfPhys.spin += (18.5 - dfPhys.spin) * (1 - Math.exp(-5 * dt));
        dfPhys.yaw += dfPhys.spin * dt;
        if (windOn) dfPhys.x = Math.min(0.45, dfPhys.x + dt * 0.38);
        whirCD -= dt;
        if (whirCD <= 0) { sWhir(); whirCD = 0.24; }
        if (dfPhys.y <= 0.06) {
          dfPhys.y = 0.06; dfPhys.done = true; sLand();
          discover('spin-slow', 's', '纸蜻蜓旋转下降又稳又慢', 'zhǐ qīng tíng xuán zhuǎn xià jiàng yòu wěn yòu màn', '#16a34a', '🌀');
          if (windOn) {
            discover('wind-fly', 'd', '微风让纸蜻蜓留空更久', 'wēi fēng ràng zhǐ qīng tíng liú kōng gèng jiǔ', '#2b8cf0', '🌬');
          }
        }
      }
      // 平纸条：快速乱翻飘偏，先落地
      if (!stPhys.done) {
        stPhys.t += dt;
        stPhys.vy = Math.max(-3.6, stPhys.vy - 6.8 * dt);
        stPhys.y += stPhys.vy * dt;
        stPhys.rx += dt * 7.8;
        stPhys.rz += dt * 5.2;
        stPhys.x += (Math.sin(stPhys.t * 8) * 0.9 + (windOn ? 1.15 : 0.3)) * dt;
        stPhys.x = THREE.MathUtils.clamp(stPhys.x, 0.35, 2.35);
        if (stPhys.y <= 0.05) {
          stPhys.y = 0.05; stPhys.done = true; sLand();
          floatWord('平纸条乱翻先落地!', 'píng zhǐ tiáo luàn fān xiān luò dì', new THREE.Vector3(stPhys.x, BASE + 0.65, 0.2));
          discover('cmp-strip', 'd', '纸蜻蜓比平纸条落得慢', 'zhǐ qīng tíng bǐ píng zhǐ tiáo luò de màn', '#7c4dcc', '⚖');
        }
      }
      flyDF.position.set(dfPhys.x, BASE + dfPhys.y, 0.15);
      flyDF.rotation.set(0, dfPhys.yaw, windOn ? -0.08 : 0);
      flyStrip.position.set(stPhys.x, BASE + stPhys.y, 0.15);
      flyStrip.rotation.set(stPhys.done ? Math.PI / 2 : stPhys.rx, 0, stPhys.done ? 0.3 : stPhys.rz);

      swirlGrp.visible = !dfPhys.done;
      swirlGrp.position.set(dfPhys.x, BASE + dfPhys.y + 0.55, 0.15);
      swirlRings.forEach(function (sr, i) { sr.rotation.z += dt * (7 + i * 2.5); });

      if (dfPhys.done && stPhys.done) {
        flyState = 'landed';
        updateGuide(false);
      }
    }
  }

  // ---- 放飞实时计时器标签 ----
  var showTmr = mode === 'fly' && (flyState === 'dropping' || flyState === 'landed');
  dfLbl.classList.toggle('show', showTmr);
  stLbl.classList.toggle('show', showTmr);
  if (showTmr) {
    dfLbl.innerHTML = ruby('纸蜻蜓', 'zhǐ qīng tíng') + ' ' + dfPhys.t.toFixed(1) + 's';
    stLbl.innerHTML = ruby('平纸条', 'píng zhǐ tiáo') + ' ' + stPhys.t.toFixed(1) + 's';
    var sp1 = toScreen(new THREE.Vector3(dfPhys.x, BASE + dfPhys.y + 1.05, 0.15));
    var sp2 = toScreen(new THREE.Vector3(stPhys.x, BASE + stPhys.y + 1.05, 0.15));
    dfLbl.style.transform = 'translate(' + sp1.x + 'px,' + sp1.y + 'px) translate(-50%,-100%)';
    stLbl.style.transform = 'translate(' + sp2.x + 'px,' + sp2.y + 'px) translate(-50%,-100%)';
  }

  updateGhost(dt);
  stepConfetti(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.4 : 1;

  renderer.render(scene, camera);
}

/* ===================== 按钮与测试钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio();
  if (!entryCueDone) {
    dismissEntryCues();
    voiceOn = true; voiceWelcomed = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  $('#voiceBtn').classList.toggle('on', voiceOn);
  $('#voiceBtn').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) { voiceWelcomed = true; updateGuide(true); }
  else if ('speechSynthesis' in window) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues();
  if (!voiceOn) {
    voiceOn = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
  }
  voiceWelcomed = true;
  updateGuide(true);
});
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#winCloseBtn').addEventListener('click', hideWinToast);
$('#winReplayBtn').addEventListener('click', function () { resetAll(false); });
$('#modeCraftBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); setMode('craft'); });
$('#modeFlyBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); setMode('fly'); });
$('#quickFoldBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); quickFoldAll(); });
$('#dropBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); launchDrop(); });
$('#windBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); toggleWind(); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, mode: mode, craftStep: craftStep, celebrated: celebrated }; },
  setMode: setMode,
  quickFoldAll: quickFoldAll,
  launchDrop: launchDrop,
  startDemo: startDemo
};

updateStepTag();
updateGuide(false);
fit();
requestAnimationFrame(frame);
})();
</script>

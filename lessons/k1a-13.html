<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第13课 改进我的纸蜻蜓 · 双机调校竞飞场（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.cue-pulse{animation:cueGlow 1.5s ease-in-out infinite}
.cue-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#e56d17;color:#fff;font-size:10px;font-weight:800;line-height:1.45;white-space:nowrap;
  box-shadow:0 2px 6px rgba(185,78,8,.35);pointer-events:none;transition:opacity .35s,transform .35s}
#demoBtn .cue-tag{background:#2578e5;box-shadow:0 2px 6px rgba(37,120,229,.35)}
.cue-tag.hide{opacity:0;transform:translateX(-50%) translateY(-4px)}
@keyframes cueGlow{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.5)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 7px rgba(229,109,23,0)}}

#guideBar{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:6px;max-width:min(440px,calc(100vw - 680px));
  padding:5px 12px;border-radius:14px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 4px 14px rgba(130,68,12,.16);
  font-size:13px;font-weight:800;line-height:1.3;color:#7a3e08;cursor:pointer;transition:transform .2s,border-color .25s}
#guideBar:hover{border-color:#d65b0a}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.pulse{animation:guidePop .45s ease}
.gb-ico{flex:none;font-size:18px;line-height:1}
.gb-txt{flex:1}
@keyframes guidePop{0%{transform:translateX(-50%) scale(.94)}50%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}
@media (max-width:1160px){
  #guideBar{left:14px;top:66px;transform:none;max-width:calc(100vw - 260px)}
  #guideBar:active{transform:scale(.98)}
  @keyframes guidePop{0%{transform:scale(.95)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
}

/* 飞后双机对比与调校诊断卡 */
#cmpBanner{position:fixed;left:14px;top:78px;z-index:6;width:274px;
  padding:10px 12px;border-radius:16px;background:rgba(255,250,240,.96);border:2px solid #f08a24;
  box-shadow:0 10px 26px rgba(95,52,12,.2);display:none;flex-direction:column;gap:7px;
  animation:cmpIn .32s cubic-bezier(.2,1.4,.4,1)}
#cmpBanner.show{display:flex}
#cmpBanner.win{border-color:#16a34a;background:linear-gradient(150deg,#fffaf0 0%,#effcf3 100%)}
@keyframes cmpIn{0%{opacity:0;transform:translateY(-8px) scale(.94)}100%{opacity:1;transform:none}}
.cmp-hd{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:900;color:#b84906}
#cmpBanner.win .cmp-hd{color:#15803d}
.cmp-x{border:1px solid var(--line);background:#fff;color:#7a6544;border-radius:7px;width:22px;height:22px;line-height:18px;text-align:center;font-weight:900;cursor:pointer;padding:0}
.cmp-scores{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:11px;background:#fff;border:1.5px solid #eedcc0;font-size:12.5px;font-weight:800}
.cmp-sc{display:flex;flex-direction:column;align-items:center;flex:1}
.cmp-sc b{font-size:16px}
.cmp-sc.b b{color:#1b66c2}
.cmp-sc.m b{color:#c94d0c}
.cmp-vs{font-size:11px;font-weight:900;padding:2px 6px;border-radius:99px;background:#fff1df;color:#c2560c;white-space:nowrap}
#cmpBanner.win .cmp-vs{background:#dcfce7;color:#15803d}
.cmp-tags{display:flex;flex-wrap:wrap;gap:4px}
.cmp-tag{padding:2px 7px;border-radius:8px;font-size:11.5px;font-weight:800;background:#f7eddc;color:#6c573c}
.cmp-tag.good{background:#e7f8ed;color:#15803d}
.cmp-tag.warn{background:#fff0e6;color:#c24d0b}
.cmp-tip{padding:7px 9px;border-radius:11px;background:#fff5e6;border:1.5px dashed #e58e26;font-size:12.5px;font-weight:800;line-height:1.5;color:#7a3e08}
#cmpBanner.win .cmp-tip{background:#ecfdf3;border-color:#22c55e;color:#156934}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:226px;overflow:hidden;
  padding:9px 11px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-head-r{display:flex;align-items:center;gap:6px}
.nt-tog{border:1px solid var(--line);background:#fff;color:#7a6544;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stamps{display:flex;gap:5px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:14px;font-weight:800;line-height:1.6;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.84);z-index:20;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:22px;
  background:linear-gradient(155deg,#fffaf0 0%,#fff1d6 100%);border:2.5px solid #f08a24;
  box-shadow:0 18px 44px rgba(100,52,10,.32);opacity:0;pointer-events:none;
  transition:opacity .32s,transform .38s cubic-bezier(.2,1.5,.4,1)}
#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.win-head{display:flex;align-items:center;gap:12px}
.win-medal{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 35% 30%,#fff3a6,#f59e0b);box-shadow:0 3px 10px rgba(229,109,23,.35)}
.win-txt{display:flex;flex-direction:column;gap:2px}
.win-ttl{font-size:18px;font-weight:900;color:#b84906;line-height:1.5}
.win-sub{font-size:13px;font-weight:800;color:#7a6544;line-height:1.45}
.win-concl{padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid #f2c98a;font-size:13.5px;line-height:1.6;color:#3d3224;font-weight:700}
.win-concl-h{font-size:13px;font-weight:900;color:#c2560c;margin-bottom:3px}
.win-quiz{padding:10px 12px;border-radius:14px;background:#fffdf7;border:1.5px dashed #e58e26;display:flex;flex-direction:column;gap:7px}
.win-quiz-h{font-size:13px;font-weight:900;color:#b84906}
.win-quiz-q{font-size:14px;font-weight:800;color:#2a3040;line-height:1.5}
.win-opts{display:flex;flex-direction:column;gap:6px}
.qopt{width:100%;text-align:left;padding:8px 11px;border-radius:11px;border:1.5px solid #e3d6bd;background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:#2a3040;cursor:pointer;transition:all .16s}
.qopt:hover{border-color:#e56d17;background:#fff7eb}
.qopt.ok{border-color:#16a34a;background:#ecfdf3;color:#15803d}
.qopt.wrong{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
.quiz-fb{font-size:13px;font-weight:800;line-height:1.5;min-height:18px;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2560c}
.win-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.wact{height:36px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.wact.pri{background:var(--accent);border-color:#bf5409;color:#fff}
.wact.pri rt{color:#ffe4c4}

/* 底部紧凑滑块调校条 + 同时松手按钮 */
#tuneBar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;
  padding:8px 12px;border-radius:18px;background:rgba(255,250,240,.95);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.14);max-width:96vw}
.sld{display:flex;flex-direction:column;gap:2px;min-width:128px;padding:4px 7px;border-radius:12px;border:2px solid transparent;transition:all .22s}
.sld.coach-hi,.sld.demo-hi{background:#fff3e0;border-color:#f06818;animation:sldGlow 1.15s ease-in-out infinite}
@keyframes sldGlow{0%,100%{box-shadow:0 0 0 0 rgba(240,104,24,.55)}50%{box-shadow:0 0 0 8px rgba(240,104,24,0)}}
.sld-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;line-height:1.4;color:#6c573c}
.sld-top b{color:#c2560c;font-size:13px}
.sld input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;
  background:#eedcc0;outline:none;cursor:pointer}
.sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:#f06818;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(150,60,10,.35);cursor:pointer}
.launchBtn{flex:none;height:44px;padding:0 16px;border-radius:13px;border:1.5px solid #bf5409;background:#f06818;
  color:#fff;font:inherit;font-size:16px;font-weight:800;line-height:1.4;cursor:pointer;box-shadow:0 3px 0 #bf5409;white-space:nowrap}
.launchBtn.glow-next{animation:sldGlow 1.15s ease-in-out infinite}
.launchBtn rt{color:#ffe6ca}
.launchBtn:active{transform:translateY(1px)}

#verbs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;line-height:1.5;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tmr{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 12px;border-radius:13px;white-space:nowrap;
  background:rgba(255,250,240,.96);border:2px solid #2b8cf0;color:var(--ink);font-size:15px;font-weight:900;line-height:1.55;
  box-shadow:0 5px 14px rgba(40,48,64,.16);opacity:0;transition:opacity .2s}
.tmr.org{border-color:#f06818}
.tmr.show{opacity:1}
.tmr span.sec{font-size:19px;margin-left:4px;color:#1b66c2}
.tmr.org span.sec{color:#c94d0c}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:24px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.6s ease-out forwards}
.word.ok{color:#15803d}
.word.cool{color:#1d62b5}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-185%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:60px;height:60px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:15px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:5px}.tbtn{height:34px;padding:0 9px;font-size:13px}
  .cue-tag{font-size:9px;top:-9px;padding:0 5px}
  #guideBar{left:8px;top:52px;right:200px;max-width:none;padding:5px 9px;font-size:12px}
  .gb-ico{font-size:15px}
  #cmpBanner{left:8px;top:102px;width:min(248px,calc(100vw - 208px));padding:8px 9px;gap:5px}
  .cmp-hd,.cmp-tip{font-size:11.5px}.cmp-scores{font-size:11px;padding:4px 6px}.cmp-sc b{font-size:14px}
  #notes{top:54px;right:8px;width:186px;padding:7px 9px}
  #ntList{max-height:108px}
  .stk{font-size:13px;padding:4px 7px}
  #winToast{padding:12px 14px;gap:8px}
  .win-medal{width:38px;height:38px;font-size:22px}.win-ttl{font-size:15px}.win-sub{font-size:12px}
  .win-concl,.win-quiz-q,.qopt{font-size:12.5px}
  #tuneBar{bottom:52px;gap:7px;padding:6px 8px;flex-wrap:wrap;justify-content:center;width:96vw}
  .sld{min-width:96px;flex:1;padding:3px 5px}.sld-top{font-size:11px}
  .launchBtn{height:36px;padding:0 12px;font-size:13px;width:100%}
  #verbs{bottom:8px;gap:5px}.verb{font-size:13px;padding:4px 9px}.verb svg{width:16px;height:16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<canvas id="confettiCanvas"></canvas>

<div id="winToast" aria-live="polite">
  <div class="win-head">
    <div class="win-medal">🏆</div>
    <div class="win-txt">
      <div class="win-ttl" id="winTtl"></div>
      <div class="win-sub" id="winSub"></div>
    </div>
  </div>
  <div class="win-concl">
    <div class="win-concl-h">✨ 科学小结论</div>
    <div id="winConclTxt">纸蜻蜓的飞翼越长越宽、折尾配重适中，受到的空气阻力就越大，旋转下落得就越慢、越平稳！</div>
  </div>
  <div class="win-quiz">
    <div class="win-quiz-h">💡 考考你 · 答对领小红花 🌸</div>
    <div class="win-quiz-q">想让纸蜻蜓在空中留得更久、落得更慢，应该怎么改进？</div>
    <div class="win-opts" id="quizOpts">
      <button class="qopt" data-ok="1" type="button">🦋 把飞翼改长改宽、配重适中</button>
      <button class="qopt" data-ok="0" type="button">✂️ 把飞翼剪得又短又窄</button>
      <button class="qopt" data-ok="0" type="button">🪨 在尾巴绑很多重东西</button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="win-btns">
    <button class="wact" id="winCloseBtn" type="button"></button>
    <button class="wact pri" id="winReplayBtn" type="button"></button>
  </div>
</div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 51 页「双机调校竞飞场」</small></div>
</div>
<div id="guideBar" title="点我再听一遍玩法提示" aria-live="polite"><span class="gb-ico" id="gbIco">🔧</span><span class="gb-txt" id="gbTxt"></span></div>
<div id="cmpBanner" aria-live="polite">
  <div class="cmp-hd"><span id="cmpTitle">📊 双机飞行对比小诊断</span><button class="cmp-x" id="cmpCloseBtn" type="button" title="收起">×</button></div>
  <div class="cmp-scores">
    <div class="cmp-sc b"><span>上节课款</span><b id="cmpBaseT">0.0s</b></div>
    <span class="cmp-vs" id="cmpDiff">一样快</span>
    <div class="cmp-sc m"><span>我的改进款</span><b id="cmpMineT">0.0s</b></div>
  </div>
  <div class="cmp-tags" id="cmpTags"></div>
  <div class="cmp-tip" id="cmpTip"></div>
</div>
<div class="tools">
  <button class="tbtn on cue-pulse" id="voiceBtn" type="button">🔊 语音<span class="cue-tag" id="voiceCue">点我听玩法</span></button>
  <button class="tbtn cue-pulse" id="demoBtn" type="button">▶ 演示<span class="cue-tag" id="demoCue">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><span class="nt-head-r"><span id="ntCount" style="color:#c2560c">0</span><button class="nt-tog" id="ntTog" type="button">收起</button></span></div>
  <div class="stamps"><span class="stamp" data-k="t" id="stT"></span><span class="stamp" data-k="c" id="stC"></span><span class="stamp" data-k="w" id="stW"></span></div>
  <div id="ntList"></div>
</aside>

<div id="tuneBar">
  <label class="sld" id="sldLen">
    <span class="sld-top"><span id="sl1"></span><b id="sv1">中</b></span>
    <input id="inLen" type="range" min="0" max="100" value="45">
  </label>
  <label class="sld" id="sldWid">
    <span class="sld-top"><span id="sl2"></span><b id="sv2">中</b></span>
    <input id="inWid" type="range" min="0" max="100" value="45">
  </label>
  <label class="sld" id="sldWt">
    <span class="sld-top"><span id="sl3"></span><b id="sv3">中</b></span>
    <input id="inWt" type="range" min="0" max="100" value="45">
  </label>
  <button class="launchBtn" id="launchBtn" type="button"></button>
</div>

<div id="verbs">

  df.wLPiv.scale.set(sx, 1, sz);
  df.wRPiv.scale.set(sx, 1, sz);
  // 折尾厚度与可见回形针数（1~3个）
  var wScale = 0.75 + (c.wt / 100) * 0.75;
  df.tailFold.scale.set(1, wScale, 0.8 + (c.wt / 100) * 0.9);
  var clipCnt = c.wt < 30 ? 0 : c.wt < 62 ? 1 : c.wt < 84 ? 2 : 3;
  df.clips.forEach(function (cl, idx) { cl.visible = idx < clipCnt; });
}

function aeroOf(c) {
  var L = c.len / 100, W = c.wid / 100, M = c.wt / 100;
  var area = (0.65 + 0.75 * L) * (0.65 + 0.75 * W); // 0.42 .. 1.96
  // 理想重量区 0.42~0.68：太轻会剧烈摇晃失速，太重受重力下拉快
  var wobble = M < 0.35 ? (0.35 - M) * 1.45 : (M < 0.48 ? (0.48 - M) * 0.25 : 0.04);
  var massPenalty = M > 0.65 ? (M - 0.65) * 1.4 : (M < 0.32 ? (0.32 - M) * 0.85 : 0);
  var fallSpd = THREE.MathUtils.clamp((1.95 / Math.pow(area, 0.68)) + massPenalty - 0.12, 0.82, 2.65);
  var spinRate = THREE.MathUtils.clamp(12 + area * 6.5 - wobble * 9, 5, 24);
  return { fallSpd: fallSpd, spinRate: spinRate, wobble: wobble };
}

var confC = $('#confettiCanvas'), confCtx = confC.getContext('2d'), confParts = [], celebrated = false, quizAnswered = false;
function launchConfetti() {
  confC.width = window.innerWidth; confC.height = window.innerHeight;
  var cols = ['#f59e0b', '#e56d17', '#2b8cf0', '#16a34a', '#ec4899', '#a855f7'];
  confParts = [];
  for (var i = 0; i < 90; i++) {
    var ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
    var spd = 280 + Math.random() * 440;
    confParts.push({
      x: confC.width * (0.3 + Math.random() * 0.4), y: confC.height * 0.28,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
      w: 7 + Math.random() * 7, h: 5 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 11,
      col: cols[i % cols.length], life: 2.2 + Math.random() * 1.1
    });
  }
}
function stepConfetti(dt) {
  if (!confParts.length) return;
  if (confC.width !== window.innerWidth || confC.height !== window.innerHeight) {
    confC.width = window.innerWidth; confC.height = window.innerHeight;
  }
  confCtx.clearRect(0, 0, confC.width, confC.height);
  for (var i = confParts.length - 1; i >= 0; i--) {
    var p = confParts[i];
    p.life -= dt;
    if (p.life <= 0) { confParts.splice(i, 1); continue; }
    p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
    confCtx.globalAlpha = Math.min(1, p.life);
    confCtx.fillStyle = p.col; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confCtx.restore();
  }
  if (!confParts.length) confCtx.clearRect(0, 0, confC.width, confC.height);
}

/* ===================== 老师演示（逐条高亮滑块 + 语音讲解） ===================== */
var demo = null;
var DEMO = [
  ['say', '#sldLen', '先看第一条：把「飞翼长度」往右拉长，看橘色纸蜻蜓的翅膀变长啦！'],
  ['slide', 'len', 88, 1.5], ['wait', 0.7],
  ['say', '#sldWid', '再看第二条：把「飞翼宽度」往右加宽，翅膀面积变大，空气阻力更大！'],
  ['slide', 'wid', 86, 1.5], ['wait', 0.7],
  ['say', '#sldWt', '最后看第三条：把「折尾重量」调到适中，飞起来既不摇晃也不太重！'],
  ['slide', 'wt', 56, 1.3], ['wait', 0.8],
  ['say', '#launchBtn', '调好啦！现在两只纸蜻蜓同时松手，比一比谁落得更慢！'],
  ['wait', 0.55],
  ['launch'],
  ['wait', 4.9],
  ['end']
];
function startDemo() {
  dismissEntryCues();
  resetAll(true);
  demo = { i: 0, t: 0, fromVal: 45, inited: false };
  ghost.off = true;
  $('#demoBtn').classList.add('on'); $('#demoBtn').textContent = '■ 停止';
}
function stopDemo() {
  if (!demo) return; demo = null;
  clearSliderCoach();
  $('#demoBtn').classList.remove('on'); $('#demoBtn').textContent = '▶ 演示';
  updateGuide(false);
}
function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  if (s[0] === 'wait') { if (demo.t >= s[1]) { demo.i++; demo.t = 0; demo.inited = false; } return; }
  if (s[0] === 'say') {
    clearSliderCoach();
    if (s[1]) {
      var el = $(s[1]);
      if (el) el.classList.add(s[1] === '#launchBtn' ? 'glow-next' : 'demo-hi');
    }
    $('#gbIco').textContent = '👩‍🏫';
    $('#gbTxt').textContent = s[2];
    speak(s[2]);
    demo.i++; demo.t = 0; demo.inited = false;
    return;
  }
  if (s[0] === 'slide') {
    var prop = s[1], toVal = s[2], dur = s[3];
    if (!demo.inited) { demo.inited = true; demo.fromVal = cfgMine[prop]; }
    var u = Math.min(1, demo.t / dur);
    cfgMine[prop] = Math.round(demo.fromVal + (toVal - demo.fromVal) * u);
    syncSlidersUI();
    if (u >= 1) {
      markAct('tune');
      if (prop === 'wt') {
        discover('tuned', 't', '加宽加长飞翼并调好配重', 'jiā kuān jiā cháng fēi yì bìng tiáo hǎo pèi zhòng', '#e56d17', '🔧', true);
      }
      demo.i++; demo.t = 0; demo.inited = false;
    }
    return;
  }
  if (s[0] === 'launch') { clearSliderCoach(); launchRace(); demo.i++; demo.t = 0; demo.inited = false; }
}

/* ===================== 开场动画 ===================== */
var intro = { t: 0, done: false };
function introSkip() {
  if (intro.done) return;
  intro.t = 3.5; intro.done = true;
  figCard.visible = false;
  board.scale.set(1, 1, 1); arena.scale.setScalar(1);
}
function backOut(t) { var c = 1.65; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4); var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift; figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.02, backOut((t - 0.3) / 0.5)), 1);
  arena.scale.setScalar(Math.max(0.01, backOut((t - 0.52) / 0.55)));
  if (t >= 2.2) introSkip();
}

/* ===================== 重来 ===================== */
function resetAll(keepDemo) {
  if (!keepDemo) stopDemo();
  cfgMine = { len: 45, wid: 45, wt: 45 };
  syncSlidersUI();
  resetRace(false);
  found = {}; foundN = 0; kinds = { t: false, c: false, w: false };
  acted = { tune: false, drop: false, win: false }; actions = 0;
  celebrated = false; lastCoachMsg = '';
  hideWinToast(); resetQuizUI();
  $('#cmpBanner').classList.remove('show', 'win');
  $('#ntList').innerHTML = ''; $('#ntCount').textContent = '0';
  document.querySelectorAll('.stamp').forEach(function (s) { s.classList.remove('lit'); });
  document.querySelectorAll('.verb').forEach(function (v) { v.classList.remove('done'); });
  $('#verbs').style.opacity = 1;
  updateGuide(false);
}

/* ===================== 主循环 ===================== */
var last = performance.now(), now = 0;
function stepOneDF(p, df, dt, baseX) {
  if (raceState === 'ready') {
    df.root.position.set(baseX, BASE + p.y, 0.12);
    df.root.rotation.set(0, now * 0.5, 0);
    df.swirl.visible = false;
    return;
  }
  if (!p.landed) {
    p.t += dt;
    var a = p.aero;
    p.vy += (-a.fallSpd - p.vy) * (1 - Math.exp(-5.2 * dt));
    p.y += p.vy * dt;
    p.yaw += a.spinRate * dt;
    var wobX = Math.sin(p.t * 7.5) * a.wobble * 0.45;
    p.x = baseX + wobX;
    df.root.position.set(p.x, BASE + Math.max(0.04, p.y), 0.12);
    df.root.rotation.set(Math.cos(p.t * 7.5) * a.wobble * 0.45, p.yaw, Math.sin(p.t * 7.5) * a.wobble * 0.55);
    df.swirl.visible = true;
    df.swirl.position.set(p.x, BASE + p.y, 0.12);
    df.rings.forEach(function (r, idx) { r.rotation.z += dt * (a.spinRate * 0.6 + idx * 2); });
    if (p.y <= 0.04) {
      p.y = 0.04; p.landed = true; df.swirl.visible = false; sLand();
      df.root.position.set(p.x, BASE + 0.04, 0.12);
      df.root.rotation.set(0, p.yaw, 0);
    }
  }
}

function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  gantryBar.position.y = BASE + launchY + 0.72;
  stepOneDF(pBase, dfBase, dt, -DF_X);
  stepOneDF(pMine, dfMine, dt,  DF_X);

  if (raceState === 'dropping' && pBase.landed && pMine.landed) {
    raceState = 'done';
    evaluateRace();
  }

  if (crownGrp.visible) {
    crownGrp.position.set(pMine.x, BASE + 1.25 + Math.sin(now * 4.5) * 0.08, 0.12);
    crownGrp.rotation.y += dt * 1.8;
  }

  // 双机实时秒表
  var showTmr = raceState === 'dropping' || raceState === 'done' || intro.t > 1.0;
  tmrL.classList.toggle('show', showTmr);
  tmrR.classList.toggle('show', showTmr);
  if (showTmr) {
    tmrL.innerHTML = ruby('上节课款', 'shàng jié kè kuǎn') + '<span class="sec">' + pBase.t.toFixed(1) + 's</span>';
    tmrR.innerHTML = ruby('我的改进款', 'wǒ de gǎi jìn kuǎn') + '<span class="sec">' + pMine.t.toFixed(1) + 's</span>';
    var spL = toScreen(new THREE.Vector3(pBase.x, BASE + pBase.y + 1.15, 0.12));
    var spR = toScreen(new THREE.Vector3(pMine.x, BASE + pMine.y + 1.15, 0.12));
    var minY = 94;
    tmrL.style.transform = 'translate(' + spL.x + 'px,' + Math.max(minY, spL.y) + 'px) translate(-50%,-100%)';
    tmrR.style.transform = 'translate(' + spR.x + 'px,' + Math.max(minY, spR.y) + 'px) translate(-50%,-100%)';
  }

  updateGhost(dt);
  stepConfetti(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.4 : 1;

  renderer.render(scene, camera);
}

/* ===================== 按钮与测试钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio();
  if (!entryCueDone) {
    dismissEntryCues();
    voiceOn = true; voiceWelcomed = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  $('#voiceBtn').classList.toggle('on', voiceOn);
  $('#voiceBtn').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) { voiceWelcomed = true; updateGuide(true); }
  else if ('speechSynthesis' in window) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues();
  if (!voiceOn) {
    voiceOn = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
  }
  voiceWelcomed = true;
  updateGuide(true);
});
$('#cmpCloseBtn').addEventListener('click', function () { $('#cmpBanner').classList.remove('show'); });
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#winCloseBtn').addEventListener('click', hideWinToast);
$('#winReplayBtn').addEventListener('click', function () { resetAll(false); });
$('#launchBtn').addEventListener('click', function () { audio(); welcomeVoiceOnce(); stopDemo(); introSkip(); launchRace(); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, cfgMine: cfgMine, celebrated: celebrated }; },
  launchRace: launchRace,
  startDemo: startDemo
};

syncSlidersUI();
updateGuide(false);
fit();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

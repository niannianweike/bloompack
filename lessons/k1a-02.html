<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第2课 物体的分类 · 分一分（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:7;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.cue-pulse{animation:cueRing 1.8s ease-in-out infinite}
@keyframes cueRing{0%,100%{box-shadow:0 3px 0 #e2d2b5,0 0 0 0 rgba(229,109,23,.48)}50%{box-shadow:0 3px 0 #e2d2b5,0 0 0 8px rgba(229,109,23,0)}}
.tbtn.on.cue-pulse{animation:cueRingOn 1.8s ease-in-out infinite}
@keyframes cueRingOn{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 9px rgba(229,109,23,0)}}
.cue-tag{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:2px 8px;border-radius:99px;background:#e56d17;color:#fff;font-size:11px;font-weight:800;line-height:1.4;
  box-shadow:0 3px 10px rgba(191,84,9,.32);transition:opacity .35s,transform .35s}
.cue-tag::before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:#e56d17}
body.cues-off .cue-tag{opacity:0;transform:translateX(-50%) translateY(-4px)}
body.cues-off .tbtn.cue-pulse{animation:none}

/* 物理路牌切换条：按颜色 | 按大小 | 按形状 */
#modes{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;
  padding:5px;border-radius:18px;background:rgba(255,250,240,.94);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.14)}
.mbtn{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:13px;border:1.5px solid transparent;
  background:transparent;font:inherit;font-size:16px;font-weight:800;line-height:1.65;color:var(--ink);cursor:pointer;transition:all .2s}
.mbtn svg{width:20px;height:20px;flex:none}
.mbtn:hover{background:#fff3e0}
.mbtn.on{background:var(--accent);color:#fff;border-color:#bf5409;box-shadow:0 3px 0 #bf5409}
.mbtn.on rt{color:#ffe4c4}
.mbtn.guide-pulse{border-color:#e56d17;background:#fff3e0;animation:modePulse 1.15s ease-in-out infinite}
@keyframes modePulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(229,109,23,.5)}50%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(229,109,23,0)}}

/* 步骤小助手提示条（位于模式切换条正下方，不遮挡其它控件） */
#guideBar{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:5;
  max-width:min(460px,calc(100vw - 500px));padding:6px 14px;border-radius:99px;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  background:rgba(255,250,240,.95);border:2px solid #f59e0b;box-shadow:0 6px 18px rgba(80,55,20,.14);
  font-size:14px;font-weight:800;color:var(--ink);line-height:1.35;transition:transform .25s,border-color .25s}
#guideBar:hover{border-color:var(--accent)}
#guideBar.bump{animation:gbBump .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes gbBump{0%{transform:translateX(-50%) scale(.92)}50%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
.gb-ico{font-size:16px;flex:none}
#guideTxt{flex:1;min-width:0}
.gb-prog{flex:none;padding:2px 8px;border-radius:99px;background:#fff3e0;border:1px solid #f3c489;color:#c2560c;font-size:12px;font-weight:900}

#notes{position:fixed;right:14px;top:82px;z-index:4;width:220px;max-height:calc(100% - 156px);overflow:hidden;
  padding:9px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:top .3s,opacity .3s}
body.cues-off #notes{top:64px;max-height:calc(100% - 140px)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-acts{display:flex;align-items:center;gap:6px}
.nt-tog{height:24px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;font-weight:800;color:#8a7b62;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
.stamps{display:flex;gap:5px;margin-bottom:6px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.45}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:152px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:15px;font-weight:800;line-height:1.55;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
.stk b{color:#c2560c}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18;display:none}
#celebrate{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.86);z-index:19;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;padding:18px 20px 16px;border-radius:22px;text-align:center;
  background:rgba(255,250,240,.98);border:2.5px solid #f59e0b;box-shadow:0 16px 40px rgba(80,55,20,.28);
  opacity:0;pointer-events:none;transition:opacity .32s,transform .38s cubic-bezier(.2,1.5,.4,1)}
#celebrate.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cel-medal{font-size:44px;line-height:1.1;margin-bottom:2px}
.cel-txt{font-size:20px;font-weight:900;color:#c2560c;line-height:1.55}
.cel-sub{font-size:13px;font-weight:700;color:#6e604b;margin:2px 0 10px}
.cel-concl{text-align:left;padding:10px 12px;border-radius:14px;background:#fff5e3;border:1.5px solid #f4c88c;margin:0 0 12px}
.cel-concl-t{font-size:13px;font-weight:900;color:#c2560c;margin-bottom:4px}
.cel-concl p{margin:0;font-size:14px;font-weight:800;color:#3d3428;line-height:1.55}
.cel-quiz{text-align:left;padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);margin:0 0 14px}
.quiz-t{font-size:13px;font-weight:900;color:#d94886;margin-bottom:5px}
.quiz-q{font-size:14px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:9px}
.quiz-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qopt{padding:9px 6px;border-radius:12px;border:2px solid var(--line);background:#fffaf0;cursor:pointer;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 2px 0 #e2d2b5;transition:all .18s}
.qopt span.qi{font-size:22px;line-height:1}
.qopt:hover{border-color:var(--accent);background:#fff3e0}
.qopt.ok{border-color:#16a34a;background:#eafaf0;color:#15803d;box-shadow:0 2px 0 #86efac}
.qopt.wrong{border-color:#f59e0b;background:#fff7ed;animation:qShake .36s}
@keyframes qShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.quiz-fb{min-height:20px;margin-top:8px;font-size:13px;font-weight:800;line-height:1.45;color:#c2560c}
.quiz-fb.ok{color:#15803d}
.cel-btns{display:flex;justify-content:center;gap:10px}
.cel-btn{height:38px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.cel-btn.pri{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}

#verbs{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:22px;height:22px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:28px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#15803d;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
.word.hint{color:#c2560c}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-55%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:16px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:6px}.tbtn{height:34px;padding:0 10px;font-size:13px}
  .cue-tag{display:none}
  #modes{top:52px;gap:4px;padding:4px}
  .mbtn{padding:4px 9px;font-size:14px}.mbtn svg{width:16px;height:16px}
  #guideBar{top:96px;max-width:calc(100vw - 20px);padding:5px 11px;font-size:13px}
  #notes,body.cues-off #notes{top:auto;bottom:60px;right:8px;left:8px;width:auto;max-height:112px;padding:8px 10px}
  #ntList .stk:nth-child(n+2){display:none}
  .stk{font-size:14px}
  #verbs{bottom:10px;gap:6px}.verb{font-size:14px;padding:4px 10px}.verb svg{width:18px;height:18px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 7 页「分一分」</small></div>
</div>

<div id="modes" role="group">
  <button class="mbtn on" data-m="color" type="button"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="14" r="4.5" fill="#e85252" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="14" r="4.5" fill="#4589e6" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="8" r="4.5" fill="#f5c23b" stroke="currentColor" stroke-width="1.6"/></svg><span id="mdC"></span></button>
  <button class="mbtn" data-m="size" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="15.5" r="2.5"/><circle cx="11.5" cy="13.5" r="4"/><circle cx="18.5" cy="11" r="5.5"/></svg><span id="mdZ"></span></button>
  <button class="mbtn" data-m="shape" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="12" width="7" height="7"/><circle cx="17" cy="15.5" r="3.8"/><ellipse cx="12" cy="6.5" rx="4.5" ry="2.5"/></svg><span id="mdS"></span></button>
</div>

<div id="guideBar" role="status" aria-live="polite" title="点我再听一次提示">
  <span class="gb-ico">👉</span>
  <span id="guideTxt">把 9 个积木按颜色拖进红、黄、蓝托盘吧！</span>
  <span class="gb-prog" id="guideProg">0/9</span>
</div>

<div class="tools">
  <button class="tbtn on cue-pulse" id="voiceBtn" type="button" title="语音引导开关"><span class="tbtn-lbl">🔊 语音</span><span class="cue-tag">点我听玩法</span></button>
  <button class="tbtn cue-pulse" id="demoBtn" type="button"><span class="tbtn-lbl">▶ 演示</span><span class="cue-tag">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><div class="nt-acts"><span id="ntCount" style="color:#c2560c">0</span><button class="nt-tog" id="ntTog" type="button">收起</button></div></div>
  <div class="stamps"><span class="stamp" data-k="color" id="stColor"></span><span class="stamp" data-k="size" id="stSize"></span><span class="stamp" data-k="shape" id="stShape"></span></div>
  <div id="ntList"></div>
</aside>

<canvas id="confetti"></canvas>
<div id="celebrate" role="status" aria-live="polite">
  <div class="cel-medal">🏆</div>
  <div class="cel-txt" id="celTxt"></div>
  <div class="cel-sub" id="celSub"></div>
  <div class="cel-concl">
    <div class="cel-concl-t">✨ 科学小结论</div>
    <p>同样的物体，按颜色、大小或形状不同标准来分，分法就不一样！</p>
  </div>
  <div class="cel-quiz">
    <div class="quiz-t">💡 考考你 · 答对领小红花 🌸</div>
    <div class="quiz-q">如果想把长方体、圆柱和圆球分开，应该选哪个标准？</div>
    <div class="quiz-opts" id="quizOpts">
      <button class="qopt" type="button" data-ok="0"><span class="qi">🎨</span><span>按颜色</span></button>
      <button class="qopt" type="button" data-ok="0"><span class="qi">📏</span><span>按大小</span></button>
      <button class="qopt" type="button" data-ok="1"><span class="qi">🧊</span><span>按形状</span></button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="cel-btns">
    <button class="cel-btn" id="celKeep" type="button">继续玩</button>
    <button class="cel-btn pri" id="celAgain" type="button">再玩一次</button>
  </div>
</div>

<div id="verbs">
  <span class="verb" data-v="drag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span id="vb1"></span></span>
  <span class="verb" data-v="switch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg><span id="vb2"></span></span>
  <span class="verb" data-v="sort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1"/><rect x="15" y="4" width="6" height="6" rx="1"/><rect x="9" y="14" width="6" height="6" rx="1"/></svg><span id="vb3"></span></span>
</div>

<svg id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l3-1c2-6 9-5 9 0 2-3 8-2 8 3 3-1 7 1 7 5v12c0 9-7 15-16 15h-6c-6 0-10-3-13-8L13 41c-2-3 0-7 4-7 2 0 3 1 4 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#2a3040" stroke-width="3" stroke-linejoin="round"/></svg>

<script src="../vendor/three.min.js"></script>
<script src="../audio/manifest.js"></script>
<script src="../vendor/voice.js"></script>
<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  var syl = py ? py.trim().split(/\s+/) : [], i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) { var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; } out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>'; }
    else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
var $ = function (s) { return document.querySelector(s); };
$('#ttl').innerHTML = ruby('第2课 物体的分类', 'dì kè wù tǐ de fēn lèi');
$('#ntTitle').innerHTML = ruby('我的发现', 'wǒ de fā xiàn');
$('#mdC').innerHTML = ruby('按颜色', 'àn yán sè');
$('#mdZ').innerHTML = ruby('按大小', 'àn dà xiǎo');
$('#mdS').innerHTML = ruby('按形状', 'àn xíng zhuàng');
$('#stColor').innerHTML = ruby('颜色', 'yán sè');
$('#stSize').innerHTML = ruby('大小', 'dà xiǎo');
$('#stShape').innerHTML = ruby('形状', 'xíng zhuàng');
$('#vb1').innerHTML = ruby('拖进盘', 'tuō jìn pán');
$('#vb2').innerHTML = ruby('换标准', 'huàn biāo zhǔn');
$('#vb3').innerHTML = ruby('分一分', 'fēn yi fēn');
$('#celTxt').innerHTML = ruby('太棒啦！全部发现集齐啦！', 'tài bàng la quán bù fā xiàn jí qí la');
$('#celSub').innerHTML = ruby('颜色、大小、形状三种标准都会分啦', 'yán sè dà xiǎo xíng zhuàng sān zhǒng biāo zhǔn dōu huì fēn la');

/* ===================== 分类标准与 9 件 3D 积木物品 ===================== */
var MODES = {
  color: {
    name: '颜色', py: 'yán sè', icon: '🎨', accent: '#e85252',
    bins: [
      { key: 'red',    label: '红', py: 'hóng', bg: '#fde8e8', fg: '#e85252' },
      { key: 'yellow', label: '黄', py: 'huáng', bg: '#fef6d8', fg: '#e0a518' },
      { key: 'blue',   label: '蓝', py: 'lán',  bg: '#e5f0fd', fg: '#3b82e6' }
    ]
  },
  size: {
    name: '大小', py: 'dà xiǎo', icon: '📐', accent: '#e56d17',
    bins: [
      { key: 'L', label: '大', py: 'dà',   bg: '#fff0dd', fg: '#d96314' },
      { key: 'M', label: '中', py: 'zhōng', bg: '#eef7e6', fg: '#3d9949' },
      { key: 'S', label: '小', py: 'xiǎo', bg: '#e9f2fc', fg: '#3b7bd9' }
    ]
  },
  shape: {

    var alpha = el > 2.2 ? Math.max(0, 1 - (el - 2.2) / 0.9) : 1;

  var tgt = new THREE.Vector3(portrait ? 0 : 0.92, 0.56, portrait ? 0 : 0.08);
  var dir = portrait ? new THREE.Vector3(0.62, 0.78, 0).normalize() : new THREE.Vector3(0, 0.70, 0.71).normalize();
  var needW = portrait ? 5.6 : 10.3, needH = portrait ? 9.2 : 6.4;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max(needW / 2 / Math.tan(hf / 2), needH / 2 / Math.tan(vf / 2) * 0.82);
  camera.position.copy(tgt).addScaledVector(dir, d);
  camera.lookAt(tgt);

var curMode = 'color';

function expectedTrayIndex(it, modeKey) {
  var bins = MODES[modeKey].bins;
  var val = it[modeKey];
  for (var i = 0; i < bins.length; i++) if (bins[i].key === val) return i;
  return 0;
}

function layoutTrayItems(ti) {
  var tr = trays[ti];
  var offsets = [[-0.64, -0.14], [0.0, 0.22], [0.64, -0.14]];
  tr.items.forEach(function (it, idx) {
    var off = offsets[idx % 3];
    it.target.set(tr.x + off[0], BASE + 0.08, tr.z + off[1]);
  });
}

function removeFromTray(it) {
  if (it.tray >= 0) {
    var tr = trays[it.tray], idx = tr.items.indexOf(it);
    if (idx >= 0) tr.items.splice(idx, 1);

function switchMode(newMode, silent) {

  trays.forEach(function (tr, i) {
    tr.items.length = 0;
    tr.shakeT = 0; tr.okFlash = 0; tr.hintFlash = 0; tr.signPop = 0;
    tr.flipT = 0;
    tr.nextTex = signTexCache[newMode][i];
    tr.padMat.color.set(MODES[newMode].bins[i].bg);
  });
  ITEMS.forEach(function (it) {
    it.tray = -1;

  });

function dropItem(it, x, z) {
  // 查找是否落在某个托盘内
  var hitIdx = -1;
  for (var i = 0; i < trays.length; i++) {
    if (Math.abs(x - trays[i].x) < 1.15 && Math.abs(z - trays[i].z) < 1.0) { hitIdx = i; break; }
  }
  if (hitIdx < 0) {
    it.target.copy(it.homeVec);
    sTap();
    updateGuide(false);
    return;
  }
  var rightIdx = expectedTrayIndex(it, curMode);
  if (hitIdx === rightIdx) {
    var tr = trays[hitIdx];
    if (tr.items.indexOf(it) < 0) tr.items.push(it);
    it.tray = hitIdx;
    layoutTrayItems(hitIdx);
    tr.okFlash = 1;
    it.hop = 0.85;
    sSnap();
    markAct('drag'); markAct('sort');
    var bin = MODES[curMode].bins[hitIdx];
    floatWord(bin.label + '！', bin.py, new THREE.Vector3(tr.x, BASE + 1.0, tr.z), '');
    var totalSorted = getSortedCount();
    var allTraysFull = totalSorted === ITEMS.length && trays.every(function (t) { return t.items.length === 3; });
    if (allTraysFull) {
      // 严格规则：必须当前标准下全部 9 个积木（3 个托盘）都分完，才点亮该标准印章！
      var wasDone = kinds[curMode];
      discover(curMode + ':all', curMode, ruby('按', 'àn') + '<b>' + ruby(MODES[curMode].name, MODES[curMode].py) + '</b>' + ruby('全分好啦', 'quán fēn hǎo la'), '', true);
      floatWord('全部分好啦！', 'quán bù fēn hǎo la', new THREE.Vector3(-0.15, BASE + 1.6, TRAY_Z), '');
      if (!celebrated && !(kinds.color && kinds.size && kinds.shape)) {
        updateGuide(!wasDone);
      } else {
        updateGuide(false);
      }
    } else {
      // 单盘装满 3 个时只记发现贴纸，绝不提前点亮模式印章或通关！
      if (tr.items.length === 3) {
        discover(curMode + ':' + bin.key, curMode, ruby('按', 'àn') + '<b>' + ruby(MODES[curMode].name, MODES[curMode].py) + '</b>' + ruby('分出', 'fēn chū') + '<b>' + ruby(bin.label, bin.py) + '</b>', '按' + MODES[curMode].name + '分出' + bin.label + '啦，继续把剩下的积木分完吧', false);
      }
      updateGuide(false);
    }
  } else {
    // 温和弹回 + 高亮正确的托盘（不斥责）
    trays[hitIdx].shakeT = 1;
    trays[rightIdx].hintFlash = 1.4;
    it.target.copy(it.homeVec);
    it.hop = 0.7;
    sNudge();
    var rBin = MODES[curMode].bins[rightIdx];
    floatWord('放进' + rBin.label + '盘试试', 'fàng jìn ' + rBin.py + ' pán shì shi', new THREE.Vector3(trays[rightIdx].x, BASE + 1.25, TRAY_Z), 'hint');
    if (!demo) speak('放进' + rBin.label + '盘试试吧');
    updateGuide(false);
  }
}

var P = null, hovered = null, now = 0;
function setNDC(e) { ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(ndc, camera); }
var plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptmp = new THREE.Vector3();
function planePoint(e, y) { setNDC(e); plane.constant = -y; return raycaster.ray.intersectPlane(plane, ptmp) ? ptmp.clone() : null; }

function pickItem(e) {
  setNDC(e);
  var h = raycaster.intersectObjects(itemMeshes, false)[0];
  if (h) return h.object.userData.item;
  var best = null, bd = 32;
  ITEMS.forEach(function (it) {

    var d = Math.hypot(e.clientX - c.x, e.clientY - c.y);
    if (d < bd) { bd = d; best = it; }
  });
  return best;
}

function pickSign(e) {

}

var demo = null;
var DEMO = [
  ['mode', 'color'], ['wait', 0.4],
  ['fly', 'r_box_L'], ['fly', 'y_sph_L'], ['fly', 'b_cyl_L'], ['wait', 1.2],
  ['mode', 'shape'], ['wait', 0.8],
  ['fly', 'r_box_L'], ['fly', 'b_cyl_L'], ['fly', 'y_sph_L'], ['wait', 1.5], ['end']
];
function setBtnLbl(sel, txt) { var el = document.querySelector(sel + ' .tbtn-lbl'); if (el) el.textContent = txt; else $(sel).textContent = txt; }
function startDemo() { dismissCues(); resetAll(true); demo = { i: 0, t: 0 }; ghost.off = true; $('#demoBtn').classList.add('on'); setBtnLbl('#demoBtn', '■ 停止'); }
function stopDemo() { if (!demo) return; demo = null; ITEMS.forEach(function (it) { it.flying = null; }); $('#demoBtn').classList.remove('on'); setBtnLbl('#demoBtn', '▶ 演示'); }
function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  if (s[0] === 'wait') { if (demo.t >= s[1]) { demo.i++; demo.t = 0; } return; }
  if (s[0] === 'mode') { switchMode(s[1], false); demo.i++; demo.t = 0; return; }
  if (s[0] === 'fly') {
    var it = IMAP[s[1]];
    if (!demo.started) {
      demo.started = true;
      removeFromTray(it);
      var ti = expectedTrayIndex(it, curMode);
      it.flying = { from: it.cur.clone(), to: new THREE.Vector3(TRAY_X[ti], BASE + 0.15, TRAY_Z), t: 0, ti: ti };
    }
    if (!it.flying) { demo.started = false; demo.i++; demo.t = 0; }
  }
}

/* ===================== 开场 ===================== */
var intro = { t: 0, done: false };
function introSkip() {
  if (intro.t < 1.5) intro.t = 1.5;
  board.scale.set(1, 1, 1); trays.forEach(function (tr) { tr.g.scale.setScalar(1); });
  ITEMS.forEach(function (it) { it.pop = 1; });
}
function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4);
  var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift;
  figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.01, backOut((t - 0.3) / 0.5)), 1);
  trays.forEach(function (tr, i) { tr.g.scale.setScalar(Math.max(0.001, backOut((t - 0.45 - i * 0.06) / 0.5))); });
  ITEMS.forEach(function (it, i) { it.pop = Math.max(0.001, backOut((t - 0.62 - i * 0.04) / 0.45)); });
  if (t >= 3.0) {
    board.scale.set(1, 1, 1); trays.forEach(function (tr) { tr.g.scale.setScalar(1); });
    ITEMS.forEach(function (it) { it.pop = 1; });
    intro.done = true;
  }
}

/* ===================== 主循环 ===================== */
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  // 托盘翻转路牌 & 高亮 & 轻晃
  var hoverTray = -1;
  if (P && P.dragging && P.e) {
    var pp = planePoint(P.e, BASE + 0.72);
    if (pp) P.it.target.set(THREE.MathUtils.clamp(pp.x, BOARD.x0 + 0.25, BOARD.x1 - 0.25), BASE + 0.72, THREE.MathUtils.clamp(pp.z, BOARD.z0 + 0.25, BOARD.z1 - 0.25));
    for (var ti = 0; ti < trays.length; ti++) {
      if (Math.abs(P.it.cur.x - trays[ti].x) < 1.15 && Math.abs(P.it.cur.z - trays[ti].z) < 1.0) hoverTray = ti;
    }
  }

  trays.forEach(function (tr, i) {
    if (tr.signPop > 0) tr.signPop = Math.max(0, tr.signPop - dt * 3.5);
    if (tr.flipT < 1) {
      var prev = tr.flipT;
      tr.flipT = Math.min(1, tr.flipT + dt * 3.2);
      if (prev < 0.5 && tr.flipT >= 0.5 && tr.nextTex) {
        tr.signFaceMat.map = tr.nextTex; tr.signFaceMat.needsUpdate = true; tr.nextTex = null;
      }
      tr.signPivot.rotation.y = tr.flipT * Math.PI * 2;
      var sc = 1 + Math.sin(tr.flipT * Math.PI) * 0.22;
      tr.signPivot.scale.setScalar(sc);
    } else {
      tr.signPivot.rotation.y = 0;
      tr.signPivot.scale.setScalar(1 + Math.sin(tr.signPop * Math.PI) * 0.16);
    }
    if (tr.shakeT > 0) {
      tr.shakeT = Math.max(0, tr.shakeT - dt * 3.2);
      tr.g.position.x = tr.x + Math.sin(tr.shakeT * Math.PI * 6) * 0.14 * tr.shakeT;
    } else tr.g.position.x = tr.x;

    if (tr.okFlash > 0) tr.okFlash = Math.max(0, tr.okFlash - dt * 1.8);
    if (tr.hintFlash > 0) tr.hintFlash = Math.max(0, tr.hintFlash - dt * 1.1);

    var op = 0;
    if (tr.okFlash > 0) { tr.glowMat.color.setHex(0x22c55e); op = tr.okFlash * 0.85; }
    else if (tr.hintFlash > 0) { tr.glowMat.color.setHex(0xffa826); op = (0.45 + 0.45 * Math.sin(now * 14)) * Math.min(1, tr.hintFlash); }
    else if (hoverTray === i) { tr.glowMat.color.setHex(0xffb23c); op = 0.72; }
    tr.glowMat.opacity += (op - tr.glowMat.opacity) * 0.25;
  });

  // 物品运动
  var kk = 1 - Math.exp(-15 * dt);
  ITEMS.forEach(function (it) {
    if (it.flying) {
      var f = it.flying; f.t += dt / 0.65;
      var u = Math.min(1, f.t), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      it.cur.lerpVectors(f.from, f.to, e);
      it.cur.y += Math.sin(u * Math.PI) * 1.05;
      if (u >= 1) { var ti = f.ti; it.flying = null; dropItem(it, TRAY_X[ti], TRAY_Z); }
    } else {
      it.cur.lerp(it.target, P && P.it === it && P.dragging ? 1 - Math.exp(-22 * dt) : kk);
    }
    if (it.hop > 0) it.hop = Math.max(0, it.hop - dt * 3.2);
    var hv = (hovered === it && !P) ? 1 : 0; it.hover += (hv - it.hover) * 0.25;
    it.g.position.set(it.cur.x, it.cur.y + Math.sin(it.hop * Math.PI) * 0.35 + it.hover * 0.08, it.cur.z);
    it.body.scale.setScalar(it.pop);

    var showL = it.hover > 0.45 || (P && P.it === it);
    if (showL) {
      var sp = toScreen(it.cur.clone().setY(it.cur.y + it.h + 0.22));
      it.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    it.lbl.classList.toggle('show', !!showL);
  });

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.35 : 1;
  renderer.render(scene, camera);
}

      btn.classList.add('ok');
      fb.classList.add('ok');
      fb.textContent = '🌸 太棒了！获得本课小红花！长方体、圆柱和圆球都是不同的形状哦！';
      sWin();
      saveProgress('k1a-02', true);
      speak('太棒了！获得本课小红花！长方体、圆柱和圆球都是不同的形状，所以要按形状来分！', true);
    } else if (!quizSolved) {
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      fb.classList.remove('ok');
      fb.textContent = '再想想哦～长方体、圆柱和圆球长得不一样，是不同的什么呢？';
      sNudge();
      speak('再想想哦，长方体、圆柱和圆球长得不一样，应该按什么标准来分呢？', true);
    }
  });
});
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#celKeep').addEventListener('click', hideCelebrate);
$('#celAgain').addEventListener('click', function () { resetAll(false); });
document.querySelectorAll('.mbtn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio(); stopDemo(); introSkip(); dismissCues();
    switchMode(btn.getAttribute('data-m'), false);
  });
});
$('#demoBtn').addEventListener('click', function () { audio(); introSkip(); dismissCues(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, mode: curMode, kinds: kinds, sorted: getSortedCount(), celebrated: celebrated }; },
  startDemo: startDemo
};

updateGuide(false);
fit();
requestAnimationFrame(frame);
})();

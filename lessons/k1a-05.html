<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第5课 认识我自己 · 我会慢慢长大（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}
.tbtn-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.tbtn{height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid #e56d17;color:#b44908;font-size:10.5px;font-weight:900;white-space:nowrap;
  box-shadow:0 3px 8px rgba(229,109,23,.25);pointer-events:none;z-index:6;
  animation:cueFloat 1.5s ease-in-out infinite;transition:opacity .35s,transform .35s}
.entry-cue::before{display:none}
body.interacted .entry-cue{opacity:0;pointer-events:none;animation:none}
body:not(.interacted) #voiceBtn{animation:btnPulse 1.8s ease-in-out infinite}
@keyframes cueFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
@keyframes btnPulse{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.45)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 8px rgba(229,109,23,0)}}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;
  max-width:min(460px,calc(100vw - 520px));padding:8px 16px;border-radius:16px;
  background:rgba(255,250,240,.95);border:2px solid #f59e0b;box-shadow:0 6px 20px rgba(120,70,10,.15);
  font-size:14px;font-weight:800;line-height:1.45;color:#7c3a0b;text-align:center;
  transition:transform .25s,box-shadow .25s}
#guideBar.flash{transform:translateX(-50%) scale(1.04);box-shadow:0 8px 26px rgba(229,109,23,.32)}
.guide-pulse{animation:guideRing 1.2s ease-in-out infinite !important}
@keyframes guideRing{0%,100%{box-shadow:0 6px 20px rgba(80,55,20,.16),0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 6px 20px rgba(80,55,20,.16),0 0 0 10px rgba(229,109,23,0)}}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:244px;overflow:hidden;
  padding:8px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:opacity .3s}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-right{display:flex;align-items:center;gap:6px}
#ntToggle{border:1px solid var(--line);background:#fff;color:#8a6d4a;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
#ntToggle:hover{border-color:var(--accent);color:var(--accent)}
.stamps{display:flex;gap:5px;margin-bottom:6px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:158px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:14px;font-weight:800;line-height:1.6;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf{position:absolute;width:10px;height:14px;border-radius:3px;opacity:0;animation:confFall 2.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confFall{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.86);z-index:12;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 20px;border-radius:22px;
  background:rgba(255,250,240,.98);border:2.5px solid #f59e0b;box-shadow:0 16px 40px rgba(100,55,10,.28);
  opacity:0;pointer-events:none;transition:opacity .32s,transform .35s cubic-bezier(.2,1.5,.4,1)}
#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.win-trophy{font-size:40px;line-height:1}
#winMsg{font-size:20px;font-weight:900;color:#c2560c;line-height:1.5;text-align:center}
.win-concl{width:100%;padding:10px 13px;border-radius:14px;background:#fff7e6;border:1.5px solid #f6c478;text-align:left}
.win-concl-t{font-size:13px;font-weight:900;color:#b45309;margin-bottom:4px}
.win-concl-b{font-size:14px;font-weight:800;color:#4a3520;line-height:1.6}
.win-quiz{width:100%;padding:11px 13px;border-radius:14px;background:#fff;border:1.5px solid #e9d9bd;text-align:left}
.win-quiz-t{font-size:13px;font-weight:900;color:#e56d17;margin-bottom:5px}
.win-quiz-q{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:8px;line-height:1.45}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.qopt{width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:1.5px solid #e3d6bd;background:#fffdf8;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.qopt:hover{border-color:#e56d17;background:#fff6eb}
.qopt:active{transform:scale(.98)}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}
.qopt.err{border-color:#f97316;background:#ffedd5;color:#9a3412}
.quiz-fb{margin-top:8px;font-size:13.5px;font-weight:800;line-height:1.5;min-height:20px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2410c}
.win-btns{display:flex;gap:10px;margin-top:2px}
.wbtn{height:38px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.wbtn.pri{background:#e56d17;border-color:#bf5409;color:#fff}
.wbtn:hover{filter:brightness(.96)}

/* 时光滑杆（1岁→7岁） */
#ageBar{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:12px;padding:7px 16px;border-radius:99px;
  background:rgba(255,250,240,.95);border:2px solid #e5b878;box-shadow:0 6px 20px rgba(80,55,20,.16)}
#ageBar .tag{font-size:16px;font-weight:900;color:#8a6234;white-space:nowrap}
#ageVal{min-width:54px;text-align:center;padding:2px 8px;border-radius:10px;background:#fff0d8;color:#c2560c;font-size:18px;font-weight:900}
#ageSlider{width:200px;height:10px;-webkit-appearance:none;appearance:none;border-radius:99px;background:#f0d9b5;outline:none;cursor:pointer}
#ageSlider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#e56d17;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:pointer}
#ageSlider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#e56d17;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);cursor:pointer}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:22px;height:22px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:27px;font-weight:900;line-height:1.6;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.25s ease-out forwards;white-space:nowrap}
.word.cool{color:#2f5fa8}
.word.good{color:#15803d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:960px){
  #guideBar{top:62px;max-width:min(440px,calc(100vw - 280px));font-size:13px;padding:6px 12px}
}
@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:16px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:6px}.tbtn{height:34px;padding:0 10px;font-size:13px}
  .entry-cue{top:38px;font-size:11px;padding:2px 7px}
  #guideBar{top:50px;left:8px;right:8px;transform:none;max-width:none;font-size:12.5px;padding:5px 10px}
  #guideBar.flash{transform:scale(1.02)}
  #notes{top:auto;bottom:106px;right:8px;left:8px;width:auto;max-height:92px;padding:6px 10px}
  #ntList .stk:nth-child(n+2){display:none}
  .stk{font-size:13px;padding:4px 8px}
  #ageBar{bottom:52px;padding:5px 12px;gap:8px}
  #ageSlider{width:130px}
  #ageBar .tag,#ageVal{font-size:14px}
  #verbs{bottom:8px;gap:6px}.verb{font-size:13px;padding:4px 10px}.verb svg{width:17px;height:17px}
}
</style>
</head>

<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  var portrait = w / h < 0.85;
  var tgt = new THREE.Vector3(portrait ? 0 : 0.25, 0.72, portrait ? 0.15 : 0.05);
  var dir = portrait ? new THREE.Vector3(0.28, 0.72, 0.64).normalize() : new THREE.Vector3(0, 0.62, 0.78).normalize();
  var needW = portrait ? 6.4 : 8.7, needH = portrait ? 9.5 : 6.1;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max(needW / 2 / Math.tan(hf / 2), needH / 2 / Math.tan(vf / 2) * 0.84);
  camera.position.copy(tgt).addScaledVector(dir, d);
  camera.lookAt(tgt);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);

}

/* ===================== 指针拖拽交互 ===================== */
var P = null, hovered = null, now = 0;
var pickables = [];
ITEMS.forEach(function (it) { it.g.traverse(function (o) { if (o.isMesh) pickables.push(o); }); });
kidG.traverse(function (o) { if (o.isMesh && o !== kidGlow && o !== footPrint) pickables.push(o); });
robG.traverse(function (o) { if (o.isMesh && o !== robGlow) pickables.push(o); });
shirtG.traverse(function (o) { if (o.isMesh) pickables.push(o); });
pickables.push(bShoe);

var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptmp = new THREE.Vector3();
function setNDC(e) { ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(ndc, camera); }
function planePoint(e, y) { setNDC(e); dragPlane.constant = -y; return raycaster.ray.intersectPlane(dragPlane, ptmp) ? ptmp.clone() : null; }
function pick(e) {
  setNDC(e);
  var h = raycaster.intersectObjects(pickables, false)[0];
  if (!h) return null;
  return { kind: h.object.userData.kind, item: h.object.userData.item || null };
}

canvas.addEventListener('pointerdown', function (e) {
  audio(); welcomeVoiceOnce(); stopDemo(); introSkip();
  var h = pick(e);
  if (!h) return;
  P = { kind: h.kind, item: h.item, x: e.clientX, y: e.clientY, mode: 'pending', e: { clientX: e.clientX, clientY: e.clientY } };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
});

canvas.addEventListener('pointermove', function (e) {
  if (P) {
    var moved = Math.hypot(e.clientX - P.x, e.clientY - P.y);
    P.e = { clientX: e.clientX, clientY: e.clientY };
    if (P.mode === 'pending' && moved > 6) {
      if (P.kind === 'item') { P.mode = 'drag'; P.item.dragging = true; ghost.off = true; }
      else if (P.kind === 'clothes') { P.mode = 'dragClothes'; babyWear.dragging = true; babyWear.flying = null; babyWear.tryTimer = 0; ghost.off = true; }
    }
    return;
  }
  hovered = pick(e);
  canvas.style.cursor = hovered ? (hovered.kind === 'item' || hovered.kind === 'clothes' ? 'grab' : 'pointer') : 'default';
});

function finishPointer() {
  if (!P) return;
  if (P.mode === 'drag') {
    var it = P.item; it.dragging = false;
    var dk = Math.hypot(it.cur.x - KID_POS.x, it.cur.z - KID_POS.z);
    var dr = Math.hypot(it.cur.x - ROB_POS.x, it.cur.z - ROB_POS.z);
    if (dk < 1.35) giveItem(it, 'kid');
    else if (dr < 1.35) giveItem(it, 'robot');
    it.target.copy(it.home);
  } else if (P.mode === 'dragClothes') {
    babyWear.dragging = false;
    var dck = Math.hypot(babyWear.cur.x - KID_POS.x, babyWear.cur.z - KID_POS.z);
    var dcr = Math.hypot(babyWear.cur.x - ROB_POS.x, babyWear.cur.z - ROB_POS.z);
    if (dck < 1.4) tryBabyClothes('kid');
    else if (dcr < 1.4) tryBabyClothes('robot');
    else babyWear.target.copy(babyWear.home);
  } else if (P.mode === 'pending') {
    ghost.off = true;
    if (P.kind === 'kid') {
      // 点击小朋友只打招呼挥手，不会无故长大！只有吃食物、喝水或滑时光才会长大

      ms.robot = true;

      speak('我是玩具机器人，给我装电池就能亮起来，但我不会长大哦！');

}

  var u = Math.min(1, Math.max(0, (ghost.t - 0.35) / 1.35)), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  var x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e - (info.pulse === 'slider' ? 0 : Math.sin(e * Math.PI) * 50);

/* ===================== 老师演示 ===================== */
var demo = null;
var DEMO = [
  ['fly', 'apple', 'kid'], ['wait', 0.9],
  ['fly', 'water', 'kid'], ['wait', 0.9],
  ['slide', 7, 1.6], ['wait', 0.6],
  ['clothes'], ['wait', 1.6],
  ['fly', 'battery', 'robot'], ['wait', 1.2], ['end']
];
function startDemo() { resetAll(true); demo = { i: 0, t: 0 }; ghost.off = true; $('#demoBtn').classList.add('on'); $('#demoBtn').textContent = '■ 停止'; }
function stopDemo() { if (!demo) return; demo = null; $('#demoBtn').classList.remove('on'); $('#demoBtn').textContent = '▶ 演示'; }
function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  if (s[0] === 'wait') { if (demo.t >= s[1]) { demo.i++; demo.t = 0; } return; }
  if (s[0] === 'fly') {
    var it = IMAP[s[1]];
    if (!demo.started) {
      demo.started = true;
      var to = s[2] === 'kid' ? KID_POS.clone().add(new THREE.Vector3(0, 1.1, 0)) : ROB_POS.clone().add(new THREE.Vector3(0, 0.95, 0));
      it.flying = { from: it.cur.clone(), to: to, who: s[2], t: 0 };
    }
    if (!it.flying) { demo.started = false; demo.i++; demo.t = 0; }
    return;
  }
  if (s[0] === 'clothes') {
    if (!demo.started) {
      demo.started = true;
      babyWear.flying = { from: babyWear.cur.clone(), to: kidChestPos(), t: 0 };
    }
    if (!babyWear.flying) { demo.started = false; demo.i++; demo.t = 0; }
    return;
  }
  if (s[0] === 'slide') {
    if (!demo.started) { demo.started = true; demo.a0 = ageGoal; }
    var u = Math.min(1, demo.t / s[2]);
    setAgeGoal(demo.a0 + (s[1] - demo.a0) * u, true);
    if (u >= 1) { demo.started = false; demo.i++; demo.t = 0; }
  }
}

/* ===================== 开场与重来 ===================== */
var intro = { t: 0, done: false };
function introSkip() { if (intro.t < 1.5) intro.t = 1.5; }
function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4);
  var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift;
  figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.01, backOut((t - 0.3) / 0.5)), 1);
  var p1 = Math.max(0.01, backOut((t - 0.5) / 0.55));
  kidG.scale.setScalar(p1); robG.scale.setScalar(p1);
  kidRuler.g.scale.setScalar(p1); robRuler.g.scale.setScalar(p1); rackG.scale.setScalar(p1);
  babyWear.pop = p1;
  ITEMS.forEach(function (it, i) { it.pop = Math.max(0.01, backOut((t - 0.7 - i * 0.08) / 0.48)); });
  if (t >= 3.4) intro.done = true;
}

function resetAll(keepDemo) {
  if (!keepDemo) stopDemo();
  resetGen++;
  if (guideTimer) { clearTimeout(guideTimer); guideTimer = null; }
  celebrated = false;
  voiceCueTimer = 0;
  guidePhase = 0;
  ms = { fed: false, slid: false, clothes: false, robot: false };
  slidBySlider = false;
  $('#winToast').classList.remove('show');
  $('#confetti').innerHTML = '';
  $('#quizFb').textContent = ''; $('#quizFb').className = 'quiz-fb';
  document.querySelectorAll('#quizOpts .qopt').forEach(function (b) { b.classList.remove('ok', 'err'); });
  setAgeGoal(1, false); age = 1;
  fedFood = fedWater = false; robCharge = 0; kidWave = 0;
  babyWear.dragging = false; babyWear.flying = null; babyWear.tryTimer = 0; babyWear.target.copy(babyWear.home);
  ITEMS.forEach(function (it) { it.flying = null; it.dragging = false; it.target.copy(it.home); });
  sparkles.forEach(function (p) { p.life = 0; p.m.visible = false; });
  found = {}; foundN = 0; kinds = { g: false, n: false, l: false };
  $('#ntList').innerHTML = ''; $('#ntCount').textContent = '0';
  document.querySelectorAll('.stamp').forEach(function (s) { s.classList.remove('lit'); });
  updateGuide(false, false);
}

/* ===================== 主循环 ===================== */
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  // 小朋友成长形变（1岁 → 7岁：腿拉长、躯干长高、头略微长、脚印变大）
  age += (ageGoal - age) * (1 - Math.exp(-9 * dt));
  var g = (age - 1) / 6; // 0..1
  var legS = 0.65 + g * 0.85;
  var torsoS = 0.72 + g * 0.62;
  var headS = 0.86 + g * 0.22;
  kLegs.scale.set(0.85 + g * 0.25, legS, 0.85 + g * 0.25);
  var hipY = 0.44 * legS;
  kTorso.scale.set(0.86 + g * 0.28, torsoS, 0.86 + g * 0.25);
  kTorso.position.y = hipY + 0.24 * torsoS;
  kBelt.scale.set(0.86 + g * 0.28, 1, 0.86 + g * 0.25);
  kBelt.position.y = hipY + 0.1 * torsoS;
  kArms.position.y = hipY + 0.26 * torsoS - 0.7;
  kArms.scale.set(0.85 + g * 0.28, 0.75 + g * 0.45, 0.85 + g * 0.25);
  kHead.scale.setScalar(headS);
  kHead.position.y = hipY + 0.48 * torsoS + 0.26 * headS;
  footPrint.scale.setScalar(0.65 + g * 0.8);

  var kidTopY = kHead.position.y + 0.32 * headS;
  kidRuler.arrow.position.y = kidTopY;
  robRuler.arrow.position.y = 1.44; // 机器人身高始终不变

  // 小朋友欢呼跳 / 挥手打招呼 / 摇头
  if (kidHop > 0) kidHop = Math.max(0, kidHop - dt * 2.4);
  if (kidWave > 0) kidWave = Math.max(0, kidWave - dt * 1.5);
  if (kidShake > 0) kidShake = Math.max(0, kidShake - dt * 2.5);
  kidBody.position.y = Math.sin(kidHop * Math.PI) * 0.36;
  kHead.rotation.y = Math.sin(kidShake * Math.PI * 5) * 0.48;
  kArmMeshes[1].rotation.z = 0.28 + (kidWave > 0 ? 1.5 + Math.sin(now * 20) * 0.45 : 0);

  // 机器人旋转 / 充电发光 / 摇头
  if (robSpin > 0) robSpin = Math.max(0, robSpin - dt * 1.4);
  if (robShake > 0) robShake = Math.max(0, robShake - dt * 2.5);
  robCharge = Math.max(0, robCharge - dt * 0.15);
  robBody.rotation.y = Math.sin(robSpin * Math.PI) * Math.PI * 2;
  rHead.rotation.y = Math.sin(robShake * Math.PI * 5) * 0.45;
  rCoreMat.color.set(robCharge > 0.1 ? (Math.sin(now * 16) > 0 ? '#ffe45e' : '#38f2ff') : '#7088a0');

  // 婴儿小衣服拖拽/试穿/挂回动画
  var nearKid = false, nearRob = false;
  var kk = 1 - Math.exp(-16 * dt);
  if (babyWear.dragging && P && P.e) {
    var cp = planePoint(P.e, BASE + 1.05);
    if (cp) babyWear.target.set(THREE.MathUtils.clamp(cp.x, BOARD.x0, BOARD.x1), BASE + 1.05, THREE.MathUtils.clamp(cp.z, BOARD.z0, BOARD.z1));
    if (Math.hypot(babyWear.cur.x - KID_POS.x, babyWear.cur.z - KID_POS.z) < 1.4) nearKid = true;
    if (Math.hypot(babyWear.cur.x - ROB_POS.x, babyWear.cur.z - ROB_POS.z) < 1.4) nearRob = true;
  } else if (babyWear.flying) {
    babyWear.flying.t += dt / 0.55;
    var fu = Math.min(1, babyWear.flying.t), fe = fu < 0.5 ? 2 * fu * fu : 1 - Math.pow(-2 * fu + 2, 2) / 2;
    babyWear.target.lerpVectors(babyWear.flying.from, babyWear.flying.to, fe);
    babyWear.target.y += Math.sin(fu * Math.PI) * 0.45;
    if (fu >= 1) { babyWear.flying = null; tryBabyClothes('kid'); }
  } else if (babyWear.tryTimer > 0) {
    babyWear.tryTimer = Math.max(0, babyWear.tryTimer - dt);
    babyWear.target.copy(kidChestPos());
    if (babyWear.tryTimer === 0) babyWear.target.copy(babyWear.home);
  }
  babyWear.cur.lerp(babyWear.target, babyWear.dragging ? 1 - Math.exp(-22 * dt) : kk);
  var chv = (hovered && hovered.kind === 'clothes' && !P) ? 1 : 0;
  babyWear.hover += (chv - babyWear.hover) * 0.25;
  var curGuide = getGuideInfo();
  var pulseBob = 0.5 + 0.5 * Math.sin(now * 5.2);
  var pulseClothes = !celebrated && !babyWear.dragging && (curGuide.pulse === 'clothes' || curGuide.pulse === 'clothes_robot');
  shirtG.position.set(babyWear.cur.x, babyWear.cur.y + babyWear.hover * 0.07 + (pulseClothes ? pulseBob * 0.09 : 0), babyWear.cur.z);
  shirtBody.scale.setScalar(babyWear.pop * (1 + babyWear.hover * 0.08 + (pulseClothes ? pulseBob * 0.08 : 0)));
  shirtBody.rotation.z = babyWear.tryTimer > 0 && babyWear.tryTooSmall ? Math.sin(now * 28) * 0.16 : Math.sin(now * 2.2) * 0.05;

  // 供给品更新
  ITEMS.forEach(function (it) {
    if (it.dragging && P && P.e) {
      var ip = planePoint(P.e, BASE + 0.85);
      if (ip) it.target.set(THREE.MathUtils.clamp(ip.x, BOARD.x0, BOARD.x1), BASE + 0.85, THREE.MathUtils.clamp(ip.z, BOARD.z0, BOARD.z1));
      if (Math.hypot(it.cur.x - KID_POS.x, it.cur.z - KID_POS.z) < 1.35) nearKid = true;
      if (Math.hypot(it.cur.x - ROB_POS.x, it.cur.z - ROB_POS.z) < 1.35) nearRob = true;
    } else if (it.flying) {
      it.flying.t += dt / 0.6;
      var u = Math.min(1, it.flying.t), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      it.target.lerpVectors(it.flying.from, it.flying.to, e);
      it.target.y += Math.sin(u * Math.PI) * 0.7;
      if (u >= 1) { var w = it.flying.who; it.flying = null; giveItem(it, w); it.target.copy(it.home); }
    }
    it.cur.lerp(it.target, it.dragging ? 1 - Math.exp(-22 * dt) : kk);
    var hv = (hovered && hovered.item === it && !P) ? 1 : 0;
    it.hover += (hv - it.hover) * 0.25;
    var pulseIt = !celebrated && !it.dragging && !it.flying && (
      (curGuide.pulse === 'feed' && (it.id === 'apple' || it.id === 'water')) ||
      ((curGuide.pulse === 'robot' || curGuide.pulse === 'clothes_robot') && it.id === 'battery')
    );
    it.g.position.set(it.cur.x, it.cur.y + it.hover * 0.08 + (pulseIt ? pulseBob * 0.1 : 0), it.cur.z);
    it.body.scale.setScalar(it.pop * (1 + (pulseIt ? pulseBob * 0.08 : 0)));

    var showL = (intro.t > 0.8 && intro.t < 3.4) || it.hover > 0.4 || it.dragging || (voiceCueTimer > 0 && pulseIt);
    if (showL) {
      var p2 = toScreen(it.cur.clone().add(new THREE.Vector3(0, it.h + 0.14, 0)));
      it.lbl.style.transform = 'translate(' + p2.x + 'px,' + p2.y + 'px) translate(-50%,-100%)';
    }
    it.lbl.classList.toggle('show', !!showL);
  });

  var pulseRobGlow = !celebrated && (curGuide.pulse === 'robot' || curGuide.pulse === 'clothes_robot') ? (0.28 + pulseBob * 0.35) : 0;
  kidGlow.material.opacity += ((nearKid ? 0.85 : 0) - kidGlow.material.opacity) * 0.25;
  robGlow.material.opacity += ((nearRob ? 0.85 : pulseRobGlow) - robGlow.material.opacity) * 0.25;

  // 角色标签
  var showIntro = intro.t > 0.8 && intro.t < 3.4;
  var showK = showIntro || nearKid || (hovered && hovered.kind === 'kid');
  if (showK) {
    var pk = toScreen(KID_POS.clone().add(new THREE.Vector3(0, kidTopY + 0.18, 0)));
    kidLbl.style.transform = 'translate(' + pk.x + 'px,' + pk.y + 'px) translate(-50%,-100%)';
  }
  kidLbl.classList.toggle('show', !!showK);

  var showR = showIntro || nearRob || (hovered && hovered.kind === 'robot');
  if (showR) {
    var pr = toScreen(ROB_POS.clone().add(new THREE.Vector3(0, 1.62, 0)));
    robLbl.style.transform = 'translate(' + pr.x + 'px,' + pr.y + 'px) translate(-50%,-100%)';
  }
  robLbl.classList.toggle('show', !!showR);

  var showS = showIntro || babyWear.hover > 0.4 || babyWear.dragging;
  if (showS) {
    var ps = toScreen(babyWear.cur.clone().add(new THREE.Vector3(0, 0.36, 0)));
    shirtLbl.style.transform = 'translate(' + ps.x + 'px,' + ps.y + 'px) translate(-50%,-100%)';
  }
  shirtLbl.classList.toggle('show', !!showS);

  // 星光粒子
  sparkles.forEach(function (p) {
    if (p.life <= 0) { p.m.visible = false; return; }
    p.life -= dt;
    p.v.y -= 4.2 * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.y += dt * 6;
    p.m.scale.setScalar(Math.max(0.01, p.life * 1.8));
  });

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.35 : 1;
  renderer.render(scene, camera);
}

/* ===================== 按钮、小测验与自测钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio(); dismissCues(); introSkip();
  voiceOn = true; voiceWelcomed = true;
  this.classList.add('on'); this.textContent = '🔊 语音';
  voiceCueTimer = 4.0; ghost.t = 0;
  updateGuide(true, true);
});
$('#ntToggle').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
document.querySelectorAll('#quizOpts .qopt').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio();
    var ok = this.getAttribute('data-ok') === '1';
    var fb = $('#quizFb');
    if (ok) {
      document.querySelectorAll('#quizOpts .qopt').forEach(function (b) { b.classList.remove('err'); });
      this.classList.add('ok');
      fb.className = 'quiz-fb ok';
      fb.textContent = '🌸 太棒了！获得本课小红花！小朋友是有生命的生物，会慢慢长高，小时候的衣服穿不下了！';
      sWin();
      launchConfetti();
      saveProgress('k1a-05', true);
      speak('太棒了！答对啦，获得本课小红花！小朋友是有生命的生物，会慢慢长高，小时候的衣服就穿不下了！', true);
    } else {
      this.classList.add('err');
      fb.className = 'quiz-fb err';
      fb.textContent = '再想想哦～刚才把时光滑块拉到 7 岁时，小朋友和小衣服发生了什么变化呀？';
      sNope();
      speak('再想想哦，刚才把时光滑块拉到7岁时，小朋友和小衣服发生了什么变化？', true);
    }
  });
});
$('#winKeep').addEventListener('click', function () { $('#winToast').classList.remove('show'); });
$('#winAgain').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, age: ageGoal, ms: ms }; },
  startDemo: startDemo
};

updateGuide(false, false);
fit();
requestAnimationFrame(frame);
})();
</script>

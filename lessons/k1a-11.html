<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);

.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:7;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.attn{animation:btnGlow 1.5s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.48)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 8px rgba(229,109,23,0)}}
.tbtn:not(.on).attn{animation:btnGlowWarm 1.6s ease-in-out infinite}
@keyframes btnGlowWarm{0%,100%{box-shadow:0 3px 0 #e2d2b5,0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 3px 0 #e2d2b5,0 0 0 8px rgba(245,158,11,0)}}
.btn-cue{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:2px 8px;border-radius:99px;background:#f59e0b;color:#fff;font-size:11px;font-weight:800;line-height:1.4;
  box-shadow:0 4px 10px rgba(180,90,0,.25);transition:opacity .35s,transform .35s;animation:cueBob 1.5s ease-in-out infinite}
.btn-cue::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#f59e0b}
.btn-cue.ora{background:#e56d17;box-shadow:0 4px 10px rgba(191,84,9,.25)}
.btn-cue.ora::before{border-bottom-color:#e56d17}
@keyframes cueBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(3px)}}
body.cues-off .btn-cue{opacity:0;animation:none;transform:translateX(-50%) translateY(-4px)}
body.cues-off .tbtn.attn{animation:none}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(440px,calc(100vw - 600px));padding:7px 14px;border-radius:99px;
  background:rgba(255,250,240,.96);border:2px solid var(--accent);box-shadow:0 6px 18px rgba(229,109,23,.18);
  display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;line-height:1.45;color:var(--ink);cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s}
#guideBar:hover{transform:translateX(-50%) translateY(-1px)}
#guideBar .g-ico{font-size:17px;flex:none}
#guideBar .g-txt{overflow:hidden;text-overflow:ellipsis}
#guideBar.done{border-color:#16a34a;background:#f0fdf4;color:#166534}
@media (max-width:1280px){
  #guideBar{top:64px;max-width:min(480px,calc(100vw - 270px));left:14px;transform:none}
  #guideBar:hover{transform:translateY(-1px)}
}

#notes{position:fixed;right:14px;top:86px;z-index:4;width:236px;overflow:hidden;
  padding:9px 11px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:top .3s}
body.cues-off #notes{top:64px}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-head-r{display:flex;align-items:center;gap:6px}
.nt-tog{border:1px solid var(--line);background:#fff;color:#7a6544;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stamps{display:flex;gap:6px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:158px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;

.stk b{color:#c2560c}

#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}

.win-ttl{font-size:18px;font-weight:900;color:#b84906;line-height:1.55}

.concl-box{width:100%;text-align:left;padding:10px 13px;border-radius:14px;background:#eefaf0;border:1.5px solid #86efac;font-size:14px;line-height:1.65;color:#14532d}
.concl-box .cb-ttl{font-weight:900;color:#15803d;margin-bottom:3px;font-size:14px}

.quiz-opts{display:flex;flex-direction:column;gap:6px}

  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.qopt:hover:not(:disabled){border-color:var(--accent);background:#fff7ed;transform:translateX(2px)}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.qopt.no{border-color:#f59e0b;background:#fef3c7;color:#92400e}
.quiz-fb{margin-top:7px;font-size:13px;font-weight:800;line-height:1.5;min-height:18px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.no{color:#b45309}
.win-btns{display:flex;gap:10px;margin-top:2px}
.wact{height:38px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;

.wact.pri{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 2px 0 #bf5409}
.wact.pri rt{color:#ffe4c4}

/* 底部天气切换条（紧凑轻盈） */
#wxBar{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;
  padding:6px 8px;border-radius:18px;background:rgba(255,250,240,.94);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.14)}
.wbtn{position:relative;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:13px;border:1.5px solid transparent;
  background:#fff;font:inherit;font-size:16px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 #e6d7bd;transition:transform .12s,background .2s,border-color .2s}
.wbtn:active{transform:translateY(1px)}
.wbtn.on[data-w="sunny"]{background:#fff5d6;border-color:#e89b16;color:#b26400;box-shadow:0 2px 0 #e89b16}
.wbtn.on[data-w="rain"]{background:#e4f2ff;border-color:#2b7cd3;color:#1b5a9e;box-shadow:0 2px 0 #2b7cd3}
.wbtn.on[data-w="hot"]{background:#ffeae0;border-color:#e05226;color:#b8340e;box-shadow:0 2px 0 #e05226}
.wbtn.guide-pulse{border-color:#f59e0b;animation:wPulse 1.25s ease-in-out infinite}
@keyframes wPulse{0%,100%{box-shadow:0 2px 0 #e6d7bd,0 0 0 0 rgba(245,158,11,.65);transform:translateY(0)}50%{box-shadow:0 4px 0 #e6d7bd,0 0 0 9px rgba(245,158,11,0);transform:translateY(-3px)}}
.wico{width:22px;height:22px;flex:none}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;line-height:1.5;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:24px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
.word.cool{color:#1d62b5}
.word.ok{color:#15803d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-185%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:60px;height:60px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:15px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:5px}.tbtn{height:34px;padding:0 9px;font-size:13px}
  .btn-cue{display:none}
  #guideBar{top:46px;left:8px;right:8px;max-width:none;transform:none;padding:5px 10px;font-size:12px}
  #notes,body.cues-off #notes{top:88px;right:8px;left:auto;width:192px;padding:7px 9px}
  #ntList{max-height:102px}
  .stk{font-size:13px;padding:4px 7px}
  #wxBar{bottom:54px;gap:5px;padding:5px 6px;max-width:96vw}
  .wbtn{padding:5px 9px;font-size:13px;gap:4px}.wico{width:17px;height:17px}
  #verbs{bottom:10px;gap:5px}.verb{font-size:13px;padding:4px 9px}.verb svg{width:16px;height:16px}
}
</style>
</head>

<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  var syl = py ? py.trim().split(/\s+/) : [], i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) { var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; } out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>'; }
    else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
var $ = function (s) { return document.querySelector(s); };

$('#stW').innerHTML = ruby('救花', 'jiù huā');

$('#wx2').innerHTML = ruby('下大雨', 'xià dà yǔ');
$('#wx3').innerHTML = ruby('大太阳酷热', 'dà tài yáng kù rè');

  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

var confC = $('#confettiCanvas'), confCtx = confC.getContext('2d'), confParts = [], winShown = false;
function launchConfetti() {
  confC.width = window.innerWidth; confC.height = window.innerHeight;
  var cols = ['#f59e0b', '#e56d17', '#2b8cf0', '#16a34a', '#ec4899', '#a855f7'];
  confParts = [];
  for (var i = 0; i < 90; i++) {
    var ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
    var spd = 280 + Math.random() * 440;
    confParts.push({
      x: confC.width * (0.3 + Math.random() * 0.4), y: confC.height * 0.28,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
      w: 7 + Math.random() * 7, h: 5 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 11,
      col: cols[i % cols.length], life: 2.2 + Math.random() * 1.1
    });
  }
}
function stepConfetti(dt) {
  if (!confParts.length) return;
  if (confC.width !== window.innerWidth || confC.height !== window.innerHeight) {
    confC.width = window.innerWidth; confC.height = window.innerHeight;
  }
  confCtx.clearRect(0, 0, confC.width, confC.height);
  for (var i = confParts.length - 1; i >= 0; i--) {
    var p = confParts[i];
    p.life -= dt;
    if (p.life <= 0) { confParts.splice(i, 1); continue; }
    p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
    confCtx.globalAlpha = Math.min(1, p.life);
    confCtx.fillStyle = p.col; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confCtx.restore();
  }
  if (!confParts.length) confCtx.clearRect(0, 0, confC.width, confC.height);
}

/* ===================== 主循环 ===================== */
var last = performance.now(), now = 0;
var cSunnySoil = new THREE.Color('#8f5d38'), cWetSoil = new THREE.Color('#4a2f1b'), cDrySoil = new THREE.Color('#b68b60');
var cSunnyBluSoil = new THREE.Color('#6b472b'), cDryBluSoil = new THREE.Color('#ae8a63'), cWetBluSoil = new THREE.Color('#3f2614');
var cWhite = new THREE.Color('#ffffff'), cDarkCloud = new THREE.Color('#6f829c');
var cSunNorm = new THREE.Color('#ffd447'), cSunHot = new THREE.Color('#ff6a1a');
var cGrassNorm = new THREE.Color('#64b952'), cGrassWet = new THREE.Color('#44943e'), cGrassDry = new THREE.Color('#95b250');

function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  wxTime += dt;
  updateIntro(dt);
  stepDemo(dt);

  // ---- 天气环境、太阳、云朵、雨滴、热浪 ----
  var isRain = weather === 'rain', isHot = weather === 'hot';
  sunRays.rotation.z += dt * (isHot ? 1.5 : 0.45);
  var sunScaleGoal = isRain ? 0.01 : isHot ? 1.38 : 1.0;
  var sc = sunGrp.scale.x + (sunScaleGoal - sunGrp.scale.x) * (1 - Math.exp(-5 * dt));
  sunGrp.scale.setScalar(sc);
  sunGrp.visible = sc > 0.04;
  sunCoreMat.color.lerp(isHot ? cSunHot : cSunNorm, 1 - Math.exp(-5 * dt));
  sunHalo.material.opacity += ((isHot ? 0.42 + Math.sin(now * 6) * 0.14 : 0) - sunHalo.material.opacity) * 0.12;
  sunHalo.scale.setScalar(1 + Math.sin(now * 4) * 0.12);

  cloudMat.color.lerp(isRain ? cDarkCloud : cWhite, 1 - Math.exp(-4 * dt));
  var cVis = isHot ? 0.01 : 1;
  cloud1.scale.lerp(new THREE.Vector3(cVis * (isRain ? 1.25 : 1.05), cVis * (isRain ? 1.18 : 1.05), cVis * 1.05), 0.08);
  cloud2.scale.lerp(new THREE.Vector3(cVis * (isRain ? 1.2 : 0.95), cVis * (isRain ? 1.15 : 0.95), cVis * 0.95), 0.08);
  cloud3.scale.lerp(new THREE.Vector3(cVis * (isRain ? 1.2 : 0.85), cVis * (isRain ? 1.15 : 0.85), cVis * 0.85), 0.08);
  cloud1.position.x = (isRain ? 0.0 : 0.45) + Math.sin(now * 0.45) * 0.25;
  cloud2.position.x = (isRain ? 1.55 : 1.95) + Math.cos(now * 0.38) * 0.22;
  cloud3.position.x = (isRain ? -1.8 : -1.5) + Math.sin(now * 0.42 + 1) * 0.2;

  // 光照微妙呼应天气（保持课本明快感）
  sunLight.intensity += ((isRain ? 0.46 : isHot ? 0.78 : 0.66) - sunLight.intensity) * 0.08;
  hemi.intensity += ((isRain ? 0.36 : isHot ? 0.48 : 0.42) - hemi.intensity) * 0.08;

  // 雨滴
  rainGrp.visible = isRain;
  if (isRain) {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.y -= d.spd * dt;
      if (d.y < BASE + 0.15) { d.y = 3.15 + Math.random() * 0.35; }
      d.m.position.set(d.x, d.y, d.z);
    }
    for (var j = 0; j < ripples.length; j++) {
      var r = ripples[j];
      r.t = (r.t + dt * 1.7) % 1;
      r.m.scale.setScalar(0.5 + r.t * 2.2);
      r.m.material.opacity = (1 - r.t) * 0.6;
    }
  }
  // 热浪
  heatGrp.visible = isHot;
  if (isHot) {
    for (var hi = 0; hi < heatWaves.length; hi++) {
      var hw = heatWaves[hi];
      hw.t = (hw.t + dt * 0.55) % 1;
      hw.m.position.set(hw.x + Math.sin(now * 3 + hi) * 0.12, BASE + 0.4 + hw.t * 1.9, hw.z);
      hw.m.material.opacity = Math.sin(hw.t * Math.PI) * 0.45;
    }
  }

  // 土壤湿度变化
  soilMat.color.lerp(isRain ? cWetSoil : isHot ? cDrySoil : cSunnySoil, 1 - Math.exp(-3.5 * dt));
  grassMat.color.lerp(isRain ? cGrassWet : isHot ? cGrassDry : cGrassNorm, 1 - Math.exp(-3.5 * dt));
  bluSoilMat.color.lerp(watered || isRain ? cWetBluSoil : isHot ? cDryBluSoil : cSunnyBluSoil, 1 - Math.exp(-3.5 * dt));

  // ---- 蚯蚓：晴天在地下洞里蠕动，雨天爬出地面 ----

    var gx = 0.32 - u * 0.82 + Math.sin(now * 2.2) * 0.08;
    var gy = SOIL.h + 0.08 + Math.max(0, Math.sin(now * wFreq - u * 5.2)) * 0.07;
    var gz = 0.35 - u * 0.35 + Math.sin(now * 3 - u * 4) * 0.12;
    // 中间过渡沿着竖直通道
    var sProg = THREE.MathUtils.clamp((wormOut - u * 0.35) / 0.65, 0, 1);
    var px, py, pz;
    if (sProg < 0.5) {
      var k1 = sProg * 2;
      px = THREE.MathUtils.lerp(ux, 0.32, k1);
      py = THREE.MathUtils.lerp(uy, SOIL.h + 0.08, k1);
      pz = THREE.MathUtils.lerp(uz, SOIL.d / 2 - 0.06, k1);
    } else {
      var k2 = (sProg - 0.5) * 2;
      px = THREE.MathUtils.lerp(0.32, gx, k2);
      py = THREE.MathUtils.lerp(SOIL.h + 0.08, gy, k2);
      pz = THREE.MathUtils.lerp(SOIL.d / 2 - 0.06, gz, k2);
    }
    wormSegs[wi].position.set(px, py, pz);
  }

  // ---- 小燕子：晴天高飞，雨天低飞 ----
  swPhase += dt * (isRain ? 1.45 : 1.05);
  var altGoal = isRain ? 1.55 : 3.05;
  swAlt += (altGoal - swAlt) * (1 - Math.exp(-3 * dt));
  var sx = Math.sin(swPhase) * 2.35;
  var sz = -0.35 + Math.sin(swPhase * 2) * 0.72;
  var sy = swAlt + Math.sin(swPhase * 3) * 0.14;
  var nx = Math.sin(swPhase + 0.05) * 2.35;
  var nz = -0.35 + Math.sin((swPhase + 0.05) * 2) * 0.72;

  var flap = Math.sin(now * (isRain ? 18 : 13)) * 0.62;

  if (isRain && !rainDiscDone && wxTime > 1.25) {

    discover('rain-worm', 'a', '雨天蚯蚓钻出土', 'yǔ tiān qiū yǐn zuān chū tǔ', '#e56d17', '🪱',
      '下雨土里灌满水缺少空气，蚯蚓就钻出地面透透气！小燕子也低飞捉虫，含羞草也合拢叶子啦！');
    setTimeout(function () {
      if (weather === 'rain') {
        sChirp();
        floatWord('燕子低飞要下雨!', 'yàn zi dī fēi yào xià yǔ', swallowGrp.position.clone().add(new THREE.Vector3(0, 0.3, 0)), 'cool');
        if (!found['rain-swallow']) {
          found['rain-swallow'] = true; foundN++;
          var el = document.createElement('div'); el.className = 'stk';
          el.innerHTML = '<i style="background:#2b7cd3">🐦</i><span>' + ruby('下雨天燕子低飞', 'xià yǔ tiān yàn zi dī fēi') + '</span>';
          var list = $('#ntList'); list.insertBefore(el, list.firstChild);
          while (list.children.length > 6) list.removeChild(list.lastChild);
          $('#ntCount').textContent = foundN;
          sDing();
        }
      }
    }, 950);
  }

  // ---- 含羞草：羽状小叶合拢/展开动画 ----
  if (!isRain && mimCloseTimer > 0) {
    mimCloseTimer -= dt;
    if (mimCloseTimer <= 0) mimCloseGoal = 0;
  }
  mimClose += (mimCloseGoal - mimClose) * (1 - Math.exp(-(mimCloseGoal > mimClose ? 11 : 2.6) * dt));
  mimBranches.forEach(function (br) {
    br.inner.rotation.z = br.basePitch - mimClose * 0.58;
    br.pairs.forEach(function (pair) {
      pair.forEach(function (lf) {
        var wave = THREE.MathUtils.clamp(mimClose * 1.35 - lf.idx * 0.08, 0, 1);
        lf.p.rotation.x = -lf.side * wave * 1.38;
        lf.p.rotation.y = lf.side * wave * 0.25;
      });
    });
  });

  // ---- 蓝花草：酷热蔫垂，浇水恢复挺立 ----
  wilt += (wiltGoal - wilt) * (1 - Math.exp(-(wiltGoal > wilt ? 2.4 : 4.2) * dt));
  bluSeg1.rotation.z = -wilt * 0.42;
  bluSeg2.rotation.z = -wilt * 0.68;
  bluHead.rotation.z = -wilt * 0.55;
  bluLeaves.forEach(function (lp, idx) {
    lp.rotation.z = -wilt * 0.62 - 0.12 + Math.sin(now * 2 + idx) * 0.03 * (1 - wilt);
  });
  bluFlowers.forEach(function (fg) {
    var s = 1 - wilt * 0.22;
    fg.scale.set(s, s, s);
  });

  if (isHot && !watered && !hotDiscDone && wxTime > 1.15) {
    hotDiscDone = true;
    floatWord('酷热蓝花草蔫了!', 'kù rè lán huā cǎo niān le', new THREE.Vector3(BLU.x, BASE + 1.5, BLU.z));
    if (!found['blu-save'] && !demo) guideHandT = 3.2;
    discover('hot-wilt', 'info', '酷热天蓝花草蔫了', 'kù rè tiān lán huā cǎo niān le', '#e05226', '🥀',
      '大太阳太干太热，蓝花草缺水晒蔫了！快拖动前面的小浇水壶去给它浇水救活它吧！');
  }

  // 浇水闪烁星星
  if (sparkleT > 0) {
    sparkleT = Math.max(0, sparkleT - dt);
    sparkleGrp.visible = true;
    sparkles.forEach(function (sp, idx) {
      var a = sp.ang + now * 2.5;
      sp.m.position.set(Math.cos(a) * sp.r, Math.sin(now * 5 + idx) * 0.22, Math.sin(a) * sp.r);
      sp.m.rotation.y += dt * 4;
      sp.m.scale.setScalar(Math.min(1, sparkleT * 1.4));
    });
  } else sparkleGrp.visible = false;

  // ---- 小浇水壶拖动、靠近蓝花草自动倾倒浇水 ----
  canCur.lerp(canTarget, 1 - Math.exp(-14 * dt));
  canGrp.position.copy(canCur);

  var distBlu = Math.hypot(canCur.x + 0.55 - BLU.x, canCur.z - BLU.z);
  var distMim = Math.hypot(canCur.x + 0.55 - MIM.x, canCur.z - MIM.z);
  var distSoil = Math.hypot(canCur.x + 0.55 - SOIL.x, canCur.z - SOIL.z);
  var nearBlu = distBlu < 1.15 && (canDragging || (demo && demo.started));
  var nearMim = distMim < 1.0 && canDragging;
  var nearSoil = distSoil < 1.35 && canDragging;
  canPouring = nearBlu || nearMim || nearSoil;

  bluGlow.material.opacity += (((wilt > 0.35 && !watered) || nearBlu ? 0.65 + Math.sin(now * 5) * 0.2 : 0) - bluGlow.material.opacity) * 0.15;

  canTilt += ((canPouring ? -0.58 : 0) - canTilt) * (1 - Math.exp(-12 * dt));
  canBodyGrp.rotation.z = canTilt;
  pourGrp.visible = canTilt < -0.22;
  if (pourGrp.visible) {
    pourDrops.forEach(function (pd) {
      pd.t = (pd.t + dt * 2.2) % 1;
      pd.m.position.set(pd.t * 0.42, -pd.t * pd.t * 1.25, pd.spread * (0.4 + pd.t));
      pd.m.scale.setScalar(1 - pd.t * 0.35);
    });
    pourSoundCD -= dt;
    if (pourSoundCD <= 0) { sPour(); pourSoundCD = 0.18; }
    if (nearBlu && !waterDoneThisDrag) {
      waterDoneThisDrag = true;
      rescueBluebell();
    }
    if (nearMim && mimCloseGoal < 0.5) {
      touchMimosa();
    }
    if (nearSoil && !soilWaterDone) {
      soilWaterDone = true;
      wormExcited = 1.0;
      floatWord('草地湿润啦!', 'cǎo dì shī rùn la', new THREE.Vector3(SOIL.x, BASE + SOIL.h + 0.55, SOIL.z), 'cool');
    }
  }

  // ---- 3D 标签显示 ----
  var showIntroLbl = intro.t > 0.9 && intro.t < 3.4;
  LABELS.forEach(function (L) {
    var show = showIntroLbl || hovered === L.id || (L.id === 'can' && canDragging);
    if (show) {
      var sp = toScreen(L.pos());
      L.el.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    L.el.classList.toggle('show', !!show);
  });

  updateGhost(dt);
  stepConfetti(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.4 : 1;

  renderer.render(scene, camera);
}

/* ===================== 按钮、小测验与测试钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  if (!voiceWelcomed && voiceOn) {
    voiceWelcomed = true;
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  $('#voiceBtn').classList.toggle('on', voiceOn);
  $('#voiceLbl').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) { voiceWelcomed = true; updateGuide(true); }
  else if ('speechSynthesis' in window) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  voiceOn = true; voiceWelcomed = true;
  $('#voiceBtn').classList.add('on'); $('#voiceLbl').textContent = '🔊 语音';
  updateGuide(true);
});
document.querySelectorAll('#quizBox .qopt').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio();
    var ok = btn.dataset.ok === '1';
    var fb = $('#quizFb');
    if (ok) {
      btn.classList.add('ok');
      document.querySelectorAll('#quizBox .qopt').forEach(function (b) { b.disabled = true; });
      fb.className = 'quiz-fb ok';
      fb.textContent = '🌸 太棒了！获得本课小红花！下雨时雨水灌进土里缺少空气，蚯蚓就会钻出地面透气！';
      sTriumph();
      saveProgress('k1a-11', true);
      speak('太棒了！答对啦！获得本课小红花！下大雨时雨水灌进土里缺少空气，蚯蚓就会钻出地面透透气！');
    } else {
      btn.classList.add('no');
      fb.className = 'quiz-fb no';
      fb.textContent = '💡 ' + (btn.dataset.hint || '再想想哦，再试一次吧！');
      sWorm();
      speak(btn.dataset.hint || '再想想哦，再试一次吧！');
    }
  });
});
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#winCloseBtn').addEventListener('click', hideWinToast);
$('#winReplayBtn').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, weather: weather, celebrated: celebrated }; },
  setWeather: setWeather,
  touchMimosa: touchMimosa,
  rescueBluebell: rescueBluebell,
  startDemo: startDemo
};

updateGuide(false);
fit();
requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第2课 辨别方向 · 太阳辨向与朝向联动闯关</title>
<style>
:root{--accent:#e56d17;--ink:#2a2218;--line:#e4d5ba;--card:rgba(255,253,248,.94);--ok:#16a34a}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8d8f0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.46em;color:#7a6a52;font-weight:500}
body.no-py rt{display:none}

/* 左上标题卡片 */
#hudTL{position:fixed;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 16px rgba(30,60,90,.16)}
#backBtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:#5c4b34;font-size:18px;font-weight:900}
#backBtn:hover{border-color:var(--accent);color:var(--accent)}
.hd-t{font-size:16px;font-weight:900;line-height:1.5}
.hd-sub{font-size:11.5px;color:#7b6c56;font-weight:700}

/* 左上实时动态朝向联动徽章（前/后/左/右 <-> 东/南/西/北） */
#orientBadge{position:fixed;top:72px;left:12px;z-index:6;padding:8px 12px;border-radius:15px;
  background:rgba(255,253,247,.95);border:2px solid #f08a24;box-shadow:0 6px 18px rgba(30,60,90,.16);
  display:none;min-width:236px;transition:transform .2s}
#orientBadge.show{display:block}
#orientBadge.pop{animation:obPop .36s ease}
@keyframes obPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.ob-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#9a3412;margin-bottom:6px}
.ob-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ob-cell{padding:4px 5px;border-radius:9px;text-align:center;font-size:12px;font-weight:900;line-height:1.25;border:1.5px solid transparent}
.ob-cell.f{background:#fff7ed;border-color:#fb923c;color:#c2410c}
.ob-cell.b{background:#eef2ff;border-color:#818cf8;color:#3730a3}
.ob-cell.l{background:#ecfdf5;border-color:#34d399;color:#047857}
.ob-cell.r{background:#fff1f2;border-color:#fb7185;color:#be123c}
.ob-cell small{display:block;font-size:10px;opacity:.8;font-weight:800}

/* 顶部中央动态分步小助手（U2） */
#guideBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(470px,calc(100vw - 620px));display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:15px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 6px 18px rgba(130,68,12,.18);
  font-size:13.5px;font-weight:800;color:#753a07;cursor:pointer;line-height:1.35}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.bump{animation:gbPop .4s ease}
@keyframes gbPop{0%{transform:translateX(-50%) scale(.95)}55%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}

/* 右上工具条 */
#hudTR{position:fixed;top:12px;right:12px;z-index:7;display:flex;align-items:center;gap:6px}
.tbtn-wrap{position:relative;display:inline-flex}
.tbtn{height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font:inherit;font-size:13.5px;font-weight:800;color:#4a3c28;cursor:pointer;
  box-shadow:0 3px 0 #d9c8ab;transition:all .14s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#b8500a;color:#fff;box-shadow:0 3px 0 #b8500a}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid var(--accent);color:#b44908;font-size:10.5px;font-weight:900;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(229,109,23,.24);
  animation:cuePop 1.6s ease-in-out infinite;transition:opacity .25s}
body.interacted .entry-cue{opacity:0;animation:none}
@keyframes cuePop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}

/* 右上可收起窄版发现栏（D3） */
#notes{position:fixed;top:60px;right:12px;z-index:6;width:224px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(30,60,90,.14)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nt-title{font-size:13.5px;font-weight:900}
.nt-cnt{font-size:12.5px;font-weight:900;color:var(--accent)}
.nt-tog{padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:11px;font-weight:800;color:#6c5c45;cursor:pointer}
.stamps{display:flex;gap:4px;margin-bottom:6px}
.st{flex:1;text-align:center;padding:3px 2px;border-radius:8px;font-size:11px;font-weight:800;
  border:1.5px dashed #d7c5a4;color:#9b8a70;background:#faf4e8;transition:all .2s;line-height:1.4}
.st.lit{border-style:solid;border-color:var(--accent);background:#fff2df;color:#b8500a;animation:stPop .4s ease}
@keyframes stPop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{padding:5px 8px;border-radius:10px;background:#fff;border:1px solid #ece0c9;font-size:12px;font-weight:700;line-height:1.38}

/* 3D 场景轻浮标 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.tag3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:5px 12px;border-radius:99px;
  background:rgba(42,34,24,.92);color:#fff;font-size:13.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;transition:opacity .2s}
.tag3d.show{opacity:1}
.tag3d.ok{background:#15803d}
.tag3d.warm{background:#d95b12}
.cue3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 12px;border-radius:99px;
  background:#fff7ed;border:2px solid #ea580c;color:#9a3412;font-size:13px;font-weight:900;white-space:nowrap;
  box-shadow:0 4px 14px rgba(234,88,12,.28);animation:cueBob 1.3s ease-in-out infinite;display:none}
.cue3d.show{display:block}
@keyframes cueBob{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-6px)}}

/* 通关彩带与弹窗 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#winToast{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(20,34,52,.36);padding:16px}
#winToast.show{display:grid}
.win-card{width:min(456px,100%);max-height:85vh;overflow-y:auto;background:#fffdf8;
  border:2.5px solid var(--accent);border-radius:22px;padding:18px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(30,22,10,.3)}
.win-concl{margin:10px 0;padding:10px 12px;border-radius:13px;background:#fff8eb;border:1.5px solid #f2cf9b;
  text-align:left;font-size:13.5px;line-height:1.55;color:#5a3309;font-weight:700}
.win-quiz{margin:10px 0;padding:10px 12px;border-radius:13px;background:#f8fafc;border:1.5px solid #d9e2ec;text-align:left}
.win-quiz h4{margin:0 0 8px;font-size:13.5px;color:#c2410c}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{padding:8px 11px;border-radius:11px;border:1.5px solid #d9d0be;background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;text-align:left;cursor:pointer;transition:all .14s;color:#2a2218}
.qopt:hover{border-color:var(--accent);background:#fff9f0}
.qopt.ok{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e}
.qopt.bad{border-color:#e03131;background:#fff5f5;color:#c92a2a}
.qfb{margin-top:7px;font-size:12.5px;font-weight:800;min-height:18px;color:#15803d}
.win-acts{display:flex;justify-content:center;gap:10px;margin-top:12px}

@media (max-width:1100px){
  #guideBar{top:64px;left:50%;max-width:calc(100vw - 500px)}
}
</style>
</head>

<canvas id="cv"></canvas>
<canvas id="confetti"></canvas>

<div id="labels">
  <div class="tag3d" id="popTag"></div>
  <div class="cue3d" id="targetCue">👆 点这里</div>
</div>

<div id="hudTL">
  <a id="backBtn" href="../index.html" title="返回书包">‹</a>
  <div>
    <div class="hd-t" data-py="dì kè biàn bié fāng xiàng">第2课 辨别方向</div>
    <div class="hd-sub">活页 · 课本第 8 页「太阳辨向与朝向联动闯关」</div>
  </div>
</div>

<div id="orientBadge">
  <div class="ob-head" id="obHead">🧭 面朝东（太阳）：东西南北不动，转身前后左右变</div>

</div>

<div id="guideBar" title="点我重听当前步骤">
  <span id="guideIco">☀️</span>
  <span id="guideTxt">第1步：清晨太阳从东边升起！点天空中的大太阳，面向东方认清前后左右吧！</span>
</div>

<div id="hudTR">
  <span class="tbtn-wrap"><button class="tbtn on" id="voiceBtn" type="button">🔊 语音</button><span class="entry-cue">点我听玩法</span></span>
  <span class="tbtn-wrap"><button class="tbtn" id="demoBtn" type="button">▶ 演示</button><span class="entry-cue">不会玩点演示</span></span>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head">
    <span class="nt-title" data-py="wǒ de fā xiàn">我的发现</span>
    <span class="nt-cnt" id="ntCnt">0</span>
    <button class="nt-tog" id="ntTog" type="button">收起</button>
  </div>
  <div class="stamps">
    <span class="st" id="st1" data-py="tài yáng biàn xiàng">太阳辨向</span>
    <span class="st" id="st2" data-py="zhuǎn shēn xún bǎo">转身寻宝</span>
    <span class="st" id="st3" data-py="dēng lóu duó qí">登楼夺旗</span>
  </div>
  <div id="ntList"></div>
</aside>

<div id="winToast">
  <div class="win-card">
    <div style="font-size:38px">🏆</div>
    <h3 style="margin:4px 0">太棒啦！小红旗顺利夺得啦！</h3>
    <div class="win-concl">
      <b>✨ 科学小结论：</b>太阳每天从东方升起，校园的<b>东、南、西、北</b>固定不变；当你转身面向不同方向时，身体的<b>前、后、左、右</b>所对的地理方向也会跟着一起变化！
    </div>
    <div class="win-quiz">
      <h4>💡 考考你 · 答对领小红花 🌸</h4>
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">早上你面向升起的太阳（东方）站好，这时你的左手边是什么方向？</div>
      <div class="qopts" id="qOpts">
        <button class="qopt" type="button" data-ok="1">🧭 北方（前东、后西、左北、右南）</button>
        <button class="qopt" type="button" data-hint="南边在面向东方时的右手边哦，再想想左手边是哪边？">🧭 南方</button>
        <button class="qopt" type="button" data-hint="西边在面向东方时的背后哦，再想想左手边是哪边？">🧭 西方</button>
      </div>
      <div class="qfb" id="qFb"></div>
    </div>
    <div class="win-acts">
      <button class="tbtn" id="winKeepBtn" type="button">继续自由探索</button>
      <button class="tbtn on" id="winAgainBtn" type="button">再玩一次</button>
    </div>
  </div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../audio/manifest.js?v=doubao-2"></script>

<script>
(function () {
'use strict';

var LESSON_ID = 'k1b-02';
var BOOK_PROGRESS_KEY = 'xk_k1b_progress';
try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}

      var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; }
      out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>';

  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
document.querySelectorAll('[data-py]').forEach(function (el) { el.innerHTML = ruby(el.textContent, el.dataset.py); });
$('#backBtn').addEventListener('click', function () { try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {} });

/* ===== 语音与柔和音效 ===== */

}

  if (!text || (!voiceOn && !force)) return;
  if (window.__xkVoice) { window.__xkVoice.speak(text, '../audio/', true); return; }
}

var audioCtx = null;
function playTone(type) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'step') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(420, now); osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'bump') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(210, now); osc.frequency.exponentialRampToValueAtTime(125, now + 0.14);
      gain.gain.setValueAtTime(0.14, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'ding') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(660, now); osc.frequency.exponentialRampToValueAtTime(990, now + 0.15);
      gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'win') {
      [523, 659, 784, 1046].forEach(function (f, idx) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.1);
        g.gain.setValueAtTime(0.15, now + idx * 0.1); g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.28);

}

function saveProgress(id, hasFlower) {
  try {
    var d = JSON.parse(localStorage.getItem(BOOK_PROGRESS_KEY) || '{}');
    d[id] = { done: true, flower: !!(hasFlower || (d[id] && d[id].flower)), ts: Date.now() };
    localStorage.setItem(BOOK_PROGRESS_KEY, JSON.stringify(d));
  } catch (e) {}
}

/* ===== 彩带 ===== */
var cfCv = $('#confetti'), cfCtx = cfCv.getContext('2d'), cfList = [], cfOn = false;
function launchConfetti() {
  cfCv.width = window.innerWidth; cfCv.height = window.innerHeight;
  cfList = [];
  var cols = ['#f97316', '#facc15', '#22c55e', '#38bdf8', '#f43f5e', '#a855f7'];
  for (var i = 0; i < 85; i++) {
    cfList.push({
      x: Math.random() * cfCv.width, y: -20 - Math.random() * 140,
      vx: (Math.random() - 0.5) * 160, vy: 120 + Math.random() * 210,
      r: 5 + Math.random() * 5, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 8,
      col: cols[i % cols.length]
    });
  }
  cfOn = true;
}
function tickConfetti(dt) {
  if (!cfOn) return;
  cfCtx.clearRect(0, 0, cfCv.width, cfCv.height);
  var alive = 0;
  for (var i = 0; i < cfList.length; i++) {
    var p = cfList[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.a += p.va * dt;
    if (p.y < cfCv.height + 30) alive++;
    cfCtx.save(); cfCtx.translate(p.x, p.y); cfCtx.rotate(p.a);

// 坐标系：-Z = 北(N), +Z = 南(S), +X = 东(E), -X = 西(W)
var GEO_INFO = {
  E: { char: '东', full: '东（太阳）', yaw: -Math.PI / 2, dx: 1, dz: 0, col: '#ea580c' },
  N: { char: '北', full: '北（教学楼）', yaw: 0, dx: 0, dz: -1, col: '#2563eb' },
  W: { char: '西', full: '西（阳光花坛）', yaw: Math.PI / 2, dx: -1, dz: 0, col: '#16a34a' },
  S: { char: '南', full: '南（图书馆）', yaw: Math.PI, dx: 0, dz: 1, col: '#dc2626' }
};
var REL_MAP = {
  E: { front: 'E', back: 'W', left: 'N', right: 'S' },
  N: { front: 'N', back: 'S', left: 'W', right: 'E' },
  W: { front: 'W', back: 'E', left: 'S', right: 'N' },
  S: { front: 'S', back: 'N', left: 'E', right: 'W' }
};
var REL_CN = { front: '前', back: '后', left: '左', right: '右' };

/* ===== Three.js r147 阳光立体校园 ===== */
var cv = $('#cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = new THREE.Color('#a8d8f0');

var camera = new THREE.PerspectiveCamera(36, 16 / 9, 0.1, 100);
camera.position.set(0.15, 9.7, 9.2);
camera.lookAt(-0.15, 0.20, 0.15);

scene.add(new THREE.HemisphereLight('#fffdf5', '#689452', 0.68));
var sunL = new THREE.DirectionalLight('#fff4d6', 0.62);
sunL.position.set(8, 11, 4);
sunL.castShadow = true;
sunL.shadow.mapSize.set(1024, 1024);
sunL.shadow.camera.left = -8; sunL.shadow.camera.right = 8;

scene.add(sunL);

var ramp = new THREE.DataTexture(new Uint8Array([132,132,132,255, 195,195,195,255, 236,236,236,255, 255,255,255,255]), 4, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;

].forEach(function (gd) {

  });
  var sp = new THREE.Mesh(
    new THREE.PlaneGeometry(0.42, 0.42),

  );

});

/* 内圈：随小人身体一起旋转的 4 个相对方向踏板（前 / 后 / 左 / 右） */

var bodyPadPickMeshes = [];
var bodyPads = [];
var hoveredRelKey = null;

[
  { key: 'front', dx: 0,  dz: -1, char: '前', col: '#ea580c', glow: '#fdba74', rotY: 0 },
  { key: 'back',  dx: 0,  dz: 1,  char: '后', col: '#4f46e5', glow: '#a5b4fc', rotY: Math.PI },
  { key: 'left',  dx: -1, dz: 0,  char: '左', col: '#059669', glow: '#6ee7b7', rotY: Math.PI / 2 },
  { key: 'right', dx: 1,  dz: 0,  char: '右', col: '#e11d48', glow: '#fda4af', rotY: -Math.PI / 2 }
].forEach(function (bd) {

  );
  halo.rotation.x = -Math.PI / 2; halo.position.y = 0.025;
  g.add(halo);

  var disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.24, 0.26, 0.06, 24),
    new THREE.MeshBasicMaterial({ color: bd.col })
  );
  disc.position.y = 0.032;
  g.add(disc);

  // 用独立水平文字牌 + labelWrap 精准抵消 bodyPadsGroup.rotation.y，保证汉字永远 100% 端正！
  var tex = ctex(128, 128, function (ctx, w, h) {
    ctx.fillStyle = '#fffdf7';
    ctx.beginPath(); ctx.arc(w / 2, h / 2, 58, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = bd.col; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.arc(w / 2, h / 2, 52, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = bd.col; ctx.font = 'bold 64px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bd.char, w / 2, h / 2 + 4);
  });
  var labelWrap = new THREE.Group();
  labelWrap.position.y = 0.068;
  var labelPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(0.46, 0.46),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
  );
  labelPlane.rotation.x = -Math.PI / 2;
  labelWrap.add(labelPlane);
  g.add(labelWrap);

  var tip = new THREE.Group(); tip.rotation.y = bd.rotY;
  var cone = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.22, 4), new THREE.MeshBasicMaterial({ color: bd.col }));
  cone.rotation.x = -Math.PI / 2; cone.position.set(0, 0.14, -0.29);

  var hit = new THREE.Mesh(
    new THREE.CylinderGeometry(0.36, 0.36, 0.34, 16),

  );
  hit.position.y = 0.15;
  hit.userData = { kind: 'bodyPad', rel: bd.key };
  g.add(hit);
  bodyPadPickMeshes.push(hit);

  bodyPadsGroup.add(g);
  bodyPads.push({ def: bd, grp: g, labelWrap: labelWrap, halo: halo, tip: tip });
});

/* ===== 闯关配置（覆盖 左 / 左 / 后 / 右 + 全部 4 种朝向 E / N / W / S） ===== */
var POS_CENTER = new THREE.Vector3(-0.45, 0.01, -0.04);
var POS_NORTH  = new THREE.Vector3(-0.45, 0.01, -1.25);
var POS_WEST   = new THREE.Vector3(-2.35, 0.01, -1.25);

var POS_FLAG   = new THREE.Vector3(1.45,  0.74, 2.52);

/* ===== 状态机 ===== */
var resetGen = 0;
var found = {}, stamps = { s1: false, s2: false, s3: false };
var celebrated = false, demo = false;
var curGuideSpeech = '';
// step: 0=待点太阳定东, 1=面东去北教学楼(左), 2=面北去西花坛(左), 3=面西去东侧路口(后), 4=面东去南登楼夺旗(右), 5=通关自由探索！
var step = 0;
var facing = 'S'; // 开场面朝南看观众；点太阳后立即转向面朝东('E')
var heroPos = POS_CENTER.clone();
var heroTarget = POS_CENTER.clone();
var heroYaw = GEO_INFO.S.yaw;
var heroTargetYaw = GEO_INFO.S.yaw;
var armsOut = false;
var flagPicked = false;
var wrongStreak = 0;
var heroShakeT = 0;
var onSecondFloor = false;

var popTimer = 0, popWorld = new THREE.Vector3();
function showPop(worldV, text, cls) {

function syncOrientBadge(doPop) {
  var badge = $('#orientBadge');
  if (step === 0) {
    badge.classList.remove('show');
    return;
  }
  var m = REL_MAP[facing];

  $('#obHead').textContent = '🧭 当前面朝【' + g.full + '】';
  $('#obF').textContent = GEO_INFO[m.front].char;
  $('#obB').textContent = GEO_INFO[m.back].char;
  $('#obL').textContent = GEO_INFO[m.left].char;
  $('#obR').textContent = GEO_INFO[m.right].char;
  badge.classList.add('show');
  if (doPop) {
    badge.classList.remove('pop');
    void badge.offsetWidth;
    badge.classList.add('pop');
  }
}

function addDiscovery(key, stampKey, html, spoken) {
  if (!found[key]) {
    found[key] = true;
    var el = document.createElement('div');
    el.className = 'stk';
    el.innerHTML = html;
    $('#ntList').prepend(el);
    $('#ntCnt').textContent = Object.keys(found).length;
  }
  if (stampKey && !stamps[stampKey]) {
    stamps[stampKey] = true;
    var sEl = $('#' + stampKey.replace('s', 'st'));
    if (sEl) sEl.classList.add('lit');
    playTone('ding');
  }
  if (!demo && !celebrated && stamps.s1 && stamps.s2 && stamps.s3) {
    celebrated = true;
    saveProgress(LESSON_ID, true);
    playTone('win');
    launchConfetti();
    $('#winToast').classList.add('show');
    speak('太棒啦！小红旗顺利夺得啦！太阳从东方升起，东西南北固定不变，转身时身体的前后左右会跟着一起变化！关掉弹窗还能继续自由走动体验哦！', true);
    updateGuide(false);
    return;
  }
  updateGuide(false);
  if (spoken && !demo) speak(spoken);
}

function syncStageVisuals() {
  var showCompass = (step >= 1);
  geoRingGroup.visible = showCompass;
  bodyPadsGroup.visible = showCompass;

  Object.keys(questMarkers).forEach(function (k) {
    questMarkers[k].grp.visible = (Number(k) === step);
  });

}

function updateGuide(speakIt) {
  var bar = $('#guideBar');
  if (step === 0) {
    $('#guideIco').textContent = '☀️';
    curGuideSpeech = '第1步：清晨太阳在东边！点天空中的大太阳，面向东方认清前、后、左、右吧！';
  } else if (step === 1) {
    $('#guideIco').textContent = '🏫';
    curGuideSpeech = '挑战1：你现在面向东边太阳，北面的教学楼在你的哪一边？点脚边【前/后/左/右】踏板！';
  } else if (step === 2) {
    $('#guideIco').textContent = '🌺';
    curGuideSpeech = '挑战2：你已转身面向北面啦！西面的花坛在你的哪一边？点对应的【前/后/左/右】踏板！';
  } else if (step === 3) {
    $('#guideIco').textContent = '🧭';
    curGuideSpeech = '挑战3：现在你背对太阳面向西面！东面的楼梯路口在你的哪一边？点【前/后/左/右】踏板！';
  } else if (step === 4) {
    $('#guideIco').textContent = '🚩';
    curGuideSpeech = '挑战4：现在又面向东边太阳啦！南面的图书馆二楼红旗在你的哪一边？点【前/后/左/右】或楼梯夺旗！';
  } else {
    $('#guideIco').textContent = '🌟';
    curGuideSpeech = '自由探索模式：继续点【前/后/左/右】踏板、大太阳或金色楼梯，随时观察转身后的方向变化！';
  }
  $('#guideTxt').textContent = curGuideSpeech;
  bar.classList.remove('bump');
  void bar.offsetWidth;
  bar.classList.add('bump');

}

function setHeroFacing(newFace) {
  facing = newFace;
  heroTargetYaw = GEO_INFO[newFace].yaw;
  syncOrientBadge(true);
}

/* 点天上大太阳：转身面向东方（太阳） */
function doSunAlign() {
  setHeroFacing('E');
  armsOut = true;
  Object.keys(signMeshes).forEach(function (k) {
    signMeshes[k].ring.material.opacity = 0.92;
    signMeshes[k].ring.material.color.set('#16a34a');
  });
  playTone('ding');

  if (step === 0) {
    step = 1;
    wrongStreak = 0;
    syncStageVisuals();
    showPop(new THREE.Vector3(2.15, 1.35, -0.55), '面朝东：前东 · 后西 · 左北 · 右南！', 'ok');
    addDiscovery(
      'align_sun', 's1',
      '☀️ 面向东边太阳：前东、后西、左北、右南',
      '面向东边的太阳啦！看脚下两层罗盘：前面是东，后面是西，左面是北，右面是南！现在请思考：北面的教学楼在你的哪一边？点脚边的前后左右踏板走过去吧！'
    );
    var g = resetGen;
    setTimeout(function () { if (g === resetGen) armsOut = false; }, 1600);
  } else {
    showPop(new THREE.Vector3(heroPos.x, heroPos.y + 1.32, heroPos.z), '转身面向太阳（东）：前东 后西 左北 右南！', 'ok');
    speak('转身面向东边的太阳啦！此时前面是东、后面是西、左面是北、右面是南！');
    var g2 = resetGen;
    setTimeout(function () { if (g2 === resetGen) armsOut = false; }, 1200);
  }
}

/* 自由探索模式下，100% 畅通可点击前/后/左/右踏板移动和转身！ */
function handleFreeExplore(rel) {
  var targetGeo = REL_MAP[facing][rel];
  var gInfo = GEO_INFO[targetGeo];
  setHeroFacing(targetGeo);
  var m = REL_MAP[targetGeo];

  if (onSecondFloor) {
    // 二楼平台活动范围：x in [-0.35, 1.55], z in [1.65, 2.50]
    var nx2 = heroTarget.x + gInfo.dx * 0.9;
    var nz2 = heroTarget.z + gInfo.dz * 0.65;
    if (nz2 < 1.95 && Math.abs(nx2 - 1.45) < 0.75) {
      // 顺着楼梯走下一楼！
      onSecondFloor = false;
      heroTarget.copy(POS_STAIR_FOOT);
      playTone('step');
      showPop(new THREE.Vector3(heroTarget.x, 1.2, heroTarget.z), '下楼梯回到一楼！面朝' + gInfo.char, 'ok');
      speak('顺着楼梯走下一楼啦！现在面向' + gInfo.char + '面：前' + GEO_INFO[m.front].char + '、后' + GEO_INFO[m.back].char + '、左' + GEO_INFO[m.left].char + '、右' + GEO_INFO[m.right].char + '！');
      return;
    }
    nx2 = Math.max(-0.25, Math.min(1.65, nx2));
    nz2 = Math.max(2.10, Math.min(2.85, nz2));
    heroTarget.set(nx2, 0.74, nz2);
    playTone('step');
    showPop(new THREE.Vector3(nx2, 1.95, nz2), '面朝' + gInfo.char + '：前' + GEO_INFO[m.front].char + ' 后' + GEO_INFO[m.back].char + ' 左' + GEO_INFO[m.left].char + ' 右' + GEO_INFO[m.right].char, 'ok');
    speak('现在在二楼面向' + gInfo.char + '面！前面是' + GEO_INFO[m.front].char + '，后面是' + GEO_INFO[m.back].char + '，左面是' + GEO_INFO[m.left].char + '，右面是' + GEO_INFO[m.right].char + '！');
    return;
  }

  // 一楼校园自由移动范围（避开南北建筑墙体，靠近楼梯口向南可自动上楼！）
  var nx = heroTarget.x + gInfo.dx * 1.15;
  var nz = heroTarget.z + gInfo.dz * 1.15;
  if (targetGeo === 'S' && heroTarget.z > -0.1 && Math.abs(heroTarget.x - 1.45) < 0.85) {
    onSecondFloor = true;
    heroTarget.copy(POS_FLAG);
    playTone('step');
    showPop(new THREE.Vector3(POS_FLAG.x, 1.95, POS_FLAG.z), '登上二楼！面朝南：前南 后北 左东 右西', 'ok');
    speak('沿着金色楼梯走上二楼啦！现在面向南面：前南、后北、左东、右西！');
    return;
  }
  var clampedX = Math.max(-2.60, Math.min(2.35, nx));
  var clampedZ = Math.max(-1.45, Math.min(1.05, nz));
  var hitWall = (Math.abs(clampedX - nx) > 0.05 || Math.abs(clampedZ - nz) > 0.05);
  heroTarget.set(clampedX, 0.01, clampedZ);
  playTone('step');
  var summary = '面朝' + gInfo.char + '：前' + GEO_INFO[m.front].char + ' 后' + GEO_INFO[m.back].char + ' 左' + GEO_INFO[m.left].char + ' 右' + GEO_INFO[m.right].char;
  showPop(new THREE.Vector3(clampedX, 1.25, clampedZ), hitWall ? ('到边啦！' + summary) : summary, 'ok');
  speak('转向面向' + gInfo.char + '面啦！现在前' + GEO_INFO[m.front].char + '、后' + GEO_INFO[m.back].char + '、左' + GEO_INFO[m.left].char + '、右' + GEO_INFO[m.right].char + '！');
}

/* 闯关期：根据当前朝向判断孩子选的【前/后/左/右】对应的地理方向是否正确 */
function getExpectedGoalGeo() {
  if (step === 1) return 'N'; // 去北面教学楼
  if (step === 2) return 'W'; // 去西面花坛
  if (step === 3) return 'E'; // 去东面楼梯口
  if (step === 4) return 'S'; // 去南面二楼夺旗
  return null;
}

function getExpectedRelKey() {
  var goalGeo = getExpectedGoalGeo();
  if (!goalGeo) return null;
  var m = REL_MAP[facing];
  for (var k in m) { if (m[k] === goalGeo) return k; }
  return null;
}

function handleBodyPadClick(rel) {
  if (step === 0) {
    doSunAlign();
    return;
  }
  if (step >= 5) {
    handleFreeExplore(rel);
    return;
  }
  var chosenGeo = REL_MAP[facing][rel];
  var goalGeo = getExpectedGoalGeo();
  var needRel = getExpectedRelKey();

  if (chosenGeo !== goalGeo) {
    wrongStreak++;
    heroShakeT = 0.42;
    playTone('bump');
    var tipTxt = '那是你的' + REL_CN[rel] + '面（' + GEO_INFO[chosenGeo].char + '边）哦！面向' + GEO_INFO[facing].char + '时，' + REL_CN[needRel] + '面才是' + GEO_INFO[goalGeo].char + '！';
    showPop(new THREE.Vector3(heroPos.x, heroPos.y + 1.32, heroPos.z), '那是' + REL_CN[rel] + '面（' + GEO_INFO[chosenGeo].char + '），再想想！', 'warm');
    speak(tipTxt);
    return;
  }

  // 答对了！小人转身面向该地理方向并走过去，同时内圈罗盘随转身实时旋转！
  wrongStreak = 0;
  setHeroFacing(goalGeo);
  playTone('step');
  var nm = REL_MAP[goalGeo];

  if (step === 1) {
    step = 2;
    heroTarget.copy(POS_NORTH);
    syncStageVisuals();
    showPop(new THREE.Vector3(POS_NORTH.x, 1.32, POS_NORTH.z), '答对啦！转身面朝北：前北 后南 左西 右东', 'ok');
    addDiscovery(
      'c1_north', null,
      '🏫 面朝东时左面是北：到达北面教学楼',
      '答对啦！面向东时左面就是北！现在小同学转身面向北面啦，看脚下罗盘变成前北、后南、左西、右东！下一关：西面的花坛在你的哪一边？'
    );
  } else if (step === 2) {
    step = 3;
    heroTarget.copy(POS_WEST);
    syncStageVisuals();
    showPop(new THREE.Vector3(POS_WEST.x, 1.32, POS_WEST.z), '答对啦！转身面朝西：前西 后东 左南 右北', 'ok');
    addDiscovery(
      'c2_west', 's2',
      '🌺 面朝北时左面是西：到达西面花坛',
      '太聪明啦！面向北时左面变成西面啦！现在你背对太阳面向西面，脚下变成前西、后东、左南、右北！下一关：东面的楼梯路口在你的哪一边？'
    );
  } else if (step === 3) {
    step = 4;
    heroTarget.copy(POS_EAST);
    syncStageVisuals();
    showPop(new THREE.Vector3(POS_EAST.x, 1.32, POS_EAST.z), '答对啦！向后转面朝东：前东 后西 左北 右南', 'ok');
    addDiscovery(
      'c3_east', null,
      '🧭 面朝西时后面是东：回到太阳一侧东路口',
      '棒极了！背对太阳面向西时，东面就在你的后面！现在小同学转身又面向东边太阳啦！最后一关：南面的图书馆二楼红旗在你的哪一边？点对应踏板或金色楼梯夺旗吧！'
    );
  } else if (step === 4) {
    step = 5;
    onSecondFloor = true;
    flagPicked = true;
    heroTarget.copy(POS_FLAG);
    redFlag.position.set(POS_FLAG.x + 0.18, POS_FLAG.y + 0.62, POS_FLAG.z);
    syncStageVisuals();
    showPop(new THREE.Vector3(POS_FLAG.x, 1.98, POS_FLAG.z), '🎉 登楼夺得小红旗！面朝南：前南 后北 左东 右西', 'ok');
    addDiscovery(
      'c4_flag', 's3',
      '🚩 面朝东时右面是南：登上二楼夺得小红旗！',
      '耶！面向东时右面就是南，成功登上图书馆二楼夺得小红旗啦！'
    );
  }
}

function handleStairsClick() {
  if (step === 0) {
    showPop(new THREE.Vector3(1.45, 1.2, 1.0), '先点天空大太阳定东方哦！', 'warm');
    speak('先点天空中的大太阳面向东方辨认方向，再来闯关登楼夺红旗吧！');
    return;
  }
  if (step === 4) {
    var needRel = getExpectedRelKey();
    handleBodyPadClick(needRel || 'right');
    return;
  }
  if (step >= 5) {
    if (onSecondFloor) {
      onSecondFloor = false;
      setHeroFacing('N');
      heroTarget.copy(POS_STAIR_FOOT);
      playTone('step');
      showPop(new THREE.Vector3(POS_STAIR_FOOT.x, 1.25, POS_STAIR_FOOT.z), '下楼回到一楼！面朝北', 'ok');
      speak('走下楼梯回到一楼啦！现在面向北面：前北、后南、左西、右东！');
    } else {
      onSecondFloor = true;
      setHeroFacing('S');
      heroTarget.copy(POS_FLAG);
      playTone('step');
      showPop(new THREE.Vector3(POS_FLAG.x, 1.95, POS_FLAG.z), '上楼到达二楼平台！面朝南', 'ok');
      speak('走上金色楼梯来到二楼平台啦！现在面向南面：前南、后北、左东、右西！');
    }
    return;
  }
  showPop(new THREE.Vector3(1.45, 1.2, 1.0), '先完成前面的校园线索哦！', 'warm');
  updateGuide(true);
}

/* ===== 重置与演示 ===== */
function resetAll() {
  resetGen++;
  demo = false;
  stopVoice();
  $('#demoBtn').classList.remove('on');
  found = {};
  stamps = { s1: false, s2: false, s3: false };
  celebrated = false;
  step = 0;
  wrongStreak = 0;
  heroShakeT = 0;
  onSecondFloor = false;
  facing = 'S';
  armsOut = false;
  flagPicked = false;
  redFlag.position.copy(FLAG_HOME);
  heroPos.copy(POS_CENTER);
  heroTarget.copy(POS_CENTER);
  heroYaw = GEO_INFO.S.yaw;
  heroTargetYaw = GEO_INFO.S.yaw;
  Object.keys(signMeshes).forEach(function (k) {
    signMeshes[k].ring.material.opacity = 0.45;
    signMeshes[k].ring.material.color.set('#facc15');
  });
  syncStageVisuals();
  $('#popTag').className = 'tag3d';
  $('#ntList').innerHTML = ''; $('#ntCnt').textContent = '0';
  document.querySelectorAll('.st').forEach(function (s) { s.classList.remove('lit'); });
  $('#winToast').classList.remove('show');
  $('#qFb').textContent = '';
  document.querySelectorAll('.qopt').forEach(function (b) { b.classList.remove('ok', 'bad'); });
  updateGuide(false);
}

function startDemo() {
  markInteracted();
  if (demo) { resetAll(); return; }
  resetAll();
  demo = true;
  $('#demoBtn').classList.add('on');
  var g = resetGen;
  function at(ms, fn) { setTimeout(function () { if (g !== resetGen || !demo) return; fn(); }, ms); }
  speak('开始演示！先点太阳面向东，看脚下前后左右如何随转身变化，依次用左、左、后、右推理夺得小红旗！', true);
  at(900,  function () { doSunAlign(); });
  at(2500, function () { handleBodyPadClick('left'); });
  at(4100, function () { handleBodyPadClick('left'); });
  at(5700, function () { handleBodyPadClick('back'); });
  at(7300, function () { handleBodyPadClick('right'); });
  at(9400, function () {
    demo = false;
    $('#demoBtn').classList.remove('on');
    resetAll();
    speak('演示结束啦！现在轮到你点大太阳，体验转身辨方向闯关吧！', true);
  });
}

/* ===== 交互拾取 ===== */
function markInteracted() { document.body.classList.add('interacted'); }

var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pickScene(e) {
  var r = cv.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);

  // 1) 优先拾取小人脚边 4 个身体方向踏板（前/后/左/右）
  if (bodyPadsGroup.visible) {
    var hPad = ray.intersectObjects(bodyPadPickMeshes, false);
    if (hPad.length) return hPad[0].object.userData;
  }
  // 2) 优先拾取 3D 发光楼梯
  var hSt = ray.intersectObjects(stairPickMeshes, false);
  if (hSt.length) return hSt[0].object.userData;
  // 3) 场景其他可点物体
  var hits = ray.intersectObjects(clickables, true);
  if (hits.length) return hits[0].object.userData;
  return null;
}

cv.addEventListener('pointermove', function (e) {
  var d = pickScene(e);
  hoveredRelKey = (d && d.kind === 'bodyPad') ? d.rel : null;
  cv.style.cursor = d ? 'pointer' : 'default';
});

cv.addEventListener('pointerdown', function (e) {
  markInteracted();
  if (demo) return;
  var d = pickScene(e);
  if (!d) return;

  if (d.kind === 'bodyPad') {
    handleBodyPadClick(d.rel);
  } else if (d.kind === 'stairs') {
    handleStairsClick();
  } else if (d.kind === 'sun') {
    doSunAlign();
  } else if (d.kind === 'hero') {
    if (step === 0) doSunAlign();
    else {
      // 自由模式点小人顺时针原地转 90°，实时观察前/后/左/右变化！
      var order = ['E', 'S', 'W', 'N'];
      var nextF = order[(order.indexOf(facing) + 1) % 4];
      if (step >= 5) {
        setHeroFacing(nextF);
        playTone('step');
        var m = REL_MAP[nextF];
        showPop(new THREE.Vector3(heroPos.x, heroPos.y + 1.3, heroPos.z), '原地转身面朝' + GEO_INFO[nextF].char + '！', 'ok');
        speak('原地转身面向' + GEO_INFO[nextF].char + '面啦！现在前' + GEO_INFO[m.front].char + '、后' + GEO_INFO[m.back].char + '、左' + GEO_INFO[m.left].char + '、右' + GEO_INFO[m.right].char + '！');
      } else {
        updateGuide(true);
      }
    }
  } else if (d.kind === 'flag') {
    if (step === 4) handleStairsClick();
    else if (step >= 5) {
      showPop(new THREE.Vector3(redFlag.position.x, redFlag.position.y + 0.8, redFlag.position.z), '红旗已经夺到手啦！', 'ok');
      speak('小红旗已经夺到手啦！继续点脚边前后左右踏板自由探索方向变化吧！');
    } else {
      showPop(new THREE.Vector3(FLAG_HOME.x, 1.5, FLAG_HOME.z), '先一步步完成前面的方位挑战哦！', 'warm');
      updateGuide(true);
    }
  } else if (d.kind === 'sign') {
    var msgs = {
      N: '北面固定不变，这里是北面教学楼！',
      S: '南面固定不变，这里是南面两层图书馆！',
      E: '东面固定不变，清晨太阳从东边升起！',
      W: '西面固定不变，和东面正相对，西侧有阳光花坛！'
    };
    showPop(new THREE.Vector3(signMeshes[d.key].def.x, 1.18, signMeshes[d.key].def.z), '固定地理方向：' + d.char, 'ok');
    speak(msgs[d.key]);
  } else if (d.kind === 'gate') {
    showPop(new THREE.Vector3(3.1, 1.3, -0.1), '校园东门（太阳升起的方向）', 'ok');
    speak('这里是校园东门，太阳从东边升起！');
  } else if (d.kind === 'building') {
    var bMsg = d.id === 'teaching' ? '这是校园正北面的教学楼！' : (d.id === 'garden' ? '这是校园西面的阳光花坛！' : '这是校园南面的两层图书馆，东侧有金色楼梯上二楼！');
    speak(bMsg);
  } else if (d.kind === 'tree') {
    speak('校园里的小树固定不动，东、南、西、北也固定不变哦！');
  }
});

$('#voiceBtn').addEventListener('click', function () {
  markInteracted();
  voiceOn = !voiceOn;
  this.classList.toggle('on', voiceOn);
  if (voiceOn) updateGuide(true); else stopVoice();
});
$('#demoBtn').addEventListener('click', startDemo);
$('#guideBar').addEventListener('click', function () { markInteracted(); updateGuide(true); });
$('#resetBtn').addEventListener('click', function () { markInteracted(); resetAll(); });
$('#pyBtn').addEventListener('click', function () { markInteracted(); document.body.classList.toggle('no-py'); });
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
$('#winKeepBtn').addEventListener('click', function () {
  $('#winToast').classList.remove('show');
  updateGuide(false);
  speak('进入自由探索模式啦！点小人脚边的前后左右踏板、太阳或楼梯，自由转身观察方向变化吧！');
});
$('#winAgainBtn').addEventListener('click', resetAll);
$('#qOpts').addEventListener('click', function (e) {
  var b = e.target.closest('.qopt');
  if (!b) return;
  if (b.dataset.ok === '1') {
    b.classList.add('ok');
    $('#qFb').textContent = '🌸 答对啦！获得本课小红花！';
    saveProgress(LESSON_ID, true);
    playTone('win');
    speak('答对啦！面向东方升起的太阳时，左手边是北方，获得本课小红花！', true);
  } else {
    b.classList.add('bad');
    var h = b.dataset.hint || '再想想哦！';
    $('#qFb').textContent = h;
    speak(h, true);
  }
});

/* ===== 投影与帧循环 ===== */
function projectToScreen(v) {
  var p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * window.innerWidth, y: (-p.y * 0.5 + 0.5) * window.innerHeight };
}

var introT0 = performance.now(), lastT = performance.now();
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  cfCv.width = w; cfCv.height = h;
}
window.addEventListener('resize', fit);
fit();

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (now - lastT) / 1000));
  lastT = now;
  var t = now * 0.001;

  var pop = Math.min(1, (performance.now() - introT0) / 700);
  var ease = 1 - Math.pow(1 - pop, 3);
  live.scale.setScalar(0.01 + 0.99 * ease);

  // 东方大太阳动画
  sunRays.rotation.z = t * 0.7;
  sunGlow.scale.setScalar(1 + Math.sin(t * 3) * 0.08);
  sunPulseRing.visible = (step === 0);
  sunPulseRing.scale.setScalar(1.0 + Math.sin(t * 4.5) * 0.14);
  sunPulseRing.lookAt(camera.position);

  // 主角移动、平滑转身、轻微摇头纠错反馈、双臂伸平动画
  var dist = heroPos.distanceTo(heroTarget);
  if (dist > 0.02) {
    heroPos.lerp(heroTarget, Math.min(1, dt * 6.5));
    hero.position.set(heroPos.x, heroPos.y + Math.abs(Math.sin(t * 15)) * 0.08, heroPos.z);
  } else {
    heroPos.copy(heroTarget);
    hero.position.copy(heroPos);
  }
  var dy = heroTargetYaw - heroYaw;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  heroYaw += dy * Math.min(1, dt * 10);

  var shakeYaw = 0;
  if (heroShakeT > 0) {
    heroShakeT = Math.max(0, heroShakeT - dt);
    shakeYaw = Math.sin(heroShakeT * 36) * 0.35;
  }
  hero.rotation.y = heroYaw + shakeYaw;

  var armGoal = armsOut ? 1.52 : 0.14;
  armLPiv.rotation.z += (-armGoal - armLPiv.rotation.z) * Math.min(1, dt * 10);
  armRPiv.rotation.z += (armGoal - armRPiv.rotation.z) * Math.min(1, dt * 10);

  // 两层联动罗盘跟随主角位置；外圈固定不转，内圈随小人朝向实时同步旋转！
  geoRingGroup.position.set(heroPos.x, heroPos.y + 0.02, heroPos.z);
  bodyPadsGroup.position.set(heroPos.x, heroPos.y + 0.022, heroPos.z);
  bodyPadsGroup.rotation.y = heroYaw;

  var hintRel = (wrongStreak >= 2) ? getExpectedRelKey() : null;
  bodyPads.forEach(function (bp) {
    // 精准抵消旋转让汉字永远 100% 端正面向屏幕，同时踏板位置与立体箭头忠实跟着身体旋转！
    bp.labelWrap.rotation.y = -heroYaw;
    var isHov = (hoveredRelKey === bp.def.key);
    var isHint = (hintRel === bp.def.key);
    var sc = isHov ? 1.22 : (isHint ? (1.14 + Math.sin(t * 6.5) * 0.12) : 1.0);
    bp.grp.scale.setScalar(sc);
    bp.halo.material.opacity = isHint ? (0.65 + Math.sin(t * 6.5) * 0.35) : (isHov ? 0.95 : 0.48);
    bp.tip.position.y = isHint ? (0.05 + Math.sin(t * 6.5) * 0.04) : 0.01;
  });

  // 线索星标呼吸旋转
  Object.keys(questMarkers).forEach(function (k) {
    var qm = questMarkers[k];
    if (qm.grp.visible) {
      qm.gem.rotation.y = t * 2.2;
      qm.gem.position.y = 0.56 + Math.sin(t * 4) * 0.08;
      qm.beam.rotation.y = t * 1.4;
      qm.ring.scale.setScalar(0.95 + Math.sin(t * 5) * 0.14);
    }
  });

  // 3D 楼梯呼吸发光
  if (step === 4) {
    stairGlow.material.opacity = 0.22 + Math.sin(t * 6) * 0.16;
  } else {
    stairGlow.material.opacity = 0;
  }

  // 小红旗飘动
  fcloth.rotation.y = Math.sin(t * 4.5) * 0.15;
  flagRing.visible = !flagPicked;
  flagRing.scale.setScalar(0.96 + Math.sin(t * 4.5) * 0.15);

  // 单焦点聚焦提示 #targetCue（闯关期指向目标地标激发思考，绝不偷标答案踏板！）
  var cueEl = $('#targetCue');
  var notesRect = $('#notes').getBoundingClientRect();
  function placeCueSafe(sx, sy, txt) {
    cueEl.textContent = txt;
    var x = Math.max(105, Math.min(window.innerWidth - 110, sx));
    var y = Math.max(82, Math.min(window.innerHeight - 56, sy));
    if (x + 100 > notesRect.left && y - 34 < notesRect.bottom + 8) {
      x = Math.min(x, notesRect.left - 110);
    }
    cueEl.style.left = x + 'px';
    cueEl.style.top = y + 'px';
    cueEl.classList.add('show');
  }

  if (demo) {
    cueEl.classList.remove('show');
  } else if (step === 0) {
    var sp0 = projectToScreen(sunGrp.position.clone().add(live.position).add(new THREE.Vector3(0, 0.72, 0)));
    placeCueSafe(sp0.x, sp0.y, '👆 点大太阳定东方');
  } else if (step === 1) {
    var sp1 = projectToScreen(new THREE.Vector3(POS_NORTH.x, 1.05, POS_NORTH.z).add(live.position));
    placeCueSafe(sp1.x, sp1.y, '🎯 目标：北面教学楼（在你的哪边？）');
  } else if (step === 2) {
    var sp2 = projectToScreen(new THREE.Vector3(POS_WEST.x, 1.05, POS_WEST.z).add(live.position));
    placeCueSafe(sp2.x, sp2.y, '🎯 目标：西面花坛（在你的哪边？）');
  } else if (step === 3) {
    var sp3 = projectToScreen(new THREE.Vector3(POS_EAST.x, 1.05, POS_EAST.z).add(live.position));
    placeCueSafe(sp3.x, sp3.y, '🎯 目标：东面路口（在你的哪边？）');
  } else if (step === 4) {
    var sp4 = projectToScreen(new THREE.Vector3(POS_FLAG.x, 1.80, POS_FLAG.z).add(live.position));
    placeCueSafe(sp4.x, sp4.y, '🎯 目标：南面二楼红旗（在你的哪边？）');
  } else {
    cueEl.classList.remove('show');
  }

  // 弹窗浮标
  if (popTimer > 0) {
    popTimer -= dt;
    var pp = projectToScreen(popWorld);
    $('#popTag').style.left = Math.max(120, Math.min(window.innerWidth - 120, pp.x)) + 'px';
    $('#popTag').style.top = Math.max(76, pp.y) + 'px';
    if (popTimer <= 0) $('#popTag').classList.remove('show');
  }

  tickConfetti(dt);
  renderer.render(scene, camera);
}

window.__lesson = {
  pyErrors: pyErrors,
  info: function () {
    return {
      triangles: renderer.info.render.triangles,
      celebrated: celebrated,
      step: step,
      facing: facing,
      onSecondFloor: onSecondFloor,
      heroPos: { x: +heroPos.x.toFixed(2), y: +heroPos.y.toFixed(2), z: +heroPos.z.toFixed(2) },
      relMap: REL_MAP[facing]
    };
  },
  screenTargets: function () {
    var out = {
      sun: projectToScreen(sunGrp.position.clone().add(live.position)),
      stairs: projectToScreen(new THREE.Vector3(1.45, 0.55, 1.65).add(live.position)),
      flag: projectToScreen(redFlag.position.clone().add(live.position)),
      pads: {}
    };
    bodyPads.forEach(function (bp) {
      var wp = new THREE.Vector3();
      bp.grp.getWorldPosition(wp);
      wp.y += 0.12;
      out.pads[bp.def.key] = projectToScreen(wp);
    });
    return out;
  },
  startDemo: startDemo,
  resetAll: resetAll
};

syncStageVisuals();
updateGuide(false);
requestAnimationFrame(frame);
})();
</script>

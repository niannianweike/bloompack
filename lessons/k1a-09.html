<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第9课 观察天气 · 校园气象观测站（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:7;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#b23a36;color:#fff;box-shadow:0 3px 0 #b23a36}
.tbtn.attn{animation:btnGlow 1.5s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 3px 0 #b23a36,0 0 0 0 rgba(217,83,79,.45)}50%{box-shadow:0 3px 0 #b23a36,0 0 0 8px rgba(217,83,79,0)}}
.tbtn:not(.on).attn{animation:btnGlowWarm 1.6s ease-in-out infinite}
@keyframes btnGlowWarm{0%,100%{box-shadow:0 3px 0 #e2d2b5,0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 3px 0 #e2d2b5,0 0 0 8px rgba(245,158,11,0)}}
.btn-cue{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:2px 8px;border-radius:99px;background:#f59e0b;color:#fff;font-size:11px;font-weight:800;line-height:1.4;
  box-shadow:0 4px 10px rgba(180,90,0,.25);transition:opacity .35s,transform .35s;animation:cueBob 1.5s ease-in-out infinite}
.btn-cue::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#f59e0b}
.btn-cue.red{background:#d9534f;box-shadow:0 4px 10px rgba(178,58,54,.25)}
.btn-cue.red::before{border-bottom-color:#d9534f}
@keyframes cueBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(3px)}}
body.cues-off .btn-cue{opacity:0;animation:none;transform:translateX(-50%) translateY(-4px)}
body.cues-off .tbtn.attn{animation:none}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(460px,calc(100vw - 540px));padding:7px 15px;border-radius:99px;
  background:rgba(255,250,240,.96);border:2px solid var(--accent);box-shadow:0 6px 18px rgba(217,83,79,.16);
  display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;line-height:1.45;color:var(--ink);cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s}
#guideBar:hover{transform:translateX(-50%) translateY(-1px)}
#guideBar .g-ico{font-size:17px;flex:none}
#guideBar .g-txt{overflow:hidden;text-overflow:ellipsis}
#guideBar.done{border-color:#16a34a;background:#f0fdf4;color:#166534}
@media (max-width:1220px){
  #guideBar{top:64px;max-width:min(480px,calc(100vw - 260px));left:14px;transform:none}
  #guideBar:hover{transform:translateY(-1px)}
}

#notes{position:fixed;right:14px;top:86px;z-index:4;width:230px;max-height:calc(100% - 220px);overflow:hidden;
  padding:9px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:opacity .3s,top .3s}
body.cues-off #notes{top:64px;max-height:calc(100% - 200px)}
.nt-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:6px;gap:6px}
.nt-r{display:flex;align-items:center;gap:6px}
.nt-tgl{height:24px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;font-weight:800;color:#6e5e46;cursor:pointer}
.nt-tgl:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed .stamps,#notes.collapsed #ntList{display:none}
#notes.collapsed .nt-head{margin-bottom:0}
.stamps{display:flex;gap:4px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:9px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:12px;font-weight:800;line-height:1.45}
.stamp.lit{border-style:solid;border-color:#d9534f;background:#fff0ef;color:#b23a36;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:152px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #e6dcc8;
  font-size:15px;font-weight:800;line-height:1.65;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
.stk b{color:#b23a36}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;display:none;flex-direction:column;align-items:center;gap:10px;
  padding:18px 20px;border-radius:22px;background:rgba(255,250,240,.98);border:2.5px solid var(--accent);
  box-shadow:0 16px 40px rgba(42,48,64,.28);text-align:center;width:min(450px,92vw);max-height:85vh;overflow-y:auto}
#winToast.show{display:flex;animation:popCenter .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popCenter{0%{transform:translate(-50%,-50%) scale(.72);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#winToast .medal{font-size:40px;line-height:1}
#winToast .wmsg{font-size:18px;font-weight:900;line-height:1.6;color:var(--ink)}
.concl-box{width:100%;text-align:left;padding:10px 13px;border-radius:14px;background:#fff2f0;border:1.5px solid #f4a9a5;font-size:14px;line-height:1.65;color:#4a2525}
.concl-box .cb-ttl{font-weight:900;color:#b23a36;margin-bottom:3px;font-size:14px}
.quiz-box{width:100%;text-align:left;padding:10px 13px;border-radius:14px;background:#fff8eb;border:1.5px solid #f3c98b}
.quiz-box .qz-ttl{font-size:14px;font-weight:900;color:#b45309;margin-bottom:5px}
.quiz-box .qz-q{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.qopt{width:100%;text-align:left;padding:8px 12px;border-radius:11px;border:1.5px solid #e5d4b3;background:#fff;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.qopt:hover:not(:disabled){border-color:var(--accent);background:#fff5f4;transform:translateX(2px)}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.qopt.no{border-color:#f59e0b;background:#fef3c7;color:#92400e}
.quiz-fb{margin-top:7px;font-size:13px;font-weight:800;line-height:1.5;min-height:18px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.no{color:#b45309}
#winToast .wacts{display:flex;gap:10px;margin-top:2px}
#winToast .wact{height:38px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e2d2b5}
#winToast .wact.pri{background:var(--accent);border-color:#b23a36;color:#fff;box-shadow:0 2px 0 #b23a36}

/* 一键天气情景组合（四仪器联动） */
#combos{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:99px;background:rgba(255,250,240,.95);border:1.5px solid #e4c9a0;
  box-shadow:0 6px 18px rgba(80,55,20,.14);max-width:calc(100vw - 24px)}
.cb-lbl{font-size:12px;font-weight:900;color:#8a6d4a;white-space:nowrap;padding:0 2px 0 4px}
.cbtn{position:relative;display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;border:1.5px solid #e6d8be;
  background:#fff;font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 0 #e6d8be;transition:transform .14s,border-color .14s,background .14s}
.cbtn:hover{border-color:#d9534f;transform:translateY(-1px)}
.cbtn.on{background:#d9534f;border-color:#b23a36;color:#fff;box-shadow:0 2px 0 #b23a36}
.cbtn.on .cdeg{background:rgba(255,255,255,.22);color:#fff}
.cdeg{font-size:11px;font-weight:900;padding:1px 5px;border-radius:99px;background:#f5ead6;color:#7a5f3c}
.cbtn.done-dot::after{content:"✓";position:absolute;top:-5px;right:-3px;width:15px;height:15px;border-radius:50%;
  background:#16a34a;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.cbtn.guide-pulse,.ictrl.guide-pulse{border-color:#f59e0b;animation:wPulse 1.25s ease-in-out infinite}
@keyframes wPulse{0%,100%{box-shadow:0 2px 0 #e6d8be,0 0 0 0 rgba(245,158,11,.65)}50%{box-shadow:0 3px 0 #e6d8be,0 0 0 8px rgba(245,158,11,0)}}

/* 4 气象仪器紧凑双向调节条 */
#panel{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;
  padding:5px 8px;border-radius:20px;background:rgba(255,250,240,.94);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.16)}
.ictrl{display:flex;align-items:center;gap:3px;padding:3px 5px;border-radius:14px;border:1.5px solid #e6d8be;
  background:#fff;box-shadow:0 2px 0 #e6d8be;white-space:nowrap}
.istep{width:24px;height:28px;border-radius:8px;border:1px solid #e6d8be;background:#faf4e8;
  font:inherit;font-size:16px;font-weight:900;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.istep:hover:not(:disabled){border-color:#d9534f;color:#d9534f;background:#fff}
.istep:disabled{opacity:.35;cursor:default}
.ibtn{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:10px;border:none;
  background:transparent;font:inherit;font-size:15px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;white-space:nowrap}
.ibtn:hover{color:#d9534f}
.ibtn svg{width:19px;height:19px;flex:none}
.dots{display:flex;gap:3px;margin-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#e2d5bd;display:block;transition:background .2s,transform .2s}
.dots i.on{background:#e56d17;transform:scale(1.18)}
.ictrl[data-k="rain"] .dots i.on{background:#0284c7}
.ictrl[data-k="cloud"] .dots i.on{background:#64748b}
.ictrl[data-k="temp"].cold .dots i.on{background:#2563eb}
.ictrl[data-k="temp"].warm .dots i.on{background:#16a34a}
.ictrl[data-k="temp"].hot .dots i.on{background:#dc2626}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12);white-space:nowrap}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:16px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:26px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#b23a36;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
.word.cool{color:#1d5fc0}
.word.warm{color:#d97706}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 8px 4px 4px;max-width:calc(100% - 226px)}
  .chip h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{display:none}
  .home{width:30px;height:30px;flex:none}
  .tools{right:8px;top:8px;gap:4px}.tbtn{height:32px;padding:0 8px;font-size:12px}
  .btn-cue{display:none}
  #guideBar{top:46px;left:8px;right:8px;max-width:none;transform:none;padding:5px 10px;font-size:12px}
  #notes,body.cues-off #notes{top:88px;bottom:auto;right:8px;left:auto;width:186px;max-height:110px;padding:6px 8px}
  #ntList{max-height:48px}
  .stk{font-size:12px}
  #combos{bottom:96px;gap:4px;padding:4px 6px;overflow-x:auto}
  .cb-lbl{display:none}
  .cbtn{padding:4px 8px;font-size:12px}.cdeg{display:none}
  #panel{bottom:46px;gap:3px;padding:4px 5px;max-width:calc(100% - 10px);overflow-x:auto}
  .ictrl{padding:2px 3px;gap:2px}
  .istep{width:20px;height:24px;font-size:14px}
  .ibtn{padding:2px 4px;font-size:12px;gap:3px}.ibtn svg{width:15px;height:15px}
  .dots i{width:5px;height:5px}
  #verbs{bottom:6px;gap:6px}.verb{font-size:12px;padding:3px 8px}.verb svg{width:15px;height:15px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<canvas id="confetti"></canvas>
<div id="winToast" role="status" aria-live="polite">
  <div class="medal">🏆</div>
  <div class="wmsg" id="winMsg"></div>
  <div class="concl-box">
    <div class="cb-ttl">✨ 科学小结论</div>
    <div>我们可以用红旗看风力、看天空分云量、用雨量筒测雨量、用温度计读冷暖；天气变化时，风、云、雨和温度常常会一起变化！</div>
  </div>
  <div class="quiz-box" id="quizBox">
    <div class="qz-ttl">💡 考考你 · 答对领小红花 🌸</div>
    <div class="qz-q">如果突然刮起大风、下起大雨，红旗和温度计通常会怎么变？</div>
    <div class="quiz-opts">
      <button class="qopt" data-ok="1" type="button">🚩 红旗平平飘起、🌡️ 温度下降</button>
      <button class="qopt" data-ok="0" data-hint="再想想哦～刮大风时红旗会被吹得平平飘起，下雨时气温通常会降低，不是升到 40° 呢！" type="button">🚩 红旗垂下不动、🌡️ 温度升到 40°</button>
      <button class="qopt" data-ok="0" data-hint="再想想哦～下大雨时天空会聚满厚厚的乌云，不是一朵云也没有哦！" type="button">☀️ 天空一朵云也没有</button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="wacts">
    <button class="wact" id="winClose" type="button">继续玩</button>
    <button class="wact pri" id="winReplay" type="button">再玩一次</button>
  </div>
</div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 34 页「校园气象观测站」</small></div>
</div>
<div id="guideBar" title="点击听当前步骤提示"><span class="g-ico" id="guideIco">🧭</span><span class="g-txt" id="guideTxt"></span></div>
<div class="tools">
  <button class="tbtn on attn" id="voiceBtn" type="button"><span id="voiceLbl">🔊 语音</span><span class="btn-cue red">点我听玩法</span></button>
  <button class="tbtn attn" id="demoBtn" type="button"><span id="demoLbl">▶ 演示</span><span class="btn-cue">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><span class="nt-r"><span id="ntCount" style="color:#b23a36">0</span><button class="nt-tgl" id="ntTgl" type="button">收起</button></span></div>
  <div class="stamps"><span class="stamp" data-k="w" id="stW"></span><span class="stamp" data-k="c" id="stC"></span><span class="stamp" data-k="r" id="stR"></span><span class="stamp" data-k="t" id="stT"></span></div>
  <div id="ntList"></div>
</aside>

<div id="combos">
  <span class="cb-lbl">一键天气组合:</span>
  <button class="cbtn" data-combo="breeze" type="button">☀️ 晴朗微风 <span class="cdeg">28°C</span></button>
  <button class="cbtn" data-combo="storm" type="button">⛈️ 狂风暴雨 <span class="cdeg">14°C</span></button>
  <button class="cbtn" data-combo="drizzle" type="button">🌦️ 阴凉小雨 <span class="cdeg">19°C</span></button>
  <button class="cbtn" data-combo="hot" type="button">🥵 闷热烈日 <span class="cdeg">36°C</span></button>
</div>

<div id="panel">
  <div class="ictrl" data-k="wind">
    <button class="istep" data-d="-1" type="button" title="减小">−</button>
    <button class="ibtn" data-k="wind" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#d9534f" stroke-width="2.2" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 5h12l-2.5 3.5L17 12H5"/></svg><span id="lbWind"></span><span class="dots"><i></i><i></i><i></i></span></button>
    <button class="istep" data-d="1" type="button" title="增大">+</button>
  </div>
  <div class="ictrl" data-k="cloud">
    <button class="istep" data-d="-1" type="button" title="减小">−</button>
    <button class="ibtn" data-k="cloud" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"><path d="M6 17h11a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 7 9.4 3.5 3.5 0 0 0 6 17z"/></svg><span id="lbCloud"></span><span class="dots"><i></i><i></i><i></i></span></button>
    <button class="istep" data-d="1" type="button" title="增大">+</button>
  </div>
  <div class="ictrl" data-k="rain">
    <button class="istep" data-d="-1" type="button" title="减小">−</button>
    <button class="ibtn" data-k="rain" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"><path d="M7 4h10l-1 16H8L7 4z"/><path d="M8 14h8"/></svg><span id="lbRain"></span><span class="dots"><i></i><i></i><i></i></span></button>

function fit() {
  var w = window.innerWidth, h = window.innerHeight;

  var tgt = new THREE.Vector3(portrait ? 0 : 0.95, 0.92, portrait ? 0 : 0);
  var dir = portrait ? new THREE.Vector3(0.1, 0.52, 0.85).normalize() : new THREE.Vector3(0, 0.54, 0.84).normalize();
  var needW = portrait ? 7.2 : 9.6, needH = portrait ? 9.4 : 6.9;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max(needW / 2 / Math.tan(hf / 2), needH / 2 / Math.tan(vf / 2) * 0.88);
  camera.position.copy(tgt).addScaledVector(dir, d);
  camera.lookAt(tgt);
  camera.updateProjectionMatrix();
}

      spoken = '下大雨啦' + linkedNote + '，雨量筒的水升高很多！';
      discover('r2', 'r', ruby('雨量筒水', 'yǔ liàng tǒng shuǐ') + '<b>' + ruby('升高', 'shēng gāo') + '</b>' + ruby('雨更大', 'yǔ gèng dà'), '#0369a1', spoken, true);
    }
  } else if (k === 'temp') {
    markAct('temp'); sTemp(val);
    if (val === 0) {
      floatWord('液柱降得好低真冷!', 'yè zhù jiàng de hǎo dī zhēn lěng', pos, 'cool');
      spoken = '温度计液柱降得很低，天气真冷！';
      discover('t0', 't', ruby('温度计液柱低', 'wēn dù jì yè zhù dī') + '<b>' + ruby('天冷', 'tiān lěng') + '</b>', '#2563eb', spoken, true);
    } else if (val === 1) {
      floatWord('不冷不热真舒服!', 'bù lěng bú rè zhēn shū fu', pos, 'warm');
      spoken = '温度不冷不热，真舒服！';
    } else {
      floatWord('液柱升得高好热!', 'yè zhù shēng de gāo hǎo rè', pos);
      spoken = '温度计液柱升得很高，天气好热！';
      discover('t2', 't', ruby('温度计液柱高', 'wēn dù jì yè zhù gāo') + '<b>' + ruby('天热', 'tiān rè') + '</b>', '#dc2626', spoken, true);
    }
  }
  updateGuide(false);
  checkComplete();
  if (spoken && !(!wasDone && celebrated)) speak(spoken);
}

document.querySelectorAll('.ibtn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio(); stopDemo(); introSkip(); ghost.off = true; guideHandT = 0;
    var k = btn.dataset.k;
    setMetric(k, (state[k] + 1) % 3, false);
  });
});
document.querySelectorAll('.istep').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio(); stopDemo(); introSkip(); ghost.off = true; guideHandT = 0;
    var k = btn.parentNode.dataset.k, d = parseInt(btn.dataset.d, 10);
    var next = Math.max(0, Math.min(2, state[k] + d));
    if (next !== state[k]) setMetric(k, next, false);
  });
});

/* ===================== 3D 直接点击仪器 ===================== */
var hoveredSt = null, now = 0;
var stMeshes = []; STATIONS.forEach(function (st) { st.g.traverse(function (o) { if (o.isMesh) stMeshes.push(o); }); });
function pickStation(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  var h = raycaster.intersectObjects(stMeshes, false)[0];
  return h ? h.object.userData.station : null;
}
canvas.addEventListener('pointermove', function (e) {
  hoveredSt = pickStation(e);
  canvas.style.cursor = hoveredSt ? 'pointer' : 'default';
});
canvas.addEventListener('pointerdown', function (e) {
  audio(); stopDemo(); introSkip();
  var st = pickStation(e);
  if (!st) { greetOnce(false); return; }
  ghost.off = true; guideHandT = 0;
  setMetric(st.id, (state[st.id] + 1) % 3, false);
});

/* ===================== 幽灵手（动态指向当前推荐组合或仪器） ===================== */
var ghost = { off: false, t: 0 }, handEl = $('#hand');
function updateGhost(dt) {
  if (guideHandT > 0) guideHandT = Math.max(0, guideHandT - dt);
  var show = (!ghost.off && intro.t >= 1.5) || guideHandT > 0;
  if (!show || celebrated) { handEl.style.opacity = 0; return; }
  ghost.t = (ghost.t + dt) % 2.1;
  var g = getNextGuide();
  var bob = Math.sin(ghost.t * Math.PI * 2 / 2.1) * 8;
  var el = g.targetCombo ? document.querySelector('.cbtn[data-combo="' + g.targetCombo + '"]')
         : g.targetCtrl ? document.querySelector('.ictrl[data-k="' + g.targetCtrl + '"]') : null;
  if (el) {
    var r = el.getBoundingClientRect();
    handEl.style.opacity = 0.96;
    handEl.style.transform = 'translate(' + (r.left + r.width / 2 - 20) + 'px,' + (r.top + r.height / 2 + 4 + bob) + 'px)';
  } else {
    handEl.style.opacity = 0;
  }
}

/* ===================== 老师演示 ===================== */
var demo = null;
var DEMO = [
  ['combo', 'storm', 2.8],
  ['combo', 'breeze', 2.6],
  ['set', 'temp', 2, 1.8],
  ['set', 'wind', 0, 1.8],
  ['end']
];
function startDemo() {
  dismissEntryCues();
  resetAll(true); demo = { i: 0, t: 0, started: false }; ghost.off = true; guideHandT = 0;
  $('#demoBtn').classList.add('on'); $('#demoLbl').textContent = '■ 停止';
}
function stopDemo() {
  if (!demo) return; demo = null;
  $('#demoBtn').classList.remove('on'); $('#demoLbl').textContent = '▶ 演示';
}
function stepDemo(dt) {
  if (!demo) return;
  var s = DEMO[demo.i]; demo.t += dt;
  if (!s || s[0] === 'end') { stopDemo(); return; }
  if (!demo.started) {
    demo.started = true;
    if (s[0] === 'combo') applyCombo(s[1], false);
    else setMetric(s[1], s[2], false);
  }
  if (demo.t >= (s[0] === 'combo' ? s[2] : s[3])) { demo.started = false; demo.i++; demo.t = 0; }
}

/* ===================== 开场动画 ===================== */
var intro = { t: 0, done: false };
function introSkip() { if (intro.t < 1.45) intro.t = 1.45; }
function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4);
  var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift;
  figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.01, backOut((t - 0.3) / 0.5)), 1);
  STATIONS.forEach(function (st, i) { st.g.scale.setScalar(Math.max(0.001, backOut((t - 0.5 - i * 0.08) / 0.5))); });
  if (t > 0.9 && t < 3.6) STATIONS.forEach(function (st) { st.introLbl = true; });
  if (t >= 3.6) {
    STATIONS.forEach(function (st) { st.introLbl = false; st.g.scale.setScalar(1); });
    board.scale.set(1, 1, 1); intro.done = true;
  }
}

/* ===================== 重来 ===================== */
function resetAll(keepDemo) {
  if (!keepDemo) stopDemo();
  state.wind = 0; state.cloud = 0; state.rain = 0; state.temp = 1;
  activeCombo = null; customTempH = null;
  syncPanelUI();
  labelsEl.querySelectorAll('.word').forEach(function (w) { w.remove(); });
  found = {}; foundN = 0; kinds = { w: false, c: false, r: false, t: false };
  triedCombos = {}; manualTweaks = 0;
  acted = { wind: false, cr: false, temp: false }; actions = 0;
  celebrated = false; completed = false; hideWinToast(); clearConfetti(); resetQuiz();
  $('#ntList').innerHTML = ''; $('#ntCount').textContent = '0';
  document.querySelectorAll('.stamp').forEach(function (s) { s.classList.remove('lit'); });
  document.querySelectorAll('.verb').forEach(function (v) { v.classList.remove('done'); });
  updateGuide(false);
}

/* ===================== 主循环 ===================== */
var last = performance.now(), cTmp = new THREE.Color();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  // 1. 红旗风力物理动画
  anim.wind += (state.wind - anim.wind) * dt * 4.5;
  var wv = anim.wind;
  // 无风：旗帜垂下 (-1.42 rad)；微风：斜飘 (-0.65 rad)；大风：平展 (0.04 rad)
  var rootAng = -1.42 + wv * 0.72;
  flagSegs.forEach(function (sg, idx) {
    if (idx === 0) {
      sg.rotation.z = rootAng + Math.sin(now * (2 + wv * 5)) * (0.02 + wv * 0.05);
      sg.rotation.y = Math.sin(now * (3 + wv * 6)) * wv * 0.14;
    } else {
      var wave = Math.sin(now * (4 + wv * 7.5) - idx * 0.75) * (0.015 + wv * 0.14);
      sg.rotation.y = wave;
      sg.rotation.z = (wv < 0.3 ? -0.04 : 0.03 * Math.cos(now * 5 - idx));
    }
  });
  windLines.forEach(function (wl) {
    wl.m.visible = state.wind === 2;
    if (!wl.m.visible) return;
    wl.m.position.x += wl.sp * dt;
    if (wl.m.position.x > 1.7) wl.m.position.x = -0.9;
  });

  // 2. 天空云层
  anim.cloud += (state.cloud - anim.cloud) * dt * 3.8;
  var skyHex = state.cloud === 0 ? 0x74ccff : state.cloud === 1 ? 0x99d1f2 : 0x8da0b8;
  skyFaceMat.color.lerp(cTmp.setHex(skyHex), dt * 4);
  clMat.color.lerp(cTmp.setHex(state.cloud === 2 ? 0xcad3df : 0xffffff), dt * 4);
  skySun.scale.setScalar(state.cloud === 2 ? 0.65 : 1.0 + Math.sin(now * 2.5) * 0.05);
  skyClouds.forEach(function (c, i) {
    var showN = state.cloud === 0 ? 0 : state.cloud === 1 ? 2 : 5;
    var goalS = i < showN ? (state.cloud === 2 ? 1.15 : 0.92) : 0.001;
    c.g.scale.x += (goalS - c.g.scale.x) * dt * 5;
    c.g.scale.y = c.g.scale.z = c.g.scale.x;
    c.g.position.x = c.bx + Math.sin(now * 0.9 + i * 1.6) * 0.14;
  });

  // 3. 雨量筒液面 & 雨滴
  var goalRainH = state.rain === 0 ? 0.04 : state.rain === 1 ? 0.56 : 1.16;
  anim.rainH += (goalRainH - anim.rainH) * dt * 2.4;
  rgWater.scale.y = Math.max(0.02, anim.rainH);
  rgWater.position.y = 0.15 + anim.rainH * 0.5;
  var rClS = state.rain === 0 ? 0.001 : state.rain === 1 ? 0.85 : 1.15;
  rgCloud.scale.x += (rClS - rgCloud.scale.x) * dt * 5;
  rgCloud.scale.y = rgCloud.scale.z = rgCloud.scale.x;
  rgDrops.forEach(function (rd, i) {
    var show = state.rain === 2 || (state.rain === 1 && i < 8);
    rd.m.visible = show;
    if (!show) return;
    rd.m.position.y -= rd.sp * (state.rain === 2 ? 1.45 : 0.9) * dt;
    if (rd.m.position.y < 1.55) {
      rd.m.position.y = 2.25 + Math.random() * 0.18;
      rd.m.position.x = (Math.random() - 0.5) * 0.42;
    }
  });

  // 4. 温度计液柱与冷暖色效
  var goalTempH = customTempH !== null ? customTempH : (state.temp === 0 ? 0.34 : state.temp === 1 ? 0.92 : 1.48);
  anim.tempH += (goalTempH - anim.tempH) * dt * 3.5;
  tMerc.scale.y = anim.tempH;
  tMerc.position.y = 0.54 + anim.tempH * 0.5;
  var colHex = state.temp === 0 ? 0x3b82f6 : state.temp === 1 ? 0xf97316 : 0xef4444;
  mercMat.color.lerp(cTmp.setHex(colHex), dt * 5);
  bulbMat.color.lerp(cTmp.setHex(colHex), dt * 5);
  frostFlakes.forEach(function (ff, idx) {
    ff.m.visible = state.temp === 0;
    if (!ff.m.visible) return;
    var a = now * 1.8 + ff.a;
    ff.m.position.set(Math.cos(a) * 0.48, 0.52 + Math.sin(now * 2.5 + idx) * 0.2, 0.24 + Math.sin(a) * 0.14);
    ff.m.rotation.y += dt * 3;
  });
  heatRings.forEach(function (hr) {
    if (state.temp !== 2) { hr.m.material.opacity = 0; return; }
    var u = (now * 0.9 + hr.ph) % 1;
    hr.m.scale.setScalar(0.8 + u * 1.4);
    hr.m.material.opacity = (1 - u) * 0.65;
  });

  // 仪器点击回弹与标签
  STATIONS.forEach(function (st) {
    if (st.hop > 0) {
      st.hop = Math.max(0, st.hop - dt * 3.8);
      st.g.position.y = BASE + Math.sin(st.hop * Math.PI) * 0.16 * st.hop;
    } else st.g.position.y = BASE;
    var showL = st.introLbl || hoveredSt === st;
    if (showL) {
      var sp = toScreen(st.g.position.clone().add(new THREE.Vector3(0, st.h + 0.08, 0)));
      st.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    st.lbl.classList.toggle('show', !!showL);
  });

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.45 : 1;
  renderer.render(scene, camera);
}

/* ===================== 按钮、小测验与自检 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  if (!greeted) {
    voiceOn = true; greeted = true;
    this.classList.add('on'); $('#voiceLbl').textContent = '🔊 语音';
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  this.classList.toggle('on', voiceOn);
  $('#voiceLbl').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) updateGuide(true);
  else if (window.speechSynthesis) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues(); introSkip();
  voiceOn = true; greeted = true;
  $('#voiceBtn').classList.add('on'); $('#voiceLbl').textContent = '🔊 语音';
  updateGuide(true);
});
document.querySelectorAll('#quizBox .qopt').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio();
    var ok = btn.dataset.ok === '1';
    var fb = $('#quizFb');
    if (ok) {
      btn.classList.add('ok');
      document.querySelectorAll('#quizBox .qopt').forEach(function (b) { b.disabled = true; });

      fb.textContent = '🌸 太棒了！获得本课小红花！狂风暴雨时红旗会平平飘起、温度计液柱也会下降！';
      sCelebrate();
      saveProgress('k1a-09', true);
      speak('太棒了！答对啦！获得本课小红花！刮大风下大雨时，红旗会平平飘起，温度计的温度也会下降！');
    } else {
      btn.classList.add('no');
      fb.className = 'quiz-fb no';
      fb.textContent = '💡 ' + (btn.dataset.hint || '再想想哦，再试一次吧！');
      tone(320, 0.14, 'triangle', 0.09, 260);
      speak(btn.dataset.hint || '再想想哦，再试一次吧！');
    }
  });
});
$('#ntTgl').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
$('#winClose').addEventListener('click', hideWinToast);
$('#winReplay').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, combos: countCombos(), manualTweaks: manualTweaks, celebrated: celebrated }; },
  applyCombo: applyCombo,
  startDemo: startDemo
};

syncPanelUI();
updateGuide(false);
fit();
requestAnimationFrame(frame);
})();

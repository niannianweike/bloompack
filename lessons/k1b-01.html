<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第1课 描述位置 · 教室方位与蒙眼摸旗</title>
<style>
:root{--accent:#e56d17;--ink:#2a2218;--line:#e4d5ba;--card:rgba(255,253,248,.94);--ok:#16a34a}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfa878;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.46em;color:#7a6a52;font-weight:600}
body.no-py rt{display:none}

/* 左上标题卡片 */
#hudTL{position:fixed;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 16px rgba(60,36,12,.14)}
#backBtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:#5c4b34;font-size:18px;font-weight:900}
#backBtn:hover{border-color:var(--accent);color:var(--accent)}
.hd-t{font-size:16px;font-weight:900;line-height:1.5}
.hd-sub{font-size:11.5px;color:#7b6c56;font-weight:700}

/* 顶部中央动态分步小助手 */
#guideBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(450px,calc(100vw - 640px));display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:15px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 6px 18px rgba(130,68,12,.16);
  font-size:13.5px;font-weight:800;color:#753a07;cursor:pointer;line-height:1.35}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.bump{animation:gbBump .42s ease}
@keyframes gbBump{0%{transform:translateX(-50%) scale(.94)}50%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}

/* 右上工具条 + 顶部微标签 */
#hudTR{position:fixed;top:12px;right:12px;z-index:7;display:flex;align-items:center;gap:6px}
.tbtn-wrap{position:relative;display:inline-flex}
.tbtn{height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font:inherit;font-size:13.5px;font-weight:800;color:#4a3c28;cursor:pointer;
  box-shadow:0 3px 0 #d9c8ab;transition:all .14s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#b8500a;color:#fff;box-shadow:0 3px 0 #b8500a}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid var(--accent);color:#b44908;font-size:10.5px;font-weight:900;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(229,109,23,.24);
  animation:cuePop 1.6s ease-in-out infinite;transition:opacity .25s}
body.interacted .entry-cue{opacity:0;animation:none}
@keyframes cuePop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}

/* 右上可收起窄版发现栏（D3 防遮挡） */
#notes{position:fixed;top:60px;right:12px;z-index:6;width:224px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(60,36,12,.12)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nt-title{font-size:13.5px;font-weight:900}
.nt-cnt{font-size:12.5px;font-weight:900;color:var(--accent)}
.nt-tog{padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:11px;font-weight:800;color:#6c5c45;cursor:pointer}
.stamps{display:flex;gap:4px;margin-bottom:6px}
.st{flex:1;text-align:center;padding:3px 2px;border-radius:8px;font-size:11px;font-weight:800;
  border:1.5px dashed #d7c5a4;color:#9b8a70;background:#faf4e8;transition:all .2s;line-height:1.4}
.st.lit{border-style:solid;border-color:var(--accent);background:#fff2df;color:#b8500a;animation:stPop .4s ease}
@keyframes stPop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{padding:5px 8px;border-radius:10px;background:#fff;border:1px solid #ece0c9;font-size:12px;font-weight:700;line-height:1.38}

/* 3D 场景浮标 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.tag3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 11px;border-radius:99px;
  background:rgba(42,34,24,.9);color:#fff;font-size:13.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.22);opacity:0;transition:opacity .2s}
.tag3d.show{opacity:1}
.tag3d.warm{background:#d95b12}
.tag3d.ok{background:#15803d}

/* 走到红旗旁弹出的 2 个具象悬浮小手气泡（平时 display:none，不占底栏） */
#reachPop{position:fixed;left:0;top:0;transform:translate(-50%,-100%);z-index:8;
  display:none;align-items:center;gap:14px;padding:6px 10px;pointer-events:auto}
#reachPop.show{display:flex;animation:reachIn .26s cubic-bezier(.22,1.25,.36,1)}
@keyframes reachIn{0%{opacity:0;transform:translate(-50%,-82%) scale(.72)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.reach-bubble{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  border:3px solid #fff;box-shadow:0 8px 22px rgba(60,30,5,.28),0 0 0 3px rgba(249,115,22,.45);
  transition:transform .14s,box-shadow .14s;animation:bubblePulse 1.5s ease-in-out infinite}
.reach-bubble.high{background:linear-gradient(145deg,#fb923c,#ea580c);color:#fff}
.reach-bubble.low{background:linear-gradient(145deg,#38bdf8,#0284c7);color:#fff;
  box-shadow:0 8px 22px rgba(10,45,80,.28),0 0 0 3px rgba(14,165,233,.45)}
.reach-bubble:hover{transform:scale(1.12)}
.reach-bubble:active{transform:scale(.94)}
.reach-ico{font-size:28px;line-height:1}
.reach-lbl{font-size:12px;font-weight:900;letter-spacing:.5px}
@keyframes bubblePulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.05)}}

/* 左侧轻提示徽章 */
#stagePill{position:fixed;left:12px;top:72px;z-index:5;padding:5px 11px;border-radius:12px;
  background:rgba(255,253,248,.92);border:1.5px solid var(--line);font-size:12px;font-weight:800;color:#6c573c;
  box-shadow:0 4px 12px rgba(60,36,12,.1);pointer-events:none}

/* 通关彩带 + 结论与1题巩固弹窗 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#winToast{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(36,24,10,.34);padding:16px}
#winToast.show{display:grid}
.win-card{width:min(450px,100%);max-height:85vh;overflow-y:auto;background:#fffdf8;
  border:2.5px solid var(--accent);border-radius:22px;padding:18px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(40,22,4,.28)}
.win-concl{margin:10px 0;padding:10px 12px;border-radius:13px;background:#fff8eb;border:1.5px solid #f2cf9b;
  text-align:left;font-size:13.5px;line-height:1.55;color:#5a3309;font-weight:700}
.win-quiz{margin:10px 0;padding:10px 12px;border-radius:13px;background:#f8fafc;border:1.5px solid #d9e2ec;text-align:left}
.win-quiz h4{margin:0 0 8px;font-size:13.5px;color:#c2410c}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{padding:8px 11px;border-radius:11px;border:1.5px solid #d9d0be;background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;text-align:left;cursor:pointer;transition:all .14s;color:#2a2218}
.qopt:hover{border-color:var(--accent);background:#fff9f0}
.qopt.ok{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e}
.qopt.bad{border-color:#e03131;background:#fff5f5;color:#c92a2a}
.qfb{margin-top:7px;font-size:12.5px;font-weight:800;min-height:18px;color:#b84f08}
.win-acts{display:flex;justify-content:center;gap:10px;margin-top:12px}

@media (max-width:1100px){
  #guideBar{top:62px;left:12px;transform:none;max-width:calc(100vw - 260px)}
  #guideBar.bump{animation:none}
  #stagePill{top:114px}
}
@media (max-width:760px){
  #hudTL{padding:5px 10px 5px 6px}.hd-sub{display:none}
  .entry-cue{display:none}
  #notes{width:196px;top:56px}
  #stagePill{display:none}
  .reach-bubble{width:64px;height:64px}
  .reach-ico{font-size:24px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels">
  <div id="popTag" class="tag3d"></div>
  <div id="flagTag" class="tag3d warm"></div>
</div>
<div id="reachPop" aria-label="选择摸旗高度">
  <div class="reach-bubble high" id="reachHigh" role="button" tabindex="0">
    <span class="reach-ico">👆</span>
    <span class="reach-lbl">够高</span>
  </div>
  <div class="reach-bubble low" id="reachLow" role="button" tabindex="0">
    <span class="reach-ico">👇</span>
    <span class="reach-lbl">摸低</span>
  </div>
</div>
<canvas id="confetti"></canvas>

<div id="hudTL">
  <a id="backBtn" href="../index.html" title="返回书包">‹</a>
  <div>
    <div class="hd-t" data-py="dì kè miáo shù wèi zhì">第1课 描述位置</div>
    <div class="hd-sub">活页 · 课本第 4 页「教室方位与蒙眼摸旗」</div>
  </div>
</div>

<div id="guideBar" title="点我重听当前步骤">
  <span id="guideIco">👉</span>
  <span id="guideTxt">第1步：点教室里的黑板、讲台或课桌，观察前后左右和远近！</span>
</div>

<div id="hudTR">
  <span class="tbtn-wrap"><button class="tbtn on" id="voiceBtn" type="button">🔊 语音</button><span class="entry-cue">点我听玩法</span></span>
  <span class="tbtn-wrap"><button class="tbtn" id="demoBtn" type="button">▶ 演示</button><span class="entry-cue">不会玩点演示</span></span>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head">
    <span class="nt-title" data-py="wǒ de fā xiàn">我的发现</span>
    <span class="nt-cnt" id="ntCnt">0</span>
    <button class="nt-tog" id="ntTog" type="button">收起</button>
  </div>
  <div class="stamps">
    <span class="st" id="st1" data-py="qián hòu zuǒ yòu">前后左右</span>
    <span class="st" id="st2" data-py="yuǎn jìn guān chá">远近观察</span>
    <span class="st" id="st3" data-py="mō dào hóng qí">摸到红旗</span>
  </div>
  <div id="ntList"></div>
</aside>

<div id="stagePill">💡 点教室物品看方位 · 点脚边发光箭头走路 · 点发光光圈切红旗</div>

<div id="winToast">
  <div class="win-card">
    <div style="font-size:40px">🏆</div>
    <h3 style="margin:4px 0" data-py="tài bàng la quán bù fā xiàn jí qí la">太棒啦！全部发现集齐啦！</h3>
    <div class="win-concl">
      <b>✨ 科学小结论：</b>我们可以用前、后、左、右、上、下、远、近等词语，清楚地描述自己和物体的位置。
    </div>
    <div class="win-quiz">
      <h4>💡 考考你 · 答对领小红花 🌸</h4>
      <div style="font-size:13.5px;font-weight:800;margin-bottom:8px">小红旗在书堆上面，蒙眼小同学走到旁边伸手摸不到，应该怎么指挥？</div>
      <div class="qopts" id="qOpts">
        <button class="qopt" type="button" data-ok="1">👆 抬手往上摸</button>
        <button class="qopt" type="button" data-hint="小红旗在书堆上面，弯腰往下会摸到桌子底下哦！">👇 弯腰往下摸</button>
        <button class="qopt" type="button" data-hint="往后退会离书堆越来越远啦，小红旗在上面哦！">⬇️ 往后退两步</button>
      </div>
      <div class="qfb" id="qFb"></div>
    </div>
    <div class="win-acts">
      <button class="tbtn" id="winKeepBtn" type="button">继续玩</button>
      <button class="tbtn on" id="winAgainBtn" type="button">再玩一次</button>
    </div>
  </div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../audio/manifest.js"></script>
<script src="../vendor/voice.js"></script>
<script>
(function () {
'use strict';

var LESSON_ID = 'k1b-01';
var BOOK_PROGRESS_KEY = 'xk_k1b_progress';
try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}

var $ = function (s) { return document.querySelector(s); };
var HAN = /[\u3400-\u9fff]/;
var pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function ruby(text, py) {
  if (!py) return esc(text);
  var syl = py.trim().split(/\s+/), i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) {
      var p = syl[i++];
      if (!p) { pyErrors.push(text); p = ''; }
      out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>';
    } else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
document.querySelectorAll('[data-py]').forEach(function (el) { el.innerHTML = ruby(el.textContent, el.dataset.py); });

$('#backBtn').addEventListener('click', function () {
  try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}
});

/* ===== 语音与轻音效 ===== */
var voiceOn = true;
function stopVoice() {
  if (window.__xkVoice) window.__xkVoice.stop();
  else if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (e) {}
}
function speak(text, force) {
  if (!text || (!voiceOn && !force)) return;
  if (window.__xkVoice) { window.__xkVoice.speak(text); return; }
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.94; u.pitch = 1.08; window.speechSynthesis.speak(u); } catch (e) {}
}

var audioCtx = null;
function playTone(type) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'step') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'bump') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(190, now); osc.frequency.exponentialRampToValueAtTime(110, now + 0.16);
      gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.start(now); osc.stop(now + 0.17);
    } else if (type === 'ding') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(587, now); osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.14, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.31);
    } else if (type === 'win') {
      var notes = [523, 659, 784, 1046];
      notes.forEach(function (f, idx) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.1);
        g.gain.setValueAtTime(0.15, now + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.28);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.1); o.stop(now + idx * 0.1 + 0.29);
      });
    }
  } catch (e) {}
}

function saveProgress(id, hasFlower) {
  try {
    var d = JSON.parse(localStorage.getItem(BOOK_PROGRESS_KEY) || '{}');
    d[id] = { done: true, flower: !!(hasFlower || (d[id] && d[id].flower)), ts: Date.now() };
    localStorage.setItem(BOOK_PROGRESS_KEY, JSON.stringify(d));
  } catch (e) {}
}

/* ===== 彩带庆祝 ===== */
var cfCv = $('#confetti'), cfCtx = cfCv.getContext('2d'), cfList = [], cfOn = false;
function launchConfetti() {
  cfCv.width = window.innerWidth; cfCv.height = window.innerHeight;
  cfList = [];
  var cols = ['#f97316', '#facc15', '#22c55e', '#38bdf8', '#f43f5e', '#a855f7'];
  for (var i = 0; i < 85; i++) {
    cfList.push({
      x: Math.random() * cfCv.width,
      y: -20 - Math.random() * 140,
      vx: (Math.random() - 0.5) * 160,
      vy: 120 + Math.random() * 210,
      r: 5 + Math.random() * 5,
      a: Math.random() * 6.28,
      va: (Math.random() - 0.5) * 8,
      col: cols[i % cols.length]
    });
  }
  cfOn = true;
}
function tickConfetti(dt) {
  if (!cfOn) return;
  cfCtx.clearRect(0, 0, cfCv.width, cfCv.height);
  var alive = 0;
  for (var i = 0; i < cfList.length; i++) {
    var p = cfList[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.a += p.va * dt;
    if (p.y < cfCv.height + 30) alive++;
    cfCtx.save();
    cfCtx.translate(p.x, p.y); cfCtx.rotate(p.a);
    cfCtx.fillStyle = p.col;
    cfCtx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
    cfCtx.restore();
  }
  if (!alive) { cfOn = false; cfCtx.clearRect(0, 0, cfCv.width, cfCv.height); }
}

/* ===== Three.js r147 暖色卡通教室场景 ===== */
var cv = $('#cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = new THREE.Color('#cfa878');

var camera = new THREE.PerspectiveCamera(36, 16 / 9, 0.1, 80);
camera.position.set(0.55, 8.3, 8.0);
camera.lookAt(0.25, 0.25, 0.05);

scene.add(new THREE.HemisphereLight('#fff8eb', '#a6825b', 0.8));
var sunL = new THREE.DirectionalLight('#fff5df', 0.72);
sunL.position.set(-4.5, 11, 6.5);
sunL.castShadow = true;
sunL.shadow.mapSize.set(1024, 1024);
sunL.shadow.camera.left = -7; sunL.shadow.camera.right = 7;
sunL.shadow.camera.top = 7; sunL.shadow.camera.bottom = -7;
sunL.shadow.bias = -0.0008;
scene.add(sunL);

var ramp = new THREE.DataTexture(new Uint8Array([130, 130, 130, 255, 192, 192, 192, 255, 236, 236, 236, 255, 255, 255, 255, 255]), 4, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
var INK = new THREE.LineBasicMaterial({ color: 0x3b2d1f, transparent: true, opacity: 0.45 });
function toon(col, extra) {
  var o = { color: new THREE.Color(col), gradientMap: ramp };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new THREE.MeshToonMaterial(o);
}
function mk(geo, mat, ink) {
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (ink !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 32), INK));
  return m;
}
function ctex(w, h, fn) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);

function buildDesk(c, r) {
  var g = new THREE.Group();
  var p = gridToPos(c, r);
  g.position.set(p.x, 0, p.z);

  var top = mk(new THREE.BoxGeometry(0.64, 0.07, 0.44), toon('#e2aa68'));
  top.position.set(0, 0.46, -0.06);
  g.add(top);

  var legGeo = new THREE.BoxGeometry(0.06, 0.44, 0.06);
  [[-0.26, -0.22], [0.26, -0.22], [-0.26, 0.1], [0.26, 0.1]].forEach(function (xy) {
    var lg = mk(legGeo, toon('#8d6238'), false);
    lg.position.set(xy[0], 0.22, xy[1]);
    g.add(lg);
  });

  var shelf = mk(new THREE.BoxGeometry(0.54, 0.04, 0.34), toon('#cf9553'), false);
  shelf.position.set(0, 0.34, -0.06);
  g.add(shelf);

  var seat = mk(new THREE.BoxGeometry(0.34, 0.05, 0.26), toon('#60a5fa'));
  seat.position.set(0, 0.27, 0.24);
  var back = mk(new THREE.BoxGeometry(0.34, 0.24, 0.05), toon('#3b82f6'));
  back.position.set(0, 0.41, 0.35);
  var cLeg = mk(new THREE.BoxGeometry(0.28, 0.24, 0.05), toon('#64748b'), false);
  cLeg.position.set(0, 0.13, 0.24);
  g.add(seat, back, cLeg);

  // 左前排课桌 (1,1) 上放一摞彩色书堆（旗位 1）
  if (c === 1 && r === 1) {
    var bCols = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b'];
    for (var i = 0; i < 4; i++) {
      var bk = mk(new THREE.BoxGeometry(0.32 - i * 0.02, 0.075, 0.24 - i * 0.01), toon(bCols[i]), false);
      bk.position.set(0.02, 0.53 + i * 0.076, -0.06);
      bk.rotation.y = (i % 2 === 0 ? 0.08 : -0.09);
      g.add(bk);
    }
  } else if ((c + r) % 2 === 0) {
    var nb = mk(new THREE.BoxGeometry(0.22, 0.03, 0.16), toon('#fef08a'), false);
    nb.position.set(-0.08, 0.51, -0.06);
    g.add(nb);
  }

  live.add(g);
  var rowName = r === 1 ? '前排' : (r === 3 ? '中排' : '后排');
  var colName = c === 1 ? '左侧' : (c === 3 ? '中间' : '右侧');
  var dName = (c === 1 && r === 1) ? '左前书堆课桌' : (rowName + colName + '课桌');
  registerClickable(g, { kind: 'desk', id: 'desk_' + c + '_' + r, c: c, r: r, name: dName, pos: new THREE.Vector3(p.x, 0.55, p.z) });
}

function showDirectionArrow(fromV, toV, colorHex) {
  var dx = toV.x - fromV.x, dz = toV.z - fromV.z;
  var dist = Math.hypot(dx, dz);
  if (dist < 0.2) { guideGroup.visible = false; return; }
  dirLineMat.color.set(colorHex || '#f97316');
  guideGroup.visible = true;
  var len = Math.max(0.25, dist - 0.38);
  dirShaft.scale.set(1, 1, len);
  dirShaft.position.set(0, 0.06, len * 0.5);
  dirHead.position.set(0, 0.06, len + 0.14);
  guideGroup.position.set(fromV.x, 0, fromV.z);
  guideGroup.rotation.y = Math.atan2(dx, dz);
}

function observeObject(meta) {
  var kPos = gridToPos(kidCell.c, kidCell.r);
  if (meta.kind === 'kid') {
    showPop(new THREE.Vector3(kPos.x, 1.05, kPos.z), '面向黑板：前黑板 · 后课桌 · 左窗 · 右桌', 'warm');
    speak('蒙眼小同学正面向黑板！点黑板、课桌看方位，点我脚边的发光箭头指挥我走路吧！');
    return;
  }
  if (meta.id === 'window') {
    showDirectionArrow(kPos, meta.pos, '#38bdf8');
    showPop(meta.pos, '阳光窗户在小同学左边', '');
    dirObserved.lr = true;
    var s1a = (dirObserved.fb && dirObserved.lr) ? 's1' : null;
    addDiscovery('obs_window', s1a, '🏠 窗户在小同学<b>左边</b>', '教室的阳光窗户在小同学的左边！');
    return;
  }

  var tPos = meta.pos;
  var dx = tPos.x - kPos.x;
  var dz = tPos.z - kPos.z;
  var dist = Math.hypot(dx, dz);
  var dirWord = '';
  if (Math.abs(dz) >= Math.abs(dx)) {
    dirWord = dz < 0 ? '前面' : '后面';
    dirObserved.fb = true;
  } else {
    dirWord = dx < 0 ? '左边' : '右边';
    dirObserved.lr = true;
  }
  var distWord = dist < 1.35 ? '离得很近' : '离得较远';
  if (dist < 1.35) distObserved.near = true; else distObserved.far = true;

  showDirectionArrow(kPos, tPos, dist < 1.35 ? '#16a34a' : '#f97316');
  showPop(new THREE.Vector3(tPos.x, tPos.y + 0.45, tPos.z), meta.name + '在' + dirWord + ' · ' + distWord, dist < 1.35 ? 'ok' : 'warm');
  playTone('ding');

  var hitS1 = (!stamps.s1 && dirObserved.fb && dirObserved.lr) ? 's1' : null;
  var hitS2 = (!stamps.s2 && distObserved.near && distObserved.far) ? 's2' : null;
  var key = 'obs_' + meta.id + '_' + dirWord;
  var html = '📍 ' + meta.name + '在<b>' + dirWord + '</b>（' + distWord + '）';
  var dirStaticSpeech = {
    '前面_near': '这个物体在小同学的前面，离得很近！',
    '前面_far':  '这个物体在小同学的前面，离得较远！',
    '后面_near': '这个物体在小同学的后面，离得很近！',
    '后面_far':  '这个物体在小同学的后面，离得较远！',
    '左边_near': '这个物体在小同学的左边，离得很近！',
    '左边_far':  '这个物体在小同学的左边，离得较远！',
    '右边_near': '这个物体在小同学的右边，离得很近！',
    '右边_far':  '这个物体在小同学的右边，离得较远！'
  };
  var spoken = dirStaticSpeech[dirWord + '_' + (dist < 1.35 ? 'near' : 'far')];
  if (meta.id === 'blackboard') spoken = '黑板在小同学的前面，离得较远！';
  else if (meta.id === 'podium') spoken = '讲台在黑板前面，离黑板很近！';
  addDiscovery(key, hitS1 || hitS2, html, spoken);
  if (hitS1 && hitS2) addDiscovery(key + '_d', hitS2, html, null);
}

/* 阶段 2：3D 方向箭头踏板 + 地砖 BFS 绕课桌 */
function stepDir(dc, dr, dirLabel) {
  walkQueue = [];
  var nc = kidCell.c + dc, nr = kidCell.r + dr;
  kidTargetYaw = Math.atan2(-dc, -dr);
  if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) {
    poseMode = 'bump'; poseTimer = 0.35;
    bumpVec.set(dc * 0.16, 0, dr * 0.16);
    playTone('bump');
    showPop(new THREE.Vector3(kidPos.x, 1.05, kidPos.z), '走到教室边边啦！', 'warm');
    speak('已经走到教室边边啦，换个方向走吧！');
    return false;
  }
  if (isDesk(nc, nr)) {
    poseMode = 'bump'; poseTimer = 0.38;
    bumpVec.set(dc * 0.18, 0, dr * 0.18);
    playTone('bump');
    showPop(new THREE.Vector3(kidPos.x, 1.05, kidPos.z), '前面有课桌，绕过去！', 'warm');
    speak('前面有课桌啦，试试向左或向右绕过去！');
    return false;
  }
  kidCell.c = nc; kidCell.r = nr;
  kidTarget.copy(gridToPos(nc, nr));
  playTone('step');
  guideGroup.visible = false;
  if (dirLabel) showPop(new THREE.Vector3(kidTarget.x, 1.02, kidTarget.z), '向' + dirLabel + '走一步', '');
  updateGuide(false);
  return true;
}

function bfsPath(sc, sr, tc, tr) {
  var q = [{ c: sc, r: sr, path: [] }];
  var vis = {}; vis[sc + ',' + sr] = true;
  var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  while (q.length) {
    var cur = q.shift();
    if (cur.c === tc && cur.r === tr) return cur.path;
    for (var i = 0; i < 4; i++) {
      var nc = cur.c + dirs[i][0], nr = cur.r + dirs[i][1];
      var k = nc + ',' + nr;
      if (isWalkable(nc, nr) && !vis[k]) {
        vis[k] = true;
        q.push({ c: nc, r: nr, path: cur.path.concat([{ c: nc, r: nr }]) });
      }
    }
  }
  return [];
}

function tryReach(heightType) {
  walkQueue = [];
  poseMode = heightType;
  poseTimer = 0.72;
  var sp = FLAG_SPOTS[curSpot];
  var fdx = sp.worldPos.x - kidPos.x, fdz = sp.worldPos.z - kidPos.z;
  kidTargetYaw = Math.atan2(-fdx, -fdz);

  if (!isNearActiveFlag()) {
    playTone('bump');
    showDirectionArrow(kidPos, sp.worldPos, '#ef4444');
    showPop(new THREE.Vector3(kidPos.x, 1.05, kidPos.z), '离红旗还有点远，再走近点！', 'warm');
    speak(sp.hintFar);
    return;
  }
  if (sp.height !== heightType) {
    playTone('bump');
    showPop(new THREE.Vector3(kidPos.x, 1.08, kidPos.z), sp.height === 'high' ? '太低啦！试试 👆 够高！' : '太高啦！试试 👇 摸低！', 'warm');
    speak(sp.hintWrongH);
    return;
  }

  // 摸到红旗成功！
  poseMode = 'cheer'; poseTimer = 1.05;
  playTone('ding');
  flagsFound[curSpot] = true;
  syncSpotVisuals();
  showPop(new THREE.Vector3(sp.worldPos.x, sp.worldPos.y + 0.65, sp.worldPos.z), '🎉 摸到小红旗啦！', 'ok');

  var foundCount = Object.keys(flagsFound).length;
  var lightS3 = foundCount >= 2 ? 's3' : null;
  addDiscovery('flag_' + curSpot, lightS3, sp.sticker, sp.winMsg);

  // 自动切换到下一处未摸过的红旗（用 resetGen 守卫，满足 D4）
  if (foundCount < 3 && !celebrated) {
    var nextSpot = !flagsFound.under ? 'under' : (!flagsFound.podium ? 'podium' : 'books');
    var g = resetGen;
    setTimeout(function () {
      if (g !== resetGen || demo) return;
      setFlagSpot(nextSpot, true);
      updateGuide(false);
    }, 1500);
  }
}

/* ===== 交互事件绑定 ===== */
function markInteracted() { document.body.classList.add('interacted'); }

var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function getHit(e) {
  var r = cv.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);

  // 1) 优先拾取跟随小人的 4 个 3D 立体发光方向箭头
  var hArr = ray.intersectObjects(arrowPickMeshes, false);
  if (hArr.length) return { type: 'dirArrow', hit: hArr[0] };

  // 2) 拾取 3 处发光藏旗点
  var hSpot = ray.intersectObjects(spotPickMeshes, false);
  if (hSpot.length) return { type: 'flagSpot', hit: hSpot[0] };

  // 3) 拾取教室内黑板、讲台、课桌、窗户、小人
  var hObj = ray.intersectObjects(clickables, true);
  if (hObj.length) return { type: 'obj', hit: hObj[0] };

  // 4) 拾取可走地板格子
  var hTile = ray.intersectObjects(pickTiles, false);
  if (hTile.length) return { type: 'tile', hit: hTile[0] };
  return null;
}

cv.addEventListener('pointermove', function (e) {
  var res = getHit(e);
  hoveredArrowKey = null;
  hoveredSpotKey = null;
  hoverRing.visible = false;
  if (!res) { cv.style.cursor = 'default'; return; }
  cv.style.cursor = 'pointer';
  if (res.type === 'dirArrow') {
    hoveredArrowKey = res.hit.object.userData.key;
  } else if (res.type === 'flagSpot') {
    hoveredSpotKey = res.hit.object.userData.spot;
  } else if (res.type === 'tile') {
    var d = res.hit.object.userData;
    var p = gridToPos(d.c, d.r);
    hoverRing.position.set(p.x, 0.022, p.z);
    hoverRing.visible = true;
  }
});

cv.addEventListener('pointerdown', function (e) {
  markInteracted();
  if (demo) return;
  var res = getHit(e);
  if (!res) return;
  if (res.type === 'dirArrow') {
    var ad = res.hit.object.userData;
    stepDir(ad.dc, ad.dr, ad.label);
  } else if (res.type === 'flagSpot') {
    var spotKey = res.hit.object.userData.spot;
    if (spotKey !== curSpot) {
      setFlagSpot(spotKey, false);
    } else {
      var sp = FLAG_SPOTS[curSpot];
      if (isNearActiveFlag() && !flagsFound[curSpot]) {
        showPop(new THREE.Vector3(sp.worldPos.x, sp.worldPos.y + 0.65, sp.worldPos.z), '就在旁边！点上面小手气泡摸一摸！', 'ok');
        speak('已经走到红旗旁边啦，快点上面的够高或摸低小手摸红旗吧！');
      } else {
        var standCands = curSpot === 'books' ? [[2, 1], [1, 2], [1, 0]] : (curSpot === 'under' ? [[4, 3], [5, 2], [5, 4]] : [[4, 0], [3, 0], [5, 0]]);
        var bestPath = [];
        for (var si = 0; si < standCands.length; si++) {
          var cand = standCands[si];
          var pth = bfsPath(kidCell.c, kidCell.r, cand[0], cand[1]);
          if (pth.length && (!bestPath.length || pth.length < bestPath.length)) bestPath = pth;
        }
        if (bestPath.length) {
          walkQueue = bestPath;
          showDirectionArrow(kidPos, sp.worldPos, '#ef4444');
          showPop(new THREE.Vector3(sp.worldPos.x, sp.worldPos.y + 0.65, sp.worldPos.z), '走去' + sp.label + '摸红旗！', 'ok');
          speak(sp.flagSpeech);
        } else {
          showDirectionArrow(kidPos, sp.worldPos, '#ef4444');
          showPop(new THREE.Vector3(sp.worldPos.x, sp.worldPos.y + 0.65, sp.worldPos.z), '小红旗在' + sp.label, 'warm');
          speak(sp.flagSpeech);
        }
      }
    }
  } else if (res.type === 'obj') {
    observeObject(res.hit.object.userData);
  } else if (res.type === 'tile') {
    var td = res.hit.object.userData;
    if (td.c === kidCell.c && td.r === kidCell.r) return;
    walkQueue = bfsPath(kidCell.c, kidCell.r, td.c, td.r);
    if (walkQueue.length) {
      guideGroup.visible = false;
      showPop(new THREE.Vector3(gridToPos(td.c, td.r).x, 0.65, gridToPos(td.c, td.r).z), '小同学走过来啦！', '');
    }
  }
});

$('#reachHigh').addEventListener('click', function () { markInteracted(); if (!demo) tryReach('high'); });
$('#reachLow').addEventListener('click', function () { markInteracted(); if (!demo) tryReach('low'); });

$('#voiceBtn').addEventListener('click', function () {
  markInteracted();
  voiceOn = !voiceOn;
  this.classList.toggle('on', voiceOn);
  if (voiceOn) updateGuide(true); else stopVoice();
});
$('#demoBtn').addEventListener('click', startDemo);
$('#guideBar').addEventListener('click', function () { markInteracted(); updateGuide(true); });
$('#resetBtn').addEventListener('click', function () { markInteracted(); resetAll(); });
$('#pyBtn').addEventListener('click', function () { markInteracted(); document.body.classList.toggle('no-py'); });
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
$('#winKeepBtn').addEventListener('click', function () { $('#winToast').classList.remove('show'); });
$('#winAgainBtn').addEventListener('click', resetAll);
$('#qOpts').addEventListener('click', function (e) {
  var b = e.target.closest('.qopt');
  if (!b) return;
  if (b.dataset.ok === '1') {
    b.classList.add('ok');
    $('#qFb').textContent = '🌸 答对啦！获得本课小红花！';
    saveProgress(LESSON_ID, true);
    playTone('win');
    speak('答对啦！小红旗在书堆上面，抬手往上摸就能摸到，获得本课小红花！', true);
  } else {
    b.classList.add('bad');
    var h = b.dataset.hint || '再想想哦！';
    $('#qFb').textContent = h;
    speak(h, true);
  }
});

/* ===== 屏幕投影与渲染循环 ===== */
function projectToScreen(v) {
  var p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * window.innerWidth, y: (-p.y * 0.5 + 0.5) * window.innerHeight };
}

var introT0 = performance.now(), lastT = performance.now();
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  cfCv.width = w; cfCv.height = h;
}
window.addEventListener('resize', fit);
fit();

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (now - lastT) / 1000));
  lastT = now;
  var t = now * 0.001;

  // 弹出动画
  var pop = Math.min(1, (performance.now() - introT0) / 700);
  var ease = 1 - Math.pow(1 - pop, 3);
  live.scale.setScalar(0.01 + 0.99 * ease);

  // 自动步行队列
  var distToTarget = kidPos.distanceTo(kidTarget);
  if (distToTarget < 0.04 && walkQueue.length) {
    var nxt = walkQueue.shift();
    var dc = nxt.c - kidCell.c, dr = nxt.r - kidCell.r;
    kidCell.c = nxt.c; kidCell.r = nxt.r;
    kidTarget.copy(gridToPos(nxt.c, nxt.r));
    kidTargetYaw = Math.atan2(-dc, -dr);
    playTone('step');
    updateGuide(false);
  }

  // 平滑移动小同学
  var moving = distToTarget > 0.02;
  if (moving) {
    kidPos.lerp(kidTarget, Math.min(1, dt * 11));
  } else {
    kidPos.copy(kidTarget);
  }

  // 平滑转向（最短角）
  var dyaw = kidTargetYaw - kidYaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;
  kidYaw += dyaw * Math.min(1, dt * 12);
  kid.rotation.y = kidYaw;

  // 姿态动画
  var bumpOffset = new THREE.Vector3();
  if (poseTimer > 0) {
    poseTimer = Math.max(0, poseTimer - dt);
    if (poseMode === 'bump') {
      var s = Math.sin((poseTimer / 0.38) * Math.PI);
      bumpOffset.copy(bumpVec).multiplyScalar(s);
    }
    if (poseTimer === 0) poseMode = 'idle';
  }
  kid.position.set(kidPos.x + bumpOffset.x, moving ? Math.abs(Math.sin(t * 16)) * 0.06 : 0, kidPos.z + bumpOffset.z);

  var tgtTorsoX = 0, tgtArmX = 0;
  if (poseMode === 'high') { tgtArmX = 2.6; tgtTorsoX = -0.08; }
  else if (poseMode === 'low') { tgtTorsoX = -0.82; tgtArmX = 0.85; }
  else if (poseMode === 'cheer') { tgtArmX = 2.85 + Math.sin(t * 18) * 0.2; kid.position.y = Math.abs(Math.sin(t * 12)) * 0.14; }
  else if (moving) {
    legL.rotation.x = Math.sin(t * 16) * 0.45;
    legR.rotation.x = -Math.sin(t * 16) * 0.45;
    tgtArmX = 0.45;
  } else {
    legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
    tgtArmX = 0.35 + Math.sin(t * 2.5) * 0.05;
  }
  kidTorso.rotation.x += (tgtTorsoX - kidTorso.rotation.x) * Math.min(1, dt * 12);
  armL.rotation.x += (tgtArmX - armL.rotation.x) * Math.min(1, dt * 12);
  armR.rotation.x += (tgtArmX - armR.rotation.x) * Math.min(1, dt * 12);

  // 更新 4 个跟随蒙眼小人的 3D 立体发光方向箭头
  kidArrowsGroup.position.set(kidPos.x, 0.015, kidPos.z);
  arrowPads.forEach(function (ap, idx) {
    var nc = kidCell.c + ap.def.dc;
    var nr = kidCell.r + ap.def.dr;
    var inBounds = nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS;
    var blocked = inBounds && isDesk(nc, nr);
    ap.grp.visible = inBounds;
    if (!inBounds) return;
    var distOff = blocked ? 0.52 : 0.86;
    ap.grp.position.set(ap.def.dc * distOff, blocked ? 0.05 : 0, ap.def.dr * distOff);
    var isHov = (hoveredArrowKey === ap.def.key);
    var baseScale = blocked ? 0.72 : 1.0;
    var tgtScale = baseScale * (isHov ? 1.24 : 1.0);
    var sc = ap.grp.scale.x + (tgtScale - ap.grp.scale.x) * Math.min(1, dt * 14);
    ap.grp.scale.setScalar(sc);
    ap.halo.scale.setScalar(0.95 + Math.sin(t * 4.5 + idx) * 0.14);
    ap.halo.material.opacity = isHov ? 0.96 : (blocked ? 0.36 : 0.78);
    ap.tip.position.y = Math.sin(t * 5 + idx) * 0.035;
  });

  // 3 处藏旗点呼吸光圈 + 小旗飘动
  flagCloth.rotation.y = Math.sin(t * 4.5) * 0.18;
  Object.keys(spotMarkers).forEach(function (k, idx) {
    var sm = spotMarkers[k];
    var isCur = (k === curSpot);
    var isHov = (hoveredSpotKey === k);
    var pulse = (isCur ? 1.0 : 0.92) + Math.sin(t * 4 + idx) * 0.13;
    sm.ring.scale.setScalar(pulse * (isHov ? 1.15 : 1.0));
    if (sm.groundRing) sm.groundRing.scale.setScalar(pulse);
    if (sm.ghost.visible) {
      sm.ghost.position.y = Math.sin(t * 3.5 + idx) * 0.04;
      sm.ghost.scale.setScalar(isHov ? 1.2 : 1.0);
    }
  });

  // 走到红旗旁时弹出 2 个具象悬浮小手气泡（👆 够高 / 👇 摸低）
  var reachEl = $('#reachPop');
  var showReach = !demo && !celebrated && !moving && isNearActiveFlag() && !flagsFound[curSpot];
  if (showReach) {
    var spCur = FLAG_SPOTS[curSpot];
    var midW = new THREE.Vector3(
      (kidPos.x + spCur.worldPos.x) * 0.5,
      Math.max(kidPos.y + 1.15, spCur.worldPos.y + 0.72),
      (kidPos.z + spCur.worldPos.z) * 0.5
    ).add(live.position);
    var rp = projectToScreen(midW);
    var rx = Math.max(105, Math.min(window.innerWidth - 260, rp.x));
    var ry = Math.max(150, Math.min(window.innerHeight - 36, rp.y));
    reachEl.style.left = rx + 'px';
    reachEl.style.top = ry + 'px';
    reachEl.classList.add('show');
  } else {
    reachEl.classList.remove('show');
  }

  // 更新 3D 浮标位置
  if (popTimer > 0) {
    popTimer = Math.max(0, popTimer - dt);
    var sp = projectToScreen(popWorld);
    var el = $('#popTag');
    el.style.left = sp.x + 'px';
    el.style.top = (sp.y - 10) + 'px';
    if (popTimer === 0) el.classList.remove('show');
  }
  var flWorld = flagGroup.position.clone().add(live.position);
  flWorld.y += 0.62;
  var fp = projectToScreen(flWorld);
  var fTag = $('#flagTag');
  fTag.textContent = '🚩 ' + FLAG_SPOTS[curSpot].label;
  fTag.style.left = fp.x + 'px';
  fTag.style.top = fp.y + 'px';
  fTag.classList.toggle('show', !showReach);

  tickConfetti(dt);
  renderer.render(scene, camera);
}

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, celebrated: celebrated }; },
  startDemo: startDemo,
  resetAll: resetAll
};

setFlagSpot('books', true);
updateGuide(false);
requestAnimationFrame(frame);
})();
</script>

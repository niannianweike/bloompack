<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第2课 物体的分类 · 一拃量长短（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:7;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.cue-pulse{animation:cueRing 1.8s ease-in-out infinite}
@keyframes cueRing{0%,100%{box-shadow:0 3px 0 #e2d2b5,0 0 0 0 rgba(229,109,23,.48)}50%{box-shadow:0 3px 0 #e2d2b5,0 0 0 8px rgba(229,109,23,0)}}
.tbtn.on.cue-pulse{animation:cueRingOn 1.8s ease-in-out infinite}
@keyframes cueRingOn{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 9px rgba(229,109,23,0)}}
.cue-tag{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:2px 8px;border-radius:99px;background:#e56d17;color:#fff;font-size:11px;font-weight:800;line-height:1.4;
  box-shadow:0 3px 10px rgba(191,84,9,.32);transition:opacity .35s,transform .35s}
.cue-tag::before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:#e56d17}
body.cues-off .cue-tag{opacity:0;transform:translateX(-50%) translateY(-4px)}
body.cues-off .tbtn.cue-pulse{animation:none}

/* 步骤小助手提示条 */
#guideBar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;
  max-width:min(440px,calc(100vw - 700px));padding:7px 14px;border-radius:99px;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  background:rgba(255,250,240,.95);border:2px solid #f59e0b;box-shadow:0 6px 18px rgba(80,55,20,.14);
  font-size:14px;font-weight:800;color:var(--ink);line-height:1.35;transition:border-color .25s}
#guideBar:hover{border-color:var(--accent)}
#guideBar.bump{animation:gbBump .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes gbBump{0%{transform:translateX(-50%) scale(.92)}50%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
.gb-ico{font-size:16px;flex:none}
#guideTxt{flex:1;min-width:0}
.gb-prog{flex:none;padding:2px 8px;border-radius:99px;background:#fff3e0;border:1px solid #f3c489;color:#c2560c;font-size:12px;font-weight:900}

#notes{position:fixed;right:14px;top:82px;z-index:4;width:218px;max-height:calc(100% - 156px);overflow:hidden;
  padding:9px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:top .3s,opacity .3s}
body.cues-off #notes{top:64px;max-height:calc(100% - 140px)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-acts{display:flex;align-items:center;gap:6px}
.nt-tog{height:24px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;font-weight:800;color:#8a7b62;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
.stamps{display:flex;gap:5px;margin-bottom:6px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.45}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:148px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:15px;font-weight:800;line-height:1.55;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
.stk b{color:#c2560c}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18;display:none}
#celebrate{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.86);z-index:19;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;padding:18px 20px 16px;border-radius:22px;text-align:center;
  background:rgba(255,250,240,.98);border:2.5px solid #f59e0b;box-shadow:0 16px 40px rgba(80,55,20,.28);
  opacity:0;pointer-events:none;transition:opacity .32s,transform .38s cubic-bezier(.2,1.5,.4,1)}
#celebrate.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cel-medal{font-size:44px;line-height:1.1;margin-bottom:2px}
.cel-txt{font-size:20px;font-weight:900;color:#c2560c;line-height:1.55}
.cel-sub{font-size:13px;font-weight:700;color:#6e604b;margin:2px 0 10px}
.cel-concl{text-align:left;padding:10px 12px;border-radius:14px;background:#fff5e3;border:1.5px solid #f4c88c;margin:0 0 12px}
.cel-concl-t{font-size:13px;font-weight:900;color:#c2560c;margin-bottom:4px}
.cel-concl p{margin:0;font-size:14px;font-weight:800;color:#3d3428;line-height:1.55}
.cel-quiz{text-align:left;padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);margin:0 0 14px}
.quiz-t{font-size:13px;font-weight:900;color:#d94886;margin-bottom:5px}
.quiz-q{font-size:14px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:9px}
.quiz-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qopt{padding:9px 6px;border-radius:12px;border:2px solid var(--line);background:#fffaf0;cursor:pointer;
  font:inherit;font-size:14px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 2px 0 #e2d2b5;transition:all .18s}
.qopt span.qi{font-size:22px;line-height:1}
.qopt:hover{border-color:var(--accent);background:#fff3e0}
.qopt.ok{border-color:#16a34a;background:#eafaf0;color:#15803d;box-shadow:0 2px 0 #86efac}
.qopt.wrong{border-color:#f59e0b;background:#fff7ed;animation:qShake .36s}
@keyframes qShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.quiz-fb{min-height:20px;margin-top:8px;font-size:13px;font-weight:800;line-height:1.45;color:#c2560c}
.quiz-fb.ok{color:#15803d}
.cel-btns{display:flex;justify-content:center;gap:10px}
.cel-btn{height:38px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.cel-btn.pri{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}

#verbs{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:22px;height:22px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:16px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:28px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
.word.short{color:#2f6cc0}
.word.same{color:#15803d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-55%) scale(.6)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:1120px){
  #guideBar{top:68px;left:14px;transform:none;max-width:calc(100vw - 260px)}
  #guideBar.bump{animation:none}
}
@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:16px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:6px}.tbtn{height:34px;padding:0 10px;font-size:13px}
  .cue-tag{display:none}
  #guideBar{top:52px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 20px);padding:5px 11px;font-size:13px}
  #notes,body.cues-off #notes{top:auto;bottom:64px;right:8px;left:8px;width:auto;max-height:116px;padding:8px 10px}
  #ntList .stk:nth-child(n+2){display:none}
  .stk{font-size:14px}
  #verbs{bottom:10px;gap:6px}.verb{font-size:14px;padding:4px 10px}.verb svg{width:18px;height:18px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 8 页「一拃量长短」</small></div>
</div>

<div id="guideBar" role="status" aria-live="polite" title="点我再听一次提示">
  <span class="gb-ico">👉</span>
  <span id="guideTxt">先把文具拖到左边绿垫子上，和小手“一拃”量一量！</span>
  <span class="gb-prog" id="guideProg">0/6</span>
</div>

<div class="tools">
  <button class="tbtn on cue-pulse" id="voiceBtn" type="button" title="语音引导开关"><span class="tbtn-lbl">🔊 语音</span><span class="cue-tag">点我听玩法</span></button>
  <button class="tbtn cue-pulse" id="demoBtn" type="button"><span class="tbtn-lbl">▶ 演示</span><span class="cue-tag">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><div class="nt-acts"><span id="ntCount" style="color:#c2560c">0/6</span><button class="nt-tog" id="ntTog" type="button">收起</button></div></div>
  <div class="stamps"><span class="stamp" data-k="short" id="stShort"></span><span class="stamp" data-k="same" id="stSame"></span><span class="stamp" data-k="long" id="stLong"></span></div>
  <div id="ntList"></div>
</aside>

<canvas id="confetti"></canvas>
<div id="celebrate" role="status" aria-live="polite">
  <div class="cel-medal">🏆</div>
  <div class="cel-txt" id="celTxt"></div>
  <div class="cel-sub" id="celSub"></div>
  <div class="cel-concl">
    <div class="cel-concl-t">✨ 科学小结论</div>
    <p>张开大拇指和中指之间的距离叫“一拃”，可以用一拃量出文具的长短并分类！</p>
  </div>
  <div class="cel-quiz">
    <div class="quiz-t">💡 考考你 · 答对领小红花 🌸</div>
    <div class="quiz-q">下面哪件文具比小朋友的一拃短？</div>
    <div class="quiz-opts" id="quizOpts">
      <button class="qopt" type="button" data-ok="1"><span class="qi">🧼</span><span>橡皮</span></button>
      <button class="qopt" type="button" data-ok="0"><span class="qi">🖌️</span><span>毛笔</span></button>
      <button class="qopt" type="button" data-ok="0"><span class="qi">📏</span><span>尺子</span></button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="cel-btns">
    <button class="cel-btn" id="celKeep" type="button">继续玩</button>
    <button class="cel-btn pri" id="celAgain" type="button">再玩一次</button>
  </div>
</div>

<div id="verbs">
  <span class="verb" data-v="measure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M7 9v6M12 10v4M17 9v6"/></svg><span id="vb1"></span></span>
  <span class="verb" data-v="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h10M3 8h18M17 5l4 3-4 3"/></svg><span id="vb2"></span></span>
  <span class="verb" data-v="cubby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18"/></svg><span id="vb3"></span></span>
</div>

<svg id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l3-1c2-6 9-5 9 0 2-3 8-2 8 3 3-1 7 1 7 5v12c0 9-7 15-16 15h-6c-6 0-10-3-13-8L13 41c-2-3 0-7 4-7 2 0 3 1 4 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#2a3040" stroke-width="3" stroke-linejoin="round"/></svg>

<script src="../vendor/three.min.js"></script>
<script src="../audio/manifest.js"></script>
<script src="../vendor/voice.js"></script>
<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  var syl = py ? py.trim().split(/\s+/) : [], i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) { var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; } out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>'; }
    else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
var $ = function (s) { return document.querySelector(s); };
$('#ttl').innerHTML = ruby('第2课 物体的分类', 'dì kè wù tǐ de fēn lèi');
$('#ntTitle').innerHTML = ruby('我的发现', 'wǒ de fā xiàn');
$('#stShort').innerHTML = ruby('短', 'duǎn');
$('#stSame').innerHTML = ruby('正好', 'zhèng hǎo');
$('#stLong').innerHTML = ruby('长', 'cháng');
$('#vb1').innerHTML = ruby('量一量', 'liáng yi liáng');
$('#vb2').innerHTML = ruby('比长短', 'bǐ cháng duǎn');
$('#vb3').innerHTML = ruby('放进格', 'fàng jìn gé');
$('#celTxt').innerHTML = ruby('太棒啦！全部发现集齐啦！', 'tài bàng la quán bù fā xiàn jí qí la');
$('#celSub').innerHTML = ruby('6件文具全都用一拃量好分类啦', 'jiàn wén jù quán dōu yòng yī zhǎ liáng hǎo fēn lèi la');

/* ===================== 6 件文具（一拃 = 2.10） ===================== */
var ONE_SPAN = 2.10;
var SPAN_X0 = -3.45, SPAN_X1 = SPAN_X0 + ONE_SPAN; // -3.45 .. -1.35

var ITEMS = [
  { id: 'eraser',   name: '橡皮',   py: 'xiàng pí',     len: 0.62, cat: 'short', color: '#ee7fa0', home: [-3.30, 1.05] },
  { id: 'chalk',    name: '粉笔',   py: 'fěn bǐ',       len: 1.05, cat: 'short', color: '#d4b44a', home: [-1.95, 1.05] },
  { id: 'marker',   name: '水彩笔', py: 'shuǐ cǎi bǐ',  len: 2.08, cat: 'same',  color: '#f28b30', home: [-0.15, 1.05] },
  { id: 'pencil',   name: '铅笔',   py: 'qiān bǐ',      len: 2.12, cat: 'same',  color: '#3f4756', home: [2.25,  1.05] },
  { id: 'ruler',    name: '尺子',   py: 'chǐ zi',       len: 2.75, cat: 'long',  color: '#5a82b0', home: [-2.05, 1.78] },
  { id: 'brushpen', name: '毛笔',   py: 'máo bǐ',       len: 3.05, cat: 'long',  color: '#9c6631', home: [1.55,  1.78] }
];
var IMAP = {}; ITEMS.forEach(function (it) { IMAP[it.id] = it; });

var CATS = {
  short: { label: '比一拃短', py: 'bǐ yī zhǎ duǎn',  col: '#2f6cc0', bg: '#e6f1fe', icon: '🔹' },
  same:  { label: '正好一拃', py: 'zhèng hǎo yī zhǎ', col: '#16a34a', bg: '#e6f8ec', icon: '🖐' },
  long:  { label: '比一拃长', py: 'bǐ yī zhǎ cháng', col: '#e56d17', bg: '#fff0df', icon: '🔸' }
};

/* ===================== Three 基础 ===================== */
var canvas = $('#c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

scene.add(new THREE.HemisphereLight(0xfff8ee, 0xcdb08a, 0.42));
var sun = new THREE.DirectionalLight(0xfff1dc, 0.66);
sun.position.set(-4, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
(function (c) { c.left = -7; c.right = 7; c.top = 6; c.bottom = -6; c.near = 1; c.far = 40; })(sun.shadow.camera);
sun.shadow.bias = -0.0008;
scene.add(sun);

var ramp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 185, 185, 185, 255, 232, 232, 232, 255, 255, 255, 255, 255]), 4, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
var INK = new THREE.LineBasicMaterial({ color: 0x2a3040, transparent: true, opacity: 0.8 });
function toon(hex, extra) {
  var o = { color: new THREE.Color(hex), gradientMap: ramp };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new THREE.MeshToonMaterial(o);
}
function mesh(geo, mat, ink) {
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (ink !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), INK));
  return m;
}
function ctex(w, h, fn) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  matM.scale.set(1, 1, Math.max(0.01, backOut((t - 0.45) / 0.5)));

/* ===================== 主循环 ===================== */
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  var nearMat = false, hoverCubby = -1;
  if (P && P.dragging && P.e) {
    var pp = planePoint(P.e, BASE + 0.65);
    if (pp) P.it.target.set(THREE.MathUtils.clamp(pp.x, BOARD.x0 + 0.25, BOARD.x1 - 0.25), BASE + 0.65, THREE.MathUtils.clamp(pp.z, BOARD.z0 + 0.25, BOARD.z1 - 0.25));
    var ix = P.it.cur.x, iz = P.it.cur.z;
    if (ix > MAT.x0 - 0.25 && ix < MAT.x1 + 0.3 && iz > MAT.z0 - 0.15 && iz < MAT.z1 + 0.35) nearMat = true;
    else if (ix > CUBBY_X - CUBBY_W / 2 - 0.2 && ix < CUBBY_X + CUBBY_W / 2 + 0.2) {
      for (var ci = 0; ci < cubbies.length; ci++) if (Math.abs(iz - cubbies[ci].z) < 0.42) hoverCubby = ci;
    }
  }
  if (matPulseT > 0) matPulseT = Math.max(0, matPulseT - dt);
  var matHint = nearMat ? 0.85 : (matPulseT > 0 ? (0.4 + 0.4 * Math.sin(now * 10)) * Math.min(1, matPulseT) : 0);
  matTopMat.color.setRGB(1, 1, 1).lerp(new THREE.Color(0xfff1c4), matHint);

  // 小手欢快弹跳
  if (handBounce > 0) handBounce = Math.max(0, handBounce - dt * 3);
  hand3D.position.y = BASE + 0.04 + Math.sin(handBounce * Math.PI) * 0.16;

  // 分类格高亮与轻晃
  cubbies.forEach(function (cb, i) {
    if (cb.shakeT > 0) { cb.shakeT = Math.max(0, cb.shakeT - dt * 3.2); cb.g.position.x = CUBBY_X + Math.sin(cb.shakeT * Math.PI * 6) * 0.14 * cb.shakeT; }
    else cb.g.position.x = CUBBY_X;
    if (cb.okFlash > 0) cb.okFlash = Math.max(0, cb.okFlash - dt * 1.8);
    if (cb.hintFlash > 0) cb.hintFlash = Math.max(0, cb.hintFlash - dt * 1.1);
    var op = 0;
    if (cb.okFlash > 0) { cb.glowMat.color.setHex(0x22c55e); op = cb.okFlash * 0.45; }
    else if (cb.hintFlash > 0) { cb.glowMat.color.setHex(0xffa826); op = (0.28 + 0.28 * Math.sin(now * 14)) * Math.min(1, cb.hintFlash); }
    else if (hoverCubby === i) { cb.glowMat.color.setHex(0xffb23c); op = 0.36; }
    cb.glowMat.opacity += (op - cb.glowMat.opacity) * 0.25;
  });

  // 物品运动
  var kk = 1 - Math.exp(-15 * dt);
  ITEMS.forEach(function (it) {
    if (it.flying) {
      var f = it.flying; f.t += dt / 0.65;
      var u = Math.min(1, f.t), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      it.cur.lerpVectors(f.from, f.to, e);
      it.cur.y += Math.sin(u * Math.PI) * 0.95;
      if (u >= 1) { var fn = f.done; it.flying = null; if (fn) fn(); }
    } else {
      it.cur.lerp(it.target, P && P.it === it && P.dragging ? 1 - Math.exp(-22 * dt) : kk);
    }
    if (it.hop > 0) it.hop = Math.max(0, it.hop - dt * 3.2);
    var hv = (hovered === it && !P) ? 1 : 0; it.hover += (hv - it.hover) * 0.24;
    it.g.position.set(it.cur.x, it.cur.y + Math.sin(it.hop * Math.PI) * 0.32 + it.hover * 0.06, it.cur.z);
    it.body.scale.setScalar(it.pop);

    var showL = it.introLbl || it.hover > 0.45 || (P && P.it === it);
    if (showL) {
      var sp = toScreen(it.cur.clone().setY(it.cur.y + it.h + 0.2));
      it.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    it.lbl.classList.toggle('show', !!showL);
  });

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.35 : 1;
  renderer.render(scene, camera);
}

$('#voiceBtn').addEventListener('click', function () {
  audio(); introSkip(); dismissCues();
  if (!voiceOn || lastVoiceGuideKey !== curGuideKey) {
    welcomeSpoken = true; voiceOn = true; lastVoiceGuideKey = curGuideKey;
    $('#voiceBtn').classList.add('on'); setBtnLbl('#voiceBtn', '🔊 语音');
    pulseGuideTarget();
    speak(curGuideSpeech, true);
    return;
  }
  voiceOn = false;
  $('#voiceBtn').classList.remove('on');
  setBtnLbl('#voiceBtn', '🔇 静音');
  stopVoice();
});
$('#guideBar').addEventListener('click', function () {

});
document.querySelectorAll('#quizOpts .qopt').forEach(function (btn) {

      fb.textContent = '🌸 太棒了！获得本课小红花！橡皮短短的，比小朋友的一拃短！';

    } else if (!quizSolved) {
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      fb.classList.remove('ok');
      fb.textContent = '再想想哦～刚才量过，哪件文具短短小小的，还没到一拃呢？';
      sNudge();
      speak('再想想哦，刚才用一拃量过，哪件文具短短的、比一拃短呢？', true);
    }
  });
});
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#celKeep').addEventListener('click', hideCelebrate);
$('#celAgain').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); introSkip(); dismissCues(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, placed: getPlacedCount(), onMat: matItem ? matItem.id : null, celebrated: celebrated }; },
  startDemo: startDemo
};

updateGuide(false);
fit();
requestAnimationFrame(frame);
})();

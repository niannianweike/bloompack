<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第6课 动物是生物 · 窗帘蝴蝶与小狗（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}
.tbtn-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.tbtn{height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid #e56d17;color:#b44908;font-size:10.5px;font-weight:900;white-space:nowrap;
  box-shadow:0 3px 8px rgba(229,109,23,.25);pointer-events:none;z-index:6;
  animation:cueFloat 1.5s ease-in-out infinite;transition:opacity .35s,transform .35s}
.entry-cue::before{display:none}
body.interacted .entry-cue{opacity:0;pointer-events:none;animation:none}
body:not(.interacted) #voiceBtn{animation:btnPulse 1.8s ease-in-out infinite}
@keyframes cueFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
@keyframes btnPulse{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.45)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 8px rgba(229,109,23,0)}}

#guideBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;
  max-width:min(460px,calc(100vw - 520px));padding:8px 16px;border-radius:16px;
  background:rgba(255,250,240,.95);border:2px solid #f59e0b;box-shadow:0 6px 20px rgba(120,70,10,.15);
  font-size:14px;font-weight:800;line-height:1.45;color:#7c3a0b;text-align:center;
  transition:transform .25s,box-shadow .25s}
#guideBar.flash{transform:translateX(-50%) scale(1.04);box-shadow:0 8px 26px rgba(229,109,23,.32)}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:244px;overflow:hidden;
  padding:8px 10px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12);transition:opacity .3s}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-right{display:flex;align-items:center;gap:6px}
#ntToggle{border:1px solid var(--line);background:#fff;color:#8a6d4a;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
#ntToggle:hover{border-color:var(--accent);color:var(--accent)}
.stamps{display:flex;gap:5px;margin-bottom:6px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:10px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:13px;font-weight:800;line-height:1.5}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:158px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:14px;font-weight:800;line-height:1.6;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf{position:absolute;width:10px;height:14px;border-radius:3px;opacity:0;animation:confFall 2.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confFall{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.86);z-index:12;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 20px;border-radius:22px;
  background:rgba(255,250,240,.98);border:2.5px solid #f59e0b;box-shadow:0 16px 40px rgba(100,55,10,.28);
  opacity:0;pointer-events:none;transition:opacity .32s,transform .35s cubic-bezier(.2,1.5,.4,1)}
#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.win-trophy{font-size:40px;line-height:1}
#winMsg{font-size:20px;font-weight:900;color:#c2560c;line-height:1.5;text-align:center}
.win-concl{width:100%;padding:10px 13px;border-radius:14px;background:#fff7e6;border:1.5px solid #f6c478;text-align:left}
.win-concl-t{font-size:13px;font-weight:900;color:#b45309;margin-bottom:4px}
.win-concl-b{font-size:14px;font-weight:800;color:#4a3520;line-height:1.6}
.win-quiz{width:100%;padding:11px 13px;border-radius:14px;background:#fff;border:1.5px solid #e9d9bd;text-align:left}
.win-quiz-t{font-size:13px;font-weight:900;color:#e56d17;margin-bottom:5px}
.win-quiz-q{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:8px;line-height:1.45}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.qopt{width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid #e3d6bd;background:#fffdf8;
  font:inherit;font-size:14.5px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.qopt:hover{border-color:#e56d17;background:#fff6eb}
.qopt:active{transform:scale(.98)}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}
.qopt.err{border-color:#f97316;background:#ffedd5;color:#9a3412}
.quiz-fb{margin-top:8px;font-size:13.5px;font-weight:800;line-height:1.5;min-height:20px}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2410c}
.win-btns{display:flex;gap:10px;margin-top:2px}
.wbtn{height:38px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.wbtn.pri{background:#e56d17;border-color:#bf5409;color:#fff}
.wbtn:hover{filter:brightness(.96)}

#verbs{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:22px;height:22px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:27px;font-weight:900;line-height:1.6;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.25s ease-out forwards;white-space:nowrap}
.word.cool{color:#2f5fa8}
.word.good{color:#15803d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:64px;height:64px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:960px){
  #guideBar{top:62px;max-width:min(440px,calc(100vw - 280px));font-size:13px;padding:6px 12px}
}
@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:16px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:6px}.tbtn{height:34px;padding:0 10px;font-size:13px}
  .entry-cue{top:38px;font-size:11px;padding:2px 7px}
  #guideBar{top:50px;left:8px;right:8px;transform:none;max-width:none;font-size:12.5px;padding:5px 10px}
  #guideBar.flash{transform:scale(1.02)}
  #notes{top:auto;bottom:60px;right:8px;left:8px;width:auto;max-height:112px;padding:7px 10px}
  #ntList .stk:nth-child(n+2){display:none}
  .stk{font-size:14px}
  #verbs{bottom:10px;gap:6px}.verb{font-size:14px;padding:4px 10px}.verb svg{width:18px;height:18px}
}
</style>
</head>

<canvas id="c"></canvas>
<div id="labels"></div>

    <button class="wbtn" id="winAgain" type="button">再玩一次</button>

</div>

<div id="verbs">
  <span class="verb" data-v="curtain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16M6 4v16M18 4v16M6 12c3 0 4 4 6 4s3-4 6-4"/></svg><span id="vb1"></span></span>
  <span class="verb" data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16l-2 6H6l-2-6z"/><path d="M8 10c1-2 3-2 4 0 1-2 3-2 4 0"/></svg><span id="vb2"></span></span>
  <span class="verb" data-v="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.5 4.5 1.5 6 0"/></svg><span id="vb3"></span></span>
</div>

<svg id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l3-1c2-6 9-5 9 0 2-3 8-2 8 3 3-1 7 1 7 5v12c0 9-7 15-16 15h-6c-6 0-10-3-13-8L13 41c-2-3 0-7 4-7 2 0 3 1 4 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#2a3040" stroke-width="3" stroke-linejoin="round"/></svg>

<script>
(function () {
'use strict';

/* ===================== 拼音 ===================== */
var HAN = /[\u3400-\u9fff]/, pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  var syl = py ? py.trim().split(/\s+/) : [], i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) { var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; } out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>'; }
    else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
var $ = function (s) { return document.querySelector(s); };
$('#ttl').innerHTML = ruby('第6课 动物是生物', 'dì kè dòng wù shì shēng wù');
$('#ntTitle').innerHTML = ruby('我的发现', 'wǒ de fā xiàn');
$('#stB').innerHTML = ruby('蝴蝶', 'hú dié');
$('#stD').innerHTML = ruby('小狗', 'xiǎo gǒu');
$('#stL').innerHTML = ruby('生物', 'shēng wù');
$('#vb1').innerHTML = ruby('拉窗帘', 'lā chuāng lián');
$('#vb2').innerHTML = ruby('喂食物', 'wèi shí wù');
$('#vb3').innerHTML = ruby('逗小狗', 'dòu xiǎo gǒu');
$('#winMsg').innerHTML = '🌟 ' + ruby('太棒啦！全部发现集齐啦！', 'tài bàng la quán bù fā xiàn jí qí la');

/* ===================== Three 基础 ===================== */
var canvas = $('#c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

scene.add(new THREE.HemisphereLight(0xfff8ee, 0xcdb08a, 0.42));
var sun = new THREE.DirectionalLight(0xfff1dc, 0.66);
sun.position.set(-4, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
(function (c) { c.left = -7; c.right = 7; c.top = 6; c.bottom = -6; c.near = 1; c.far = 40; })(sun.shadow.camera);
sun.shadow.bias = -0.0008;
scene.add(sun);

var ramp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 185, 185, 185, 255, 232, 232, 232, 255, 255, 255, 255, 255]), 4, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
var INK = new THREE.LineBasicMaterial({ color: 0x2a3040, transparent: true, opacity: 0.8 });
function toon(hex, extra) {
  var o = { color: new THREE.Color(hex), gradientMap: ramp };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new THREE.MeshToonMaterial(o);
}
function mesh(geo, mat, ink) {
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (ink !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), INK));
  return m;
}
function ctex(w, h, fn) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* ===================== 书桌 + 摊开的课本 ===================== */
var deskTex = ctex(512, 512, function (g, w, h) {
  g.fillStyle = '#c9a36b'; g.fillRect(0, 0, w, h);
  for (var i = 0; i < 70; i++) { g.fillStyle = 'rgba(120,80,35,' + (Math.random() * 0.05).toFixed(3) + ')'; g.fillRect(0, Math.random() * h, w, 1 + Math.random() * 3); }
});
deskTex.wrapS = deskTex.wrapT = THREE.RepeatWrapping; deskTex.repeat.set(3, 3);
var deskM = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ map: deskTex }));
deskM.rotation.x = -Math.PI / 2; deskM.position.y = -0.2; deskM.receiveShadow = true;
scene.add(deskM);

function pageTex(right) {
  return ctex(512, 640, function (g, w, h) {
    g.fillStyle = '#fbf6ea'; g.fillRect(0, 0, w, h);
    var gr = g.createLinearGradient(right ? 0 : w, 0, right ? 60 : w - 60, 0);
    gr.addColorStop(0, 'rgba(120,90,45,.18)'); gr.addColorStop(1, 'rgba(120,90,45,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#e4d8c2';
    for (var r = 0; r < 15; r++) { var y = 60 + r * 36; if (r === 5 || r === 11) continue; g.fillRect(50, y, w - 100 - (r % 4) * 40, 8); }
    g.fillStyle = '#b9a98c'; g.font = 'bold 22px sans-serif'; g.textAlign = right ? 'right' : 'left';
    g.fillText(right ? '24' : '23', right ? w - 40 : 40, h - 26);
  });
}
var baseBook = new THREE.Group(); scene.add(baseBook);
[-1, 1].forEach(function (sx) {
  var pg = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.16, 6.6), [
    new THREE.MeshLambertMaterial({ color: 0xefe6d2 }), new THREE.MeshLambertMaterial({ color: 0xefe6d2 }),
    new THREE.MeshLambertMaterial({ map: pageTex(sx > 0) }), new THREE.MeshLambertMaterial({ color: 0xe4d8c0 }),
    new THREE.MeshLambertMaterial({ color: 0xefe6d2 }), new THREE.MeshLambertMaterial({ color: 0xefe6d2 })
  ]);
  pg.position.set(sx * 2.62, -0.08, 0); pg.receiveShadow = true; pg.castShadow = true;
  baseBook.add(pg);
});
var coverM = new THREE.Mesh(new THREE.BoxGeometry(10.7, 0.06, 6.9), new THREE.MeshLambertMaterial({ color: 0xe56d17 }));
coverM.position.y = -0.19; baseBook.add(coverM);

/* ===================== 活页底板 ===================== */
var BASE = 0.1;
var BOARD = { x0: -4.1, x1: 4.1, z0: -2.35, z1: 2.35 };
var live = new THREE.Group(); scene.add(live);
var boardTex = ctex(512, 300, function (g, w, h) {
  g.fillStyle = '#fffaf0'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(214,196,160,.55)'; g.lineWidth = 1;

function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  var portrait = w / h < 0.85;
  var tgt = new THREE.Vector3(portrait ? 0 : 0.25, 0.65, portrait ? 0.1 : 0.02);
  var dir = portrait ? new THREE.Vector3(0.25, 0.72, 0.65).normalize() : new THREE.Vector3(0, 0.64, 0.77).normalize();
  var needW = portrait ? 6.4 : 8.7, needH = portrait ? 9.5 : 6.1;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max(needW / 2 / Math.tan(hf / 2), needH / 2 / Math.tan(vf / 2) * 0.84);
  camera.position.copy(tgt).addScaledVector(dir, d);
  camera.lookAt(tgt);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);

  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}

  var n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);

    guideBarEl.classList.remove('flash');
    void guideBarEl.offsetWidth;
    guideBarEl.classList.add('flash');

var P = null, hovered = null, now = 0;
var pickables = [curtainM];
bfG.traverse(function (o) { if (o.isMesh) pickables.push(o); });
rDog.g.traverse(function (o) { if (o.isMesh && o !== rDogGlow) pickables.push(o); });
tDog.g.traverse(function (o) { if (o.isMesh && o !== tDogGlow) pickables.push(o); });
FOODS.forEach(function (fd) { fd.g.traverse(function (o) { if (o.isMesh) pickables.push(o); }); });

var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptmp = new THREE.Vector3();
function setNDC(e) { ndc.x = (e.clientX / window.innerWidth) * 2 - 1; ndc.y = -(e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(ndc, camera); }
function planePoint(e, y) { setNDC(e); dragPlane.constant = -y; return raycaster.ray.intersectPlane(dragPlane, ptmp) ? ptmp.clone() : null; }
function pick(e) {
  setNDC(e);
  var h = raycaster.intersectObjects(pickables, false)[0];
  if (!h) return null;
  return { kind: h.object.userData.kind, food: h.object.userData.food || null };
}

canvas.addEventListener('pointerdown', function (e) {
  audio(); welcomeVoiceOnce(); stopDemo(); introSkip();
  var h = pick(e);
  if (!h) return;
  P = { kind: h.kind, food: h.food, x: e.clientX, y: e.clientY, mode: 'pending', e: { clientX: e.clientX, clientY: e.clientY } };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
});

canvas.addEventListener('pointermove', function (e) {
  if (P) {
    var moved = Math.hypot(e.clientX - P.x, e.clientY - P.y);
    P.e = { clientX: e.clientX, clientY: e.clientY };
    if (P.mode === 'pending' && moved > 6) {
      if (P.kind === 'food') { P.mode = 'drag'; P.food.dragging = true; ghost.off = true; }
      else if (P.kind === 'curtain' || P.kind === 'butterfly') { P.mode = 'done'; ghost.off = true; shakeCurtain(); }
    }
    return;
  }
  hovered = pick(e);
  canvas.style.cursor = hovered ? 'pointer' : 'default';
});

function finishPointer() {
  if (!P) return;
  if (P.mode === 'drag') {
    var fd = P.food; fd.dragging = false;
    if (fd.id === 'nectar') {
      if (Math.hypot(fd.cur.x - WIN_POS.x, fd.cur.z - WIN_POS.z) < 2.2) {
        fd.target.set(WIN_POS.x - 0.1, BASE + 0.05, WIN_POS.z + 1.05);
        feedButterfly(fd.target);
      } else {
        if (Math.hypot(fd.cur.x - rDog.pos.x, fd.cur.z - rDog.pos.z) < 1.35 || Math.hypot(fd.cur.x - tDog.pos.x, fd.cur.z - tDog.pos.z) < 1.35) {
          sNope();
          floatWord('蝴蝶爱吃花蜜!', 'hú dié ài chī huā mì', fd.cur.clone().add(new THREE.Vector3(0, 0.7, 0)), 'cool');
        }
        fd.target.copy(fd.home);
      }
    } else {
      var dr = Math.hypot(fd.cur.x - rDog.pos.x, fd.cur.z - rDog.pos.z);
      var dt = Math.hypot(fd.cur.x - tDog.pos.x, fd.cur.z - tDog.pos.z);
      if (dr < 1.35) { fd.target.set(rDog.pos.x, BASE + 0.05, rDog.pos.z + 0.72); feedRealDog(fd.target); }
      else if (dt < 1.35) { testToyDogFood(); fd.target.copy(fd.home); }
      else {
        if (Math.hypot(fd.cur.x - WIN_POS.x, fd.cur.z - WIN_POS.z) < 2.0) {
          sNope();
          floatWord('小狗爱吃狗粮!', 'xiǎo gǒu ài chī gǒu liáng', fd.cur.clone().add(new THREE.Vector3(0, 0.7, 0)), 'cool');
        }
        fd.target.copy(fd.home);
      }
    }
  } else if (P.mode === 'pending') {
    ghost.off = true;
    if (P.kind === 'curtain' || P.kind === 'butterfly') shakeCurtain();
    else if (P.kind === 'realDog') petRealDog();
    else if (P.kind === 'toyDog' || P.kind === 'windKey') toggleWindToyDog();
    else if (P.kind === 'food') {
      var f = P.food;
      if (f.id === 'nectar') {
        var toN = new THREE.Vector3(WIN_POS.x - 0.1, BASE + 0.05, WIN_POS.z + 1.05);
        f.flying = { from: f.cur.clone(), to: toN, t: 0, cb: function () { feedButterfly(toN); } };
      } else {
        var toB = new THREE.Vector3(RDOG_HOME.x, BASE + 0.05, RDOG_HOME.z + 0.72);
        f.flying = { from: f.cur.clone(), to: toB, t: 0, cb: function () { feedRealDog(toB); } };
      }
    }
  }
  P = null;
}

var demo = null;

  ['curtain'], ['wait', 2.2],

function startDemo() { resetAll(true); demo = { i: 0, t: 0 }; ghost.off = true; $('#demoBtn').classList.add('on'); $('#demoBtn').textContent = '■ 停止'; }
function stopDemo() { if (!demo) return; demo = null; $('#demoBtn').classList.remove('on'); $('#demoBtn').textContent = '▶ 演示'; }
function stepDemo(dt) {
  if (!demo) return;

/* ===================== 开场与重来 ===================== */
var intro = { t: 0, done: false };
function introSkip() { if (intro.t < 1.5) intro.t = 1.5; }
function backOut(t) { var c = 1.7; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4);
  var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift;
  figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.01, backOut((t - 0.3) / 0.5)), 1);
  var p1 = Math.max(0.01, backOut((t - 0.5) / 0.55));
  winG.scale.setScalar(p1); bfG.scale.setScalar(p1);
  rDog.pop = p1; tDog.pop = p1;
  FOODS.forEach(function (fd, i) { fd.pop = Math.max(0.01, backOut((t - 0.72 - i * 0.1) / 0.48)); });
  if (t >= 3.4) intro.done = true;
}

/* ===================== 主循环 ===================== */
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);

  // 蓝窗帘波浪摆动
  if (curtWave > 0) curtWave = Math.max(0, curtWave - dt * 0.65);
  var cPos = curtGeo.attributes.position;
  for (var i = 0; i < cPos.count; i++) {
    var x0 = curtBase[i * 3], y0 = curtBase[i * 3 + 1];
    var frac = Math.min(1, -y0 / CURT_H);
    var pleat = Math.sin(x0 * 11) * 0.045;
    var sway = Math.sin(now * 10 + x0 * 4 - frac * 3) * curtWave * 0.22 * frac + Math.sin(now * 2 + x0 * 3) * 0.025 * frac;
    cPos.setXYZ(i, x0 + sway * 0.55, y0, pleat + sway);
  }
  cPos.needsUpdate = true;
  curtGeo.computeVertexNormals();

  // 蝴蝶动画（停歇 / 受惊盘旋 / 飞来吸花蜜）
  if (bfState.mode === 'perch') {
    bfState.pos.lerp(bfPerch, 0.14);
    bfG.rotation.set(0.35, 0.2, 0);
    var slowWing = 0.25 + Math.sin(now * 2.2) * 0.15;
    wingL.rotation.y = slowWing; wingR.rotation.y = -slowWing;
  } else if (bfState.mode === 'circle') {
    bfState.t += dt;
    var u = bfState.t / 2.6;
    if (u >= 1) { bfState.mode = 'perch'; }
    else {
      var ang = u * Math.PI * 2;
      bfState.pos.set(
        WIN_POS.x + Math.sin(ang) * 0.95,
        BASE + 1.45 + Math.sin(ang * 2) * 0.38,
        WIN_POS.z + 0.95 - Math.cos(ang) * 0.65
      );
      bfG.rotation.set(0, -ang + Math.PI / 2, 0);
      var flap = Math.sin(now * 34) * 0.95;
      wingL.rotation.y = flap; wingR.rotation.y = -flap;
    }
  } else if (bfState.mode === 'sip') {
    bfState.t += dt;
    bfState.pos.lerp(bfState.sipTarget, 1 - Math.exp(-5 * dt));
    bfState.pos.y += Math.sin(now * 7) * 0.015;
    bfG.rotation.set(0.15, Math.sin(now * 3) * 0.3, 0);
    var sFlap = Math.sin(now * 26) * 0.85;
    wingL.rotation.y = sFlap; wingR.rotation.y = -sFlap;
    if (bfState.t > 0.7 && !bfState.sparked) { bfState.sparked = true; burst(bfState.sipTarget); }
    if (bfState.t > 2.8) { bfState.mode = 'perch'; bfState.sparked = false; FMAP.nectar.target.copy(FMAP.nectar.home); }
  }
  bfG.position.copy(bfState.pos);

  // 真小狗动画（呼吸、摇尾巴、啃狗粮、欢呼蹦跳）
  rDog.pos.lerp(rDog.target, 1 - Math.exp(-8 * dt));
  if (rDog.hop > 0) rDog.hop = Math.max(0, rDog.hop - dt * 2.5);
  if (rDog.munch > 0) {
    rDog.munch = Math.max(0, rDog.munch - dt);
    rdHead.rotation.x = 0.55 + Math.sin(now * 16) * 0.2;
    if (rDog.munch === 0) { rDog.target.copy(RDOG_HOME); FMAP.bowl.target.copy(FMAP.bowl.home); }
  } else {
    rdHead.rotation.x += (0 - rdHead.rotation.x) * 0.2;
  }
  if (rDog.wagBoost > 0) rDog.wagBoost = Math.max(0, rDog.wagBoost - dt);
  var wagSpeed = rDog.wagBoost > 0 ? 18 : 5.5;
  rdTail.rotation.z = Math.sin(now * wagSpeed) * (rDog.wagBoost > 0 ? 0.65 : 0.25);
  rDog.g.position.set(rDog.pos.x, rDog.pos.y + Math.sin(rDog.hop * Math.PI) * 0.35, rDog.pos.z);
  rDog.body.scale.setScalar(rDog.pop * (1 + Math.sin(now * 3) * 0.015));

  // 发条玩具狗动画（发条转动时生硬迈腿走，能量耗尽彻底停死）
  if (tDog.power > 0) {
    tDog.power = Math.max(0, tDog.power - dt);
    tDog.phase += dt * 10;
    keyG.rotation.y -= dt * 8;
    tDog.pos.z = TDOG_HOME.z + Math.sin(tDog.phase * 0.35) * 0.38;
    tdLegs.forEach(function (lg, idx) {
      lg.rotation.x = Math.sin(tDog.phase + (idx % 2 ? Math.PI : 0)) * 0.45;
    });
    if (tDog.power === 0) {
      tdLegs.forEach(function (lg) { lg.rotation.x = 0; });
      floatWord('停下来了!', 'tíng xià lái le', tDog.pos.clone().add(new THREE.Vector3(0, 1.15, 0)), 'cool');
    }
  } else {
    tdLegs.forEach(function (lg) { lg.rotation.x *= 0.85; });
  }
  tDog.g.position.copy(tDog.pos);
  tDog.body.scale.setScalar(tDog.pop);

  // 食物更新
  var nearRD = false, nearTD = false;
  var curGuide = getGuideInfo();
  var pulseBob = 0.5 + 0.5 * Math.sin(now * 5.2);
  var kk = 1 - Math.exp(-16 * dt);
  FOODS.forEach(function (fd) {
    if (fd.dragging && P && P.e) {
      var fp = planePoint(P.e, BASE + 0.65);
      if (fp) fd.target.set(THREE.MathUtils.clamp(fp.x, BOARD.x0, BOARD.x1), BASE + 0.65, THREE.MathUtils.clamp(fp.z, BOARD.z0, BOARD.z1));
      if (fd.id === 'bowl') {
        if (Math.hypot(fd.cur.x - rDog.pos.x, fd.cur.z - rDog.pos.z) < 1.35) nearRD = true;
        if (Math.hypot(fd.cur.x - tDog.pos.x, fd.cur.z - tDog.pos.z) < 1.35) nearTD = true;
      }
    } else if (fd.flying) {
      fd.flying.t += dt / 0.6;
      var u = Math.min(1, fd.flying.t), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      fd.target.lerpVectors(fd.flying.from, fd.flying.to, e);
      fd.target.y += Math.sin(u * Math.PI) * 0.65;
      if (u >= 1) { var cb = fd.flying.cb; fd.flying = null; if (cb) cb(); }
    }
    fd.cur.lerp(fd.target, fd.dragging ? 1 - Math.exp(-22 * dt) : kk);
    var hv = (hovered && hovered.food === fd && !P) ? 1 : 0;
    fd.hover += (hv - fd.hover) * 0.25;
    var pulseFd = !celebrated && !fd.dragging && !fd.flying && (
      (curGuide.pulse === 'butterfly' && fd.id === 'nectar') ||
      (curGuide.pulse === 'feedDog' && fd.id === 'bowl')
    );
    fd.g.position.set(fd.cur.x, fd.cur.y + fd.hover * 0.08 + (pulseFd ? pulseBob * 0.1 : 0), fd.cur.z);
    fd.body.scale.setScalar(fd.pop * (1 + (pulseFd ? pulseBob * 0.08 : 0)));

    var showL = (intro.t > 0.8 && intro.t < 3.4) || fd.hover > 0.4 || fd.dragging || pulseFd;
    if (showL) {
      var p2 = toScreen(fd.cur.clone().add(new THREE.Vector3(0, fd.h + 0.14, 0)));
      fd.lbl.style.transform = 'translate(' + p2.x + 'px,' + p2.y + 'px) translate(-50%,-100%)';
    }
    fd.lbl.classList.toggle('show', !!showL);
  });

  var pulseRD = !celebrated && (curGuide.pulse === 'bothDogs' || curGuide.pulse === 'realDog' || curGuide.pulse === 'feedDog');
  var pulseTD = !celebrated && (curGuide.pulse === 'bothDogs' || curGuide.pulse === 'toyDog');
  rDogGlow.material.opacity += ((nearRD ? 0.85 : (pulseRD ? 0.25 + pulseBob * 0.42 : 0)) - rDogGlow.material.opacity) * 0.25;
  tDogGlow.material.opacity += ((nearTD ? 0.85 : (pulseTD ? 0.25 + pulseBob * 0.42 : 0)) - tDogGlow.material.opacity) * 0.25;

  // 场景标签（引导阶段清晰标出真小狗和玩具狗，彻底解决不知道怎么区分两只狗）
  var showIntro = intro.t > 0.8 && intro.t < 3.4;
  var showC = showIntro || (hovered && hovered.kind === 'curtain') || (!celebrated && curGuide.pulse === 'butterfly');
  if (showC) {
    var pc = toScreen(new THREE.Vector3(WIN_POS.x - 0.55, BASE + 2.15, WIN_POS.z + 0.2));
    curtLbl.style.transform = 'translate(' + pc.x + 'px,' + pc.y + 'px) translate(-50%,-100%)';
  }
  curtLbl.classList.toggle('show', !!showC);

  var showBf = showIntro || (hovered && hovered.kind === 'butterfly') || bfState.mode !== 'perch';
  if (showBf) {
    var pbf = toScreen(bfState.pos.clone().add(new THREE.Vector3(0, 0.28, 0)));
    bfLbl.style.transform = 'translate(' + pbf.x + 'px,' + pbf.y + 'px) translate(-50%,-100%)';
  }
  bfLbl.classList.toggle('show', !!showBf);

  var showRD = showIntro || nearRD || pulseRD || (hovered && hovered.kind === 'realDog');
  if (showRD) {
    var prd = toScreen(rDog.pos.clone().add(new THREE.Vector3(0, 0.98, 0)));
    rDogLbl.style.transform = 'translate(' + prd.x + 'px,' + prd.y + 'px) translate(-50%,-100%)';
  }
  rDogLbl.classList.toggle('show', !!showRD);

  var showTD = showIntro || nearTD || pulseTD || (hovered && (hovered.kind === 'toyDog' || hovered.kind === 'windKey'));
  if (showTD) {
    var ptd = toScreen(tDog.pos.clone().add(new THREE.Vector3(0, 1.05, 0)));
    tDogLbl.style.transform = 'translate(' + ptd.x + 'px,' + ptd.y + 'px) translate(-50%,-100%)';
  }
  tDogLbl.classList.toggle('show', !!showTD);

  // 星光粒子
  sparkles.forEach(function (p) {
    if (p.life <= 0) { p.m.visible = false; return; }
    p.life -= dt;
    p.v.y -= 4.0 * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(Math.max(0.01, p.life * 1.8));
  });

  updateGhost(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.35 : 1;
  renderer.render(scene, camera);
}

/* ===================== 按钮、小测验与自测钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio(); dismissCues(); introSkip();
  voiceOn = true; voiceWelcomed = true;
  this.classList.add('on'); this.textContent = '🔊 语音';
  voiceCueTimer = 4.0; ghost.t = 0;
  updateGuide(true, true);
});
$('#ntToggle').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  this.textContent = c ? '展开' : '收起';
});
document.querySelectorAll('#quizOpts .qopt').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio();
    var ok = this.getAttribute('data-ok') === '1';
    var fb = $('#quizFb');
    if (ok) {
      document.querySelectorAll('#quizOpts .qopt').forEach(function (b) { b.classList.remove('err'); });
      this.classList.add('ok');
      fb.className = 'quiz-fb ok';
      fb.textContent = '🌸 太棒了！获得本课小红花！真小狗是生物，会高兴地吃狗粮！';
      sWin();
      launchConfetti();
      saveProgress('k1a-06', true);
      speak('太棒了！答对啦，获得本课小红花！真小狗是有生命的生物，会高兴地吃狗粮！', true);
    } else {
      this.classList.add('err');
      fb.className = 'quiz-fb err';
      fb.textContent = '再想想哦～玩具狗没有生命，只会靠发条动，哪一只小狗会吃狗粮呀？';
      sNope();
      speak('再想想哦，玩具狗没有生命不会吃食物，哪一只小狗会高兴地吃狗粮呢？', true);
    }
  });
});
$('#winKeep').addEventListener('click', function () { $('#winToast').classList.remove('show'); });
$('#winAgain').addEventListener('click', function () { resetAll(false); });
$('#demoBtn').addEventListener('click', function () { audio(); dismissCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, ms: ms }; },
  startDemo: startDemo
};

updateGuide(false, false);
fit();
requestAnimationFrame(frame);
})();
</script>

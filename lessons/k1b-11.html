<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第11课 设计一座纸桥 · 3D 搭桥积木桌</title>
<style>
:root{--accent:#e56d17;--ink:#2a2218;--line:#d8ccb8;--card:rgba(255,252,246,.95);--blue:#2563eb}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#233042;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.46em;color:#7a6a52;font-weight:500}
body.no-py rt{display:none}

/* 左上标题卡片 */
#hudTL{position:fixed;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 18px rgba(10,18,32,.32)}
#backBtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:#5c4b34;font-size:18px;font-weight:900}
#backBtn:hover{border-color:var(--accent);color:var(--accent)}
.hd-t{font-size:16px;font-weight:900;line-height:1.5}
.hd-sub{font-size:11.5px;color:#6e5e49;font-weight:700}

/* 顶部中央动态分步小助手（U2） */
#guideBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(450px,calc(100vw - 640px));display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:15px;background:rgba(255,250,240,.97);
  border:2px solid #f08a24;box-shadow:0 6px 20px rgba(10,18,32,.28);
  font-size:13.5px;font-weight:800;color:#753a07;cursor:pointer;line-height:1.4;transition:transform .16s}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.pulse{animation:guidePop .45s ease}
@keyframes guidePop{0%{transform:translateX(-50%) scale(.94)}50%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}

/* 右上工具条 + 顶部防遮挡入口微标签（U2） */
#hudTR{position:fixed;top:12px;right:12px;z-index:7;display:flex;align-items:center;gap:6px}
.tbtn-wrap{position:relative;display:inline-flex}
.tbtn{height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:800;color:#4a3c28;cursor:pointer;
  box-shadow:0 3px 0 #b8ab96;transition:all .14s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#b8500a;color:#fff;box-shadow:0 3px 0 #b8500a}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#ffedd5;border:1.5px solid var(--accent);color:#b44908;font-size:10.5px;font-weight:900;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(229,109,23,.28);
  animation:cuePop 1.6s ease-in-out infinite;transition:opacity .25s}
body.interacted .entry-cue{opacity:0;animation:none}
@keyframes cuePop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}

/* 右上可收起窄版发现栏（D3 防遮挡铁律） */
#notes{position:fixed;top:60px;right:12px;z-index:6;width:224px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 20px rgba(10,18,32,.26)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nt-title{font-size:13.5px;font-weight:900}
.nt-cnt{font-size:12.5px;font-weight:900;color:var(--accent)}
.nt-tog{padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:800;color:#6c5c45;cursor:pointer}
.stamps{display:flex;gap:4px;margin-bottom:6px}
.st{flex:1;text-align:center;padding:3px 2px;border-radius:8px;font-size:11px;font-weight:800;
  border:1.5px dashed #d7c5a4;color:#9b8a70;background:#faf4e8;transition:all .2s;line-height:1.4}
.st.lit{border-style:solid;border-color:var(--accent);background:#fff2df;color:#b8500a;animation:stPop .4s ease}
@keyframes stPop{0%{transform:scale(.75)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList{display:none}
.stk{padding:5px 8px;border-radius:10px;background:#fff;border:1px solid #ece0c9;font-size:12px;font-weight:700;line-height:1.4}

/* 左上纸张用量视觉纸张格 */
#matCard{position:fixed;left:12px;top:82px;z-index:5;width:196px;padding:9px 11px;border-radius:15px;
  background:rgba(255,252,246,.95);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(10,18,32,.24)}
.mc-h{font-size:12.5px;font-weight:900;color:#5a3712;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.mc-badge{padding:1px 7px;border-radius:99px;font-size:11px;font-weight:900;background:#ecfdf3;color:#15803d;border:1px solid #86efac}
.mc-badge.warn{background:#fef2f2;color:#b91c1c;border-color:#fca5a5}
.mc-sheets{display:flex;gap:4px;margin:6px 0}
.mc-sh{flex:1;height:14px;border-radius:4px;border:1.5px solid #94a3b8;background:#e2e8f0;transition:all .2s}
.mc-sh.used{background:#2563eb;border-color:#1d4ed8}
.mc-sh.over{background:#ef4444;border-color:#b91c1c}
.mc-row{font-size:11.5px;font-weight:700;color:#5d4e3b;line-height:1.45}

/* 3D 浮动微标签与飘字（深蓝工程垫板上超高清晰度） */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 11px;border-radius:99px;
  background:rgba(15,23,42,.92);color:#fff;font-size:13px;font-weight:800;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.32);opacity:0;transition:opacity .18s}
.lbl.show{opacity:1}
.lbl.hi{background:#e56d17}
.lbl rt{color:#ffe4be}
.tag3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 9px;border-radius:99px;
  background:rgba(15,31,51,.92);border:1.5px solid #7dd3fc;color:#f0f9ff;font-size:11.5px;font-weight:900;
  white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.32);opacity:0;transition:opacity .18s}
.tag3d.show{opacity:1}
.tag3d.glow{background:#ea580c;border-color:#fde047;color:#ffffff;box-shadow:0 3px 12px rgba(234,88,12,.45)}
.tag3d.done{background:#15803d;border-color:#86efac;color:#ffffff}
.cue3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:5px 13px;border-radius:99px;
  background:#fff7ed;border:2px solid #f97316;color:#9a3412;font-size:13px;font-weight:900;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.35);animation:cueBob 1.3s ease-in-out infinite;display:none;pointer-events:none}
.cue3d.show{display:block}
@keyframes cueBob{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-6px)}}
.float-msg{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:18px;font-weight:900;
  color:#fef08a;text-shadow:0 2px 6px rgba(0,0,0,.78),0 0 2px rgba(0,0,0,.9);white-space:nowrap;animation:fUp 1.55s ease-out forwards}
.float-msg.ok{color:#86efac}
.float-msg.bad{color:#fca5a5}
@keyframes fUp{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* 底部极简双图标视角切换坞（严格仅2个按钮！） */
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:18px;
  background:rgba(255,252,246,.96);border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(10,18,32,.34)}
.stab{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:12px;
  border:1.5px solid #e4d5ba;background:#fff;font:inherit;font-size:14.5px;font-weight:900;
  color:#54442f;cursor:pointer;transition:all .15s}
.stab:hover{border-color:var(--accent);color:var(--accent)}
.stab.on{background:var(--accent);border-color:#b8500a;color:#fff;box-shadow:0 3px 0 #b8500a}
.stab.on rt{color:#ffe4c4}
.stab.glow{animation:btnPulse 1.2s ease-in-out infinite;border-color:#e56d17}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 0 0 9px rgba(229,109,23,0)}}

/* 通关彩带 + 结论与1题巩固弹窗 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#winToast{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(15,23,42,.48);padding:16px}
#winToast.show{display:grid}
.win-card{width:min(458px,100%);max-height:86vh;overflow-y:auto;background:#fffdf8;
  border:2.5px solid var(--accent);border-radius:22px;padding:18px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(10,18,32,.38)}
.win-concl{margin:10px 0;padding:10px 12px;border-radius:13px;background:#fff8eb;border:1.5px solid #f2cf9b;
  text-align:left;font-size:13.5px;line-height:1.6;color:#5a3309;font-weight:700}
.win-quiz{margin:10px 0;padding:10px 12px;border-radius:13px;background:#f8fafc;border:1.5px solid #d9e2ec;text-align:left}
.win-quiz h4{margin:0 0 8px;font-size:13.5px;color:#2b3a4a}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{padding:8px 11px;border-radius:11px;border:1.5px solid #d9d0be;background:#fff;
  font:inherit;font-size:13px;font-weight:800;text-align:left;cursor:pointer;transition:all .14s;color:#2a2218}
.qopt:hover{border-color:var(--accent);background:#fff9f0}
.qopt.ok{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e}
.qopt.bad{border-color:#e03131;background:#fff5f5;color:#c92a2a}
.qfb{margin-top:7px;font-size:12.5px;font-weight:800;min-height:18px}
.win-acts{display:flex;justify-content:center;gap:10px;margin-top:12px}

@media (max-width:1120px){
  #guideBar{top:62px;left:12px;transform:none;max-width:calc(100vw - 260px)}
  #matCard{top:114px;width:176px}
}
@media (max-width:760px){
  #matCard{display:none}
  #notes{width:190px;top:56px}
  .stab{font-size:13px;padding:7px 14px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels">
  <div class="cue3d" id="targetCue">👆 点桥面</div>
</div>
<canvas id="confetti"></canvas>

<div id="hudTL">
  <a id="backBtn" href="../index.html" title="返回书包">‹</a>
  <div>
    <div class="hd-t" data-py="dì kè shè jì yí zuò zhǐ qiáo">第11课 设计一座纸桥</div>
    <div class="hd-sub">活页 · 课本第 50 页「3D 工程蓝图搭桥桌」</div>
  </div>
</div>

<div id="guideBar" title="点我重听当前步骤">
  <span id="guideIco">🔍</span>
  <span id="guideTxt">第1步：直接点3D桥梁的桥面、桥身、桥墩和桥台，认识4大部件！</span>
</div>

<div id="hudTR">
  <span class="tbtn-wrap"><button class="tbtn on" id="voiceBtn" type="button">🔊 语音</button><span class="entry-cue">点我听玩法</span></span>
  <span class="tbtn-wrap"><button class="tbtn" id="demoBtn" type="button">▶ 演示</button><span class="entry-cue">不会玩点演示</span></span>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="matCard">
  <div class="mc-h"><span>📄 A4 纸限量</span><span class="mc-badge" id="paperBadge">已用 0 / 5 张</span></div>
  <div class="mc-sheets" id="paperBars">
    <span class="mc-sh"></span><span class="mc-sh"></span><span class="mc-sh"></span><span class="mc-sh"></span><span class="mc-sh"></span>
  </div>
  <div class="mc-row" id="matSub">拖蓝图板零件搭桥 · 拖2枚硬币试压</div>
</aside>

<aside id="notes">
  <div class="nt-head">
    <span class="nt-title" data-py="wǒ de fā xiàn">我的发现</span>
    <span class="nt-cnt" id="ntCnt">0</span>
    <button class="nt-tog" id="ntTog" type="button">收起</button>
  </div>
  <div class="stamps">
    <span class="st" id="st1" data-py="rèn shi bù jiàn">认识部件</span>
    <span class="st" id="st2" data-py="lán tú pīn zhuāng">蓝图拼装</span>
    <span class="st" id="st3" data-py="shì yā dá biāo">试压达标</span>
  </div>
  <div id="ntList"></div>
</aside>

<div id="dock">
  <button class="stab on" id="tabStage1" type="button">🔍 <span data-py="rèn bù jiàn">认部件</span></button>
  <button class="stab" id="tabStage2" type="button">🛠️ <span data-py="dā zhǐ qiáo">搭纸桥</span></button>
</div>

<div id="winToast">
  <div class="win-card">
    <div style="font-size:38px">🏆</div>
    <h3 style="margin:4px 0" data-py="tài bàng la xiǎo gōng chéng shī shè jì dá biāo">太棒啦！小工程师设计达标！</h3>
    <div class="win-concl">
      <b>✨ 科学小结论：</b>造桥前要先明确任务和材料限制（5张A4纸、胶带、剪刀），设计包含桥面和桥墩的草图，合理的折纸形状（凹槽、波浪瓦楞）能让纸桥更稳固。
    </div>
    <div class="win-quiz">
      <h4>💡 考考你 · 答对领小红花 🌸</h4>
      <div style="font-size:13px;font-weight:800;margin-bottom:8px">设计一座能稳托两枚一角硬币的纸桥，哪种蓝图最合理？</div>
      <div class="qopts" id="qOpts">
        <button class="qopt" type="button" data-ok="1">🌉 有桥墩和主梁胶带固定、桥面折成凹槽或波浪，用纸不超过5张</button>
        <button class="qopt" type="button" data-hint="平铺一张纸没有桥墩支撑，放上硬币就会塌掉哦，再想想！">📄 只平铺一张纸，不加桥墩也不加胶带</button>
        <button class="qopt" type="button" data-hint="制作纸桥要遵守材料限制，只能用5张使用过的A4纸哦！">🧱 超过材料限制，用20张新纸堆成实心砖</button>
      </div>
      <div class="qfb" id="qFb"></div>
    </div>
    <div class="win-acts">
      <button class="tbtn" id="winKeepBtn" type="button">继续搭桥</button>
      <button class="tbtn on" id="winAgainBtn" type="button">再玩一次</button>
    </div>
  </div>
</div>

<script src="../vendor/three.min.js"></script>
<script src="../audio/manifest.js"></script>
<script src="../vendor/voice.js"></script>
<script>
(function () {
'use strict';

try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}

var LESSON_ID = 'k1b-11';
var BOOK_PROGRESS_KEY = 'xk_k1b_progress';

var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var HAN = /[\u3400-\u9fff]/;
var pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function ruby(text, py) {
  if (!py) return esc(text);
  var syl = py.trim().split(/\s+/), i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) {
      var p = syl[i++]; if (!p) { pyErrors.push(text); p = ''; }
      out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>';
    } else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
$$('[data-py]').forEach(function (el) { el.innerHTML = ruby(el.textContent, el.dataset.py); });

$('#backBtn').addEventListener('click', function () {
  try { sessionStorage.setItem('xk_last_vol', 'k1b'); } catch (e) {}
});

/* ===== 语音与轻音效 ===== */
var voiceOn = true;
function stopVoice() {
  if (window.__xkVoice) window.__xkVoice.stop();
  else if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (e) {}
}
function speak(text, force) {
  if (!text || (!voiceOn && !force)) return;
  if (window.__xkVoice) { window.__xkVoice.speak(text); return; }
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.94; u.pitch = 1.08; window.speechSynthesis.speak(u); } catch (e) {}
}

var audioCtx = null;
function playTone(freq, dur, type, vol, delay) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (dur || 0.18));
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + (dur || 0.18) + 0.02);
  } catch (e) {}
}
function sfxPop() { playTone(560, 0.12, 'triangle', 0.11); playTone(760, 0.14, 'triangle', 0.1, 0.06); }
function sfxSnap() { playTone(480, 0.08, 'triangle', 0.12); playTone(820, 0.12, 'triangle', 0.11, 0.05); }
function sfxCoin() { playTone(1680, 0.11, 'sine', 0.1); playTone(2320, 0.14, 'sine', 0.08, 0.04); }
function sfxFail() { playTone(260, 0.18, 'sawtooth', 0.08); playTone(185, 0.28, 'sawtooth', 0.08, 0.12); }
function sfxWin() { [523, 659, 784, 1046].forEach(function (f, i) { playTone(f, 0.24, 'triangle', 0.13, i * 0.09); }); }

function saveProgress(id, hasFlower) {
  try {
    var d = JSON.parse(localStorage.getItem(BOOK_PROGRESS_KEY) || '{}');
    d[id] = { done: true, flower: !!(hasFlower || (d[id] && d[id].flower)), ts: Date.now() };
    localStorage.setItem(BOOK_PROGRESS_KEY, JSON.stringify(d));
  } catch (e) {}
}

/* ===== 彩带粒子 ===== */
var cfCv = $('#confetti'), cfCtx = cfCv.getContext('2d'), cfList = [];
function launchConfetti() {
  cfCv.width = window.innerWidth; cfCv.height = window.innerHeight;
  cfList = [];
  var cols = ['#f97316', '#facc15', '#22c55e', '#3b82f6', '#ec4899', '#a855f7'];
  for (var i = 0; i < 95; i++) {
    cfList.push({
      x: cfCv.width * (0.15 + Math.random() * 0.7), y: -20 - Math.random() * 140,
      vx: (Math.random() - 0.5) * 210, vy: 110 + Math.random() * 210,
      w: 7 + Math.random() * 6, h: 5 + Math.random() * 5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 9,
      c: cols[i % cols.length], life: 3.4
    });
  }
}

/* ===== Three.js 场景（深胡桃木桌 + 藏青蓝图工程垫板 + 柔和不刺眼光照） ===== */
var cv = $('#cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = new THREE.Color('#233042');

// 锐利描边辅助函数（让所有纸桥零件像立体浮雕般轮廓分明！）
function addOutline(mesh, col, angle) {
  var edges = new THREE.EdgesGeometry(mesh.geometry, angle || 24);
  var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: col || '#334155' }));
  line.userData = { ignoreHit: true };
  mesh.add(line);
  return mesh;
}

/* ===== 程序化高对比度纹理（深胡桃木纹、藏青蓝图网格、砖纹桥台、金属硬币） ===== */
function makeWalnutDeskTex() {
  var c = document.createElement('canvas'); c.width = 512; c.height = 512;
  var g = c.getContext('2d');
  g.fillStyle = '#4a3525'; g.fillRect(0, 0, 512, 512);
  for (var y = 0; y < 512; y += 8) {
    g.fillStyle = (y % 16 === 0) ? 'rgba(36,22,12,0.22)' : 'rgba(98,70,48,0.12)';
    g.fillRect(0, y, 512, 4);
  }
  g.strokeStyle = 'rgba(28,17,10,0.18)'; g.lineWidth = 2;
  for (var i = 0; i < 18; i++) {
    g.beginPath();
    var yy = i * 30 + 6;
    g.moveTo(0, yy);
    g.bezierCurveTo(160, yy + (i % 2 ? 7 : -7), 350, yy + (i % 2 ? -6 : 6), 512, yy);
    g.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1.4);
  return tex;
}

function makeBlueprintMatTex() {
  var c = document.createElement('canvas'); c.width = 768; c.height = 1024;
  var g = c.getContext('2d');
  // 沉稳藏青工程蓝图底色
  var bg = g.createLinearGradient(0, 0, 768, 1024);
  bg.addColorStop(0, '#183654'); bg.addColorStop(1, '#122942');
  g.fillStyle = bg; g.fillRect(0, 0, 768, 1024);

  // 细白蓝图网格
  g.strokeStyle = 'rgba(148,210,255,0.14)'; g.lineWidth = 1;
  for (var x = 24; x < 768; x += 24) { g.beginPath(); g.moveTo(x, 18); g.lineTo(x, 1006); g.stroke(); }
  for (var y = 24; y < 1024; y += 24) { g.beginPath(); g.moveTo(18, y); g.lineTo(750, y); g.stroke(); }
  // 主网格线
  g.strokeStyle = 'rgba(186,230,253,0.26)'; g.lineWidth = 1.6;
  for (var x2 = 96; x2 < 768; x2 += 96) { g.beginPath(); g.moveTo(x2, 18); g.lineTo(x2, 1006); g.stroke(); }
  for (var y2 = 96; y2 < 1024; y2 += 96) { g.beginPath(); g.moveTo(18, y2); g.lineTo(750, y2); g.stroke(); }

  // 外圈双边框与刻度
  g.strokeStyle = 'rgba(224,242,254,0.72)'; g.lineWidth = 4;
  g.strokeRect(18, 18, 732, 988);
  g.strokeStyle = 'rgba(125,211,252,0.45)'; g.lineWidth = 2;
  g.strokeRect(30, 30, 708, 964);

  // 四大零件虚线分区框（分别对应桥墩、主梁、三桥面、硬币试压区）
  g.setLineDash([12, 8]);
  g.strokeStyle = 'rgba(224,242,254,0.52)'; g.lineWidth = 2.5;
  var zones = [
    [48, 56, 672, 200],   // 桥墩 & 剪刀
    [48, 282, 672, 186],  // 主梁+胶带
    [48, 494, 672, 224],  // 三种桥面区
    [48, 744, 672, 224]   // 1角硬币区
  ];
  zones.forEach(function (z) { g.strokeRect(z[0], z[1], z[2], z[3]); });
  g.setLineDash([]);

  // 底部蓝图工程角标
  g.fillStyle = 'rgba(186,230,253,0.78)';
  g.font = 'bold 22px "Microsoft YaHei", sans-serif';
  g.fillText('BLUEPRINT · 纸桥工程零件区', 52, 990);
  return new THREE.CanvasTexture(c);
}

function makeBrickTex() {
  var c = document.createElement('canvas'); c.width = 256; c.height = 256;
  var g = c.getContext('2d');
  g.fillStyle = '#c85a36'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#7c2d12'; g.lineWidth = 4;
  for (var row = 0; row < 8; row++) {
    var y = row * 32;
    g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke();
    var off = (row % 2) * 32;
    for (var col = -32; col < 256; col += 64) {
      g.beginPath(); g.moveTo(col + off, y); g.lineTo(col + off, y + 32); g.stroke();
    }
  }
  return new THREE.CanvasTexture(c);
}

function makeCoinTex() {
  var c = document.createElement('canvas'); c.width = 160; c.height = 160;
  var g = c.getContext('2d');
  // 金属银灰厚重质感，绝不泛白！

  gr.addColorStop(0, '#dce3ec');

  g.fillStyle = gr; g.beginPath(); g.arc(80, 80, 76, 0, Math.PI * 2); g.fill();
  // 双层深色浮雕外圈
  g.strokeStyle = '#1e293b'; g.lineWidth = 6; g.beginPath(); g.arc(80, 80, 73, 0, Math.PI * 2); g.stroke();

  // 深蓝“1角”大字

  return new THREE.CanvasTexture(c);
}

function makeRolledPierMesh(radius, height, userDataObj) {
  var pg = new THREE.Group();
  var cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.04, height, 18), pierKraftMat);
  cyl.position.y = height * 0.5;
  cyl.castShadow = true; cyl.receiveShadow = true;
  if (userDataObj) cyl.userData = userDataObj;
  addOutline(cyl, '#5c4221', 35);
  pg.add(cyl);

  // 纵向深灰棕卷纸接缝线
  var seam = new THREE.Mesh(new THREE.BoxGeometry(0.024, height + 0.01, 0.03), pierSeamMat);
  seam.position.set(0, height * 0.5, radius * 0.94);
  seam.userData = { ignoreHit: true };
  pg.add(seam);

  // 顶部圆孔阴影（一眼看出是空心卷纸柱！）
  var hole = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.62, 16), pierHoleMat);
  hole.rotation.x = -Math.PI / 2;
  hole.position.y = height + 0.005;
  hole.userData = { ignoreHit: true };
  pg.add(hole);
  return { grp: pg, hitMesh: cyl };
}

function makeTagEl(text) {
  var d = document.createElement('div');
  d.className = 'tag3d';
  d.textContent = text;

  return d;
}

function registerTrayItem(key, grp, homePos, tagText, isCoin, hitGeo, hitY) {
  grp.position.copy(homePos);
  var hits = [];
  grp.traverse(function (m) {
    if (m.isMesh) {
      if (m.userData && m.userData.ignoreHit) return;
      m.castShadow = true; m.receiveShadow = true;
      m.userData = { dragKey: key, isCoin: !!isCoin };
      hits.push(m);
      trayHitMeshes.push(m);
    }
  });
  if (hitGeo) {
    var hb = new THREE.Mesh(hitGeo, HIT_MAT);
    hb.position.y = hitY || 0.22;
    hb.userData = { dragKey: key, isCoin: !!isCoin, isHitBox: true };
    grp.add(hb);
    hits.push(hb);
    trayHitMeshes.push(hb);
  }
  stage2Grp.add(grp);
  trayItems[key] = {
    key: key, grp: grp, homePos: homePos.clone(), targetPos: homePos.clone(),
    tagEl: makeTagEl(tagText), tagText: tagText, installed: false, isCoin: !!isCoin,
    coinSlotIdx: -1, hits: hits
  };
}

  }

  var used = calcUsedSheets();
  if (!built.piers) {
    bridgePhys.outcome = 'no_pier';
    bridgePhys.targetBend = 0.28;
    bridgePhys.targetDropY = -0.38;
    bridgePhys.targetSplay = 0;

  } else if (!built.girder) {
    bridgePhys.outcome = 'no_girder';
    bridgePhys.targetSplay = 0.44;
    bridgePhys.targetBend = 0.32;
    bridgePhys.targetDropY = 0;

    bridgePhys.targetSplay = 0;
    bridgePhys.targetDropY = 0;

        addDiscovery('asm_complete', 's2', '🛠️ 蓝图拼装完成：桥墩 + 主梁胶带 + 抗弯桥面（共 5 张纸）', null);

      addDiscovery('check_pass', 's3', '✅ 试压达标：用纸 ' + used + ' 张，稳稳托住 2 枚 1 角硬币！',

function placeCoinOnBridge(key, silent) {
  var it = trayItems[key];
  if (!it || !it.isCoin) return;

    it.targetPos.copy(it.homePos);

/* ===== 拖拽交互与射线检测 ===== */
var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.95);
var dragHitPt = new THREE.Vector3();
var dragState = null;

function setPtrFromEvent(e) {
  var r = cv.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
}

cv.addEventListener('pointerdown', function (e) {
  markInteracted();
  setPtrFromEvent(e);

  if (curStage === 1) {
    var pHits = ray.intersectObjects(s1Props, false);
    if (pHits.length) {
      var sp = pHits[0].object.userData.s1Prop;
      sfxPop();
      if (sp === 'paper') speak('这是限量材料：5张使用过的A4纸，搭纸桥时最多只能用5张哦！');
      else speak('这是胶带，搭纸桥时用来固定桥墩、主梁和桥面！');
      return;
    }
    var hitBoxes = ray.intersectObjects(partHitMeshes, false);
    if (hitBoxes.length) {
      inspectPart(hitBoxes[0].object.userData.partKey);
      return;
    }
    var hits = ray.intersectObjects(partMeshes, false);
    if (hits.length) {
      inspectPart(hits[0].object.userData.partKey);
    }
    return;
  }

  var visTrayHits = trayHitMeshes.filter(function (m) {
    var it = trayItems[m.userData.dragKey];
    return it && it.grp.visible && !m.userData.ignoreHit;
  });
  var tHits = ray.intersectObjects(visTrayHits, false);
  if (tHits.length) {
    var dk = tHits[0].object.userData.dragKey;
    var item = trayItems[dk];
    dragState = {
      key: dk,
      fromBridge: item.isCoin && item.installed,
      startX: e.clientX,
      startY: e.clientY,
      moved: false
    };
    if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch (ex) {}
    sfxPop();
    return;
  }

  var iHits = ray.intersectObjects(installedHitMeshes, false);
  if (iHits.length) {
    var ik = iHits[0].object.userData.installedKey;
    var it2 = trayItems[ik];
    dragState = {
      key: ik,
      fromBridge: true,
      startX: e.clientX,
      startY: e.clientY,
      moved: false
    };
    it2.grp.visible = true;
    if (ray.ray.intersectPlane(dragPlane, dragHitPt)) {
      it2.grp.position.set(dragHitPt.x, 1.05, dragHitPt.z);
    }
    if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch (ex) {}
    sfxPop();
    return;
  }

  if (ray.intersectObjects(s2ScisHits, false).length) {
    sfxPop();
    speak('这是剪刀，用来把A4纸裁开折成纸桥墩，使用剪刀要注意安全哦！');
  }
});

cv.addEventListener('pointermove', function (e) {
  setPtrFromEvent(e);
  if (!dragState) {
    var hover = false;
    if (curStage === 1) {
      hover = ray.intersectObjects(partHitMeshes.concat(partMeshes).concat(s1Props), false).length > 0;
    } else {
      var visT = trayHitMeshes.filter(function (m) {
        var it = trayItems[m.userData.dragKey];
        return it && it.grp.visible && !m.userData.ignoreHit;
      });
      hover = ray.intersectObjects(visT.concat(installedHitMeshes).concat(s2ScisHits), false).length > 0;
    }
    cv.style.cursor = hover ? 'grab' : 'default';
    return;
  }

  cv.style.cursor = 'grabbing';
  if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) > 10) {
    dragState.moved = true;
  }
  if (ray.ray.intersectPlane(dragPlane, dragHitPt)) {
    var it = trayItems[dragState.key];
    it.grp.position.set(
      Math.max(-4.4, Math.min(3.8, dragHitPt.x)),
      1.05,
      Math.max(-1.8, Math.min(2.2, dragHitPt.z))
    );
  }
});

function finishDrag(e) {
  if (!dragState) return;
  var ds = dragState;
  dragState = null;
  cv.style.cursor = 'default';
  var it = trayItems[ds.key];

  if (it.isCoin) {
    if (!ds.moved) {
      if (ds.fromBridge) removeCoinToTray(ds.key, false);
      else placeCoinOnBridge(ds.key, false);
    } else {
      if (it.grp.position.x > -0.95) placeCoinOnBridge(ds.key, false);
      else removeCoinToTray(ds.key, !ds.fromBridge);
    }
    return;
  }

  if (!ds.moved) {
    if (ds.fromBridge) {
      uninstallPart(ds.key, false);
    } else {
      installPart(ds.key, false);
    }
  } else {
    if (it.grp.position.x > -1.05) {
      if (ds.fromBridge) {
        it.grp.visible = false;
      } else {
        installPart(ds.key, false);
      }
    } else {
      if (ds.fromBridge) {
        uninstallPart(ds.key, false, true);
      } else {
        it.targetPos.copy(it.homePos);
      }
    }
  }
}

cv.addEventListener('pointerup', finishDrag);
cv.addEventListener('pointercancel', finishDrag);

/* ===== 渲染循环 ===== */
var introT0 = performance.now(), lastT = performance.now();
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  cfCv.width = w; cfCv.height = h;
}
window.addEventListener('resize', fit);
fit();

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (now - lastT) / 1000));
  lastT = now;
  var t = now * 0.001;

  var pop = Math.min(1, (performance.now() - introT0) / 680);
  var ease = 1 - Math.pow(1 - pop, 3);
  live.scale.setScalar(0.01 + 0.99 * ease);

  camera.position.lerp(camTargetPos, Math.min(1, dt * 8));
  camLook.lerp(camTargetLook, Math.min(1, dt * 8));
  camera.lookAt(camLook);

  var cueEl = $('#targetCue');
  var showCue = false, cueTxt = '', cueX = 0, cueY = 0;

  if (curStage === 1) {
    var nextPart = PART_ORDER.find(function (k) { return !inspectedParts[k]; });
    Object.keys(partGroups).forEach(function (k) {
      var grp = partGroups[k];
      var isAct = activePart === k;
      var isNext = nextPart === k;
      var targetY = partData[k].baseY + (isAct ? 0.30 + Math.sin(t * 5) * 0.04 : 0);
      grp.position.y += (targetY - grp.position.y) * Math.min(1, dt * 10);
      var hintPulse = isNext ? (0.5 + 0.5 * Math.sin(t * 5.0)) : 0;
      grp.traverse(function (obj) {
        if (obj.isMesh && !obj.userData.isHitBox && obj.material && obj.material.emissive) {
          if (isAct) obj.material.emissive.setHex(0x4a2400);
          else if (hintPulse > 0.55) obj.material.emissive.setHex(0x301a04);
          else obj.material.emissive.setHex(0x000000);
        }
      });
    });
    if (activePart) {
      var wp = partData[activePart].lblPos.clone().add(stage1Grp.position);
      wp.y += 0.30;
      var sp = projectToScreen(wp);
      partLblEl.innerHTML = ruby(partData[activePart].name, partData[activePart].py);
      partLblEl.style.left = sp.x + 'px';
      partLblEl.style.top = Math.max(82, sp.y) + 'px';
      partLblEl.classList.add('show');
    } else {
      partLblEl.classList.remove('show');
    }
    if (nextPart && !demo) {
      var cp = partData[nextPart].cuePos.clone().add(stage1Grp.position);
      var scp = projectToScreen(cp);
      showCue = true;
      cueTxt = partData[nextPart].cue;
      cueX = scp.x;
      cueY = scp.y - (activePart === nextPart ? 34 : 6);
    } else if (stamps.s1 && !stamps.s3 && !demo) {
      var tb2 = $('#tabStage2').getBoundingClientRect();
      showCue = true;
      cueTxt = '👆 点这里去搭纸桥';
      cueX = tb2.left + tb2.width / 2;
      cueY = tb2.top - 10;
    }
  }

  if (curStage === 2) {
    s2Ripples.forEach(function (rp, i) { rp.position.z += Math.sin(t * 1.6 + i) * dt * 0.14; });

    var ringScale = 1 + Math.sin(t * 4.5) * 0.08;
    slotPierRings.forEach(function (r) { if (r.visible) r.scale.setScalar(ringScale); });
    var deckReady = !!built.deck;
    var placedC = countPlacedCoins();
    coinPadRings.forEach(function (cg, i) {
      cg.visible = deckReady && placedC < 2;
      if (cg.visible) {
        cg.position.y = 1.09 + (built.deck === 'wave' ? 0.14 : 0.02);
        cg.scale.setScalar(1 + Math.sin(t * 4.8 + i) * 0.09);
      }
    });

    bridgePhys.bend += (bridgePhys.targetBend - bridgePhys.bend) * Math.min(1, dt * 8);
    bridgePhys.splay += (bridgePhys.targetSplay - bridgePhys.splay) * Math.min(1, dt * 8);
    bridgePhys.dropY += (bridgePhys.targetDropY - bridgePhys.dropY) * Math.min(1, dt * 8);

    if (asmDeckMid && asmDeckPivotL && asmDeckPivotR) {
      asmDeckPivotL.rotation.z = -bridgePhys.bend;
      asmDeckPivotR.rotation.z = bridgePhys.bend;
      asmDeckMid.position.y = 1.04 + bridgePhys.dropY - bridgePhys.splay * 0.42;
    }
    asmPierRefs.forEach(function (pr) {
      pr.grp.rotation.z = pr.side * bridgePhys.splay;
    });
    asmGirderRefs.forEach(function (gm) {
      gm.position.y = 0.99 + bridgePhys.dropY - bridgePhys.bend * 0.42;
    });

    var deckSurfaceY = (asmDeckMid ? asmDeckMid.position.y : 1.04) + (built.deck === 'wave' ? 0.18 : 0.05) - Math.sin(bridgePhys.bend) * 0.85;
    Object.keys(trayItems).forEach(function (k) {
      var it = trayItems[k];
      var isDraggingThis = dragState && dragState.key === k;

      if (it.isCoin) {
        if (it.grp.userData.halo) {
          it.grp.userData.halo.visible = !it.installed && deckReady && !isDraggingThis;
          it.grp.userData.halo.scale.setScalar(1 + Math.sin(t * 5) * 0.08);
        }
        if (it.installed && !isDraggingThis) {
          it.targetPos.y = Math.max(0.14, deckSurfaceY);
          var tilt = (bridgePhys.outcome === 'flat_sag' || bridgePhys.outcome === 'no_girder' || bridgePhys.outcome === 'no_pier')
            ? (it.coinSlotIdx === 0 ? -0.34 : 0.34) : 0;
          it.grp.rotation.z += (tilt - it.grp.rotation.z) * Math.min(1, dt * 7);
        }
      }

      if (!isDraggingThis && it.grp.visible) {
        it.grp.position.lerp(it.targetPos, Math.min(1, dt * 11));
      }

      if (it.grp.visible && !it.installed && !isDraggingThis) {
        if (k === 'coin_1' && !trayItems.coin_0.installed) {
          it.tagEl.classList.remove('show');
        } else {
          var tp = it.grp.position.clone();
          tp.y += (k === 'piers' ? 0.62 : 0.32);
          if (k === 'coin_0' && !trayItems.coin_1.installed) tp.x = -2.73;
          var sp2 = projectToScreen(tp);
          it.tagEl.textContent = (k === 'coin_0' && !trayItems.coin_1.installed) ? '🟡 1角硬币(2枚)' : it.tagText;
          it.tagEl.style.left = sp2.x + 'px';
          it.tagEl.style.top = sp2.y + 'px';
          var highlight = (k === 'piers' && !built.piers)
            || (k === 'girder' && built.piers && !built.girder)
            || ((k === 'deck_u' || k === 'deck_wave') && built.piers && built.girder && !built.deck)
            || (it.isCoin && deckReady);
          it.tagEl.classList.toggle('glow', !!highlight);
          it.tagEl.classList.add('show');
        }
      } else {
        it.tagEl.classList.remove('show');
      }
    });

    var nextKey = null, nextCue = '';
    if (!stamps.s3 && !demo && !dragState) {
      if (!built.piers) { nextKey = 'piers'; nextCue = '👆 拖或点：立米黄纸桥墩'; }
      else if (!built.girder) { nextKey = 'girder'; nextCue = '👆 拖或点：架金黄主梁胶带'; }
      else if (!built.deck || built.deck === 'flat') { nextKey = 'deck_u'; nextCue = '👆 拖或点：铺蓝色凹槽桥面'; }
      else if (!trayItems.coin_0.installed) { nextKey = 'coin_0'; nextCue = '👆 拖或点：1角硬币试压'; }
      else if (!trayItems.coin_1.installed) { nextKey = 'coin_1'; nextCue = '👆 拖或点：第2枚硬币'; }
    }
    if (nextKey && trayItems[nextKey] && trayItems[nextKey].grp.visible) {
      var nt = trayItems[nextKey];
      s2GuideHalo.visible = true;
      s2GuideHalo.position.set(nt.grp.position.x, 0.095, nt.grp.position.z);
      var hScale = (nextKey === 'girder' ? 1.32 : (nt.isCoin ? 0.88 : 1.05)) * (1 + Math.sin(t * 5.2) * 0.09);
      s2GuideHalo.scale.setScalar(hScale);
      var cwp = nt.grp.position.clone();
      cwp.y += (nextKey === 'piers' ? 0.92 : 0.64);
      var csp = projectToScreen(cwp);
      showCue = true;
      cueTxt = nextCue;
      cueX = csp.x;
      cueY = csp.y - 12;
    } else {
      s2GuideHalo.visible = false;
      if (!stamps.s1 && stamps.s3 && !demo) {
        var tb1 = $('#tabStage1').getBoundingClientRect();
        showCue = true;
        cueTxt = '👆 点这里认部件';
        cueX = tb1.left + tb1.width / 2;
        cueY = tb1.top - 10;
      }
    }
  }

  if (showCue) {
    cueEl.textContent = cueTxt;
    cueEl.style.left = Math.max(96, Math.min(window.innerWidth - 260, cueX)) + 'px';
    cueEl.style.top = Math.max(90, Math.min(window.innerHeight - 80, cueY)) + 'px';
    cueEl.classList.add('show');
  } else {
    cueEl.classList.remove('show');
  }

  if (cfList.length) {
    cfCtx.clearRect(0, 0, cfCv.width, cfCv.height);
    for (var i = cfList.length - 1; i >= 0; i--) {
      var p = cfList[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.r += p.vr * dt;
      if (p.life <= 0 || p.y > cfCv.height + 40) { cfList.splice(i, 1); continue; }
      cfCtx.save(); cfCtx.translate(p.x, p.y); cfCtx.rotate(p.r);
      cfCtx.fillStyle = p.c; cfCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cfCtx.restore();
    }
  }

  renderer.render(scene, camera);
}

rebuildAssembledBridge();
updatePaperBudgetUI();
updateGuide(false);

window.__lesson = {
  pyErrors: pyErrors,
  info: function () {
    var targets = {};
    if (curStage === 1) {
      PART_ORDER.forEach(function (k) {
        var p = new THREE.Vector3();
        if (k === 'deck') p.set(0, partGroups.deck.position.y + 0.1, 0);
        else if (k === 'body') p.set(0, partGroups.body.position.y, 0.68);
        else if (k === 'pier') p.set(-0.78, partGroups.pier.position.y, 0.44);
        else p.set(-2.02, partGroups.abut.position.y - 0.04, 0.55);
        p.add(stage1Grp.position);
        targets[k] = projectToScreen(p);
      });
    } else {
      Object.keys(trayItems).forEach(function (k) {
        var p = trayItems[k].grp.position.clone();
        p.y += 0.16;
        targets[k] = projectToScreen(p);
      });
      targets.river = projectToScreen(new THREE.Vector3(RIVER_CX, 1.05, RIVER_CZ));
    }
    return {
      triangles: renderer.info.render.triangles,
      celebrated: celebrated,
      curStage: curStage,
      stamps: stamps,
      inspected: Object.keys(inspectedParts),
      built: built,
      placedCoins: countPlacedCoins(),
      targets: targets
    };
  },
  startDemo: startDemo,
  resetAll: resetAll
};

requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第14课 发现常见工具的作用 · 手撕·小刀·剪刀工坊（活页）</title>
<style>
:root{--ink:#2a3040;--paper:#fffaf0;--line:#e3d6bd;--accent:#e56d17}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c19b;color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
ruby{ruby-align:center}
rt{font-size:.5em;font-weight:600;color:#8a6d4a;letter-spacing:0}
body.no-py rt{display:none}

.chip{position:fixed;left:14px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(80,55,20,.12)}
.home{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:800}
.home:hover{border-color:var(--accent);color:var(--accent)}
.chip h1{margin:0;font-size:20px;line-height:1.5;font-weight:800}
.chip small{display:block;font-size:12px;color:#8a7b62;font-weight:700;margin-top:-2px}

.tools{position:fixed;right:14px;top:12px;z-index:5;display:flex;gap:8px}
.tbtn{position:relative;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,250,240,.94);
  font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e2d2b5}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:#bf5409;color:#fff;box-shadow:0 3px 0 #bf5409}
.tbtn.cue-pulse{animation:cueGlow 1.5s ease-in-out infinite}
.cue-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#e56d17;color:#fff;font-size:10px;font-weight:800;line-height:1.45;white-space:nowrap;
  box-shadow:0 2px 6px rgba(185,78,8,.35);pointer-events:none;transition:opacity .35s,transform .35s}
#demoBtn .cue-tag{background:#2578e5;box-shadow:0 2px 6px rgba(37,120,229,.35)}
.cue-tag.hide{opacity:0;transform:translateX(-50%) translateY(-4px)}
@keyframes cueGlow{0%,100%{box-shadow:0 3px 0 #bf5409,0 0 0 0 rgba(229,109,23,.5)}50%{box-shadow:0 3px 0 #bf5409,0 0 0 7px rgba(229,109,23,0)}}

#guideBar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:8px;max-width:min(460px,calc(100vw - 680px));
  padding:7px 14px;border-radius:16px;background:rgba(255,250,240,.96);
  border:2px solid #f08a24;box-shadow:0 6px 18px rgba(130,68,12,.16);
  font-size:14px;font-weight:800;line-height:1.45;color:#7a3e08;cursor:pointer;transition:transform .2s,border-color .25s}
#guideBar:hover{border-color:#d65b0a}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.pulse{animation:guidePop .45s ease}
.gb-ico{flex:none;font-size:18px;line-height:1}
.gb-txt{flex:1}
@keyframes guidePop{0%{transform:translateX(-50%) scale(.94)}50%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}
@media (max-width:1160px){
  #guideBar{left:14px;top:66px;transform:none;max-width:calc(100vw - 266px)}
  #guideBar:active{transform:scale(.98)}
  @keyframes guidePop{0%{transform:scale(.95)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
}

#notes{position:fixed;right:14px;top:64px;z-index:4;width:236px;overflow:hidden;
  padding:9px 11px 10px;border-radius:16px;background:rgba(255,250,240,.92);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.12)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin-bottom:6px}
.nt-head-r{display:flex;align-items:center;gap:6px}
.nt-tog{border:1px solid var(--line);background:#fff;color:#7a6544;border-radius:8px;padding:1px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.nt-tog:hover{border-color:var(--accent);color:var(--accent)}
#notes.collapsed #ntList{display:none}
#notes.collapsed .stamps{margin-bottom:0}
.stamps{display:flex;gap:4px;margin-bottom:7px}
.stamp{flex:1;text-align:center;padding:3px 0 2px;border-radius:9px;border:1.5px dashed #d8c7a6;color:#b3a283;font-size:12px;font-weight:800;line-height:1.45}
.stamp.lit{border-style:solid;border-color:#e56d17;background:#fff3e2;color:#c2560c;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:152px;overflow-y:auto;padding-right:2px}
.stk{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:11px;background:#fff;border:1.5px solid #f0dcc0;
  font-size:13.5px;font-weight:800;line-height:1.6;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk i{font-style:normal;width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}
#winToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.84);z-index:20;
  width:min(450px,92vw);max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:22px;
  background:linear-gradient(155deg,#fffaf0 0%,#fff1d6 100%);border:2.5px solid #f08a24;
  box-shadow:0 18px 44px rgba(100,52,10,.32);opacity:0;pointer-events:none;
  transition:opacity .32s,transform .38s cubic-bezier(.2,1.5,.4,1)}
#winToast.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.win-head{display:flex;align-items:center;gap:12px}
.win-medal{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 35% 30%,#fff3a6,#f59e0b);box-shadow:0 3px 10px rgba(229,109,23,.35)}
.win-txt{display:flex;flex-direction:column;gap:2px}
.win-ttl{font-size:18px;font-weight:900;color:#b84906;line-height:1.5}
.win-sub{font-size:13px;font-weight:800;color:#7a6544;line-height:1.45}
.win-concl{padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid #f2c98a;font-size:13.5px;line-height:1.6;color:#3d3224;font-weight:700}
.win-concl-h{font-size:13px;font-weight:900;color:#c2560c;margin-bottom:3px}
.win-quiz{padding:10px 12px;border-radius:14px;background:#fffdf7;border:1.5px dashed #e58e26;display:flex;flex-direction:column;gap:7px}
.win-quiz-h{font-size:13px;font-weight:900;color:#b84906}
.win-quiz-q{font-size:14px;font-weight:800;color:#2a3040;line-height:1.5}
.win-opts{display:flex;flex-direction:column;gap:6px}
.qopt{width:100%;text-align:left;padding:8px 11px;border-radius:11px;border:1.5px solid #e3d6bd;background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:#2a3040;cursor:pointer;transition:all .16s}
.qopt:hover{border-color:#e56d17;background:#fff7eb}
.qopt.ok{border-color:#16a34a;background:#ecfdf3;color:#15803d}
.qopt.wrong{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
.quiz-fb{font-size:13px;font-weight:800;line-height:1.5;min-height:18px;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{color:#15803d}
.quiz-fb.err{color:#c2560c}
.win-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.wact{height:36px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.wact.pri{background:var(--accent);border-color:#bf5409;color:#fff}
.wact.pri rt{color:#ffe4c4}

/* 左侧图形画纸选择卡栏（看图直接选，不用靠文字！） */
#shapeRack{position:fixed;left:14px;top:52%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:18px;
  background:rgba(255,250,240,.95);border:1.5px solid var(--line);
  box-shadow:0 8px 22px rgba(80,55,20,.16);transition:box-shadow .25s}
#shapeRack.rack-pulse{border-color:#e56d17;animation:rackGlow 1.15s ease-in-out infinite}
@keyframes rackGlow{0%,100%{box-shadow:0 8px 22px rgba(80,55,20,.16),0 0 0 0 rgba(229,109,23,.55)}50%{box-shadow:0 8px 22px rgba(80,55,20,.16),0 0 0 9px rgba(229,109,23,0)}}
.sr-hd{font-size:11px;font-weight:900;color:#8a6d4a;text-align:center;line-height:1.2}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:1px;width:58px;padding:5px 3px 4px;
  border-radius:12px;border:1.5px solid #e6d7bd;background:#fff;font:inherit;font-size:11.5px;
  font-weight:800;line-height:1.35;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e6d7bd;transition:all .14s}
.sbtn svg{width:34px;height:24px;display:block}
.sbtn:hover{border-color:#e56d17;transform:translateX(2px)}
.sbtn:active{transform:translateY(1px)}
.sbtn.on{background:#fff1df;border-color:#e56d17;color:#c2560c;box-shadow:0 2px 0 #e56d17}
.sbtn.fresh{background:#effaf2;border-color:#16a34a;color:#15803d;box-shadow:0 2px 0 #16a34a;padding:6px 3px}
.sbtn.fresh.glow-next{animation:freshPulse 1.1s ease-in-out infinite}
@keyframes freshPulse{0%,100%{box-shadow:0 2px 0 #16a34a,0 0 0 0 rgba(22,163,74,.6)}50%{box-shadow:0 2px 0 #16a34a,0 0 0 8px rgba(22,163,74,0)}}
.sr-sep{height:1.5px;width:100%;background:#e3d6bd;margin:1px 0}

/* 5x 放大镜圆形显微浮窗 */
#loupe{position:fixed;left:0;top:0;width:166px;height:166px;z-index:7;pointer-events:none;
  border-radius:50%;border:6px solid #d4a33b;background:#fffaf0;
  box-shadow:0 12px 28px rgba(40,30,10,.32),inset 0 0 18px rgba(56,163,241,.25);
  overflow:hidden;opacity:0;transform:translate(-50%,-115%) scale(.7);transition:opacity .2s,transform .2s}
#loupe.show{opacity:1;transform:translate(-50%,-115%) scale(1)}
#loupeCanvas{width:100%;height:100%;display:block}
#loupeTag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 9px;border-radius:99px;
  background:rgba(42,48,64,.88);color:#fff;font-size:12px;font-weight:800;white-space:nowrap}

#verbs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;transition:opacity .5s}
.verb{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;background:rgba(255,250,240,.94);
  border:1.5px solid var(--line);font-size:16px;font-weight:800;line-height:1.5;box-shadow:0 4px 14px rgba(80,55,20,.12)}
.verb svg{width:20px;height:20px}
.verb.done{border-color:#16a34a;color:#15803d;background:#effaf2}
.verb.done::after{content:"✓";font-weight:900;color:#16a34a}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:rgba(42,48,64,.88);color:#fff;font-size:15px;font-weight:800;line-height:1.75;opacity:0;transition:opacity .2s}
.lbl rt{color:#ffe0b8}
.lbl.show{opacity:1}
.word{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:24px;font-weight:900;line-height:1.65;white-space:nowrap;
  color:#c2560c;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.55s ease-out forwards}
.word.ok{color:#15803d}
.word.cool{color:#1d62b5}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-185%) scale(1)}}

#hand{position:fixed;left:0;top:0;width:60px;height:60px;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

@media (max-width:760px){
  .chip{left:8px;top:8px;padding:4px 10px 4px 4px}
  .chip h1{font-size:15px}.chip small{display:none}
  .home{width:32px;height:32px}
  .tools{right:8px;top:8px;gap:5px}.tbtn{height:34px;padding:0 9px;font-size:13px}
  .cue-tag{font-size:9px;top:-9px;padding:0 5px}
  #guideBar{left:8px;top:52px;right:204px;max-width:none;padding:5px 9px;font-size:12px}
  .gb-ico{font-size:15px}
  #notes{top:54px;right:8px;width:194px;padding:7px 8px}
  .stamp{font-size:10.5px}
  #ntList{max-height:110px}
  .stk{font-size:12.5px;padding:4px 7px}
  #winToast{padding:12px 14px;gap:8px}
  .win-medal{width:38px;height:38px;font-size:22px}.win-ttl{font-size:15px}.win-sub{font-size:12px}
  .win-concl,.win-quiz-q,.qopt{font-size:12.5px}
  #shapeRack{left:6px;top:56%;padding:5px;gap:4px}
  .sbtn{width:46px;padding:4px 2px 3px;font-size:10px}
  .sbtn svg{width:28px;height:20px}
  #loupe{width:136px;height:136px}
  #verbs{bottom:10px;gap:5px}.verb{font-size:13px;padding:4px 9px}.verb svg{width:16px;height:16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<canvas id="confettiCanvas"></canvas>

<div id="winToast" aria-live="polite">
  <div class="win-head">
    <div class="win-medal">🏆</div>
    <div class="win-txt">
      <div class="win-ttl" id="winTtl"></div>
      <div class="win-sub" id="winSub"></div>
    </div>
  </div>
  <div class="win-concl">
    <div class="win-concl-h">✨ 科学小结论</div>
    <div id="winConclTxt">不同工具各有本领：用手撕最快但边缘毛糙；剪刀能从纸边整齐剪开；小刀能直接落刀把纸中间的图案完整抠出来，外框一点不破！</div>
  </div>
  <div class="win-quiz">
    <div class="win-quiz-h">💡 考考你 · 答对领小红花 🌸</div>
    <div class="win-quiz-q">想在纸中间挖出一个正方形小窗户，而且不能把外面的纸框剪断，选哪个工具最合适？</div>
    <div class="win-opts" id="quizOpts">
      <button class="qopt" data-ok="1" type="button">🔪 学生小刀（内部直接抠出）</button>
      <button class="qopt" data-ok="0" type="button">✋ 用手直接撕</button>
      <button class="qopt" data-ok="0" type="button">✂️ 剪刀（必须从外边剪入）</button>
    </div>
    <div class="quiz-fb" id="quizFb"></div>
  </div>
  <div class="win-btns">
    <button class="wact" id="winCloseBtn" type="button"></button>
    <button class="wact pri" id="winReplayBtn" type="button"></button>
  </div>
</div>

<div id="loupe">
  <canvas id="loupeCanvas" width="200" height="200"></canvas>
  <span id="loupeTag">5× 放大镜</span>
</div>

<div class="chip">
  <a class="home" href="../index.html" title="回到书包">‹</a>
  <div><h1 id="ttl"></h1><small>活页 · 课本第 56 页「手撕·小刀·剪刀工坊」</small></div>
</div>
<div id="guideBar" title="点我再听一遍玩法提示" aria-live="polite"><span class="gb-ico" id="gbIco">✋</span><span class="gb-txt" id="gbTxt"></span></div>
<div class="tools">
  <button class="tbtn on cue-pulse" id="voiceBtn" type="button">🔊 语音<span class="cue-tag" id="voiceCue">点我听玩法</span></button>
  <button class="tbtn cue-pulse" id="demoBtn" type="button">▶ 演示<span class="cue-tag" id="demoCue">不会玩点演示</span></button>
  <button class="tbtn" id="resetBtn" type="button">↺ 重来</button>
  <button class="tbtn" id="pyBtn" type="button">拼音</button>
</div>

<aside id="notes">
  <div class="nt-head"><span id="ntTitle"></span><span class="nt-head-r"><span id="ntCount" style="color:#c2560c">0</span><button class="nt-tog" id="ntTog" type="button">收起</button></span></div>
  <div class="stamps"><span class="stamp" data-k="h" id="stH"></span><span class="stamp" data-k="s" id="stS"></span><span class="stamp" data-k="k" id="stK"></span><span class="stamp" data-k="m" id="stM"></span></div>
  <div id="ntList"></div>
</aside>

<div id="shapeRack" aria-label="选图形画纸">
  <div class="sr-hd">选画纸</div>
  <button class="sbtn on" id="shStripBtn" data-sh="strip" type="button" title="长条纸">
    <svg viewBox="0 0 36 24"><rect x="2" y="3" width="32" height="18" rx="3" fill="#ff9f6e" stroke="#2a3040" stroke-width="1.8"/><line x1="18" y1="4" x2="18" y2="20" stroke="#2a3040" stroke-width="1.8" stroke-dasharray="3 2.5"/></svg>
    <span id="shStripTxt"></span>
  </button>
  <button class="sbtn" id="shSquareBtn" data-sh="square" type="button" title="方形窗">
    <svg viewBox="0 0 36 24"><rect x="2" y="2" width="32" height="20" rx="3" fill="#7ad7ba" stroke="#2a3040" stroke-width="1.8"/><rect x="11" y="6" width="14" height="12" fill="none" stroke="#2a3040" stroke-width="1.8" stroke-dasharray="3 2"/></svg>
    <span id="shSquareTxt"></span>
  </button>
  <button class="sbtn" id="shTriBtn" data-sh="triangle" type="button" title="三角窗">
    <svg viewBox="0 0 36 24"><rect x="2" y="2" width="32" height="20" rx="3" fill="#8ec5fc" stroke="#2a3040" stroke-width="1.8"/><polygon points="18,5 27,19 9,19" fill="none" stroke="#2a3040" stroke-width="1.8" stroke-dasharray="3 2"/></svg>
    <span id="shTriTxt"></span>
  </button>
  <button class="sbtn" id="shCircleBtn" data-sh="circle" type="button" title="圆形窗">
    <svg viewBox="0 0 36 24"><rect x="2" y="2" width="32" height="20" rx="3" fill="#f8a5cf" stroke="#2a3040" stroke-width="1.8"/><circle cx="18" cy="12" r="6.5" fill="none" stroke="#2a3040" stroke-width="1.8" stroke-dasharray="3 2"/></svg>
    <span id="shCircleTxt"></span>
  </button>
  <button class="sbtn" id="shStarBtn" data-sh="star" type="button" title="五角星">
    <svg viewBox="0 0 36 24"><rect x="2" y="2" width="32" height="20" rx="3" fill="#ffd052" stroke="#2a3040" stroke-width="1.8"/><polygon points="18,4 20.1,9.5 26,9.7 21.3,13.2 23,19 18,15.6 13,19 14.7,13.2 10,9.7 15.9,9.5" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="2.5 1.8"/></svg>
    <span id="shStarTxt"></span>
  </button>
  <div class="sr-sep"></div>
  <button class="sbtn fresh" id="freshBtn" type="button" title="换新纸">
    <span style="font-size:15px;line-height:1">🔄</span>
    <span id="freshTxt"></span>
  </button>
</div>

<div id="verbs">
  <span class="verb" data-v="hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v4M14 10V5a2 2 0 0 0-4 0v5M10 10V7a2 2 0 0 0-4 0v8a6 6 0 0 0 12 0v-4"/></svg><span id="vb1"></span></span>
  <span class="verb" data-v="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/><path d="M8.5 8.5L20 18M8.5 15.5L20 6"/></svg><span id="vb2"></span></span>

  var s = new THREE.Shape();
  s.moveTo(1.6, -halfSlit);
  s.lineTo(1.6, -0.95);
  s.lineTo(-1.6, -0.95);
  s.lineTo(-1.6,  0.95);
  s.lineTo(1.6,   0.95);
  s.lineTo(1.6,  halfSlit);

  // 下沿切入线 (1.6 -> entryX, y = +halfSlit)
  if (jagged) {
    for (var k1 = 1; k1 <= 6; k1++) {
      var u1 = k1 / 6;
      var jx1 = 1.6 + (entryX - 1.6) * u1;
      var jy1 = halfSlit + (k1 % 2 === 0 ? 0.055 : -0.028);
      s.lineTo(jx1, jy1);
    }
  } else {
    s.lineTo(entryX, halfSlit);
  }

  // 内部图形轮廓
  innerWalk.forEach(function (pt, idx) {
    if (jagged) {
      var jit = (idx % 2 === 0 ? 0.05 : -0.045);
      s.lineTo(pt.x + Math.sin(idx * 4.1) * 0.05, pt.y + jit);
    } else {
      s.lineTo(pt.x, pt.y);
    }
  });

  // 上沿切出线 (exitX -> 1.6, y = -halfSlit)
  if (jagged) {
    for (var k2 = 0; k2 <= 6; k2++) {
      var u2 = k2 / 6;
      var jx2 = exitX + (1.6 - exitX) * u2;
      var jy2 = -halfSlit + (k2 % 2 === 0 ? -0.055 : 0.028);
      s.lineTo(jx2, jy2);
    }
  } else {
    s.lineTo(exitX, -halfSlit);
  }
  s.closePath();
  return { shape: s, entryX: entryX, exitX: exitX };
}

function getCutPathPos(shape, toolId, u) {
  if (shape === 'strip') {
    var zPos = MAT_Z - 0.72 + u * 1.44;
    var xJit = toolId === 'hand' ? Math.sin(u * 28) * 0.09 : 0;
    return new THREE.Vector3(xJit, BASE + 0.24, zPos + 0.35);
  }
  var pts = getInnerPoints(shape, false);
  // 剪刀：前 28% 从右侧纸边剪入，后 72% 沿图案边剪一圈！
  if (toolId === 'scissors') {
    if (u < 0.28) {
      var uIn = u / 0.28;
      var rx = 1.68 + (0.58 - 1.68) * uIn;
      return new THREE.Vector3(rx, BASE + 0.22, MAT_Z + 0.25);
    }
    var uLoop = (u - 0.28) / 0.72;
    var angS = uLoop * Math.PI * 2;
    return new THREE.Vector3(Math.cos(angS) * 0.62, BASE + 0.22, MAT_Z + Math.sin(angS) * 0.56 + 0.25);
  }
  // 小刀：直接飞到纸中间落刀刻割，完全不碰纸边！
  if (toolId === 'knife') {
    if (u < 0.14) {
      var uDrop = u / 0.14;
      var p0 = pts[0];
      return new THREE.Vector3(p0.x, BASE + 0.58 - uDrop * 0.36, MAT_Z + p0.y + 0.32);
    }
    var uTrace = (u - 0.14) / 0.86;
    var segF = uTrace * pts.length;
    var idx = Math.floor(segF) % pts.length;
    var nxt = (idx + 1) % pts.length;
    var f = segF - Math.floor(segF);
    var px = pts[idx].x + (pts[nxt].x - pts[idx].x) * f;
    var py = pts[idx].y + (pts[nxt].y - pts[idx].y) * f;
    return new THREE.Vector3(px, BASE + 0.22, MAT_Z + py + 0.32);
  }
  // 小手：从右侧边缘胡乱扯入撕扯！
  var uH = u;
  var hx = 1.35 - uH * 1.6 + Math.sin(uH * 32) * 0.16;
  var hz = MAT_Z + Math.cos(uH * 22) * 0.42 + 0.22;
  return new THREE.Vector3(hx, BASE + 0.26, hz);
}

function buildPaper(shape, method) {
  clearPaper();
  paperShape = shape;
  cutMethod = method || null;
  var meta = SHAPE_META[shape] || SHAPE_META.strip;
  var pMat = toon(meta.col);
  var frameMat = toon(meta.frame);
  var fiberMat = toon('#fff5e6');

  if (shape === 'strip') {
    if (!method) {
      var whole = mesh(new THREE.BoxGeometry(3.4, 0.028, 1.55), pMat);
      whole.position.y = 0.014; whole.userData.paper = true;
      paperGrp.add(whole);
      var gLine = new THREE.Group();
      for (var d = 0; d < 8; d++) {
        var dm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 0.12), new THREE.MeshBasicMaterial({ color: 0x2a3040 }));
        dm.position.set(0, 0.032, -0.68 + d * 0.195); dm.userData.paper = true;
        gLine.add(dm);
      }
      paperGrp.add(gLine);
      paperPieces.guide = gLine;
    } else if (method === 'hand') {
      function buildJaggedHalf(side) {
        var s = new THREE.Shape();
        var outerX = side * 1.7;
        s.moveTo(outerX, -0.775);
        s.lineTo(outerX, 0.775);
        for (var k = 14; k >= 0; k--) {
          var y = -0.775 + (k / 14) * 1.55;
          var jag = (k % 2 === 0 ? 0.075 : -0.065) + Math.sin(k * 2.7) * 0.035;
          s.lineTo(jag, y);
        }
        s.closePath();
        var geo = new THREE.ExtrudeGeometry(s, { depth: 0.026, bevelEnabled: false });
        geo.rotateX(Math.PI / 2);
        var m = mesh(geo, pMat);
        m.position.y = 0.028; m.userData.paper = true;
        for (var f = 0; f < 10; f++) {
          var fy = -0.68 + f * 0.15;
          var fib = mesh(new THREE.BoxGeometry(0.11 + (f % 3) * 0.04, 0.014, 0.032), fiberMat, false);
          fib.position.set(side * -0.02, 0.016, fy);
          fib.rotation.y = (f % 2 ? 0.35 : -0.3);
          m.add(fib);
        }
        return m;
      }
      paperPieces.A = buildJaggedHalf(-1);
      paperPieces.B = buildJaggedHalf(1);
      paperGrp.add(paperPieces.A); paperGrp.add(paperPieces.B);
    } else {
      var leftH = mesh(new THREE.BoxGeometry(1.7, 0.028, 1.55), pMat);
      leftH.position.set(-0.85, 0.014, 0); leftH.userData.paper = true;
      var rightH = mesh(new THREE.BoxGeometry(1.7, 0.028, 1.55), pMat);
      rightH.position.set(0.85, 0.014, 0); rightH.userData.paper = true;
      paperPieces.A = leftH; paperPieces.B = rightH;
      paperGrp.add(leftH); paperGrp.add(rightH);
    }
    return;
  }

  // ---- 内部图形画纸：方形窗 / 三角窗 / 圆形窗 / 五角星 ----
  var ptsClean = getInnerPoints(shape, false);
  if (!method) {
    var stTex = ctex(512, 304, function (g, w, h) {
      g.fillStyle = meta.col; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#2a3040'; g.lineWidth = 4.5; g.setLineDash([10, 7]);
      g.beginPath();
      ptsClean.forEach(function (pt, idx) {
        var px = w / 2 + (pt.x / 3.2) * w, py = h / 2 + (pt.y / 1.9) * h;
        if (idx === 0) g.moveTo(px, py); else g.lineTo(px, py);
      });
      g.closePath(); g.stroke();
    });
    var sheet = mesh(new THREE.BoxGeometry(3.2, 0.028, 1.9), [
      pMat, pMat, new THREE.MeshToonMaterial({ map: stTex, gradientMap: ramp }), pMat, pMat, pMat
    ]);
    sheet.position.y = 0.014; sheet.userData.paper = true;
    paperGrp.add(sheet);
    return;
  }

  if (method === 'hand') {
    // 手撕：从右侧纸边暴力撕破进入内部，边缘锯齿+白毛刺+图案撕歪！
    var rip = buildSlitFrameShape(shape, 0.08, true);
    var ripGeo = new THREE.ExtrudeGeometry(rip.shape, { depth: 0.024, bevelEnabled: false });
    ripGeo.rotateX(Math.PI / 2);
    var ripFrame = mesh(ripGeo, frameMat);
    ripFrame.position.y = 0.026; ripFrame.userData.paper = true;
    // 在撕破的口子上贴白毛刺
    for (var rf = 0; rf < 7; rf++) {
      var fx = rip.entryX + (rf / 6) * (1.58 - rip.entryX);
      var f1 = mesh(new THREE.BoxGeometry(0.08, 0.014, 0.045), fiberMat, false);
      f1.position.set(fx, 0.016, rf % 2 ? 0.09 : -0.09);
      f1.rotation.y = rf * 0.7;
      ripFrame.add(f1);
    }

    var jagPts = getInnerPoints(shape, true);
    var jagShape = new THREE.Shape();
    jagPts.forEach(function (pt, i) { if (i === 0) jagShape.moveTo(pt.x, pt.y); else jagShape.lineTo(pt.x, pt.y); });
    jagShape.closePath();
    var jagGeo = new THREE.ExtrudeGeometry(jagShape, { depth: 0.03, bevelEnabled: false });
    jagGeo.rotateX(Math.PI / 2);
    var jagPiece = mesh(jagGeo, pMat);
    jagPiece.position.y = 0.034; jagPiece.userData.paper = true;
    jagPts.forEach(function (pt, idx) {
      if (idx % 2 === 0) {
        var fib = mesh(new THREE.BoxGeometry(0.11, 0.014, 0.036), fiberMat, false);
        fib.position.set(pt.x * 0.96, 0.016, pt.y * 0.96);
        fib.rotation.y = idx * 0.85;
        jagPiece.add(fib);
      }
    });
    paperPieces.A = ripFrame; paperPieces.B = jagPiece;
    paperGrp.add(ripFrame); paperGrp.add(jagPiece);
  } else if (method === 'scissors') {
    // 剪刀：边缘极其整齐，但外框右侧有清晰笔直的「从纸边剪入」切口！
    var slit = buildSlitFrameShape(shape, 0.055, false);
    var sGeo = new THREE.ExtrudeGeometry(slit.shape, { depth: 0.024, bevelEnabled: false });
    sGeo.rotateX(Math.PI / 2);
    var slitFrame = mesh(sGeo, frameMat);
    slitFrame.position.y = 0.026; slitFrame.userData.paper = true;

    // 在剪开的口子处显示醒目的蓝色虚线切痕标记，让孩子一眼看清「从纸边剪进去了一道口子」
    var slitMark = new THREE.Group();
    var slitLen = 1.62 - slit.entryX;
    var segs = Math.max(3, Math.round(slitLen / 0.18));
    var blueMarkMat = new THREE.MeshBasicMaterial({ color: 0x2578e5 });
    for (var sm = 0; sm < segs; sm++) {
      var dash = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.012, 0.028), blueMarkMat);
      dash.position.set(slit.entryX + 0.08 + (sm / segs) * (slitLen - 0.08), 0.016, 0);
      slitMark.add(dash);
    }
    paperGrp.add(slitMark);
    paperPieces.extra = slitMark;

    var cutShape = new THREE.Shape();
    ptsClean.forEach(function (pt, i) { if (i === 0) cutShape.moveTo(pt.x, pt.y); else cutShape.lineTo(pt.x, pt.y); });
    cutShape.closePath();
    var cutGeo = new THREE.ExtrudeGeometry(cutShape, { depth: 0.032, bevelEnabled: false });
    cutGeo.rotateX(Math.PI / 2);
    var cutPiece = mesh(cutGeo, pMat);
    cutPiece.position.y = 0.034; cutPiece.userData.paper = true;

    paperPieces.A = slitFrame; paperPieces.B = cutPiece;
    paperGrp.add(slitFrame); paperGrp.add(cutPiece);
  } else {
    // 小刀：直接落刀内部刻割，完整抠出图案，外框 100% 完好无任何切口！
    var outer = new THREE.Shape();
    outer.moveTo(-1.6, -0.95); outer.lineTo(1.6, -0.95); outer.lineTo(1.6, 0.95); outer.lineTo(-1.6, 0.95); outer.closePath();
    var hole = new THREE.Path();
    ptsClean.forEach(function (pt, i) { if (i === 0) hole.moveTo(pt.x, pt.y); else hole.lineTo(pt.x, pt.y); });
    hole.closePath(); outer.holes.push(hole);
    var kFrameGeo = new THREE.ExtrudeGeometry(outer, { depth: 0.024, bevelEnabled: false });
    kFrameGeo.rotateX(Math.PI / 2);
    var kFrame = mesh(kFrameGeo, frameMat);
    kFrame.position.y = 0.026; kFrame.userData.paper = true;

    // 外框一圈浅绿色完整高亮框线，直观提示「外框一点没破！」
    var rimPts = [
      new THREE.Vector3(-1.58, 0.035, -0.93), new THREE.Vector3(1.58, 0.035, -0.93),
      new THREE.Vector3(1.58, 0.035, 0.93), new THREE.Vector3(-1.58, 0.035, 0.93),
      new THREE.Vector3(-1.58, 0.035, -0.93)
    ];
    var rimGeo = new THREE.BufferGeometry().setFromPoints(rimPts);
    var intactRim = new THREE.Line(rimGeo, new THREE.LineBasicMaterial({ color: 0x16a34a }));
    paperGrp.add(intactRim);
    paperPieces.extra = intactRim;

    var popShape = new THREE.Shape();
    ptsClean.forEach(function (pt, i) { if (i === 0) popShape.moveTo(pt.x, pt.y); else popShape.lineTo(pt.x, pt.y); });
    popShape.closePath();
    var popGeo = new THREE.ExtrudeGeometry(popShape, { depth: 0.032, bevelEnabled: false });
    popGeo.rotateX(Math.PI / 2);
    var popPiece = mesh(popGeo, pMat);
    popPiece.position.y = 0.034; popPiece.userData.paper = true;

    paperPieces.A = kFrame; paperPieces.B = popPiece;
    paperGrp.add(kFrame); paperGrp.add(popPiece);
  }
}
buildPaper('strip', null);

var TOOLS = [

var loupeEl = $('#loupe'), loupeCtx = $('#loupeCanvas').getContext('2d'), loupeTag = $('#loupeTag');

  var g = loupeCtx, w = 200, h = 200;

  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 2;
  for (var x = 20; x < w; x += 36) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (var y = 20; y < h; y += 36) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }

  var col = (SHAPE_META[paperShape] || SHAPE_META.strip).col;
  var isInner = paperShape !== 'strip';
  if (!method) {
    g.fillStyle = col; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#2a3040'; g.lineWidth = 6; g.setLineDash([14, 12]);
    g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke(); g.setLineDash([]);
    loupeTag.textContent = '5× 还没裁开';
  } else if (method === 'hand') {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(86, 0);
    for (var yy = 0; yy <= h; yy += 10) {
      g.lineTo(82 + ((yy / 10) % 2 ? 18 : -10) + Math.sin(yy * 0.13) * 8, yy);
    }
    g.lineTo(0, h); g.closePath(); g.fill();
    g.strokeStyle = '#fff9f0'; g.lineWidth = 3;
    for (var f = 6; f < h; f += 7) {
      var bx = 80 + Math.sin(f * 0.25) * 10;
      g.beginPath(); g.moveTo(bx - 12, f); g.lineTo(bx + 22 + (f % 17), f + ((f % 3) - 1) * 5); g.stroke();
    }
    loupeTag.textContent = '手撕：毛糙锯齿边';
  } else if (method === 'scissors') {
    if (isInner) {
      // 放大显示：内窗边缘整齐 + 从纸边剪入的明显切缝！
      g.fillStyle = col;

      loupeTag.textContent = '剪刀：整齐,从边剪入';

      g.fillStyle = col; g.fillRect(0, 0, 96, h);
      g.strokeStyle = '#2a3040'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(96, 0); g.lineTo(96, h); g.stroke();

      g.beginPath(); g.moveTo(92, 0); g.lineTo(92, h); g.stroke();
      loupeTag.textContent = '剪刀：切口整齐平顺';
    }
  } else {
    // 小刀：内部完整抠出，外框连续完整无断口！
    if (isInner) {
      g.fillStyle = col; g.fillRect(0, 0, w, h);

      g.strokeStyle = '#16a34a'; g.lineWidth = 5; g.strokeRect(18, 18, w - 36, h - 36);

    }
  }
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 6; g.lineCap = 'round';

  portrait = w / h < 0.85;
  var tgt = new THREE.Vector3(portrait ? 0 : 0.25, 0.32, 0.25);
  var dir = portrait ? new THREE.Vector3(0.10, 0.80, 0.59).normalize() : new THREE.Vector3(0, 0.76, 0.65).normalize();
  var needW = portrait ? 7.6 : 9.5, needH = portrait ? 7.8 : 5.9;
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);

  camera.position.copy(tgt).addScaledVector(dir, d);
  camera.lookAt(tgt);
  camera.updateProjectionMatrix();
}

  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);

  var n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.4);
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2; g.gain.value = vol || 0.25;

var confC = $('#confettiCanvas'), confCtx = confC.getContext('2d'), confParts = [], celebrated = false, quizAnswered = false;
function launchConfetti() {
  confC.width = window.innerWidth; confC.height = window.innerHeight;
  var cols = ['#f59e0b', '#e56d17', '#2b8cf0', '#16a34a', '#ec4899', '#a855f7'];
  confParts = [];
  for (var i = 0; i < 90; i++) {
    var ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
    var spd = 280 + Math.random() * 440;
    confParts.push({
      x: confC.width * (0.3 + Math.random() * 0.4), y: confC.height * 0.28,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
      w: 7 + Math.random() * 7, h: 5 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 11,
      col: cols[i % cols.length], life: 2.2 + Math.random() * 1.1
    });
  }
}
function stepConfetti(dt) {
  if (!confParts.length) return;
  if (confC.width !== window.innerWidth || confC.height !== window.innerHeight) {
    confC.width = window.innerWidth; confC.height = window.innerHeight;
  }
  confCtx.clearRect(0, 0, confC.width, confC.height);
  for (var i = confParts.length - 1; i >= 0; i--) {
    var p = confParts[i];
    p.life -= dt;
    if (p.life <= 0) { confParts.splice(i, 1); continue; }
    p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
    confCtx.globalAlpha = Math.min(1, p.life);
    confCtx.fillStyle = p.col; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confCtx.restore();
  }
  if (!confParts.length) confCtx.clearRect(0, 0, confC.width, confC.height);
}

  }
  if (s[0] === 'paper') { setPaperShape(s[1], true); demo.i++; demo.t = 0; return; }
  if (s[0] === 'cut') { runToolCut(s[1]); demo.i++; demo.t = 0; return; }
  if (s[0] === 'lens') {
    if (!demo.started) {
      demo.started = true;
      TMAP.lens.target.set(0.05, BASE + 0.55, MAT_Z + 0.2);
      inspectWithLens();
    }
    if (demo.t >= s[1]) {
      TMAP.lens.target.copy(TMAP.lens.home);
      loupeTimer = 0;
      demo.started = false; demo.i++; demo.t = 0;
    }
  }
}

/* ===================== 开场动画 ===================== */
var intro = { t: 0, done: false };
function introSkip() {
  if (intro.done) return;
  intro.t = 3.5; intro.done = true;
  figCard.visible = false;
  board.scale.set(1, 1, 1); workshop.scale.setScalar(1);
}
function backOut(t) { var c = 1.65; t = Math.min(1, Math.max(0, t)); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function updateIntro(dt) {
  if (intro.done) return;
  if (!intro.t0) intro.t0 = performance.now();
  intro.t = Math.max(intro.t + dt, (performance.now() - intro.t0) / 1000 * 1.4); var t = intro.t;
  var lift = Math.min(1, Math.max(0, (t - 0.2) / 0.65));
  figCard.position.y = 0.012 + lift * 1.6;
  figCard.material.opacity = 1 - lift; figCard.visible = lift < 1;
  board.scale.set(1, Math.max(0.02, backOut((t - 0.3) / 0.5)), 1);
  workshop.scale.setScalar(Math.max(0.01, backOut((t - 0.52) / 0.55)));
  if (t >= 2.2) introSkip();
}

/* ===================== 换纸 / 重来 ===================== */
function setPaperShape(sh, silent) {
  cancelCutAnim();
  cancelLensReturn();
  paperShape = sh;
  document.querySelectorAll('#shapeRack .sbtn[data-sh]').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-sh') === sh);
  });
  buildPaper(sh, null);
  if (!silent) {
    tone(520, 0.07, 'sine', 0.07, 680);
    updateGuide(false);
  }
}
function resetAll(keepDemo) {
  if (!keepDemo) stopDemo();
  cancelCutAnim();
  cancelLensReturn();
  selectedTool = null;
  TOOLS.forEach(function (T) { T.cur.copy(T.home); T.target.copy(T.home); });
  found = {}; foundN = 0; kinds = { h: false, s: false, k: false, m: false };
  acted = { hand: false, tool: false, lens: false }; actions = 0;
  celebrated = false; hideWinToast(); resetQuizUI();
  setPaperShape('strip', true);
  $('#ntList').innerHTML = ''; $('#ntCount').textContent = '0';
  document.querySelectorAll('.stamp').forEach(function (s) { s.classList.remove('lit'); });
  document.querySelectorAll('.verb').forEach(function (v) { v.classList.remove('done'); });
  $('#verbs').style.opacity = 1;
  updateGuide(false);
}

/* ===================== 主循环 ===================== */
var last = performance.now(), now = 0;
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (t - last) / 1000)); last = t; now = t / 1000;
  updateIntro(dt);
  stepDemo(dt);
  if (guidePulseT > 0) guidePulseT = Math.max(0, guidePulseT - dt);

  // 工具专属真实运动路径（剪刀从外边剪入 / 小刀直接内部落刀刻割 / 小手撕扯）
  if (activeCutAnim) {
    var A = activeCutAnim;
    A.t += dt;
    var u = Math.min(1, A.t / A.dur);
    A.tool.target.copy(getCutPathPos(paperShape, A.tool.id, u));
    if (A.tool.id === 'scissors') {
      var sn = Math.abs(Math.sin(now * 26)) * 0.44;
      A.tool.bladeA.rotation.y = sn; A.tool.bladeB.rotation.y = -sn;
    }
    if (u >= 1 && !A.done) {
      A.done = true;
      var tid = A.tool.id;
      if (tid === 'scissors') { A.tool.bladeA.rotation.y = 0; A.tool.bladeB.rotation.y = 0; }
      if (!dragTool) A.tool.target.copy(A.tool.home);
      activeCutAnim = null;
      finishToolCut(tid);
    }
  }

  // 纸片裁开后的真实分离展现（手撕歪斜 / 剪刀留边缝 / 小刀完整抠出！）
  if (cutMethod && paperPieces.A && paperPieces.B) {
    splitSep += (1 - splitSep) * (1 - Math.exp(-6 * dt));
    if (paperShape === 'strip') {
      paperPieces.A.position.x = (cutMethod === 'hand' ? 0 : -0.85) - splitSep * 0.28;
      paperPieces.B.position.x = (cutMethod === 'hand' ? 0 :  0.85) + splitSep * 0.28;
    } else if (cutMethod === 'knife') {
      // 小刀：干净抠出的图形优雅抬起并移到外框右侧空位，让完整中空窗洞一目了然！
      paperPieces.B.position.set(splitSep * 1.15, 0.034 + splitSep * 0.16, splitSep * 0.22);
      paperPieces.B.rotation.y = 0;
    } else if (cutMethod === 'scissors') {
      // 剪刀：裁出的图形微微向上滑出，同时保留右侧清晰的「从纸边剪入」蓝色切缝！
      paperPieces.B.position.set(-splitSep * 0.22, 0.034 + splitSep * 0.14, splitSep * 0.62);
      paperPieces.B.rotation.y = 0;
    } else {
      // 手撕：撕得歪歪扭扭偏移一旁
      paperPieces.B.position.set(splitSep * 0.52, 0.034 + splitSep * 0.1, splitSep * 0.35);
      paperPieces.B.rotation.y = splitSep * 0.22;
    }
  }
  if (paperShake > 0) {
    paperShake = Math.max(0, paperShake - dt * 1.4);
    paperGrp.position.x = Math.sin(now * 60) * 0.04 * paperShake;
  } else paperGrp.position.x = 0;

  // 工具平滑移动、悬浮标签、选中/引导脉冲光圈
  var showIntroL = intro.t > 0.9 && intro.t < 3.4;
  TOOLS.forEach(function (T) {
    T.cur.lerp(T.target, 1 - Math.exp(-15 * dt));
    var isGuided = !demo && guideTargetTool === T.id && !dragTool && !activeCutAnim;
    var hv = (hoveredTool === T && !dragTool) ? 0.06 : 0;
    T.g.position.set(T.cur.x, T.cur.y + hv, T.cur.z);
    var pulseOp = isGuided ? (0.42 + Math.sin(now * 6) * 0.32 * (guidePulseT > 0 ? 1.3 : 1)) : 0;
    var targetOp = (selectedTool === T || hoveredTool === T) ? 0.9 : pulseOp;
    T.ring.material.opacity += (targetOp - T.ring.material.opacity) * 0.2;
    var rScale = isGuided ? (1 + Math.sin(now * 6) * 0.09) : 1;
    T.ring.scale.set(rScale, rScale, 1);
    var show = showIntroL || hoveredTool === T || selectedTool === T || (isGuided && guidePulseT > 0);
    if (show) {
      var sp = toScreen(T.cur.clone().add(new THREE.Vector3(0, 0.35, 0)));
      T.lbl.style.transform = 'translate(' + sp.x + 'px,' + sp.y + 'px) translate(-50%,-100%)';
    }
    T.lbl.classList.toggle('show', !!show);
  });

  // 5x 放大镜显微浮窗跟随 3D 放大镜位置（仅当放大镜在纸面上方时显示）
  var lensNearPaper = Math.hypot(TMAP.lens.cur.x, TMAP.lens.cur.z - MAT_Z) < 2.25;
  var lensAimPaper = Math.hypot(TMAP.lens.target.x, TMAP.lens.target.z - MAT_Z) < 2.25;
  if (loupeTimer > 0 && lensNearPaper) {
    loupeTimer = Math.max(0, loupeTimer - dt);
    var lp = toScreen(TMAP.lens.cur.clone().add(new THREE.Vector3(0, 0.2, -0.18)));
    loupeEl.style.left = Math.max(96, Math.min(window.innerWidth - 96, lp.x)) + 'px';
    loupeEl.style.top = Math.max(185, Math.min(window.innerHeight - 100, lp.y)) + 'px';
    loupeEl.classList.add('show');
  } else {
    if (!lensAimPaper) loupeTimer = 0;
    loupeEl.classList.remove('show');
  }

  updateGhost(dt);
  stepConfetti(dt);
  $('#verbs').style.opacity = actions > 8 ? 0.4 : 1;

  renderer.render(scene, camera);
}

/* ===================== 按钮与测试钩子 ===================== */
$('#voiceBtn').addEventListener('click', function () {
  audio();
  if (!entryCueDone) {
    dismissEntryCues();
    voiceOn = true; voiceWelcomed = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
    updateGuide(true);
    return;
  }
  voiceOn = !voiceOn;
  $('#voiceBtn').classList.toggle('on', voiceOn);
  $('#voiceBtn').textContent = voiceOn ? '🔊 语音' : '🔇 静音';
  if (voiceOn) { voiceWelcomed = true; updateGuide(true); }
  else if ('speechSynthesis' in window) { try { (window.__xkVoice ? window.__xkVoice.stop() : window.speechSynthesis.cancel()); } catch (e) {} }
});
$('#guideBar').addEventListener('click', function () {
  audio(); dismissEntryCues();
  if (!voiceOn) {
    voiceOn = true;
    $('#voiceBtn').classList.add('on');
    $('#voiceBtn').textContent = '🔊 语音';
  }
  voiceWelcomed = true;
  updateGuide(true);
});
$('#ntTog').addEventListener('click', function () {
  var c = $('#notes').classList.toggle('collapsed');
  $('#ntTog').textContent = c ? '展开' : '收起';
});
$('#winCloseBtn').addEventListener('click', hideWinToast);
$('#winReplayBtn').addEventListener('click', function () { resetAll(false); });
document.querySelectorAll('#shapeRack .sbtn[data-sh]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    audio(); welcomeVoiceOnce(); stopDemo(); introSkip();
    setPaperShape(btn.getAttribute('data-sh'));
  });
});
$('#freshBtn').addEventListener('click', function () {
  audio(); welcomeVoiceOnce(); stopDemo(); introSkip();
  cancelCutAnim(); cancelLensReturn();
  buildPaper(paperShape, null);
  tone(520, 0.08, 'sine', 0.08, 680);
  updateGuide(false);
});
$('#demoBtn').addEventListener('click', function () { audio(); dismissEntryCues(); introSkip(); if (demo) stopDemo(); else startDemo(); });
$('#resetBtn').addEventListener('click', function () { resetAll(false); });
$('#pyBtn').addEventListener('click', function () { document.body.classList.toggle('no-py'); });

window.__lesson = {
  pyErrors: pyErrors,
  info: function () { return { triangles: renderer.info.render.triangles, pixelRatio: renderer.getPixelRatio(), found: foundN, kinds: kinds, paperShape: paperShape, cutMethod: cutMethod, celebrated: celebrated }; },
  runToolCut: runToolCut,
  setPaperShape: setPaperShape,
  inspectWithLens: inspectWithLens,
  startDemo: startDemo
};

updateGuide(false);
fit();
requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第6课 运用感觉器官 · 多感官 3D 探案台</title>
<style>
:root{--accent:#d97706;--accent-dark:#b45309;--ink:#2a2218;--line:#e4d5ba;--card:rgba(255,253,248,.94)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2b3d38;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#cv.grabbing{cursor:grabbing}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.46em;color:#7a6a52;font-weight:600}
body.no-py rt{display:none}

/* 左上标题卡片 */
#hudTL{position:fixed;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 16px rgba(30,18,8,.22)}
#backBtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;text-decoration:none;
  background:#fff;border:1.5px solid var(--line);color:#5c4b34;font-size:19px;font-weight:900}
#backBtn:hover{border-color:var(--accent);color:var(--accent)}
.hd-t{font-size:16px;font-weight:900;line-height:1.5}
.hd-sub{font-size:11.5px;color:#7b6c56;font-weight:700}

/* 顶部中央动态分步小助手（U2） */
#guideBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  max-width:min(460px,calc(100vw - 630px));display:flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:15px;background:rgba(255,250,240,.96);
  border:2px solid var(--accent);box-shadow:0 6px 18px rgba(120,60,8,.22);
  font-size:13.5px;font-weight:800;color:#78350f;cursor:pointer;line-height:1.38;transition:transform .2s,box-shadow .2s}
#guideBar:active{transform:translateX(-50%) scale(.98)}
#guideBar.flash{transform:translateX(-50%) scale(1.04);box-shadow:0 8px 24px rgba(217,119,6,.36)}

/* 右上工具条 + 顶部微标签（U2） */
#hudTR{position:fixed;top:12px;right:12px;z-index:7;display:flex;align-items:center;gap:6px}
.tbtn-wrap{position:relative;display:inline-flex}
.tbtn{height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:800;color:#4a3c28;cursor:pointer;
  box-shadow:0 3px 0 #d9c8ab;transition:all .14s;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent-dark);color:#fff;box-shadow:0 3px 0 var(--accent-dark)}
.entry-cue{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;
  background:#fef3c7;border:1.5px solid var(--accent);color:#92400e;font-size:10.5px;font-weight:900;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(217,119,6,.24);
  animation:cuePop 1.6s ease-in-out infinite;transition:opacity .25s}
body.interacted .entry-cue{opacity:0;animation:none}
@keyframes cuePop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}

/* 右上可收起窄版发现栏（D3 防遮挡铁律） */
#notes{position:fixed;top:60px;right:12px;z-index:6;width:224px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(30,18,8,.2)}
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nt-title{font-size:13.5px;font-weight:900}
.nt-cnt{font-size:12.5px;font-weight:900;color:var(--accent)}
.nt-tog{padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:800;color:#6c5c45;cursor:pointer}
.stamps{display:flex;gap:4px;margin-bottom:6px}
.st{flex:1;text-align:center;padding:3px 2px;border-radius:8px;font-size:10.5px;font-weight:800;
  border:1.5px dashed #d7c5a4;color:#9b8a70;background:#faf4e8;transition:all .2s;line-height:1.35}
.st.lit{border-style:solid;border-color:#16a34a;background:#ecfdf3;color:#166534}
#ntList{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;padding-right:2px}
#notes.collapsed #ntList,#notes.collapsed .stamps{display:none}
#notes.collapsed .nt-head{margin-bottom:0}
.stk{padding:5px 8px;border-radius:10px;background:#fff;border:1px solid #ece0c9;font-size:12px;font-weight:700;line-height:1.4}
.stk b{color:#b45309}

/* 左侧情境记录卡 */
#leftPanel{position:fixed;left:14px;top:78px;z-index:6;width:214px;padding:11px 12px;border-radius:16px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 8px 22px rgba(30,18,8,.22);pointer-events:none}
.lp-title{font-size:13.5px;font-weight:900;color:#92400e;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.radar-list{display:flex;flex-direction:column;gap:5px}
.r-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:9px;
  background:#faf4e8;border:1px solid #e7d8be;font-size:12px;font-weight:800;color:#78654b;transition:all .24s}
.r-row.lit{background:#ecfdf3;border-color:#86efac;color:#166534}
.r-val{font-weight:900;color:#b45309}
.r-row.lit .r-val{color:#15803d}
.poem-box{padding:8px 10px;border-radius:11px;background:#fffbeb;border:1.5px dashed #f59e0b;
  font-size:13px;font-weight:800;color:#78350f;line-height:1.6;text-align:center}
.poem-sub{margin-top:6px;font-size:11.5px;font-weight:700;color:#6c5c45;line-height:1.45}
.melody-row{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.mnote{flex:1;padding:6px 0;text-align:center;border-radius:10px;background:#f1f5f9;border:1.5px solid #cbd5e1;
  font-size:14px;font-weight:900;color:#475569;transition:all .15s}
.mnote.play{background:#fef08a;border-color:#eab308;color:#854d0e;transform:scale(1.1)}
.mnote.bad{background:#fee2e2;border-color:#ef4444;color:#b91c1c;transform:scale(1.12)}
.mnote.ok{background:#dcfce7;border-color:#22c55e;color:#15803d}

/* 桌面左下角 3 个迷你纯图标切关徽章（0 个底栏文字按钮！） */
#stageDock{position:fixed;left:16px;bottom:14px;z-index:6;display:flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 6px 18px rgba(30,18,8,.22)}
.sbadge{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:2px solid #e2d3b8;background:#fff;cursor:pointer;font-size:22px;line-height:1;padding:0;transition:all .16s}
.sbadge:hover{border-color:var(--accent);transform:translateY(-2px) scale(1.06)}
.sbadge.active{border-color:var(--accent);background:#fef3c7;box-shadow:0 3px 0 #f59e0b;transform:scale(1.08)}
.sbadge.done::after{content:'✓';position:absolute;top:-3px;right:-3px;width:17px;height:17px;border-radius:50%;
  background:#16a34a;color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}

/* 3D 道具轻量签 + 单焦点跳动提示气泡 */
#toolTags{position:fixed;inset:0;pointer-events:none;z-index:3}
.ttag{position:absolute;transform:translate(-50%,0);padding:2px 9px;border-radius:99px;
  background:rgba(36,24,14,.84);color:#fff;font-size:11.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.22);transition:background .2s}
.ttag.done{background:rgba(22,163,74,.92)}
.ttag.sel{background:rgba(217,119,6,.96)}

#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.cue3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 12px;border-radius:99px;
  background:#fff7ed;border:2px solid #ea580c;color:#9a3412;font-size:13px;font-weight:900;white-space:nowrap;
  box-shadow:0 4px 14px rgba(234,88,12,.3);animation:cueBob 1.3s ease-in-out infinite;display:none;pointer-events:none}
.cue3d.show{display:block}
@keyframes cueBob{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-6px)}}
.popword{position:absolute;transform:translate(-50%,-100%);padding:5px 12px;border-radius:99px;
  background:rgba(22,101,52,.94);color:#fff;font-size:13.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.22);animation:popFloat 1.75s ease-out forwards}
.popword.warn{background:rgba(194,65,12,.94)}
@keyframes popFloat{0%{opacity:0;transform:translate(-50%,-70%) scale(.78)}18%{opacity:1;transform:translate(-50%,-110%) scale(1.04)}82%{opacity:1;transform:translate(-50%,-142%) scale(1)}100%{opacity:0;transform:translate(-50%,-178%) scale(.95)}}

/* 通关彩带 + 结论与1题巩固弹窗 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#winToast{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(28,18,8,.40);padding:16px}
#winToast.show{display:grid}
.win-card{width:min(460px,100%);max-height:86vh;overflow-y:auto;background:#fffdf8;
  border:2.5px solid var(--accent);border-radius:22px;padding:18px 20px;text-align:center;
  box-shadow:0 20px 50px rgba(30,16,4,.32)}
.win-concl{margin:10px 0;padding:10px 12px;border-radius:13px;background:#fff8eb;border:1.5px solid #f2cf9b;
  text-align:left;font-size:13.5px;line-height:1.58;color:#5a3309}
.win-quiz{margin:10px 0;padding:10px 12px;border-radius:13px;background:#f8fafc;border:1.5px solid #d9e2ec;text-align:left}
.win-quiz h4{margin:0 0 8px;font-size:13.5px;color:#92400e}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{padding:8px 11px;border-radius:11px;border:1.5px solid #d9d0be;background:#fff;
  font-size:13.5px;font-weight:800;text-align:left;cursor:pointer;transition:all .14s}
.qopt:hover{border-color:var(--accent);background:#fff9f0}
.qopt.ok{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e}
.qopt.bad{border-color:#e03131;background:#fff5f5;color:#c92a2a}
.qfb{margin-top:7px;font-size:12.5px;font-weight:800;min-height:18px;color:#166534}
.win-acts{display:flex;justify-content:center;gap:10px;margin-top:12px}

@media (max-width:960px){
  #guideBar{top:58px;max-width:min(420px,calc(100vw - 250px));font-size:12.5px}
}
@media (max-width:740px){
  #guideBar{top:54px;left:10px;right:10px;transform:none;max-width:none}
  #leftPanel{top:102px;left:8px;width:190px;padding:8px}
}
</style>
</head>
<body>

<div id="toolTags"></div>

<canvas id="confetti"></canvas>

<div id="hudTL">
  <a id="backBtn" href="../index.html" title="返回书包">‹</a>
  <div>
    <div class="hd-t" data-py="dì kè yùn yòng gǎn jué qì guān">第6课 运用感觉器官</div>
    <div class="hd-sub">活页 · 课本第 22 页「多感官 3D 探案台」</div>
  </div>
</div>

</div>

<!-- 左侧动态科学记录面板 -->
<div id="leftPanel"></div>

<aside id="notes">
  <div class="nt-head">
    <span class="nt-title" data-py="wǒ de fā xiàn">我的发现</span>

  </div>

</aside>

<!-- 桌面左下角 3 个迷你纯图标切关徽章（0 个底栏文字按钮！） -->
<div id="stageDock">
  <button class="sbadge active" data-stage="1" type="button" title="第1关：多感官观察香蕉" aria-label="观察香蕉">🍌</button>

</div>

<div id="winToast">
  <div class="win-card">
    <div style="font-size:38px">🏆</div>
    <h3 style="margin:4px 0;color:#92400e">太棒啦！3 关感官大探案全部通关！</h3>
    <div class="win-concl">
      <b>✨ 科学小结论：</b>综合运用眼、手、鼻、舌等多种感觉器官，可以更全面地认识物体；遇到只靠眼睛分不清的情况（如雪中白梅、闭眼辨音），巧妙切换鼻子或耳朵也能帮我们准确判断！
    </div>
    <div class="win-quiz">
      <h4>💡 考考你 · 答对领小红花 🌸</h4>
      <div style="font-size:13.5px;font-weight:800;margin-bottom:8px">想全面了解一根香蕉的特点，下面哪种观察方法最好？</div>
      <div class="qopts" id="qOpts">
        <button class="qopt" type="button" data-ok="1">✨ 用眼看、用手摸、用鼻闻、再尝一尝，多感官综合观察</button>
        <button class="qopt" type="button" data-hint="只用眼睛只能看到颜色和形状，没法知道香不香、软不软、甜不甜哦！">👁 只用眼睛远远看一眼就够了</button>
        <button class="qopt" type="button" data-hint="香蕉不会发出声音，只用耳朵可没法了解香蕉的形状和味道哦！">👂 只用耳朵听香蕉的声音</button>
      </div>
      <div class="qfb" id="qFb"></div>
    </div>
    <div class="win-acts">
      <button class="tbtn" id="winKeepBtn" type="button">继续玩</button>
      <button class="tbtn on" id="winAgainBtn" type="button">再玩一次</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

try { sessionStorage.setItem('xk_last_vol', 'k2a'); } catch (e) {}

var LESSON_ID = 'k2a-06';

var muted = false;

function saveProgress(id, hasFlower) {

  for (var i = 0; i < 92; i++) {

/* ===== 变截面弯曲管道几何体工厂（雕出零穿模、饱满有棱线的真实大香蕉！） ===== */
function buildTaperedTube(curve, tSegs, rSegs, radFn, ridgeAmp) {
  var frames = curve.computeFrenetFrames(tSegs, false);
  var positions = [];
  var uvs = [];
  var indices = [];
  var v = new THREE.Vector3();
  var N = frames.normals, B = frames.binormals;

  for (var i = 0; i <= tSegs; i++) {
    var u = i / tSegs;
    var P = curve.getPointAt(u);
    var baseR = radFn(u);
    for (var j = 0; j <= rSegs; j++) {
      var vv = j / rSegs;
      var ang = vv * Math.PI * 2;
      // 柔和 5 棱香蕉横截面特征
      var ridge = ridgeAmp ? (1 + ridgeAmp * Math.cos(ang * 5)) : 1;
      var r = baseR * ridge;
      var c = Math.cos(ang), s = Math.sin(ang);
      v.copy(P).addScaledVector(N[i], r * c).addScaledVector(B[i], r * s);
      positions.push(v.x, v.y, v.z);
      uvs.push(vv, u);
    }
  }
  var stride = rSegs + 1;
  for (var i2 = 0; i2 < tSegs; i2++) {
    for (var j2 = 0; j2 < rSegs; j2++) {
      var a = i2 * stride + j2;
      var b = (i2 + 1) * stride + j2;
      var c2 = (i2 + 1) * stride + (j2 + 1);
      var d = i2 * stride + (j2 + 1);
      indices.push(a, b, d, b, c2, d);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// 真实厚实实体弧形弯曲下卷香蕉皮瓣几何体（带厚度横截面，360度看都饱满立体，绝不显纸片薄边！）
function createThickPeelGeometry(tSegs, rSegs) {
  var count = (tSegs + 1) * (rSegs + 1);
  var pos = new Float32Array(count * 3);
  var uvs = new Float32Array(count * 2);
  var indices = [];
  for (var i = 0; i <= tSegs; i++) {
    for (var j = 0; j <= rSegs; j++) {
      var idx = i * (rSegs + 1) + j;
      uvs[idx * 2] = j / rSegs;
      uvs[idx * 2 + 1] = i / tSegs;
    }
  }
  var stride = rSegs + 1;
  for (var i2 = 0; i2 < tSegs; i2++) {
    for (var j2 = 0; j2 < rSegs; j2++) {
      var a = i2 * stride + j2;
      var b = (i2 + 1) * stride + j2;
      var c = (i2 + 1) * stride + (j2 + 1);
      var d = i2 * stride + (j2 + 1);
      indices.push(a, b, d, b, c, d);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

function updateCurvedPeelGeometry(geo, tSegs, rSegs, curlAmt) {
  // 沿弯曲卷落弧线生成椭圆扁带实体截面（宽厚自然、尖端收细，正面侧面都饱满圆润！）
  var pos = geo.attributes.position.array;
  var baseR = 0.205;
  var len = 0.92;
  var maxAngle = 0.2 + curlAmt * 2.25;
  var idx = 0;
  for (var i = 0; i <= tSegs; i++) {
    var u = i / tSegs;
    var theta = u * maxAngle;
    var rArc = len / maxAngle;
    var cz = baseR + rArc * (1 - Math.cos(theta));
    var cy = rArc * Math.sin(theta);
    // 径向法向 (0, -sin(theta), cos(theta))
    var ny = -Math.sin(theta), nz = Math.cos(theta);
    // 宽度从根部饱满 0.145 平滑收到尖端 0.012，厚度 0.036 平滑收到尖端 0.010
    var taper = Math.pow(1 - u * 0.92, 0.72);
    var halfW = 0.145 * taper;
    var halfT = 0.036 * taper;

    for (var j = 0; j <= rSegs; j++) {
      var ang = (j / rSegs) * Math.PI * 2;
      var lx = Math.cos(ang) * halfW;
      var ln = Math.sin(ang) * halfT;
      pos[idx++] = lx;
      pos[idx++] = cy + ny * ln;
      pos[idx++] = cz + nz * ln;
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
}

function projectToScreen(v3) {
  var p = v3.clone().project(camera);
  return {
    x: (p.x * 0.5 + 0.5) * window.innerWidth,
    y: (-p.y * 0.5 + 0.5) * window.innerHeight
  };
}

function popLabelAt3D(worldPos, text, isWarn) {
  var sc = projectToScreen(worldPos);
  var el = document.createElement('div');
  el.className = 'popword' + (isWarn ? ' warn' : '');
  el.textContent = text;
  el.style.left = Math.max(110, Math.min(window.innerWidth - 110, sc.x)) + 'px';
  el.style.top = Math.max(76, Math.min(window.innerHeight - 100, sc.y - 16)) + 'px';
  $('#labels').appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1780);
}

function pressVisualKey(idx, isOffKey) {
  var k = pianoKeys[idx];
  if (!k) return;
  k.press = 1.0;
  k.glow = 1.0;
  playPianoNote(PIANO_FREQS[idx], 0.50, isOffKey);
  if (idx < 4 && noteBlocks[idx]) {
    noteBlocks[idx].bounce = 1.0;
    var mn = $('#mn' + idx);
    if (mn) {
      mn.classList.remove('play', 'bad', 'ok');
      mn.classList.add(isOffKey ? 'bad' : 'play');
      var g = resetGen;
      setTimeout(function () { if (g === resetGen && mn) mn.classList.remove('play', 'bad'); }, 450);
    }
  }
}

function playStage3Melody(cleanVersion) {
  if (pianoPlayingSeq) return;
  pianoPlayingSeq = true;
  var g = resetGen;
  var seq = cleanVersion ? [0, 1, 2, 3, 4] : [0, 1, 2, 3];
  seq.forEach(function (ki, step) {
    setTimeout(function () {
      if (g !== resetGen || currentStage !== 3) return;
      var off = (!cleanVersion && ki === WRONG_NOTE_IDX);
      pressVisualKey(ki, off);
      if (off) {
        popLabelAt3D(new THREE.Vector3(startX + ki * (keyW + keyGap) + 0.08, 1.88, 0.42), '🎵 咦？这个音有点刺耳！', true);
      }
    }, step * 520);
  });
  setTimeout(function () {
    if (g === resetGen) pianoPlayingSeq = false;
  }, seq.length * 520 + 240);
}

function handleStage3Guess(idx) {

/* ===== 根治拖拽“用不了”：相机视角动态拖拽平面 + 屏幕射线直命超大碰撞体 + 拖拽中目标高亮 ===== */
var ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
var camDragPlane = new THREE.Plane();
var camDir = new THREE.Vector3();
var dragPt = new THREE.Vector3();
var downX = 0, downY = 0, moved = false;

function updateDragPlane(stage) {
  camera.getWorldDirection(camDir);
  var anchor = stage === 1 ? new THREE.Vector3(-0.10, 0.95, 0.15) : new THREE.Vector3(-0.10, 0.72, 0.10);
  camDragPlane.setFromNormalAndCoplanarPoint(camDir.clone().negate(), anchor);
}

function getNDC(e) {
  var r = cv.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}

function detectStageTarget(stage, clientX, clientY) {
  if (stage === 1) {
    if (ray.intersectObject(bananaHit, false).length > 0) return 'banana';
    var bSc = projectToScreen(new THREE.Vector3(-0.10, 0.98, -0.08));
    if (Math.hypot(clientX - bSc.x, clientY - bSc.y) < 165) return 'banana';
    return '';
  }
  if (stage === 2) {
    var hits = ray.intersectObjects([snowHit, plumHit], false);
    if (hits.length) return hits[0].object.userData.targetType;
    var sSc = projectToScreen(new THREE.Vector3(-1.18, 0.56, -0.18));
    var pSc = projectToScreen(new THREE.Vector3(0.98, 0.56, -0.18));
    var dS = Math.hypot(clientX - sSc.x, clientY - sSc.y);
    var dP = Math.hypot(clientX - pSc.x, clientY - pSc.y);
    if (dS < 135 && dS <= dP) return 'snow';
    if (dP < 135 && dP < dS) return 'plum';
    return '';
  }
  return '';
}

function launchToolFly(stage, toolId, targetPos, onArrive) {
  var grp = stage === 1 ? s1ToolG[toolId] : s2ToolG[toolId];
  var home = stage === 1 ? S1_HOMES[toolId] : S2_HOMES[toolId];
  flyAnims = flyAnims.filter(function (f) { return f.toolId !== toolId; });
  flyAnims.push({
    stage: stage, toolId: toolId, grp: grp, home: home,
    from: grp.position.clone(), to: targetPos.clone(),
    t: 0, dur: 0.28, done: false, onArrive: onArrive
  });
}

cv.addEventListener('pointerdown', function (e) {
  markInteracted();
  if (demo) return;
  getNDC(e);
  ray.setFromCamera(ptr, camera);
  downX = e.clientX; downY = e.clientY; moved = false;

  if (currentStage === 1) {
    var tHits = ray.intersectObjects(s1HitMeshes, false);
    if (tHits.length) {
      draggingTool = tHits[0].object.userData.toolId;
      draggingStage = 1;
      updateDragPlane(1);
      cv.classList.add('grabbing');
      beep([480], 0.08);
      return;
    }
    if (ray.intersectObject(bananaHit, false).length) {
      var nextT = selectedTool || ['eye', 'hand', 'nose', 'spoon'].find(function (k) { return !bananaDone[k]; }) || 'spoon';
      selectedTool = '';
      launchToolFly(1, nextT, new THREE.Vector3(0.32, 0.96, 0.55), function () { triggerBananaTool(nextT); });
      return;
    }
  } else if (currentStage === 2) {
    var t2Hits = ray.intersectObjects(s2HitMeshes, false);
    if (t2Hits.length) {
      draggingTool = t2Hits[0].object.userData.toolId;
      draggingStage = 2;
      updateDragPlane(2);
      cv.classList.add('grabbing');
      beep([480], 0.08);
      return;
    }
    var cHits = ray.intersectObjects([snowHit, plumHit], false);
    if (cHits.length) {
      var tt = cHits[0].object.userData.targetType;
      var useTool = selectedTool || (plumEyeTried ? 'nose2' : 'eye2');
      selectedTool = '';
      var dest = tt === 'snow' ? new THREE.Vector3(-1.18, 0.96, 0.35) : new THREE.Vector3(0.98, 0.96, 0.35);
      launchToolFly(2, useTool, dest, function () { triggerStage2Probe(useTool, tt); });
      return;
    }
  } else if (currentStage === 3) {
    if (ray.intersectObject(speakerHit, false).length) {
      speakerG.scale.set(1.16, 0.88, 1.16);
      playStage3Melody(stage3Solved);
      return;
    }
    var nHits = ray.intersectObjects(noteBlockHits, false);
    if (nHits.length) {
      handleStage3Guess(nHits[0].object.userData.noteIdx);
      return;
    }
    var kHits = ray.intersectObjects(pianoKeyHits, false);
    if (kHits.length) {
      handleStage3Guess(kHits[0].object.userData.pianoKey);
      return;
    }
  }
});

window.addEventListener('pointermove', function (e) {
  if (!draggingTool) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 14) moved = true;
  if (!moved) return;

  getNDC(e);
  ray.setFromCamera(ptr, camera);
  if (ray.ray.intersectPlane(camDragPlane, dragPt)) {
    var goal = draggingStage === 1 ? s1ToolGoal[draggingTool] : s2ToolGoal[draggingTool];
    var cy = draggingStage === 1 ? S1_TOOLS[draggingTool].cy : S2_TOOLS[draggingTool].cy;
    if (goal) {
      goal.set(
        Math.max(-3.0, Math.min(2.6, dragPt.x)),
        Math.max(0.08, Math.min(2.4, dragPt.y - cy)),
        Math.max(0.18, Math.min(1.6, dragPt.z))
      );
    }
  }
  hoverTarget = detectStageTarget(draggingStage, e.clientX, e.clientY);
});

window.addEventListener('pointerup', function (e) {
  if (!draggingTool) return;
  var tid = draggingTool, st = draggingStage;
  draggingTool = ''; draggingStage = 0; hoverTarget = '';
  cv.classList.remove('grabbing');

  if (!moved) {
    if (st === 1) {
      s1ToolGoal[tid].copy(S1_HOMES[tid]);
      launchToolFly(1, tid, new THREE.Vector3(0.32, 0.96, 0.55), function () { triggerBananaTool(tid); });
    } else if (st === 2) {
      s2ToolGoal[tid].copy(S2_HOMES[tid]);
      var destPos = tid === 'eye2' ? new THREE.Vector3(-0.10, 0.96, 0.35) : new THREE.Vector3(0.98, 0.96, 0.35);
      launchToolFly(2, tid, destPos, function () { triggerStage2Probe(tid, tid === 'eye2' ? 'both' : 'plum'); });
    }
    return;
  }

  getNDC(e);
  ray.setFromCamera(ptr, camera);
  var hitT = detectStageTarget(st, e.clientX, e.clientY);
  if (st === 1) {
    s1ToolGoal[tid].copy(S1_HOMES[tid]);
    if (hitT === 'banana') triggerBananaTool(tid);
    else beep([320], 0.08);
  } else if (st === 2) {
    s2ToolGoal[tid].copy(S2_HOMES[tid]);
    if (tid === 'eye2' && (hitT === 'snow' || hitT === 'plum')) {
      triggerStage2Probe('eye2', 'both');
    } else if (tid === 'nose2' && (hitT === 'snow' || hitT === 'plum')) {
      triggerStage2Probe('nose2', hitT);
    } else {
      beep([320], 0.08);
    }
  }
});

/* ===== 单焦点 #targetCue 与帧循环 ===== */
var introT0 = performance.now(), lastT = performance.now(), simT = 0;
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
fit();

function updateTargetCue() {
  var cue = $('#targetCue');
  if (demo || celebrated) { cue.classList.remove('show'); return; }
  var wp = null, txt = '';
  if (currentStage === 1) {
    var nk = ['eye', 'hand', 'nose', 'spoon'].find(function (k) { return !bananaDone[k]; });
    if (nk) {
      wp = s1ToolG[nk].position.clone(); wp.y += 1.08;
      txt = '👆 拖起或点「' + S1_TOOLS[nk].name + '」';
    }
  } else if (currentStage === 2) {
    if (!stage2Solved) {
      var tk = plumEyeTried ? 'nose2' : 'eye2';
      wp = s2ToolG[tk].position.clone(); wp.y += 1.08;
      txt = plumEyeTried ? '👃 换用小鼻子闻出白梅暗香！' : '👆 拖起道具去查一查两团白绒！';
    }
  } else if (currentStage === 3) {
    if (!stage3Solved) {
      wp = new THREE.Vector3(startX + 1.5 * (keyW + keyGap) + 0.08, 1.82, 0.42);
      txt = pianoWrongTried ? '👂 再听听第 ③ 个音是不是走调了？' : '👂 听声音，点出走调的音符块！';
    }
  }
  if (!wp) { cue.classList.remove('show'); return; }
  var sc = projectToScreen(wp);
  var maxRight = window.innerWidth - 252;
  cue.style.left = Math.max(248, Math.min(maxRight, sc.x)) + 'px';
  cue.style.top = Math.max(82, Math.min(window.innerHeight - 54, sc.y)) + 'px';
  cue.textContent = txt;
  cue.classList.add('show');
}

var lastPeelUpdated = -1;

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.max(0.001, Math.min(0.05, (now - lastT) / 1000));
  lastT = now;
  simT += dt;

  var pop = Math.min(1, (performance.now() - introT0) / 680);
  var ease = 1 - Math.pow(1 - pop, 3);
  live.scale.setScalar(0.01 + 0.99 * ease);

  // 自动飞行道具动画
  for (var fi = flyAnims.length - 1; fi >= 0; fi--) {
    var fa = flyAnims[fi];
    fa.t += dt;
    var u = Math.min(1, fa.t / fa.dur);
    var eU = 1 - Math.pow(1 - u, 3);
    if (u < 1) {
      fa.grp.position.lerpVectors(fa.from, fa.to, eU);
      fa.grp.position.y += Math.sin(u * Math.PI) * 0.36;
    } else if (!fa.done) {
      fa.done = true;
      if (fa.onArrive) fa.onArrive();
    } else if (fa.t > fa.dur + 0.45) {
      if (fa.stage === 1) s1ToolGoal[fa.toolId].copy(fa.home);
      else s2ToolGoal[fa.toolId].copy(fa.home);
      flyAnims.splice(fi, 1);
    }
  }

  // ===== 第 1 关动画：香蕉零穿模剥皮展开 + 弹性 + 果香粒子 + 悬停高亮 =====
  if (currentStage === 1) {
    bananaPeelCur += (bananaPeelTarget - bananaPeelCur) * Math.min(1, dt * 4.8);
    var isPeeled = bananaPeelCur > 0.015;
    wholeBananaG.visible = !isPeeled;
    peeledBananaG.visible = isPeeled;
    if (isPeeled && Math.abs(bananaPeelCur - lastPeelUpdated) > 0.002) {
      lastPeelUpdated = bananaPeelCur;
      peelFlaps.forEach(function (pf) {
        updateCurvedPeelGeometry(pf.geo, PEEL_TSEGS, PEEL_WSEGS, bananaPeelCur);
      });
    }

    bananaGlowRing.material.opacity = hoverTarget === 'banana' ? (0.65 + 0.30 * Math.sin(simT * 8)) : 0.0;

    if (bananaSquishT > 0) {
      bananaSquishT = Math.max(0, bananaSquishT - dt);
      var sq = Math.sin(bananaSquishT * 14) * 0.075 * bananaSquishT;
      bananaBodyG.scale.set(1 + sq, 1 - sq, 1 + sq);
    } else {
      bananaBodyG.scale.set(1, 1, 1);
      bananaBodyG.rotation.y = Math.sin(simT * 0.75) * 0.14;
    }

    if (bananaAromaT > 0) {
      bananaAromaT = Math.max(0, bananaAromaT - dt);
      bananaParticles.forEach(function (bp, i) {
        bp.m.visible = true;
        var p = (simT * 0.75 + bp.ph * 0.2) % 1;
        bp.m.position.set(-0.10 + Math.cos(i * 1.5 + simT * 2) * 0.48, 0.75 + p * 1.15, Math.sin(i * 1.5 + simT * 2) * 0.32);
        bp.m.rotation.y = simT * 3;
        bp.m.material.opacity = Math.sin(p * Math.PI) * Math.min(1, bananaAromaT);
      });
    } else {
      bananaParticles.forEach(function (bp) { bp.m.visible = false; });
    }

    Object.keys(S1_HOMES).forEach(function (k) {
      var flying = flyAnims.some(function (f) { return f.stage === 1 && f.toolId === k; });
      if (!flying) s1ToolG[k].position.lerp(s1ToolGoal[k], Math.min(1, dt * (draggingTool === k ? 22 : 13)));
      s1Tags[k].classList.toggle('sel', draggingTool === k);
      var tp = projectToScreen(new THREE.Vector3(s1ToolG[k].position.x, s1ToolG[k].position.y - 0.04, s1ToolG[k].position.z + 0.34));
      s1Tags[k].style.left = tp.x + 'px';
      s1Tags[k].style.top = Math.min(window.innerHeight - 28, tp.y) + 'px';
    });
  }

  // ===== 第 2 关动画：白梅绽放 + 寒气/暗香粒子 + 悬停高亮 =====
  if (currentStage === 2) {
    var bloomTarget = stage2Solved ? 1 : 0;
    plumBloomCur += (bloomTarget - plumBloomCur) * Math.min(1, dt * 4.5);
    plumBloomG.scale.setScalar(0.01 + 0.99 * plumBloomCur);
    plumCamoG.scale.setScalar(Math.max(0.01, 1 - plumBloomCur * 0.92));
    plumCamoG.visible = plumBloomCur < 0.88;

    snowGlowRing.material.opacity = hoverTarget === 'snow' ? (0.65 + 0.30 * Math.sin(simT * 8)) : 0.0;
    plumGlowRing.material.opacity = hoverTarget === 'plum' ? (0.65 + 0.30 * Math.sin(simT * 8)) : 0.0;

    if (snowColdT > 0) {
      snowColdT = Math.max(0, snowColdT - dt);
      snowColdParts.forEach(function (cp, i) {
        cp.m.visible = true;
        var p = (simT * 0.65 + cp.ph * 0.2) % 1;
        cp.m.position.set(Math.cos(i * 1.8 + simT) * 0.42, 0.55 + p * 0.85, Math.sin(i * 1.8 + simT) * 0.35);
        cp.m.material.opacity = Math.sin(p * Math.PI) * Math.min(1, snowColdT);
      });
    } else snowColdParts.forEach(function (cp) { cp.m.visible = false; });

    if (plumScentT > 0 || stage2Solved) {
      if (plumScentT > 0) plumScentT = Math.max(0, plumScentT - dt);
      var opMul = stage2Solved ? 0.72 : Math.min(1, plumScentT);
      plumScentParts.forEach(function (sp, i) {
        sp.m.visible = true;
        var p = (simT * 0.6 + sp.ph * 0.18) % 1;
        sp.m.position.set(Math.cos(i * 1.3 + simT * 1.8) * (0.28 + p * 0.45), 0.55 + p * 1.15, Math.sin(i * 1.3 + simT * 1.8) * 0.38);
        sp.m.rotation.z = simT * 3.5;
        sp.m.material.opacity = Math.sin(p * Math.PI) * opMul;
      });
    } else plumScentParts.forEach(function (sp) { sp.m.visible = false; });

    Object.keys(S2_HOMES).forEach(function (k) {
      var flying = flyAnims.some(function (f) { return f.stage === 2 && f.toolId === k; });
      if (!flying) s2ToolG[k].position.lerp(s2ToolGoal[k], Math.min(1, dt * (draggingTool === k ? 22 : 13)));
      s2Tags[k].classList.toggle('sel', draggingTool === k);
      var tp = projectToScreen(new THREE.Vector3(s2ToolG[k].position.x, s2ToolG[k].position.y - 0.04, s2ToolG[k].position.z + 0.34));
      s2Tags[k].style.left = tp.x + 'px';
      s2Tags[k].style.top = Math.min(window.innerHeight - 28, tp.y) + 'px';
    });
  }

  // ===== 第 3 关动画：3D 琴键机械下压 + 音符跳动 + 闭眼听音帘优雅升起 =====
  if (currentStage === 3) {
    pianoKeys.forEach(function (k) {
      k.press = Math.max(0, k.press - dt * 3.6);
      k.glow = Math.max(0, k.glow - dt * 2.5);
      k.pivot.rotation.x = k.press * 0.18;
      if (k.glow > 0.05) {
        k.mat.color.setHex(k.idx === WRONG_NOTE_IDX && !stage3Solved ? 0xfca5a5 : 0xfef08a);
      } else {
        k.mat.color.setHex(0xfcfcfd);
      }
    });
    noteBlocks.forEach(function (nb, idx) {
      nb.bounce = Math.max(0, nb.bounce - dt * 3.2);
      nb.grp.position.y = nb.baseY + Math.sin(simT * 2.4 + idx) * 0.042 + Math.sin(nb.bounce * Math.PI) * 0.26;
      nb.grp.visible = !stage3Solved;
    });
    var cTarget = stage3Solved ? 1 : 0;
    curtainOpenCur += (cTarget - curtainOpenCur) * Math.min(1, dt * 3.8);
    curtainG.position.y = 1.78 + curtainOpenCur * 0.45;
    curtainMesh.scale.y = Math.max(0.14, 1 - curtainOpenCur * 0.86);

    speakerG.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 10));
    spkRing.scale.setScalar(0.85 + ((simT * 0.9) % 1) * 0.65);
    spkRing.material.opacity = (1 - ((simT * 0.9) % 1)) * 0.8;

    var spSc = projectToScreen(new THREE.Vector3(speakerG.position.x, speakerG.position.y - 0.04, speakerG.position.z + 0.42));
    spkTag.style.left = spSc.x + 'px';
    spkTag.style.top = Math.min(window.innerHeight - 28, spSc.y) + 'px';
  }

  // 彩带
  if (cfOn) {
    cfCtx.clearRect(0, 0, cfCanvas.width, cfCanvas.height);
    var alive = 0;
    cfParts.forEach(function (p) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.a += p.va * dt;
      if (p.y < cfCanvas.height + 24) alive++;
      cfCtx.save(); cfCtx.translate(p.x, p.y); cfCtx.rotate(p.a);
      cfCtx.fillStyle = p.c; cfCtx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
      cfCtx.restore();
    });
    if (!alive) { cfOn = false; cfCtx.clearRect(0, 0, cfCanvas.width, cfCanvas.height); }
  }

  updateTargetCue();
  renderer.render(scene, camera);
}

/* ===== 自检接口 ===== */
window.__lesson = {
  pyErrors: pyErrors,
  info: function () {
    return {
      triangles: renderer.info.render.triangles,
      celebrated: celebrated,
      currentStage: currentStage,
      stage1Solved: stage1Solved,
      stage2Solved: stage2Solved,
      stage3Solved: stage3Solved
    };
  },
  getState: function () {
    var s1Pts = {}, s2Pts = {}, notePts = [], keyPts = [];
    Object.keys(S1_HOMES).forEach(function (k) {
      var p = s1ToolG[k].position.clone(); p.y += S1_TOOLS[k].cy; s1Pts[k] = projectToScreen(p);
    });
    Object.keys(S2_HOMES).forEach(function (k) {
      var p = s2ToolG[k].position.clone(); p.y += S2_TOOLS[k].cy; s2Pts[k] = projectToScreen(p);
    });
    noteBlocks.forEach(function (nb) {
      var wp = new THREE.Vector3(); nb.grp.getWorldPosition(wp); notePts.push(projectToScreen(wp));
    });
    pianoKeys.forEach(function (pk) {
      var wp = new THREE.Vector3(0, 0.12, 0.72); pk.pivot.localToWorld(wp); keyPts.push(projectToScreen(wp));
    });
    return {
      currentStage: currentStage,
      bananaDone: Object.assign({}, bananaDone),
      bananaPeelCur: bananaPeelCur,
      wholeVisible: wholeBananaG.visible,
      peeledVisible: peeledBananaG.visible,
      stage1Solved: stage1Solved,
      plumEyeTried: plumEyeTried,
      snowSmelled: snowSmelled,
      stage2Solved: stage2Solved,
      stage3Solved: stage3Solved,
      pianoWrongTried: pianoWrongTried,
      celebrated: celebrated,
      bananaPt: projectToScreen(new THREE.Vector3(-0.10, 0.98, -0.08)),
      snowPt: projectToScreen(new THREE.Vector3(-1.18, 0.56, -0.18)),
      plumPt: projectToScreen(new THREE.Vector3(0.98, 0.56, -0.18)),
      speakerPt: projectToScreen(new THREE.Vector3(-2.45, 0.46, 1.08)),
      s1Pts: s1Pts,
      s2Pts: s2Pts,
      notePts: notePts,
      keyPts: keyPts
    };
  }
};

setStage(1, true);
requestAnimationFrame(frame);
})();
</script>

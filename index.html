<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学科学·3D互动书包与课本</title>
<style>
:root{
  --bg:#f6efe0; --bg-hi:#fdfaf2; --card:#fffdf8; --ink:#241e16; --muted:#7b705e; --line:#e4d7be;
  --accent:#e56d17; --accent-hi:#f2822e; --accent-lo:#bf5409; --accent-soft:#fde7cf;
  --u1:#d97706; --u2:#16a34a; --u3:#2563eb; --u4:#e56d17;
  --shadow:0 2px 10px rgba(68,48,18,.06), 0 16px 38px rgba(68,48,18,.11);
  --shadow-sm:0 1px 4px rgba(68,48,18,.06), 0 4px 14px rgba(68,48,18,.07);
  --f-kai:"KaiTi","楷体","STKaiti","Kaiti SC","Noto Serif SC",serif;
  --f-ui:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{
  font-family:var(--f-ui);line-height:1.5;
  background-image:
    radial-gradient(960px 540px at 15% -5%, rgba(255,244,218,.92) 0%, transparent 72%),
    radial-gradient(960px 540px at 88% -5%, rgba(214,236,252,.72) 0%, transparent 72%),
    linear-gradient(180deg, #faf4e6 0%, #efe2c8 100%);
}
ruby{ruby-position:over;margin:0 .03em;ruby-align:center}
rt{font-size:.42em;color:#8e7e64;font-family:var(--f-ui);font-weight:400;line-height:1.15;padding:0 .05em}
body.no-py rt{display:none}
button,a{font-family:inherit;color:inherit}
svg.ico{width:1.08em;height:1.08em;flex:none;vertical-align:-.14em}

.shell{display:flex;flex-direction:column;min-height:100vh;padding:12px 18px 16px;gap:12px}
body.stage-locked .shell{height:100vh}

/* ===== 顶部统一工作台栏 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:8px 14px;border-radius:20px;
  background:rgba(255,253,248,.88);backdrop-filter:blur(10px);
  border:1.5px solid rgba(228,215,190,.92);box-shadow:var(--shadow-sm);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#fff2dc,#fddcb0);border:1.5px solid #efc68c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(217,114,30,.16);
}
.brand-mark svg{width:28px;height:28px}
.brand-t h1{margin:0;font-size:23px;line-height:1.75;color:#2a2218;white-space:nowrap}
.brand-sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:-4px}
.b-pill{padding:0 8px;border-radius:99px;background:#fef3e2;border:1px solid #f0cba0;color:#b8550b;font-weight:700;font-size:12px}

.top-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode-tabs{display:inline-flex;padding:3px;border-radius:14px;background:#f2e9d6;border:1px solid #e5d8bd;gap:4px}
.mtab{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:11px;
  border:1.5px solid transparent;background:transparent;font-size:16px;font-weight:700;color:#5c503e;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mtab:hover{background:rgba(255,255,255,.72);color:var(--ink)}
.mtab[aria-pressed="true"]{background:#fff;border-color:#ebb27d;color:#c2560c;box-shadow:0 2px 8px rgba(217,114,30,.15)}

.tool-btn{
  display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;border-radius:13px;
  border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:#4a3f2f;
  cursor:pointer;box-shadow:0 2px 0 #e2d5bc;transition:all .14s;white-space:nowrap;
}
.tool-btn:hover{border-color:var(--accent);color:var(--accent);background:#fffaf2;transform:translateY(-1px)}
.tool-btn.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff;box-shadow:0 2px 0 var(--accent-lo)}
.tool-btn.primary:hover{color:#fff;filter:brightness(1.04)}

/* ===== 学习进度与小红花统计栏 ===== */
.prog-hud{
  display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:14px;
  background:linear-gradient(180deg,#fff9f0,#fef0dc);border:1.5px solid #f0cfa0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);min-width:210px;
}
.prog-flower{
  display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:900;color:#d6336c;white-space:nowrap;
}
.prog-bar-wrap{flex:1 1 86px;min-width:72px;display:flex;flex-direction:column;gap:3px}
.prog-bar-bg{height:9px;border-radius:99px;background:#f0e0c4;overflow:hidden;box-shadow:inset 0 1px 2px rgba(90,60,20,.14)}
.prog-bar-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#f59f00,#f06595);transition:width .4s cubic-bezier(.22,1,.36,1)}
.prog-txt{font-size:11px;font-weight:800;color:#8a6232;white-space:nowrap;line-height:1}
.done-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;
  background:linear-gradient(180deg,#fff0f6,#ffd6e7);border:1.5px solid #f783ac;
  color:#c2255c;font-size:11px;font-weight:800;white-space:nowrap;
}
.portal-slot.is-done{border-color:#2b8a3e;background:linear-gradient(145deg,#f6fff8 0%,#e6f9eb 100%);box-shadow:0 8px 20px rgba(43,138,62,.16)}
.portal-slot.is-done::after{border-color:rgba(43,138,62,.28)}
.ccard.is-done{border-color:#74c69d;background:linear-gradient(180deg,#ffffff 0%,#f7fff9 100%)}
.cflower{
  position:absolute;right:10px;bottom:8px;padding:2px 8px;border-radius:99px;
  background:rgba(255,240,246,.96);border:1.5px solid #f783ac;color:#c2255c;
  font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(194,37,92,.14);
}
.cat-prog-banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 18px;border-radius:18px;
  background:linear-gradient(135deg,#fffaf0 0%,#fff0f6 100%);
  border:1.5px solid #f2c6d4;box-shadow:var(--shadow-sm);
}
.cat-prog-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cat-prog-title{font-size:17px;font-weight:900;color:#4a2b34}
.cat-prog-flowers{display:flex;flex-wrap:wrap;gap:4px;font-size:17px;line-height:1}
.cat-prog-bar{width:220px;max-width:100%;height:12px;border-radius:99px;background:#f2dce4;overflow:hidden}
.cat-prog-bar>i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#f59f00,#e64980);transition:width .4s ease}

/* ===== 接着学 + 快速搜索 + 原书 PDF 导入 ===== */
.resume-btn{
  display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:12px;
  border:1.5px solid #e58325;background:linear-gradient(180deg,#ff9a3c,#e56d17);color:#fff;
  font-size:13.5px;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 0 #b8500a;transition:all .14s;
}
.resume-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-in{
  width:168px;min-height:40px;padding:0 12px 0 32px;border-radius:12px;
  border:1.5px solid var(--line);background:#fffdf8;font-size:14px;font-weight:700;color:var(--ink);
  outline:none;transition:border-color .15s,width .18s;
}
.search-in:focus{border-color:var(--accent);width:214px;background:#fff}
.search-ico{position:absolute;left:10px;width:15px;height:15px;color:#8e7e64;pointer-events:none}
.search-drop{
  position:absolute;top:calc(100% + 6px);right:0;width:300px;max-height:320px;overflow-y:auto;
  background:#fffdf8;border:1.5px solid #e4d2b4;border-radius:14px;padding:6px;
  box-shadow:0 14px 32px rgba(68,48,18,.18);z-index:60;display:none;flex-direction:column;gap:4px;
}
.search-drop.show{display:flex}
.sdrop-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
  border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;
  background:transparent;border:none;cursor:pointer;text-align:left;transition:background .12s;
}
.sdrop-item:hover{background:#fff3df;color:#bf5409}
.sdrop-item small{font-size:11px;color:#8a7b62;font-weight:700;flex:none}

.pdf-wrap{position:relative;display:inline-flex;align-items:center}
.tool-btn.pdf-need{border-color:#e58325;background:#fff5e6;color:#c2560c;box-shadow:0 2px 0 #f0c28b;animation:pdfPulse 2s ease-in-out infinite}
@keyframes pdfPulse{0%,100%{box-shadow:0 2px 0 #f0c28b,0 0 0 0 rgba(229,109,23,.35)}50%{box-shadow:0 2px 0 #f0c28b,0 0 0 7px rgba(229,109,23,0)}}
.tool-btn.pdf-on{border-color:#2b8a3e;background:#ebfbee;color:#2b8a3e;box-shadow:0 2px 0 #b2f2bb;animation:none}
.pdf-pop{
  position:absolute;top:calc(100% + 8px);right:0;width:300px;z-index:50;
  background:#fffdf8;border:1.5px solid #e4d2b4;border-radius:16px;padding:12px 14px;
  box-shadow:0 16px 36px rgba(68,48,18,.22);display:none;flex-direction:column;gap:9px;
}
.pdf-pop.show{display:flex}
.pdf-pop h5{margin:0;font-size:14.5px;color:#2c2216;display:flex;align-items:center;gap:6px}
.pdf-pop p{margin:0;font-size:12.5px;color:#6d5f49;line-height:1.45}
.pdf-stat{font-size:12px;font-weight:700;padding:6px 9px;border-radius:10px;background:#f8f1e2;color:#5c4b32}
.pdf-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pdf-mini{
  padding:5px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:800;color:#4a3f2f;cursor:pointer;transition:all .12s;
}
.pdf-mini:hover{border-color:var(--accent);color:var(--accent)}
.pdf-mini.pri{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff}
.pdf-mini.danger{border-color:#ffc9c9;color:#c92a2a;background:#fff5f5}

/* 原书 PDF 贴图页面与半透明发光活页入口 */
.page.has-pdf{padding:0;background:#fff}
.page.has-pdf .pdf-bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;display:block;
}
.page.has-pdf .pdf-loading{
  position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;color:#8e7e64;background:#fbf7ee;
}
.page.has-pdf .pdf-pg-chip{
  position:absolute;bottom:8px;z-index:4;padding:2px 9px;border-radius:99px;
  background:rgba(255,253,248,.88);border:1px solid rgba(210,192,160,.8);
  font-size:11.5px;font-weight:800;color:#6c5e49;pointer-events:none;
}
.page.left.has-pdf .pdf-pg-chip{left:12px}
.page.right.has-pdf .pdf-pg-chip{right:12px}
.portal-slot.on-pdf{
  position:absolute;z-index:5;left:12px;right:12px;bottom:10px;width:auto;
  padding:7px 12px;gap:10px;flex-direction:row;align-items:center;justify-content:space-between;
  background:rgba(255,250,240,.94);backdrop-filter:blur(8px);
  border:2px solid var(--accent);border-radius:14px;
  box-shadow:0 8px 22px rgba(229,109,23,.26), 0 0 0 2px rgba(255,255,255,.8);
}
.portal-slot.on-pdf:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(229,109,23,.34)}
.portal-slot.on-pdf .portal-top{display:none}
.portal-slot.on-pdf .portal-mid{flex:1 1 auto;min-width:0;gap:8px}
.portal-slot.on-pdf .portal-ico{width:38px;height:38px;border-radius:10px}
.portal-slot.on-pdf .portal-ico svg{width:28px;height:28px}
.portal-slot.on-pdf .portal-txt{min-width:0}
.portal-slot.on-pdf .portal-txt h4{font-size:14.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portal-slot.on-pdf .portal-txt p{font-size:11.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portal-slot.on-pdf .portal-go{align-self:center;flex:none;padding:5px 11px;font-size:12.5px;background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff}
.page.has-pdf .pdf-pg-chip{top:8px;bottom:auto}
#bookOverlay.drag-pdf::after{
  content:"松手导入《科学》教材 PDF（仅存本机浏览器，不上传）";
  position:absolute;inset:14px;z-index:80;border-radius:20px;
  border:3px dashed var(--accent);background:rgba(255,250,240,.92);
  display:grid;place-items:center;font-size:20px;font-weight:900;color:#bf5409;pointer-events:none;
}

/* ===== 主舞台：3D 书包 / 立体翻书 ===== */
#stageWrap{
  position:relative;flex:1 1 auto;min-height:0;border-radius:26px;overflow:hidden;
  border:2px solid rgba(220,204,174,.95);
  background:linear-gradient(180deg,#cbe6fa 0%,#eaf4fc 42%,#f4ecdc 66%,#e8d6b8 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.72), var(--shadow);
  display:flex;flex-direction:column;
}
#bagCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

/* 3D 书包阶段浮层 */
.bag-hud{
  position:absolute;inset:0;pointer-events:none;z-index:5;
  display:flex;flex-direction:column;justify-content:space-between;padding:18px 22px;
}
.bag-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.stage-badge{
  pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:99px;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);
  border:1.5px solid rgba(226,210,180,.95);box-shadow:var(--shadow-sm);
  font-size:19px;font-weight:700;color:#382f22;line-height:1.6;
}
.stage-badge .pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(229,109,23,.22);animation:pDot 1.6s infinite}
@keyframes pDot{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}

.bag-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.bag-cta-row{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.big-cta{
  display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:4px 26px;border-radius:18px;
  border:2px solid var(--accent-lo);background:linear-gradient(180deg,var(--accent-hi),var(--accent));
  color:#fff;font-size:22px;font-weight:800;cursor:pointer;line-height:1.65;
  box-shadow:0 4px 0 var(--accent-lo), 0 10px 24px rgba(191,84,9,.32);transition:all .15s;
}
.big-cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
.big-cta:active{transform:translateY(2px)}
.big-cta rt{color:#fff3e4}
.soft-cta{
  display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:4px 18px;border-radius:16px;
  border:1.5px solid var(--line);background:rgba(255,253,248,.94);color:#4a3f2f;
  font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #dfd2b9;transition:all .15s;
}
.soft-cta:hover{border-color:var(--accent);color:var(--accent);background:#fff}

/* 12 册课本选书条（书包侧视时显示） */
.shelf-dock{
  pointer-events:auto;width:min(1560px, 100%);
  background:rgba(255,253,248,.90);backdrop-filter:blur(10px);
  border:1.5px solid rgba(226,210,180,.95);border-radius:18px;padding:8px 12px;
  box-shadow:0 12px 30px rgba(68,48,18,.14);
  display:flex;flex-direction:column;gap:6px;
}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.shelf-info{font-size:15px;font-weight:700;color:#4a3f2f}
.shelf-info em{font-style:normal;color:var(--accent)}
.book-pills{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.bpill{
  display:flex;align-items:center;justify-content:space-between;gap:3px;white-space:nowrap;
  padding:5px 7px;border-radius:11px;border:1.5px solid #e5d8bf;background:#faf5ea;
  font-size:13px;font-weight:700;color:#786c58;cursor:pointer;transition:all .14s;
}
.bpill:hover{border-color:#d8b38f;background:#fff}
.bpill.ready{background:linear-gradient(180deg,#fffaf0,#fdebd3);border-color:#ebb27d;color:#b8500a}
.bpill.sel{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff;box-shadow:0 3px 10px rgba(217,114,30,.28)}
.bpill .btag{font-size:11px;padding:1px 6px;border-radius:99px;background:rgba(0,0,0,.06)}
.bpill.ready .btag{background:#fff;color:#c85a0e}
.bpill.sel .btag{background:rgba(255,255,255,.24);color:#fff}

/* 3D 书名悬浮名牌 */
#bookHoverTag{
  position:absolute;left:0;top:0;z-index:8;display:none;pointer-events:none;
  padding:4px 14px;border-radius:99px;background:rgba(36,30,22,.88);color:#fff;
  font-size:15px;font-weight:700;white-space:nowrap;border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 6px 16px rgba(0,0,0,.22);transform:translate(-50%,-115%);
}
#bookHoverTag.show{display:block}

/* ===== 状态 3：立体摊开翻书层 ===== */
#bookOverlay{
  position:absolute;inset:0;z-index:12;
  background:radial-gradient(ellipse at 50% 45%, rgba(250,242,226,.96) 0%, rgba(235,219,192,.98) 100%);
  display:none;flex-direction:column;align-items:center;justify-content:space-between;
  padding:12px 22px 14px;gap:8px;
}
#bookOverlay.show{display:flex;animation:bookFade .45s cubic-bezier(.2,.8,.3,1)}
@keyframes bookFade{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.book-bar{
  width:min(1320px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.book-bar-l,.book-bar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.book-crumb{
  padding:5px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);
  font-size:16px;font-weight:700;color:#4a3f2f;box-shadow:var(--shadow-sm);
}
.book-crumb b{color:var(--accent)}

/* 单元书签 */
.unit-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.utab{
  padding:5px 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font-size:14px;font-weight:700;color:#5a4e3d;cursor:pointer;transition:all .14s;
  display:inline-flex;align-items:center;gap:5px;
}
.utab .udot{width:8px;height:8px;border-radius:50%}
.utab:hover{border-color:var(--accent);transform:translateY(-1px)}
.utab.act{background:#fff8eb;border-color:var(--accent);color:#b8500a;box-shadow:0 2px 8px rgba(217,114,30,.15)}

/* 书本本体（3D 透视对开双页） */
.book-stage{
  flex:1 1 auto;min-height:0;width:min(1260px,100%);
  display:flex;align-items:center;justify-content:center;gap:14px;
  perspective:2200px;position:relative;
}
.flip-arrow{
  width:52px;height:52px;border-radius:50%;flex:none;
  border:2px solid #dfd0b4;background:rgba(255,253,248,.95);color:#4a3f2f;
  display:grid;place-items:center;cursor:pointer;font-size:22px;font-weight:800;
  box-shadow:0 4px 14px rgba(68,48,18,.12);transition:all .15s;z-index:6;
}
.flip-arrow:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:scale(1.06)}
.flip-arrow:disabled{opacity:.32;cursor:not-allowed}

.book-shell{
  position:relative;flex:1 1 auto;max-width:1100px;height:min(74vh, 720px);min-height:460px;
  display:grid;grid-template-columns:1fr 1fr;
  border-radius:16px;padding:10px;
  background:linear-gradient(90deg, #b8601c 0%, #d97724 3%, #a65416 49.5%, #7c3c0d 50%, #a65416 50.5%, #d97724 97%, #b8601c 100%);
  box-shadow:0 22px 48px rgba(62,40,12,.24), 0 4px 0 #8c4410;
  transform-style:preserve-3d;
}
/* 纸张厚度叠边 */
.book-shell::before,.book-shell::after{
  content:"";position:absolute;top:14px;bottom:14px;width:9px;pointer-events:none;

  cursor:pointer;transition:transform .16s, box-shadow .16s;overflow:hidden;
}
.portal-slot::after{
  content:"";position:absolute;inset:-2px;border-radius:16px;pointer-events:none;
  border:2px solid rgba(229,109,23,.35);animation:portalGlow 2.1s ease-in-out infinite;
}

/* 翻页 3D 动效叶片 */
#flipLeaf{
  position:absolute;top:10px;bottom:10px;width:calc(50% - 10px);
  pointer-events:none;display:none;transform-style:preserve-3d;z-index:10;
}
#flipLeaf.fwd{left:50%;transform-origin:left center;display:block;animation:leafFwd .42s cubic-bezier(.45,.05,.55,.95) forwards}
#flipLeaf.bwd{left:10px;transform-origin:right center;display:block;animation:leafBwd .42s cubic-bezier(.45,.05,.55,.95) forwards}
.leaf-face{
  position:absolute;inset:0;border-radius:0 8px 8px 0;
  background:linear-gradient(90deg,#e9dec7 0%,#fffdf7 16%,#fbf5e7 100%);
  box-shadow:-6px 0 22px rgba(68,48,18,.18);backface-visibility:hidden;
}
#flipLeaf.bwd .leaf-face{border-radius:8px 0 0 8px;background:linear-gradient(270deg,#e9dec7 0%,#fffdf7 16%,#fbf5e7 100%)}
@keyframes leafFwd{0%{transform:rotateY(0deg)}100%{transform:rotateY(-180deg)}}
@keyframes leafBwd{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}

/* ========= 拼音注音引擎 ========= */
var HAN = /[㐀-鿿]/;
var pyErrors = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ruby(text, py) {
  if (!py) return esc(text);
  var syl = py.trim().split(/\s+/), i = 0, out = '';
  for (var ch of text) {
    if (HAN.test(ch)) {
      var p = syl[i++];
      if (!p) { pyErrors.push(text); p = ''; }
      out += '<ruby>' + ch + '<rt>' + p + '</rt></ruby>';
    } else out += esc(ch);
  }
  if (i !== syl.length) pyErrors.push(text);
  return out;
}
function hydrate(root) {
  root.querySelectorAll('[data-py]').forEach(function (el) {
    var t = el.textContent;
    el.dataset.t = t;
    el.innerHTML = ruby(t, el.dataset.py);

function playTone(f0, f1, dur, gain) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    var t0 = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t0 + dur);

    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

  block.position.set(0.025, 0, -0.004);
  g.add(block);
  var back = new THREE.Mesh(new THREE.BoxGeometry(BOOK.w, BOOK.h, 0.022), colorMat);
  back.position.z = -BOOK.t / 2 + 0.011; g.add(back);
  var spine = new THREE.Mesh(new THREE.BoxGeometry(0.024, BOOK.h, BOOK.t), [colorMat, mats[1], colorMat, colorMat, colorMat, colorMat]);
  spine.position.x = -BOOK.w / 2 + 0.012; g.add(spine);
  var pivot = new THREE.Group(); pivot.position.set(-BOOK.w / 2, 0, BOOK.t / 2 - 0.011); g.add(pivot);
  var cover = new THREE.Mesh(new THREE.BoxGeometry(BOOK.w, BOOK.h, 0.022), [colorMat, colorMat, colorMat, colorMat, mats[4], inMat]);

  return g;
}
function disposeRig() {
  if (!openRig) return;
  scene.remove(openRig);
  openRig.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
  openRig.userData.own.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
  openRig = null;
}

function updateCam3D() {
  if (!camera) return;
  var ce = Math.cos(cam.el);
  camera.position.set(
    cam.target.x + cam.D * ce * Math.sin(cam.phi),
    cam.target.y + cam.D * Math.sin(cam.el),
    cam.target.z + cam.D * ce * Math.cos(cam.phi)
  );
  camera.lookAt(cam.target);
}
function render3D() {
  if (!renderer) return;
  updateCam3D();
  renderer.render(scene, camera);
}
function kick3D() {
  if (!renderer || looping) return;
  looping = true; lastT = performance.now();
  renderer.setAnimationLoop(frame3D);
}
function setMatFade(m, v) {
  var tr = v < 0.995;
  if (m.transparent !== tr && !m.alphaTest) { m.transparent = tr; m.needsUpdate = true; }
  else if (m.alphaTest && !m.transparent) { m.transparent = true; m.needsUpdate = true; }
  m.opacity = v;
}
function applyFade(v) {
  if (!bagGroup) return;
  bagMats.forEach(function (m) { setMatFade(m, v); });
  bookMeshes.forEach(function (bm, i) {
    var keep = fly && fly.idx === i;
    var ov = keep ? 1 : v;
    bm.material.forEach(function (m) { setMatFade(m, ov); });
    if (!(keep && openRig)) bm.visible = keep || v > 0.01;
  });
  bagGroup.visible = v > 0.01;
}
function applyDoor() {
  if (!doorPivot) return;
  var s = Math.max(0.035, 1 - 0.965 * doorVal);
  doorPivot.scale.y = s;
  doorPull.position.y = 0.51 + 3.92 * s - 0.16;
  doorRoll.visible = doorVal > 0.12;
  var rs = 0.45 + 0.55 * doorVal;
  doorRoll.scale.set(rs, 1, rs);
}

function stepFly(dt) {
  fly.t += dt;
  var t = fly.t, bm = bookMeshes[fly.idx], ud = bm.userData;
  var a = ez(t / 0.55);            // 从侧门滑出
  var b = ez((t - 0.38) / 0.80);   // 往上飞，镜头跟着一起飞
  var r = ez((t - 0.78) / 0.60);   // 转身，封面正对镜头
  var o = ez((t - 1.32) / 0.72);   // 封面绕书脊翻开
  var px = ud.baseX - a * 3.1;
  var py = ud.baseY + fly.l0 * 0.40 * (1 - a) + a * 0.30 + b * 3.0;
  var pz = ud.baseZ * (1 - r);
  bm.position.set(px, py, pz);
  bm.rotation.set(0, -r * Math.PI / 2, 0);
  bagFade = 1 - clamp01((t - 0.42) / 0.62);   // 书包渐渐消失
  applyFade(bagFade);
  if (o > 0.001 && !openRig) { openRig = buildOpenRig(fly.idx); bm.visible = false; }
  if (openRig) {
    openRig.position.copy(bm.position);
    openRig.rotation.copy(bm.rotation);
    openRig.userData.pivot.rotation.y = -o * Math.PI * 0.97;
  }
  var mob = window.innerWidth < 860;
  var Dfin = mob ? 16 : 7.6;
  var c0 = fly.c0;
  camGoal.tx = c0.tx + (px - c0.tx) * b;
  camGoal.ty = c0.ty + (py - c0.ty) * b;
  camGoal.tz = c0.tz + ((pz - o * BOOK.w / 2) - c0.tz) * Math.max(b, r);
  camGoal.D = c0.D + (Dfin - c0.D) * b;
  camGoal.phi = -Math.PI / 2; camGoal.el = 0.05;
  if (t >= 2.05 && !fly.done) { fly.done = true; setBagMode('book'); }
  if (fly && t >= 2.6) fly = null;
}

function frame3D(now) {
  var dt = Math.max(0.001, Math.min((now - lastT) / 1000, 0.05)); lastT = now;
  var k = 1 - Math.exp(-5.2 * dt);
  var kl = 1 - Math.exp(-13 * dt);
  var kd = 1 - Math.exp(-6.5 * dt);
  var moving = false;

  if (fly) { stepFly(dt); moving = true; }

  [['phi', 'phi'], ['el', 'el'], ['D', 'D']].forEach(function (p) {
    var diff = camGoal[p[1]] - cam[p[0]];
    if (Math.abs(diff) > 0.0015) { cam[p[0]] += diff * k; moving = true; }
    else cam[p[0]] = camGoal[p[1]];
  });
  [['x', 'tx'], ['y', 'ty'], ['z', 'tz']].forEach(function (p) {
    var diff = camGoal[p[1]] - cam.target[p[0]];
    if (Math.abs(diff) > 0.0015) { cam.target[p[0]] += diff * k; moving = true; }
    else cam.target[p[0]] = camGoal[p[1]];
  });

  if (Math.abs(doorGoal - doorVal) > 0.002) { doorVal += (doorGoal - doorVal) * kd; moving = true; }
  else doorVal = doorGoal;
  applyDoor();

  if (!fly) {
    if (Math.abs(bagFadeGoal - bagFade) > 0.004) { bagFade += (bagFadeGoal - bagFade) * kd; moving = true; applyFade(bagFade); }
    else if (bagFade !== bagFadeGoal) { bagFade = bagFadeGoal; applyFade(bagFade); }
  }

  bookMeshes.forEach(function (m, i) {
    if (fly && fly.idx === i) return;
    var goal = Math.max(liftGoal[i], (S.bagMode === 'side' && i === S.selBook) ? 0.2 : 0);
    var d = goal - lift[i];
    if (Math.abs(d) > 0.002) { lift[i] += d * kl; moving = true; } else lift[i] = goal;
    var ud = m.userData;
    m.position.set(ud.baseX - lift[i] * 0.10, ud.baseY + lift[i] * 0.40, ud.baseZ);
    m.rotation.set(0, 0, 0);
    m.material[1].emissiveIntensity = 0.26 + lift[i] * 0.30;
  });

  render3D();
  if (!moving) { renderer.setAnimationLoop(null); looping = false; }
}

function resize3D() {
  if (!renderer || S.view !== 'bag') return;
  vw = stageWrap.clientWidth; vh = stageWrap.clientHeight;
  if (!vw || !vh) return;
  renderer.setSize(vw, vh, false);
  camera.aspect = vw / vh;
  camera.updateProjectionMatrix();
  if (!fly && (S.bagMode === 'front' || S.bagMode === 'side')) { camGoal = camFor(S.bagMode); kick3D(); }
  render3D();
}

function resetShelf() {
  fly = null;
  disposeRig();
  bookMeshes.forEach(function (bm) {
    var ud = bm.userData;
    bm.visible = true;
    bm.rotation.set(0, 0, 0);
    bm.position.set(ud.baseX, ud.baseY, ud.baseZ);
  });
}

/* ========= 书包状态切换（正面 → 纯侧面看书脊 → 书飞起展开） ========= */
function setBagMode(mode) {

  hoverTag.classList.remove('show');
  for (var i = 0; i < liftGoal.length; i++) liftGoal[i] = 0;

  if (isFront) {
    doorGoal = 0; bagFadeGoal = 1;
    camGoal = camFor('front');
    $('#bagTipTxt').innerHTML = ruby('点一点书包，打开看看里面的科学书！', 'diǎn yì diǎn shū bāo dǎ kāi kàn kan lǐ miàn de kē xué shū');
  } else if (isSide) {
    doorGoal = 1; bagFadeGoal = 1;
    camGoal = camFor('side');
    updateBookSelection(S.selBook);
    $('#bagTipTxt').innerHTML = ruby('滑过书脊挑一本，点一下就飞出来翻开！', 'huá guò shū jǐ tiāo yì běn diǎn yí xià jiù fēi chū lái fān kāi');
  } else if (isBook) {
    bagFadeGoal = 0;
  }
  if (!isBook) kick3D();
  if (isBook) renderSpread(S.spread, null);
  saveState();
}

function updateBookSelection(idx) {
  S.selBook = idx;
  var bk = BOOKS[idx];
  $$('.bpill').forEach(function (el, i) { el.classList.toggle('sel', i === idx); });
  var btn = $('#pullBookBtn'), txt = $('#pullBookTxt');

    if (VOLUMES[bk.id] && S.vol !== bk.id) selectVolume(bk.id, { resetSpread: true, silentRender: true });

  }
  kick3D();
}
function bounceBook(idx) {
  if (lift[idx] !== undefined) { lift[idx] = 1.25; kick3D(); }
}

function pullAndOpenBook(idx) {
  var bk = BOOKS[idx];
  if (!bk || !bk.ready) { updateBookSelection(idx); bounceBook(idx); return; }
  if (VOLUMES[bk.id]) selectVolume(bk.id, { resetSpread: S.vol !== bk.id, silentRender: true });
  if (!renderer || !bookMeshes.length) { setBagMode('book'); return; }
  if (fly) return;
  updateBookSelection(idx);
  sfxSlide();
  S.bagMode = 'pulling';
  $('#bagHud').hidden = true;
  hoverTag.classList.remove('show');
  for (var i = 0; i < liftGoal.length; i++) liftGoal[i] = 0;
  doorGoal = 1;
  fly = { idx: idx, t: 0, l0: lift[idx] || 0, done: false,
          c0: { tx: cam.target.x, ty: cam.target.y, tz: cam.target.z, D: cam.D } };
  kick3D();
}

/* ========= 书脊悬停“波浪”、点击飞出 ========= */
var dragOrb = null;
function spineScreen(i) {
  var rect = canvas.getBoundingClientRect(), ud = bookMeshes[i].userData, v = new THREE.Vector3();
  var sx = ud.baseX - BOOK.w / 2;
  v.set(sx, ud.baseY, ud.baseZ).project(camera);
  var cx = (v.x + 1) / 2 * rect.width, cy = (1 - v.y) / 2 * rect.height;
  v.set(sx, ud.baseY + BOOK.h / 2, ud.baseZ).project(camera);
  var ty = (1 - v.y) / 2 * rect.height;
  v.set(sx, ud.baseY - BOOK.h / 2, ud.baseZ).project(camera);
  var by = (1 - v.y) / 2 * rect.height;
  return { x: cx, y: cy, top: ty, bot: by, clientX: rect.left + cx, clientY: rect.top + cy };
}
function clearWave() {
  var had = false;
  for (var i = 0; i < liftGoal.length; i++) { if (liftGoal[i]) had = true; liftGoal[i] = 0; }
  S.hoverBook = -1;
  hoverTag.classList.remove('show');
  if (had) kick3D();
}
function waveCenter(idx) {
  for (var i = 0; i < liftGoal.length; i++) { var d = i - idx; liftGoal[i] = Math.exp(-d * d / 1.6); }
  kick3D();
}
function waveAt(e) {
  if (!renderer || S.bagMode !== 'side' || fly || !bookMeshes.length) return -1;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var ps = bookMeshes.map(function (_, i) { return spineScreen(i); });
  var n = ps.length;
  var pitch = Math.abs(ps[1].x - ps[0].x) || 1;
  var x0 = Math.min(ps[0].x, ps[n - 1].x) - pitch * 1.1, x1 = Math.max(ps[0].x, ps[n - 1].x) + pitch * 1.1;
  if (mx < x0 || mx > x1 || my < ps[0].top - 50 || my > ps[0].bot + 30) {
    clearWave(); canvas.style.cursor = 'default'; return -1;
  }
  var best = 0, bd = 1e9;
  ps.forEach(function (p, i) {
    var d = (mx - p.x) / pitch;
    liftGoal[i] = Math.exp(-d * d / 1.6);   // 高斯波峰：鼠标滑过时相邻书依次抬起再落下
    if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
  });
  S.hoverBook = best;
  var bk = BOOKS[best];
  var srect = stageWrap.getBoundingClientRect();
  hoverTag.textContent = bk.label + (bk.ready ? ' · 点一下飞出翻开' : ' · 待制作');
  hoverTag.style.left = (rect.left - srect.left + ps[best].x) + 'px';
  hoverTag.style.top = (rect.top - srect.top + ps[best].top - 34) + 'px';
  hoverTag.classList.add('show');
  canvas.style.cursor = 'pointer';
  kick3D();
  return best;
}
function hitBooks(e) {
  if (!renderer || !bookMeshes.length) return null;
  var rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  var hits = raycaster.intersectObjects(bookMeshes.filter(function (m) { return m.visible; }), false);
  if (hits.length) return { type: 'book', idx: hits[0].object.userData.bookIdx };
  return null;
}

canvas.addEventListener('pointerdown', function (e) {
  if (S.bagMode !== 'front' && S.bagMode !== 'side') return;
  dragOrb = { x: e.clientX, y: e.clientY, phi: cam.phi, el: cam.el, moved: 0 };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
});
canvas.addEventListener('pointermove', function (e) {
  if (S.bagMode !== 'front' && S.bagMode !== 'side') return;
  if (dragOrb) {
    var dx = e.clientX - dragOrb.x, dy = e.clientY - dragOrb.y;
    dragOrb.moved = Math.max(dragOrb.moved, Math.hypot(dx, dy));
    if (S.bagMode === 'front' && dragOrb.moved > 6) {
      cam.phi = THREE.MathUtils.clamp(dragOrb.phi - dx * 0.007, -0.9, 1.3);
      cam.el = THREE.MathUtils.clamp(dragOrb.el + dy * 0.004, 0.04, 0.7);
      camGoal.phi = cam.phi; camGoal.el = cam.el;
      render3D();
      return;
    }
  }
  if (S.bagMode === 'side') waveAt(e);
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragOrb) return;
  var moved = dragOrb.moved;
  dragOrb = null;
  if (S.bagMode === 'front') {
    if (moved < 8) { sfxZip(); setBagMode('side'); }
    return;
  }
  if (S.bagMode === 'side' && moved < 14) {
    var h = hitBooks(e);
    var idx = (h && h.type === 'book') ? h.idx : waveAt(e);
    if (idx == null || idx < 0) return;
    if (BOOKS[idx].ready) pullAndOpenBook(idx);
    else { updateBookSelection(idx); bounceBook(idx); }
  }
});
canvas.addEventListener('pointerleave', function () { if (S.bagMode === 'side') clearWave(); });
$('#bookPills').addEventListener('pointerover', function (e) {
  var b = e.target.closest('.bpill');
  if (b && S.bagMode === 'side') waveCenter(+b.dataset.bidx);
});
$('#bookPills').addEventListener('pointerleave', function () { if (S.bagMode === 'side') clearWave(); });
window.__hubSpine = function (i) { return renderer && bookMeshes[i] ? spineScreen(i) : null; };
window.__hubFlyT = function () { return fly ? fly.t : -1; };

      html += '<div class="toc-u" style="color:' + u.color + '">' + u.num + ' · ' + u.name + '</div>';

      });
    });
    html += '</div></div><div class="pg-foot"><span>' + v.label + '</span><span>目录</span></div>';
    return { html: html, isPdf: false };
  }

  if (pNum > v.maxPage) {
    var endHtml = '<div class="pg-head"><span class="pg-unit-tag" style="background:#16a34a">全册完</span><span class="pg-lesson-tag">' + v.label + '</span></div>' +
      '<div class="pg-body"><div class="abs-block span2 row2" style="align-items:center;text-align:center">' +

        '<div style="font-size:18px;font-weight:900;color:#4a3f2f">《科学·' + v.label + '》翻完啦！</div>' +
        '<div style="font-size:13.5px;color:#7b705e">点左上角“放回书包”可以换另一册继续探索哦</div>' +
      '</div></div><div class="pg-foot"><span>封底</span><span>粤教科技版</span></div>';
    return { html: endHtml, isPdf: false };
  }

  var pd = v.pages[pNum] || { u: 'u1', label: '课本页', pos: 'none' };
  var u = v.units[pd.u];
  var l = pd.lid ? v.lmap[pd.lid] : null;
  var headTitle = l ? ('第 ' + l.no + ' 课 · ' + l.name) : pd.label;
  var meta = curPdfMeta(), hasBuiltin = curHasBuiltin();

  if (showRealPdf && ((meta && window.__xkPdfBook) || hasBuiltin)) {
    var posCls = 'on-pdf pos-' + (pd.pos || 'bottom');
    var overlay = (pd.pos && pd.pos !== 'none' && pd.lid) ? portalHtml(pd, posCls) : '';
    if (meta && window.__xkPdfBook) {
      var pdfHtml = '<div class="pdf-loading" data-pdf-loading="' + pNum + '">正在渲染原书第 ' + pNum + ' 页…</div>' +
        '<img class="pdf-bg" data-pdf-img="' + pNum + '" alt="课本第' + pNum + '页" hidden>' +
        overlay +
        '<span class="pdf-pg-chip">原书 P' + pNum + '</span>';
      return { html: pdfHtml, isPdf: true, pNum: pNum };
    } else {
      var imgSrc = 'pages/' + v.id + '/' + pad3(pNum) + '.jpg';
      var builtinHtml = '<img class="pdf-bg" src="' + imgSrc + '" alt="课本第' + pNum + '页">' +
        overlay +
        '<span class="pdf-pg-chip">原书 P' + pNum + '</span>';
      return { html: builtinHtml, isPdf: true, pNum: pNum };
    }
  }

  var body = '';
  if (pd.pos === 'none') {
    body = absLinesHtml('span2', pd.sketch || '图文导读区') + absLinesHtml('span2', '阅读与思考横线区');
  } else if (pd.pos === 'tl') {
    body = portalHtml(pd) + absLinesHtml('', '插图区') + absLinesHtml('span2', '');
  } else if (pd.pos === 'tr') {
    body = absLinesHtml('', '导语区') + portalHtml(pd) + absLinesHtml('span2', '');
  } else if (pd.pos === 'bl') {
    body = absLinesHtml('span2', '思考与记录区') + portalHtml(pd) + absLinesHtml('', '');
  } else if (pd.pos === 'br') {
    body = absLinesHtml('span2', '思考与记录区') + absLinesHtml('', '') + portalHtml(pd);
  } else if (pd.pos === 'top') {
    body = portalHtml(pd, 'span2') + absLinesHtml('span2', '记录与交流横线区');

  return {
    html: '<div class="pg-head"><span class="pg-unit-tag" style="background:' + u.color + '">' + u.num + '</span><span class="pg-lesson-tag">' + esc(headTitle) + '</span></div>' +

      '<div class="pg-foot"><span>P' + pNum + '</span><span>' + u.name + '</span></div>',
    isPdf: false
  };
}

function hydratePdfSpread(pair, seq) {
  var v = curVol(), meta = curPdfMeta();
  if (!meta || !showRealPdf || !window.__xkPdfBook) return;
  pair.forEach(function (pNum) {
    if (pNum <= 0 || pNum > v.maxPage) return;
    window.__xkPdfBook.renderPrintedPage(v.id, pNum, 1080).then(function (url) {
      if (seq !== pdfRenderSeq) return;
      var img = document.querySelector('img[data-pdf-img="' + pNum + '"]');
      var ld = document.querySelector('[data-pdf-loading="' + pNum + '"]');
      if (url && img) {
        img.src = url;
        img.hidden = false;
        if (ld) ld.hidden = true;
      } else if (ld) {
        ld.textContent = 'PDF 超出页码范围（可在右上角微调页码对齐）';
      }
    });
  });
  [pair[1] + 1, pair[1] + 2].forEach(function (np) {
    if (np >= 1 && np <= v.maxPage) window.__xkPdfBook.renderPrintedPage(v.id, np, 1080);
  });
}

function spreadPages(sp) {
  if (sp === 0) return [0, 1];
  return [sp * 2, sp * 2 + 1];
}

function renderSpread(sp, dir) {
  var v = curVol();
  sp = Math.max(0, Math.min(v.maxSpread, sp));
  S.spread = sp;
  var pair = spreadPages(sp);

  if (dir) {
    var leaf = $('#flipLeaf');
    leaf.className = '';
    void leaf.offsetWidth;
    leaf.className = dir;
    sfxFlip();
    setTimeout(function () { leaf.className = ''; }, 440);
  }

  var rL = renderSinglePage(pair[0], 'left');
  var rR = renderSinglePage(pair[1], 'right');
  var elL = $('#pageLeft'), elR = $('#pageRight');
  elL.classList.toggle('has-pdf', !!rL.isPdf);
  elR.classList.toggle('has-pdf', !!rR.isPdf);
  elL.innerHTML = rL.html;
  elR.innerHTML = rR.html;
  pdfRenderSeq++;
  if (rL.isPdf || rR.isPdf) hydratePdfSpread(pair, pdfRenderSeq);

  var label = pair[0] === 0 ? '目录 / P1' : (pair[1] > v.maxPage ? ('P' + pair[0] + ' / 封底') : ('P' + pair[0] + ' – P' + pair[1]));
  $('#pgCounter').textContent = label + '（' + (sp + 1) + '/' + (v.maxSpread + 1) + '）';
  $('#pageRange').max = String(v.maxSpread);
  $('#pageRange').value = sp;

  var pdL = v.pages[pair[0]], pdR = v.pages[pair[1]];
  var activeL = (pdL && pdL.lid && v.lmap[pdL.lid]) || (pdR && pdR.lid && v.lmap[pdR.lid]);
  $('#crumbLesson').textContent = activeL ? ('第 ' + activeL.no + ' 课《' + activeL.name + '》· ' + label) : label;

  $('#prevPageBtn').disabled = sp <= 0;
  $('#nextPageBtn').disabled = sp >= v.maxSpread;
  $('#mobPrevBtn').disabled = sp <= 0;
  $('#mobNextBtn').disabled = sp >= v.maxSpread;

  var activeTab = 0;
  v.unitTabs.forEach(function (t) {
    if (t.min !== undefined && sp >= t.min && sp <= t.max) activeTab = t.sp;
  });
  $$('#unitTabs .utab').forEach(function (t) { t.classList.toggle('act', +t.dataset.sp === activeTab); });
  maybeOfferPdf();
  saveState();
}

/* ========= 目录总览模式渲染（与当前分册活页一一对应） ========= */
function renderCatalog() {
  var v = curVol();
  var wrap = $('#catSections');
  var liveList = [];
  Object.keys(v.pages).sort(function (a, b) { return (+a) - (+b); }).forEach(function (pStr) {
    var pd = v.pages[pStr];
    if (pd && pd.pos !== 'none' && pd.lid) liveList.push({ p: +pStr, pd: pd, l: v.lmap[pd.lid] });
  });
  var html = '';
  ['u1', 'u2', 'u3', 'u4'].forEach(function (uk) {
    if (S.filter !== 'all' && S.filter !== uk) return;
    var u = v.units[uk];
    var list = liveList.filter(function (x) { return x.pd.u === uk; });
    html += '<section class="unit-sec ' + (list.length === 3 ? 'cols3' : '') + '">' +
      '<div class="unit-head"><div class="unit-title-wrap"><span class="unit-num" style="background:' + u.color + '">' + u.num + '</span><h2>' + ruby(u.name, u.py) + '</h2></div>' +
      '<span style="font-size:14px;font-weight:700;color:#8a7b62">共 ' + list.length + ' 张活页</span></div>' +
      '<div class="cat-grid">' +
      list.map(function (x) {

        return '<a class="ccard' + (done ? ' is-done' : '') + '" href="lessons/' + file + '.html">' +
          '<div class="cthumb"><span class="cno">第 ' + x.l.no + ' 课 · ' + esc(x.l.name) + '</span><span class="cpg">P' + x.p + '</span>' + (done ? '<span class="cflower">🌸 已完成</span>' : '') + ICONS[x.l.ico] + '</div>' +
          '<div class="cbody"><h3>' + ruby(x.pd.act, x.pd.actPy) + '</h3>' +

      }).join('') +

/* ========= 视图模式切换 & 状态记忆 ========= */
function setViewMode(mode) {
  S.view = mode;
  var isBag = mode === 'bag';
  $('#stageWrap').hidden = !isBag;
  $('#catalogView').hidden = isBag;
  document.body.classList.toggle('stage-locked', isBag);
  $('#tabBag').setAttribute('aria-pressed', String(isBag));
  $('#tabCatalog').setAttribute('aria-pressed', String(!isBag));
  if (isBag) { resize3D(); if (S.bagMode === 'book') renderSpread(S.spread, null); }
  else { renderVolChrome(); renderCatalog(); }
  saveState();
}

function saveState() {
  try {
    sessionStorage.setItem('xk_bag_state', JSON.stringify({ vol: S.vol, view: S.view, bagMode: S.bagMode === 'pulling' ? 'book' : S.bagMode, spread: S.spread }));
    sessionStorage.setItem('xk_last_vol', S.vol);
  } catch (e) {}
}
function restoreState() {
  try {
    var qVol = new URLSearchParams(location.search).get('vol');
    if (qVol && VOLUMES[qVol]) {
      selectVolume(qVol, { resetSpread: true, silentRender: true });
    }
    var raw = sessionStorage.getItem('xk_bag_state') || sessionStorage.getItem('k1a_bag_state');
    if (!raw) {
      var lastV = sessionStorage.getItem('xk_last_vol');
      if (!qVol && lastV && VOLUMES[lastV]) selectVolume(lastV, { resetSpread: true, silentRender: true });
      return;
    }
    var st = JSON.parse(raw);
    if (!qVol && st && st.vol && VOLUMES[st.vol]) {
      selectVolume(st.vol, { resetSpread: false, silentRender: true });
    }
    if (st && typeof st.spread === 'number') S.spread = Math.max(0, Math.min(curVol().maxSpread, st.spread));
    if (st && st.view === 'catalog') { setViewMode('catalog'); return; }
    if (st && (st.bagMode === 'book' || st.bagMode === 'side')) setBagMode(st.bagMode);
  } catch (e) {}
}

function handlePdfFile(file) {
  var v = curVol();
  if (!file || !/\.pdf$/i.test(file.name || '') && file.type !== 'application/pdf') {
    syncPdfUi('请选择有效的 PDF 教材文件！');
    return;
  }
  if (!window.__xkPdfBook) {
    syncPdfUi('PDF 引擎未加载，请刷新页面重试');
    return;
  }
  syncPdfUi('正在本地解析并存入浏览器，请稍候…');
  window.__xkPdfBook.importFile(v.id, file, { defaultOffset: v.pdfOffset, printedTotal: v.maxPage }).then(function (meta) {
    pdfMetaByVol[v.id] = meta;
    showRealPdf = true;
    syncPdfUi();
    $('#pdfPop').classList.remove('show');
    if (S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
  }).catch(function (err) {
    syncPdfUi('解析失败：' + (err && err.message ? err.message : '请确认文件未加密'));
  });
}

      if (!curPdfMeta() && S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
    }
  };
  testImg.src = 'pages/' + vk + '/001.jpg';
});
init3D();
resize3D();
renderCatalog();
restoreState();
if (window.__xkPdfBook) {
  ['k1a', 'k1b'].forEach(function (vk) {
    window.__xkPdfBook.restore(vk).then(function (meta) {
      if (meta) {
        pdfMetaByVol[vk] = meta;
        if (S.vol === vk) {
          syncPdfUi();
          if (S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
        }
      }
    });
  });
}
})();
</script>

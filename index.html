<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学科学 · 3D 互动书包与科学手记</title>
<style>
:root{
  --bg:#f6efe0; --bg-hi:#fdfaf2; --card:#fffdf8; --ink:#241e16; --muted:#7b705e; --line:#e4d7be;
  --accent:#d9621a; --accent-hi:#ec7b2f; --accent-lo:#b24b0d; --accent-soft:#fde7cf;
  --u1:#c86d14; --u2:#248248; --u3:#2b6cb0; --u4:#c95b22;
  --shadow:0 2px 10px rgba(68,48,18,.06), 0 16px 38px rgba(68,48,18,.11);
  --shadow-sm:0 1px 4px rgba(68,48,18,.06), 0 4px 14px rgba(68,48,18,.07);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","FZFangSong-Z02","FangSong",Georgia,serif;
  --f-kai:"KaiTi","楷体","STKaiti","Kaiti SC","Noto Serif SC",serif;
  --f-ui:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{
  font-family:var(--f-ui);line-height:1.5;
  background-image:
    radial-gradient(960px 540px at 15% -5%, rgba(255,244,218,.92) 0%, transparent 72%),
    radial-gradient(960px 540px at 88% -5%, rgba(214,236,252,.72) 0%, transparent 72%),
    linear-gradient(180deg, #faf4e6 0%, #efe2c8 100%);
}
ruby{ruby-position:over;margin:0 .03em;ruby-align:center}
rt{font-size:.42em;color:#8e7e64;font-family:var(--f-ui);font-weight:400;line-height:1.15;padding:0 .05em}
body.no-py rt{display:none}
button,a{font-family:inherit;color:inherit}
svg.ico{width:1.08em;height:1.08em;flex:none;vertical-align:-.14em}

.shell{display:flex;flex-direction:column;min-height:100vh;padding:12px 18px 16px;gap:12px}
body.stage-locked .shell{height:100vh}
body.book-open .shell{padding:0;gap:0;height:100vh}
body.book-open .topbar{display:none}
body.book-open #stageWrap{border-radius:0;border:none;box-shadow:none}

/* ===== 顶部统一工作台栏 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:8px 14px;border-radius:20px;
  background:rgba(255,253,248,.88);backdrop-filter:blur(10px);
  border:1.5px solid rgba(228,215,190,.92);box-shadow:var(--shadow-sm);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#fff2dc,#fddcb0);border:1.5px solid #efc68c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(217,114,30,.16);
}
.brand-mark svg{width:28px;height:28px}
.brand-t h1{margin:0;font-size:23px;line-height:1.75;color:#2a2218;white-space:nowrap}
.brand-sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:-4px}
.b-pill{padding:0 8px;border-radius:99px;background:#fef3e2;border:1px solid #f0cba0;color:#b8550b;font-weight:700;font-size:12px}

.top-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode-tabs{display:inline-flex;padding:3px;border-radius:14px;background:#f2e9d6;border:1px solid #e5d8bd;gap:4px}
.mtab{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:11px;
  border:1.5px solid transparent;background:transparent;font-size:16px;font-weight:700;color:#5c503e;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mtab:hover{background:rgba(255,255,255,.72);color:var(--ink)}
.mtab[aria-pressed="true"]{background:#fff;border-color:#ebb27d;color:#c2560c;box-shadow:0 2px 8px rgba(217,114,30,.15)}

.tool-btn{
  display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;border-radius:13px;
  border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:#4a3f2f;
  cursor:pointer;box-shadow:0 2px 0 #e2d5bc;transition:all .14s;white-space:nowrap;
}
.tool-btn:hover{border-color:var(--accent);color:var(--accent);background:#fffaf2;transform:translateY(-1px)}
.tool-btn.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff;box-shadow:0 2px 0 var(--accent-lo)}
.tool-btn.primary:hover{color:#fff;filter:brightness(1.04)}

/* ===== 学习进度与小红花统计栏 ===== */
.prog-hud{
  display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:14px;
  background:linear-gradient(180deg,#fff9f0,#fef0dc);border:1.5px solid #f0cfa0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);min-width:210px;
}
.prog-flower{
  display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:900;color:#d6336c;white-space:nowrap;
}
.prog-bar-wrap{flex:1 1 86px;min-width:72px;display:flex;flex-direction:column;gap:3px}
.prog-bar-bg{height:9px;border-radius:99px;background:#f0e0c4;overflow:hidden;box-shadow:inset 0 1px 2px rgba(90,60,20,.14)}
.prog-bar-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#f59f00,#f06595);transition:width .4s cubic-bezier(.22,1,.36,1)}
.prog-txt{font-size:11px;font-weight:800;color:#8a6232;white-space:nowrap;line-height:1}
.done-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;
  background:linear-gradient(180deg,#fff0f6,#ffd6e7);border:1.5px solid #f783ac;
  color:#c2255c;font-size:11px;font-weight:800;white-space:nowrap;
}
.ccard.is-done{border-color:#74c69d;background:linear-gradient(180deg,#ffffff 0%,#f7fff9 100%)}
.cflower{
  position:absolute;right:10px;bottom:8px;padding:2px 8px;border-radius:99px;
  background:rgba(255,240,246,.96);border:1.5px solid #f783ac;color:#c2255c;
  font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(194,37,92,.14);
}
.cat-prog-banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 18px;border-radius:18px;
  background:linear-gradient(135deg,#fffaf0 0%,#fff0f6 100%);
  border:1.5px solid #f2c6d4;box-shadow:var(--shadow-sm);
}
.cat-prog-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cat-prog-title{font-size:17px;font-weight:900;color:#4a2b34}
.cat-prog-flowers{display:flex;flex-wrap:wrap;gap:4px;font-size:17px;line-height:1}
.cat-prog-bar{width:220px;max-width:100%;height:12px;border-radius:99px;background:#f2dce4;overflow:hidden}
.cat-prog-bar>i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#f59f00,#e64980);transition:width .4s ease}

/* ===== 接着学 + 快速搜索 ===== */
.resume-btn{
  display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:12px;
  border:1.5px solid #e58325;background:linear-gradient(180deg,#ff9a3c,#e56d17);color:#fff;
  font-size:13.5px;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 0 #b8500a;transition:all .14s;
}
.resume-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-in{
  width:168px;min-height:40px;padding:0 12px 0 32px;border-radius:12px;
  border:1.5px solid var(--line);background:#fffdf8;font-size:14px;font-weight:700;color:var(--ink);
  outline:none;transition:border-color .15s,width .18s;
}
.search-in:focus{border-color:var(--accent);width:214px;background:#fff}
.search-ico{position:absolute;left:10px;width:15px;height:15px;color:#8e7e64;pointer-events:none}
.search-drop{
  position:absolute;top:calc(100% + 6px);right:0;width:300px;max-height:320px;overflow-y:auto;
  background:#fffdf8;border:1.5px solid #e4d2b4;border-radius:14px;padding:6px;
  box-shadow:0 14px 32px rgba(68,48,18,.18);z-index:60;display:none;flex-direction:column;gap:4px;
}
.search-drop.show{display:flex}
.sdrop-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
  border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;
  background:transparent;border:none;cursor:pointer;text-align:left;transition:background .12s;
}
.sdrop-item:hover{background:#fff3df;color:#bf5409}
.sdrop-item small{font-size:11px;color:#8a7b62;font-weight:700;flex:none}

/* ===== 主舞台：3D 书包 / 立体翻书 ===== */
#stageWrap{
  position:relative;flex:1 1 auto;min-height:0;border-radius:26px;overflow:hidden;
  border:2px solid rgba(220,204,174,.95);
  background:linear-gradient(180deg,#cbe6fa 0%,#eaf4fc 42%,#f4ecdc 66%,#e8d6b8 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.72), var(--shadow);
  display:flex;flex-direction:column;
}
#bagCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

/* 3D 书包阶段浮层 */
.bag-hud{
  position:absolute;inset:0;pointer-events:none;z-index:5;
  display:flex;flex-direction:column;justify-content:space-between;padding:18px 22px;
}
.bag-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.stage-badge{
  pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:99px;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);
  border:1.5px solid rgba(226,210,180,.95);box-shadow:var(--shadow-sm);
  font-size:19px;font-weight:700;color:#382f22;line-height:1.6;
}
.stage-badge .pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(229,109,23,.22);animation:pDot 1.6s infinite}
@keyframes pDot{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}

.bag-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.bag-cta-row{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.big-cta{
  display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:4px 26px;border-radius:18px;
  border:2px solid var(--accent-lo);background:linear-gradient(180deg,var(--accent-hi),var(--accent));
  color:#fff;font-size:22px;font-weight:800;cursor:pointer;line-height:1.65;
  box-shadow:0 4px 0 var(--accent-lo), 0 10px 24px rgba(191,84,9,.32);transition:all .15s;
}
.big-cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
.big-cta:active{transform:translateY(2px)}
.big-cta rt{color:#fff3e4}
.soft-cta{
  display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:4px 18px;border-radius:16px;
  border:1.5px solid var(--line);background:rgba(255,253,248,.94);color:#4a3f2f;
  font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #dfd2b9;transition:all .15s;
}
.soft-cta:hover{border-color:var(--accent);color:var(--accent);background:#fff}

/* 12 册课本选书条（书包侧视时显示） */
.shelf-dock{
  pointer-events:auto;width:min(1560px, 100%);
  background:rgba(255,253,248,.90);backdrop-filter:blur(10px);
  border:1.5px solid rgba(226,210,180,.95);border-radius:18px;padding:8px 12px;
  box-shadow:0 12px 30px rgba(68,48,18,.14);
  display:flex;flex-direction:column;gap:6px;
}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.shelf-info{font-size:15px;font-weight:700;color:#4a3f2f}
.shelf-info em{font-style:normal;color:var(--accent)}
.book-pills{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.bpill{
  display:flex;align-items:center;justify-content:space-between;gap:2px;white-space:nowrap;
  padding:5px 6px;border-radius:11px;border:1.5px solid #e5d8bf;background:#faf5ea;
  font-size:12px;font-weight:700;color:#786c58;cursor:pointer;transition:all .14s;min-width:0;
}
.bpill:hover{border-color:#d8b38f;background:#fff}
.bpill.ready{background:linear-gradient(180deg,#fffaf0,#fdebd3);border-color:#ebb27d;color:#b8500a}
.bpill.sel{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff;box-shadow:0 3px 10px rgba(217,114,30,.28)}
.bpill .btag{font-size:10.5px;padding:1px 5px;border-radius:99px;background:rgba(0,0,0,.06);flex:none}
.bpill.ready .btag{background:#fff;color:#c85a0e}
.bpill.sel .btag{background:rgba(255,255,255,.24);color:#fff}

/* 3D 书名悬浮名牌 */
#bookHoverTag{
  position:absolute;left:0;top:0;z-index:8;display:none;pointer-events:none;
  padding:4px 14px;border-radius:99px;background:rgba(36,30,22,.88);color:#fff;
  font-size:15px;font-weight:700;white-space:nowrap;border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 6px 16px rgba(0,0,0,.22);transform:translate(-50%,-115%);
}
#bookHoverTag.show{display:block}

/* ===== 状态 3：极简精装科学手记翻书层 ===== */
#bookOverlay{
  position:absolute;inset:0;z-index:12;
  background:radial-gradient(ellipse at 50% 42%, #f8f3e8 0%, #ede3d1 66%, #e3d6be 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 28px 78px;
}
#bookOverlay.show{display:flex;animation:bookFade .38s cubic-bezier(.2,.8,.3,1)}
@keyframes bookFade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* 书本本体（高留白精装对开双页，占画面 ~90%） */
.book-stage{
  flex:1 1 auto;min-height:0;width:min(1240px, 100%);height:100%;
  display:flex;align-items:center;justify-content:center;
  perspective:2400px;position:relative;
}
.book-shell{
  position:relative;width:100%;max-width:1200px;height:min(100%, 780px);min-height:480px;
  display:grid;grid-template-columns:1fr 1fr;
  border-radius:16px;padding:9px;
  background:linear-gradient(90deg, #754b2a 0%, #8f5f38 3%, #6e4525 49.4%, #4f2f17 50%, #6e4525 50.6%, #8f5f38 97%, #754b2a 100%);
  box-shadow:0 26px 64px rgba(48,32,14,.20), 0 4px 12px rgba(48,32,14,.10), 0 3px 0 #5b371b;
  transform-style:preserve-3d;
}
/* 纸张厚度叠边 */
.book-shell::before,.book-shell::after{
  content:"";position:absolute;top:14px;bottom:14px;width:8px;pointer-events:none;
  background:repeating-linear-gradient(90deg,#f7f1e3 0 1.5px,#dcd0ba 1.5px 3px);
}
.book-shell::before{left:2px;border-radius:4px 0 0 4px}
.book-shell::after{right:2px;border-radius:0 4px 4px 0}

.page{
  position:relative;overflow:hidden;
  background:#fdfbf6;
  padding:28px 34px 44px;
  display:flex;flex-direction:column;gap:16px;
}
.page.left{
  border-radius:8px 0 0 8px;
  background:linear-gradient(90deg, #f8f3e8 0%, #fdfbf6 7%, #fdfbf6 93%, #ece2cf 100%);
  border-right:1px solid rgba(112,86,52,.14);
}
.page.right{
  border-radius:0 8px 8px 0;
  background:linear-gradient(90deg, #ece2cf 0%, #fdfbf6 7%, #fdfbf6 93%, #f8f3e8 100%);
}
.pg-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:10px;border-bottom:1px solid rgba(182,164,134,.36);flex:none;
}
.pg-head-l{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pg-dot{width:7px;height:7px;border-radius:50%;flex:none}
.pg-kicker{
  font-size:12.5px;font-weight:700;color:#6c5d47;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pg-meta{
  font-size:12px;font-weight:700;color:#93846c;letter-spacing:.04em;white-space:nowrap;flex:none;
}
.pg-meta.is-done{
  color:#237442;background:#edf9f0;border:1px solid #bce4c7;padding:2px 9px;border-radius:99px;
}
.pg-body{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  position:relative;overflow-y:auto;padding-right:2px;
}
.pg-body::-webkit-scrollbar{width:5px}
.pg-body::-webkit-scrollbar-thumb{background:rgba(166,148,118,.35);border-radius:99px}
.pg-foot{
  position:absolute;bottom:14px;left:34px;right:34px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;font-weight:600;color:#a0917a;letter-spacing:.04em;pointer-events:none;
}
.page.left .pg-foot{flex-direction:row}
.page.right .pg-foot{flex-direction:row-reverse}

/* ===== Spread 0 左页：精装目录 ===== */
.toc-header{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.toc-title{
  margin:0;font-family:var(--f-serif);font-size:25px;font-weight:700;
  letter-spacing:.12em;color:#241c13;line-height:1.3;
}
.toc-sub{font-size:12.5px;color:#857761;letter-spacing:.03em}
.toc-list{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;align-content:start;
  overflow-y:auto;padding-right:4px;
}
.toc-list::-webkit-scrollbar{width:5px}
.toc-list::-webkit-scrollbar-thumb{background:rgba(166,148,118,.35);border-radius:99px}
.toc-u{
  grid-column:1 / span 2;display:flex;align-items:center;gap:7px;
  font-family:var(--f-serif);font-size:12.5px;font-weight:700;color:#665742;
  margin-top:8px;padding:2px 0 4px;border-bottom:1px solid rgba(196,178,148,.32);
}
.toc-u:first-child{margin-top:0}
.toc-u i{width:6px;height:6px;border-radius:50%;flex:none}
.toc-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 9px;border-radius:9px;border:1px solid transparent;background:transparent;
  font-size:13px;font-weight:600;color:#33291d;cursor:pointer;text-align:left;transition:all .14s;
}
.toc-item:hover{background:rgba(241,231,211,.62);border-color:rgba(208,188,154,.65);color:#b24b0d}
.toc-item-l{display:inline-flex;align-items:center;gap:6px;min-width:0}
.toc-no{font-size:11px;font-weight:700;color:#9b8b72;font-variant-numeric:tabular-nums;flex:none}
.toc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-fl{font-size:11px;flex:none}
.toc-item .tp{font-size:11px;color:#a09077;font-weight:600;flex:none;font-variant-numeric:tabular-nums}

/* ===== Spread 0 右页：卷首科学手记 + 推荐 3D 实验启动区 ===== */
.intro-wrap{display:flex;flex-direction:column;justify-content:space-between;gap:14px;height:100%}
.intro-top{display:flex;flex-direction:column;gap:10px}
.intro-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.14em;color:#9a7b52;text-transform:uppercase;
}
.intro-title{
  margin:0;font-family:var(--f-serif);font-size:24px;font-weight:700;color:#221a12;
  line-height:1.42;letter-spacing:.03em;
}
.intro-lead{
  margin:0;font-family:var(--f-serif);font-size:14px;color:#625542;line-height:1.75;
}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.unit-card{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;
  border:1px solid rgba(206,190,162,.62);background:rgba(255,254,250,.78);
  cursor:pointer;text-align:left;transition:all .16s;
}
.unit-card:hover{
  background:#fff;border-color:rgba(217,98,26,.55);transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(68,48,18,.07);
}
.unit-card-dot{width:8px;height:8px;border-radius:50%;flex:none}
.unit-card-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.unit-card-num{font-size:11px;font-weight:700;color:#8e7e64}
.unit-card-name{
  font-family:var(--f-serif);font-size:13.5px;font-weight:700;color:#2c2318;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== 课次对开左页：本课科学手记卡片 ===== */
.note-wrap{display:flex;flex-direction:column;justify-content:flex-start;gap:22px;height:100%}
.note-hero{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.note-lesson-no{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#9a8567;
  display:inline-flex;align-items:center;gap:8px;
}
.note-title{
  margin:0;font-family:var(--f-serif);font-size:30px;font-weight:700;color:#211a11;
  line-height:1.5;letter-spacing:.04em;
}
.note-rule{width:34px;height:2.5px;border-radius:99px;opacity:.75}
.note-sub{
  margin:0;font-size:13.5px;color:#6c5d47;letter-spacing:.03em;line-height:1.55;
}
.note-card{
  background:rgba(255,254,250,.86);border:1px solid rgba(206,190,162,.62);
  border-radius:14px;padding:16px 18px;
  box-shadow:0 4px 16px rgba(68,48,18,.04);
  display:flex;flex-direction:column;gap:11px;
}
.note-card-hd{
  font-size:11.5px;font-weight:800;letter-spacing:.12em;color:#8e7a5d;
  display:flex;align-items:center;justify-content:space-between;
}
.note-points{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.note-pt{
  display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#342a1e;line-height:1.55;
}
.note-pt-idx{
  font-family:var(--f-serif);font-size:12px;font-weight:700;color:#a0855c;
  min-width:20px;padding-top:2px;font-variant-numeric:tabular-nums;flex:none;
}
.note-pt-txt{font-family:var(--f-serif);font-size:15px;font-weight:600;color:#2b2217}
.note-quote{
  margin-top:auto;
  border-left:2.5px solid var(--accent);padding:12px 15px;border-radius:0 12px 12px 0;
  background:linear-gradient(90deg, rgba(247,237,219,.62) 0%, rgba(253,251,246,.3) 100%);
  display:flex;flex-direction:column;gap:4px;
}
.note-quote-lbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:#9c6533}
.note-quote p{
  margin:0;font-family:var(--f-serif);font-size:14px;color:#4a3d2d;line-height:1.68;
}

/* ===== 右页：3D 互动实验直接启动预览区 ===== */
.lab-wrap{display:flex;flex-direction:column;justify-content:center;gap:14px;height:100%}
.lab-stage-card{
  position:relative;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  text-decoration:none;color:inherit;
  border-radius:18px;padding:22px 22px 20px;
  background:linear-gradient(160deg, #fffefb 0%, #fbf4e6 100%);
  border:1px solid rgba(206,184,148,.78);
  box-shadow:0 10px 28px rgba(68,48,18,.07), inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .2s cubic-bezier(.2,.8,.3,1), border-color .2s, box-shadow .2s;
  overflow:hidden;
}
.lab-stage-card:hover{
  transform:translateY(-2px);border-color:rgba(217,98,26,.65);
  box-shadow:0 16px 36px rgba(178,75,13,.14), inset 0 1px 0 #fff;
}
.lab-stage-card.is-done{
  border-color:rgba(64,145,108,.55);
  background:linear-gradient(160deg, #fcfffd 0%, #f0faf3 100%);
}
.lab-visual{
  position:relative;flex:1 1 auto;min-height:150px;
  border-radius:14px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.92) 0%, rgba(246,236,216,.65) 58%, rgba(238,225,200,.45) 100%);
  border:1px solid rgba(214,197,168,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:16px;
}
.lab-visual::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 62px, rgba(186,164,128,.16) 63px, transparent 64px),
    radial-gradient(circle at 50% 50%, transparent 106px, rgba(186,164,128,.11) 107px, transparent 108px);
}
.lab-badge{
  position:absolute;top:12px;left:12px;z-index:2;
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  background:rgba(255,253,248,.92);border:1px solid rgba(208,190,158,.75);
  font-size:11px;font-weight:700;color:#7a6345;letter-spacing:.04em;
}
.lab-badge.is-done{color:#217141;border-color:#b2dfbe;background:#eefaf2}
.lab-medallion{
  position:relative;z-index:1;width:96px;height:96px;border-radius:26px;
  background:#fff;border:1px solid rgba(226,208,178,.85);
  box-shadow:0 12px 26px rgba(100,72,32,.10), 0 2px 6px rgba(100,72,32,.05);
  display:grid;place-items:center;transition:transform .24s ease;
}
.lab-stage-card:hover .lab-medallion{transform:scale(1.05)}
.lab-medallion svg{width:68px;height:68px}
.lab-info{display:flex;flex-direction:column;gap:7px}
.lab-title{
  margin:0;font-family:var(--f-serif);font-size:21px;font-weight:700;color:#231b12;line-height:1.5;
}
.lab-desc{
  margin:0;font-size:13.5px;color:#625543;line-height:1.65;
}
.lab-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.lab-chip{
  font-size:11.5px;font-weight:600;color:#78654a;
  padding:2px 9px;border-radius:99px;background:rgba(241,231,212,.72);
  border:1px solid rgba(214,198,170,.55);
}
.lab-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;
}
.lab-hint{font-size:12px;color:#8f7f67;font-weight:600}
.lab-cta{
  display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;
  background:#2c2319;color:#fdfbf6;font-size:13.5px;font-weight:700;letter-spacing:.03em;
  box-shadow:0 6px 16px rgba(44,35,25,.18);transition:all .16s;white-space:nowrap;
}
.lab-stage-card:hover .lab-cta{background:var(--accent);box-shadow:0 8px 20px rgba(217,98,26,.28)}
.lab-stage-card.is-done .lab-cta{background:#247345}

/* 双实验课（k1a-02 / k1a-03 / k1b-08）精巧上下双卡 */
.lab-dual-wrap{display:flex;flex-direction:column;gap:12px;height:100%}
.lab-stage-card.is-dual{padding:16px 18px;gap:10px}
.lab-stage-card.is-dual .lab-dual-row{display:flex;align-items:center;gap:14px;min-height:0}
.lab-stage-card.is-dual .lab-medallion{width:68px;height:68px;border-radius:18px;flex:none}
.lab-stage-card.is-dual .lab-medallion svg{width:48px;height:48px}
.lab-stage-card.is-dual .lab-title{font-size:18px;line-height:1.45}
.lab-stage-card.is-dual .lab-desc{font-size:13px;line-height:1.55}
.lab-stage-card.is-dual .lab-cta{padding:7px 14px;font-size:12.5px}

/* Spread 0 底部精简推荐启动卡 */
.intro-lab-card{
  display:flex;flex-direction:column;gap:10px;padding:15px 17px;border-radius:16px;
  text-decoration:none;color:inherit;
  background:linear-gradient(155deg, #fffefb 0%, #faf0de 100%);
  border:1px solid rgba(212,184,142,.82);
  box-shadow:0 8px 22px rgba(68,48,18,.07);transition:all .18s;
}
.intro-lab-card:hover{
  transform:translateY(-2px);border-color:rgba(217,98,26,.65);
  box-shadow:0 12px 28px rgba(178,75,13,.13);
}
.intro-lab-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.intro-lab-tag{
  font-size:11px;font-weight:800;letter-spacing:.08em;color:#b24b0d;
  padding:2px 9px;border-radius:99px;background:rgba(253,231,207,.85);
}
.intro-lab-mid{display:flex;align-items:center;gap:12px}
.intro-lab-ico{
  width:56px;height:56px;border-radius:15px;flex:none;background:#fff;
  border:1px solid rgba(226,208,178,.85);display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(68,48,18,.07);
}
.intro-lab-ico svg{width:40px;height:40px}
.intro-lab-txt{min-width:0;flex:1}
.intro-lab-txt h4{margin:0;font-family:var(--f-serif);font-size:17px;font-weight:700;color:#241c13;line-height:1.45}
.intro-lab-txt p{margin:2px 0 0;font-size:12.5px;color:#6b5c47;line-height:1.5}
.intro-lab-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:2px}
.intro-lab-card .lab-cta{padding:7px 15px;font-size:12.5px}

/* 线下展演指引卡（k1b-14） */
.offline-card{
  flex:1 1 auto;border-radius:18px;padding:24px 22px;
  background:linear-gradient(160deg,#fffefb 0%,#f7f1e4 100%);
  border:1px solid rgba(206,190,162,.72);
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
}
.offline-steps{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.offline-step{
  padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.8);
  border:1px solid rgba(214,198,170,.55);font-size:13px;color:#3d3224;line-height:1.5;
}
.offline-step b{display:block;font-family:var(--f-serif);font-size:14px;color:#241c13;margin-bottom:2px}

/* 翻页 3D 动效叶片 */
#flipLeaf{
  position:absolute;top:9px;bottom:9px;width:calc(50% - 9px);
  pointer-events:none;display:none;transform-style:preserve-3d;z-index:10;
}
#flipLeaf.fwd{left:50%;transform-origin:left center;display:block;animation:leafFwd .38s cubic-bezier(.45,.05,.55,.95) forwards}
#flipLeaf.bwd{left:9px;transform-origin:right center;display:block;animation:leafBwd .38s cubic-bezier(.45,.05,.55,.95) forwards}
.leaf-face{
  position:absolute;inset:0;border-radius:0 8px 8px 0;
  background:linear-gradient(90deg,#e9dec7 0%,#fdfbf6 16%,#f8f2e4 100%);
  box-shadow:-6px 0 22px rgba(68,48,18,.16);backface-visibility:hidden;
}
#flipLeaf.bwd .leaf-face{border-radius:8px 0 0 8px;background:linear-gradient(270deg,#e9dec7 0%,#fdfbf6 16%,#f8f2e4 100%)}
@keyframes leafFwd{0%{transform:rotateY(0deg)}100%{transform:rotateY(-180deg)}}
@keyframes leafBwd{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}

/* ===== 极简悬浮胶囊导航 + 目录切课浮层 ===== */
.dock-anchor{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  z-index:30;display:flex;flex-direction:column;align-items:center;
}
.book-dock{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 7px;border-radius:999px;
  background:rgba(255,253,248,.90);backdrop-filter:blur(14px);
  border:1px solid rgba(196,178,148,.62);
  box-shadow:0 10px 28px rgba(48,34,16,.13), 0 1px 3px rgba(48,34,16,.06);
  white-space:nowrap;
}
.dock-btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;
  border:none;background:transparent;font-size:13.5px;font-weight:700;color:#45392a;
  cursor:pointer;transition:background .14s, color .14s;white-space:nowrap;
}
.dock-btn:hover:not(:disabled){background:rgba(232,218,194,.55);color:#1f1810}
.dock-btn[aria-expanded="true"]{background:#2c2319;color:#fdfbf6}
.dock-btn:disabled{opacity:.32;cursor:not-allowed}
.dock-sep{width:1px;height:18px;background:rgba(186,168,138,.45);flex:none;margin:0 2px}
.dock-pager{display:inline-flex;align-items:center;gap:2px}
.dock-icon-btn{
  width:34px;height:34px;border-radius:999px;border:none;background:transparent;
  color:#45392a;display:grid;place-items:center;cursor:pointer;font-size:18px;font-weight:700;
  transition:background .14s, color .14s;
}
.dock-icon-btn:hover:not(:disabled){background:rgba(232,218,194,.58);color:#1f1810}
.dock-icon-btn:disabled{opacity:.3;cursor:not-allowed}
.dock-icon-btn.is-muted{color:#a89b86}
.pg-counter{
  font-size:12.5px;font-weight:700;color:#6e604b;padding:0 8px;
  min-width:68px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* 目录/切课弹出卡片 */
.toc-drawer{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  width:min(400px, calc(100vw - 24px));max-height:min(64vh, 480px);
  background:rgba(255,253,249,.97);backdrop-filter:blur(16px);
  border:1px solid rgba(196,178,148,.75);border-radius:18px;
  box-shadow:0 20px 48px rgba(48,32,14,.20);
  display:none;flex-direction:column;overflow:hidden;
}
.toc-drawer.show{display:flex;animation:drawerUp .18s ease-out}
@keyframes drawerUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.drawer-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px;border-bottom:1px solid rgba(206,190,162,.45);
  background:rgba(248,242,230,.72);
}
.drawer-vols{display:inline-flex;gap:4px;background:rgba(228,215,190,.55);padding:3px;border-radius:999px}
.dvol-btn{
  border:none;background:transparent;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:700;color:#625440;cursor:pointer;transition:all .13s;
}
.dvol-btn.act{background:#fff;color:#b24b0d;box-shadow:0 1px 4px rgba(48,32,14,.10)}
.drawer-py{
  border:1px solid rgba(196,178,148,.65);background:#fff;border-radius:999px;
  padding:4px 10px;font-size:11.5px;font-weight:700;color:#5c4e3b;cursor:pointer;
}
.drawer-py:hover{border-color:var(--accent);color:var(--accent)}
.drawer-list{
  overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:3px;
}
.drawer-list::-webkit-scrollbar{width:5px}
.drawer-list::-webkit-scrollbar-thumb{background:rgba(166,148,118,.35);border-radius:99px}
.drawer-u{
  font-size:11.5px;font-weight:800;color:#8b7b63;letter-spacing:.05em;
  padding:8px 8px 3px;display:flex;align-items:center;gap:6px;
}
.drawer-u i{width:6px;height:6px;border-radius:50%}
.drawer-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:10px;border:none;background:transparent;
  font-size:13px;font-weight:600;color:#33291d;cursor:pointer;text-align:left;transition:background .12s;
}
.drawer-item:hover{background:#f5ecdc;color:#b24b0d}
.drawer-item.act{background:#fdebd5;color:#a8440a;font-weight:700}
.drawer-item small{font-size:11px;color:#93846c;font-weight:600;flex:none}

/* ===== 备用目录总览模式 ===== */
#catalogView{
  width:min(1440px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:24px;
}
.cat-filters{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px 14px;border-radius:18px;background:rgba(255,253,248,.88);
  border:1.5px solid var(--line);box-shadow:var(--shadow-sm);
}
.f-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:2px 14px;border-radius:99px;
  border:1.5px solid var(--line);background:#faf5ea;font-size:15px;font-weight:700;color:#5a4f3e;cursor:pointer;
}
.f-pill[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:var(--accent-lo);color:#fff}
.f-pill .dot{width:8px;height:8px;border-radius:50%}
.f-pill[aria-pressed="true"] .dot{background:#fff!important}
.unit-sec{
  background:rgba(255,253,248,.9);border:1.5px solid rgba(226,212,185,.95);
  border-radius:22px;padding:16px 20px 20px;box-shadow:var(--shadow-sm);
}
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px dashed rgba(190,170,136,.38);flex-wrap:wrap}
.unit-title-wrap{display:flex;align-items:center;gap:10px}
.unit-num{padding:3px 11px;border-radius:10px;color:#fff;font-size:14px;font-weight:800}
.unit-head h2{margin:0;font-size:26px;font-family:var(--f-serif)}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.unit-sec.cols3 .cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ccard{
  display:flex;flex-direction:column;text-decoration:none;border-radius:18px;overflow:hidden;
  background:#fff;border:1.5px solid #e8dcc4;box-shadow:0 3px 10px rgba(70,50,20,.05);
  transition:transform .16s, border-color .16s, box-shadow .16s;
}
.ccard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 24px rgba(191,84,9,.14)}
.cthumb{
  position:relative;height:106px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fef6e4,#fdebd0);border-bottom:1px solid #f0e3ca;
}
.cthumb svg{width:72px;height:72px}
.cno{position:absolute;left:10px;top:8px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.92);border:1px solid #e8d9be;font-size:12px;font-weight:800;color:#5a4d3a}
.cpg{position:absolute;right:10px;top:8px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.88);font-size:11px;font-weight:700;color:#8a7b62}
.cbody{padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.cbody h3{margin:0;font-size:20px;line-height:1.6;color:#241e16}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:#faf3e4;border:1px solid #ead8b8;color:#7a551e}
.cfoot{margin-top:auto;padding-top:7px;border-top:1px dashed rgba(210,192,160,.55);display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#7b705e}
.cfoot .go{color:var(--accent)}

/* 响应式（平板与 390px 手机） */
@media (max-width:1180px){
  .book-pills{grid-template-columns:repeat(6,minmax(0,1fr))}
  .cat-grid,.unit-sec.cols3 .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:22px 24px 38px}
  .pg-foot{left:24px;right:24px}
}
@media (max-width:860px){
  body.stage-locked .shell{height:auto;min-height:100vh}
  body.book-open .shell{height:auto;min-height:100vh}
  .shell{padding:8px 10px 16px;gap:8px}
  .topbar{padding:7px 10px;border-radius:16px;gap:8px}
  .brand-mark{width:34px;height:34px;border-radius:10px}
  .brand-mark svg{width:22px;height:22px}
  .brand-t h1{font-size:17px}
  .brand-sub{display:none}
  .prog-hud{min-width:0;padding:4px 10px;gap:6px;flex:1 1 auto}
  .prog-flower{font-size:13px}
  .prog-txt{font-size:10px}
  .resume-btn{min-height:32px;padding:0 9px;font-size:12px}
  .search-wrap{display:none}
  .mtab{min-height:36px;padding:0 10px;font-size:14px}
  .tool-btn{min-height:36px;padding:0 10px;font-size:13px}
  #stageWrap{min-height:78vh;border-radius:18px}
  body.book-open #stageWrap{min-height:100vh;overflow:visible}
  .bag-hud{padding:10px 10px}
  .stage-badge{font-size:14px;padding:5px 12px}
  .big-cta{font-size:17px;min-height:44px;padding:2px 16px}
  .soft-cta{font-size:14px;min-height:42px;padding:2px 12px}
  .shelf-dock{padding:8px 10px;border-radius:15px;gap:6px}
  .shelf-info{font-size:13px;line-height:1.4}
  .book-pills{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:112px;overflow-y:auto;padding-right:2px}
  .bpill{font-size:12px;padding:5px 8px;white-space:nowrap}
  #bookOverlay{position:relative;inset:auto;min-height:100vh;padding:12px 12px 84px;justify-content:flex-start}
  .book-stage{height:auto;align-items:flex-start}
  .book-shell{grid-template-columns:1fr;height:auto;min-height:0;gap:12px;padding:7px;width:100%;border-radius:14px}
  .book-shell::before,.book-shell::after{display:none}
  .page.left,.page.right{border-radius:10px;border-right:none;padding:18px 16px 38px;min-height:0;gap:12px}
  .pg-body{overflow-y:visible;padding-right:0}
  .pg-foot{left:16px;right:16px;bottom:11px}
  .toc-list{grid-template-columns:1fr;max-height:none;overflow-y:visible}
  .toc-u{grid-column:auto}
  .note-title{font-size:23px}
  .intro-title{font-size:20px}
  .unit-grid{grid-template-columns:1fr 1fr;gap:6px}
  .lab-stage-card{padding:16px 15px}
  .lab-visual{min-height:124px;padding:12px}
  .lab-medallion{width:76px;height:76px;border-radius:20px}
  .lab-medallion svg{width:54px;height:54px}
  .lab-title{font-size:18px}

  spine.position.x = -BOOK.w / 2 + 0.012; g.add(spine);

}
function disposeRig() {
  if (!openRig) return;
  scene.remove(openRig);
  openRig.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
  openRig.userData.own.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
  openRig = null;
}

function updateCam3D() {
  if (!camera) return;
  var ce = Math.cos(cam.el);
  camera.position.set(
    cam.target.x + cam.D * ce * Math.sin(cam.phi),
    cam.target.y + cam.D * Math.sin(cam.el),
    cam.target.z + cam.D * ce * Math.cos(cam.phi)
  );
  camera.lookAt(cam.target);
}
function render3D() {
  if (!renderer) return;
  updateCam3D();
  renderer.render(scene, camera);
}
function kick3D() {
  if (!renderer || looping) return;
  looping = true; lastT = performance.now();
  renderer.setAnimationLoop(frame3D);
}
function setMatFade(m, v) {
  var tr = v < 0.995;
  if (m.transparent !== tr && !m.alphaTest) { m.transparent = tr; m.needsUpdate = true; }
  else if (m.alphaTest && !m.transparent) { m.transparent = true; m.needsUpdate = true; }
  m.opacity = v;
}
function applyFade(v) {
  if (!bagGroup) return;
  bagMats.forEach(function (m) { setMatFade(m, v); });
  bookMeshes.forEach(function (bm, i) {
    var keep = fly && fly.idx === i;
    var ov = keep ? 1 : v;
    bm.material.forEach(function (m) { setMatFade(m, ov); });
    if (!(keep && openRig)) bm.visible = keep || v > 0.01;
  });
  bagGroup.visible = v > 0.01;
}
function applyDoor() {
  if (!doorPivot) return;
  var s = Math.max(0.035, 1 - 0.965 * doorVal);
  doorPivot.scale.y = s;
  doorPull.position.y = 0.51 + 3.92 * s - 0.16;
  doorRoll.visible = doorVal > 0.12;
  var rs = 0.45 + 0.55 * doorVal;
  doorRoll.scale.set(rs, 1, rs);
}

function stepFly(dt) {
  fly.t += dt;
  var t = fly.t, bm = bookMeshes[fly.idx], ud = bm.userData;
  var a = ez(t / 0.55);            // 从侧门滑出
  var b = ez((t - 0.38) / 0.80);   // 往上飞，镜头跟着一起飞
  var r = ez((t - 0.78) / 0.60);   // 转身，封面正对镜头
  var o = ez((t - 1.32) / 0.72);   // 封面绕书脊翻开
  var px = ud.baseX - a * 3.1;
  var py = ud.baseY + fly.l0 * 0.40 * (1 - a) + a * 0.30 + b * 3.0;
  var pz = ud.baseZ * (1 - r);
  bm.position.set(px, py, pz);
  bm.rotation.set(0, -r * Math.PI / 2, 0);
  bagFade = 1 - clamp01((t - 0.42) / 0.62);   // 书包渐渐消失
  applyFade(bagFade);
  if (o > 0.001 && !openRig) { openRig = buildOpenRig(fly.idx); bm.visible = false; }
  if (openRig) {
    openRig.position.copy(bm.position);
    openRig.rotation.copy(bm.rotation);
    openRig.userData.pivot.rotation.y = -o * Math.PI * 0.97;
  }
  var mob = window.innerWidth < 860;
  var Dfin = mob ? 16 : 7.6;
  var c0 = fly.c0;
  camGoal.tx = c0.tx + (px - c0.tx) * b;
  camGoal.ty = c0.ty + (py - c0.ty) * b;
  camGoal.tz = c0.tz + ((pz - o * BOOK.w / 2) - c0.tz) * Math.max(b, r);
  camGoal.D = c0.D + (Dfin - c0.D) * b;
  camGoal.phi = -Math.PI / 2; camGoal.el = 0.05;
  if (t >= 2.05 && !fly.done) { fly.done = true; setBagMode('book'); }
  if (fly && t >= 2.6) fly = null;
}

function frame3D(now) {
  var dt = Math.max(0.001, Math.min((now - lastT) / 1000, 0.05)); lastT = now;
  var k = 1 - Math.exp(-5.2 * dt);
  var kl = 1 - Math.exp(-13 * dt);
  var kd = 1 - Math.exp(-6.5 * dt);
  var moving = false;

  if (fly) { stepFly(dt); moving = true; }

  [['phi', 'phi'], ['el', 'el'], ['D', 'D']].forEach(function (p) {
    var diff = camGoal[p[1]] - cam[p[0]];
    if (Math.abs(diff) > 0.0015) { cam[p[0]] += diff * k; moving = true; }
    else cam[p[0]] = camGoal[p[1]];
  });
  [['x', 'tx'], ['y', 'ty'], ['z', 'tz']].forEach(function (p) {
    var diff = camGoal[p[1]] - cam.target[p[0]];
    if (Math.abs(diff) > 0.0015) { cam.target[p[0]] += diff * k; moving = true; }
    else cam.target[p[0]] = camGoal[p[1]];
  });

  if (Math.abs(doorGoal - doorVal) > 0.002) { doorVal += (doorGoal - doorVal) * kd; moving = true; }
  else doorVal = doorGoal;
  applyDoor();

  if (!fly) {
    if (Math.abs(bagFadeGoal - bagFade) > 0.004) { bagFade += (bagFadeGoal - bagFade) * kd; moving = true; applyFade(bagFade); }
    else if (bagFade !== bagFadeGoal) { bagFade = bagFadeGoal; applyFade(bagFade); }
  }

  bookMeshes.forEach(function (m, i) {
    if (fly && fly.idx === i) return;
    var goal = Math.max(liftGoal[i], (S.bagMode === 'side' && i === S.selBook) ? 0.2 : 0);
    var d = goal - lift[i];
    if (Math.abs(d) > 0.002) { lift[i] += d * kl; moving = true; } else lift[i] = goal;
    var ud = m.userData;
    m.position.set(ud.baseX - lift[i] * 0.10, ud.baseY + lift[i] * 0.40, ud.baseZ);
    m.rotation.set(0, 0, 0);
    m.material[1].emissiveIntensity = 0.26 + lift[i] * 0.30;
  });

  render3D();
  if (!moving) { renderer.setAnimationLoop(null); looping = false; }
}

function resize3D() {
  if (!renderer || S.view !== 'bag') return;
  vw = stageWrap.clientWidth; vh = stageWrap.clientHeight;
  if (!vw || !vh) return;
  renderer.setSize(vw, vh, false);
  camera.aspect = vw / vh;
  camera.updateProjectionMatrix();
  if (!fly && (S.bagMode === 'front' || S.bagMode === 'side')) { camGoal = camFor(S.bagMode); kick3D(); }
  render3D();
}

function resetShelf() {
  fly = null;
  disposeRig();
  bookMeshes.forEach(function (bm) {
    var ud = bm.userData;
    bm.visible = true;
    bm.rotation.set(0, 0, 0);
    bm.position.set(ud.baseX, ud.baseY, ud.baseZ);
  });
}

/* ========= 书包状态切换（正面 → 纯侧面看书脊 → 书飞起展开） ========= */

function setBagMode(mode) {

function updateBookSelection(idx) {
  S.selBook = idx;

  }

}
function bounceBook(idx) {
  if (lift[idx] !== undefined) { lift[idx] = 1.25; kick3D(); }
}

function pullAndOpenBook(idx) {
  var bk = BOOKS[idx];
  if (!bk || !bk.ready) { updateBookSelection(idx); bounceBook(idx); return; }
  if (VOLUMES[bk.id]) selectVolume(bk.id, { resetSpread: S.vol !== bk.id, silentRender: true });
  if (!renderer || !bookMeshes.length) { setBagMode('book'); return; }
  if (fly) return;
  updateBookSelection(idx);
  sfxSlide();
  S.bagMode = 'pulling';
  $('#bagHud').hidden = true;
  hoverTag.classList.remove('show');
  for (var i = 0; i < liftGoal.length; i++) liftGoal[i] = 0;
  doorGoal = 1;
  fly = { idx: idx, t: 0, l0: lift[idx] || 0, done: false,
          c0: { tx: cam.target.x, ty: cam.target.y, tz: cam.target.z, D: cam.D } };
  kick3D();
}

/* ========= 书脊悬停“波浪”、点击飞出 ========= */
var dragOrb = null;
function spineScreen(i) {
  var rect = canvas.getBoundingClientRect(), ud = bookMeshes[i].userData, v = new THREE.Vector3();
  var sx = ud.baseX - BOOK.w / 2;
  v.set(sx, ud.baseY, ud.baseZ).project(camera);
  var cx = (v.x + 1) / 2 * rect.width, cy = (1 - v.y) / 2 * rect.height;
  v.set(sx, ud.baseY + BOOK.h / 2, ud.baseZ).project(camera);
  var ty = (1 - v.y) / 2 * rect.height;
  v.set(sx, ud.baseY - BOOK.h / 2, ud.baseZ).project(camera);
  var by = (1 - v.y) / 2 * rect.height;
  return { x: cx, y: cy, top: ty, bot: by, clientX: rect.left + cx, clientY: rect.top + cy };
}
function clearWave() {
  var had = false;
  for (var i = 0; i < liftGoal.length; i++) { if (liftGoal[i]) had = true; liftGoal[i] = 0; }
  S.hoverBook = -1;
  hoverTag.classList.remove('show');
  if (had) kick3D();
}
function waveCenter(idx) {
  for (var i = 0; i < liftGoal.length; i++) { var d = i - idx; liftGoal[i] = Math.exp(-d * d / 1.6); }
  kick3D();
}
function waveAt(e) {
  if (!renderer || S.bagMode !== 'side' || fly || !bookMeshes.length) return -1;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var ps = bookMeshes.map(function (_, i) { return spineScreen(i); });
  var n = ps.length;
  var pitch = Math.abs(ps[1].x - ps[0].x) || 1;
  var x0 = Math.min(ps[0].x, ps[n - 1].x) - pitch * 1.1, x1 = Math.max(ps[0].x, ps[n - 1].x) + pitch * 1.1;
  if (mx < x0 || mx > x1 || my < ps[0].top - 50 || my > ps[0].bot + 30) {
    clearWave(); canvas.style.cursor = 'default'; return -1;
  }
  var best = 0, bd = 1e9;
  ps.forEach(function (p, i) {
    var d = (mx - p.x) / pitch;
    liftGoal[i] = Math.exp(-d * d / 1.6);   // 高斯波峰：鼠标滑过时相邻书依次抬起再落下
    if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
  });
  S.hoverBook = best;
  var bk = BOOKS[best];
  var srect = stageWrap.getBoundingClientRect();
  hoverTag.textContent = bk.label + (bk.ready ? ' · 点一下飞出翻开' : ' · 待制作');
  hoverTag.style.left = (rect.left - srect.left + ps[best].x) + 'px';
  hoverTag.style.top = (rect.top - srect.top + ps[best].top - 34) + 'px';
  hoverTag.classList.add('show');
  canvas.style.cursor = 'pointer';
  kick3D();
  return best;
}
function hitBooks(e) {
  if (!renderer || !bookMeshes.length) return null;
  var rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  var hits = raycaster.intersectObjects(bookMeshes.filter(function (m) { return m.visible; }), false);
  if (hits.length) return { type: 'book', idx: hits[0].object.userData.bookIdx };
  return null;
}

canvas.addEventListener('pointerdown', function (e) {
  if (S.bagMode !== 'front' && S.bagMode !== 'side') return;
  dragOrb = { x: e.clientX, y: e.clientY, phi: cam.phi, el: cam.el, moved: 0 };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
});
canvas.addEventListener('pointermove', function (e) {
  if (S.bagMode !== 'front' && S.bagMode !== 'side') return;
  if (dragOrb) {
    var dx = e.clientX - dragOrb.x, dy = e.clientY - dragOrb.y;
    dragOrb.moved = Math.max(dragOrb.moved, Math.hypot(dx, dy));
    if (S.bagMode === 'front' && dragOrb.moved > 6) {
      cam.phi = THREE.MathUtils.clamp(dragOrb.phi - dx * 0.007, -0.9, 1.3);
      cam.el = THREE.MathUtils.clamp(dragOrb.el + dy * 0.004, 0.04, 0.7);
      camGoal.phi = cam.phi; camGoal.el = cam.el;
      render3D();
      return;
    }
  }
  if (S.bagMode === 'side') waveAt(e);
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragOrb) return;
  var moved = dragOrb.moved;
  dragOrb = null;
  if (S.bagMode === 'front') {
    if (moved < 8) { sfxZip(); setBagMode('side'); }
    return;
  }
  if (S.bagMode === 'side' && moved < 14) {
    var h = hitBooks(e);
    var idx = (h && h.type === 'book') ? h.idx : waveAt(e);
    if (idx == null || idx < 0) return;
    if (BOOKS[idx].ready) pullAndOpenBook(idx);
    else { updateBookSelection(idx); bounceBook(idx); }
  }
});
canvas.addEventListener('pointerleave', function () { if (S.bagMode === 'side') clearWave(); });
$('#bookPills').addEventListener('pointerover', function (e) {
  var b = e.target.closest('.bpill');
  if (b && S.bagMode === 'side') waveCenter(+b.dataset.bidx);
});
$('#bookPills').addEventListener('pointerleave', function () { if (S.bagMode === 'side') clearWave(); });
window.__hubSpine = function (i) { return renderer && bookMeshes[i] ? spineScreen(i) : null; };
window.__hubFlyT = function () { return fly ? fly.t : -1; };

/* ========= 分册切换 + 独立学习进度与小红花读写（xk_k1a_progress / xk_k1b_progress / xk_k2a_progress） ========= */
function readProgress(volId) {
  var v = VOLUMES[volId || S.vol] || curVol();
  try {
    var raw = localStorage.getItem(v.progressKey);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function isLiveDone(fileId, volId) {
  var p = readProgress(volId);
  return !!(p && p[fileId] && p[fileId].done);
}
function lessonFlowersFor(lid, volId) {
  var v = VOLUMES[volId || S.vol] || curVol();
  var p = readProgress(v.id), cnt = 0;
  v.liveIds.forEach(function (id) {
    if ((id === lid || id.indexOf(lid + '-') === 0) && p[id] && p[id].done) cnt++;
  });
  return cnt;
}
function countVolDone(volId) {
  var v = VOLUMES[volId || S.vol] || curVol();
  var p = readProgress(v.id), done = 0;
  v.liveIds.forEach(function (id) { if (p[id] && p[id].done) done++; });
  return { done: done, total: v.liveIds.length };
}
function nextLiveEntry(v) {
  var p = readProgress(v.id);
  var firstEntry = null;
  for (var i = 0; i < v.lessons.length; i++) {
    var l = v.lessons[i];
    var labs = v.lessonLabs[l.id] || [];
    for (var j = 0; j < labs.length; j++) {
      var file = labs[j].pd.file || l.id;
      var item = { lesson: l, lab: labs[j], file: file, sp: i + 1 };
      if (!firstEntry) firstEntry = item;
      if (!(p[file] && p[file].done)) return item;
    }
  }
  return firstEntry;
}

function renderVolChrome() {
  var v = curVol();
  var cf = $('#catFilters');
  if (cf) {
    cf.innerHTML = v.catFilters.map(function (f) {
      return '<button class="f-pill" type="button" data-filter="' + f.key + '" aria-pressed="' + String(S.filter === f.key) + '"><span class="dot" style="background:' + f.color + '"></span>' + esc(f.label) + '</button>';
    }).join('');
  }
  $$('#catVolTabs .mtab').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.vol === v.id));
  });
  $$('#drawerVols .dvol-btn').forEach(function (b) {
    b.classList.toggle('act', b.dataset.dvol === v.id);
  });
  renderTocDrawer();
}

function selectVolume(volId, opts) {
  if (!VOLUMES[volId]) return;
  opts = opts || {};
  var changed = S.vol !== volId;
  S.vol = volId;
  S.selBook = VOLUMES[volId].bookIdx;
  if (opts.resetSpread || changed) S.spread = 0;
  if (changed) S.filter = 'all';
  try { sessionStorage.setItem('xk_last_vol', volId); } catch (e) {}
  renderVolChrome();
  updateProgressUI();
  if (!opts.silentRender) {
    if (S.view === 'catalog') renderCatalog();
    if (S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
  }
  saveState();
}

function updateProgressUI() {
  var v = curVol();
  var p = readProgress(v.id);
  var liveIds = v.liveIds;
  var total = liveIds.length;
  var doneCount = 0, flowerCount = 0;
  liveIds.forEach(function (id) {
    if (p[id] && p[id].done) {
      doneCount++;
      flowerCount += (p[id].flower === false ? 0 : 1);
    }
  });
  var pct = total ? Math.round((doneCount / total) * 100) : 0;
  var fEl = $('#progFlower'), bEl = $('#progBarFill'), tEl = $('#progTxt');
  if (fEl) fEl.textContent = '🌸 ' + flowerCount + ' / ' + total;
  if (bEl) bEl.style.width = pct + '%';
  if (tEl) tEl.textContent = v.short + '已完成 ' + doneCount + ' / ' + total + ' 页';
  var rBtn = $('#resumeBtn');
  if (rBtn) {
    var nextId = liveIds.find(function (id) { return !(p[id] && p[id].done); });
    if (nextId) {
      rBtn.href = 'lessons/' + nextId + '.html';
      rBtn.textContent = doneCount === 0 ? '▶ 开始学' : '▶ 接着学';
      rBtn.title = '一键进入《' + v.label + '》下一张未完成的活页（' + nextId + '）';
    } else {
      rBtn.href = 'lessons/' + liveIds[0] + '.html';
      rBtn.textContent = '🎉 全部通关';
      rBtn.title = '《' + v.label + '》全部 ' + total + ' 张活页都已拿到小红花啦！';
    }
  }
  var ct = $('#catProgTitle'), cf = $('#catProgFill'), cfl = $('#catProgFlowers');
  if (ct) ct.textContent = '🌸 ' + v.label + '小红花：' + doneCount + ' / ' + total + ' 张活页';
  if (cf) cf.style.width = pct + '%';
  if (cfl) {
    var flHtml = '';
    for (var i = 0; i < total; i++) {
      flHtml += i < flowerCount ? '<span title="已获得小红花">🌸</span>' : '<span style="opacity:.25" title="待解锁">✿</span>';
    }
    cfl.innerHTML = flHtml;
  }
}

function renderTocDrawer() {
  var listEl = $('#drawerList');
  if (!listEl) return;
  var v = curVol();
  var byUnit = { u1: [], u2: [], u3: [], u4: [] };
  v.lessons.forEach(function (l, idx) { byUnit[l.u].push({ l: l, sp: idx + 1 }); });
  var html = '<button class="drawer-item' + (S.spread === 0 ? ' act' : '') + '" type="button" data-drawer-sp="0">' +
    '<span>📖 全册目录与卷首手记</span><small>' + esc(v.short) + '</small></button>';
  ['u1', 'u2', 'u3', 'u4'].forEach(function (uk) {
    var u = v.units[uk];
    html += '<div class="drawer-u"><i style="background:' + u.color + '"></i><span>' + esc(u.num) + ' · ' + esc(u.name) + '</span></div>';
    byUnit[uk].forEach(function (item) {
      var l = item.l;
      var fc = lessonFlowersFor(l.id, v.id);
      html += '<button class="drawer-item' + (S.spread === item.sp ? ' act' : '') + '" type="button" data-drawer-sp="' + item.sp + '">' +
        '<span>' + pad2(l.no) + '. ' + esc(l.name) + (fc > 0 ? ' ' + '🌸'.repeat(fc) : '') + '</span><small>' + esc(l.p) + '</small></button>';
    });
  });
  listEl.innerHTML = html;
}

function renderSpread(sp, dir) {
  var v = curVol();
  sp = Math.max(0, Math.min(v.spreadCount, sp));
  S.spread = sp;

  if (dir) {
    var leaf = $('#flipLeaf');
    leaf.className = '';
    void leaf.offsetWidth;
    leaf.className = dir;
    sfxFlip();
    setTimeout(function () { leaf.className = ''; }, 400);
  }

  var elL = $('#pageLeft'), elR = $('#pageRight');
  if (sp === 0) {
    elL.innerHTML = renderTocPage(v);
    elR.innerHTML = renderIntroPage(v);
  } else {
    var lesson = v.lessons[sp - 1];
    elL.innerHTML = renderLessonNotePage(v, lesson, sp);
    elR.innerHTML = renderLessonLabPage(v, lesson, sp);
  }

  var totalSp = v.spreadCount + 1;
  var tocLbl = $('#dockTocLabel');
  if (sp === 0) {
    $('#pgCounter').textContent = '目录 · 1/' + totalSp;
    if (tocLbl) tocLbl.textContent = '目录 · ' + v.short;
  } else {
    var cl = v.lessons[sp - 1];
    $('#pgCounter').textContent = (sp + 1) + ' / ' + totalSp;
    if (tocLbl) tocLbl.textContent = '第 ' + cl.no + ' 课 · ' + (cl.name.length > 6 ? cl.name.slice(0, 6) + '…' : cl.name);
  }

  $('#prevPageBtn').disabled = sp <= 0;
  $('#nextPageBtn').disabled = sp >= v.spreadCount;
  renderTocDrawer();
  if (dir && window.innerWidth <= 860) {
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
  }
  saveState();
}

function syncSoundUI() {
  var btn = $('#soundBtn'), onI = $('#soundIcoOn'), offI = $('#soundIcoOff');
  if (!btn) return;
  btn.setAttribute('aria-pressed', String(S.soundOn));
  btn.classList.toggle('is-muted', !S.soundOn);
  btn.title = S.soundOn ? '声音：开（点击静音）' : '声音：关（点击开启）';
  if (onI) onI.hidden = !S.soundOn;
  if (offI) offI.hidden = S.soundOn;
}
function togglePinyin() {
  S.pyOn = !S.pyOn;
  document.body.classList.toggle('no-py', !S.pyOn);
  var lbl = S.pyOn ? '拼音：开' : '拼音：关';
  var pb = $('#pyBtn'), dpb = $('#drawerPyBtn');
  if (pb) { pb.setAttribute('aria-pressed', String(S.pyOn)); pb.textContent = lbl; }
  if (dpb) dpb.textContent = lbl;
}

function setViewMode(mode) {
  S.view = mode;
  var isBag = mode === 'bag';
  closeTocDrawer();
  $('#stageWrap').hidden = !isBag;
  $('#catalogView').hidden = isBag;
  document.body.classList.toggle('stage-locked', isBag);
  document.body.classList.toggle('book-open', isBag && S.bagMode === 'book');
  $('#tabBag').setAttribute('aria-pressed', String(isBag));
  $('#tabCatalog').setAttribute('aria-pressed', String(!isBag));
  if (isBag) { resize3D(); if (S.bagMode === 'book') renderSpread(S.spread, null); }
  else { renderVolChrome(); renderCatalog(); }
  saveState();
}

function saveState() {
  try {
    sessionStorage.setItem('xk_bag_state', JSON.stringify({ vol: S.vol, view: S.view, bagMode: S.bagMode === 'pulling' ? 'book' : S.bagMode, spread: S.spread }));
    sessionStorage.setItem('xk_last_vol', S.vol);
  } catch (e) {}
}
function restoreState() {
  try {
    var qVol = new URLSearchParams(location.search).get('vol');
    if (qVol && VOLUMES[qVol]) {
      selectVolume(qVol, { resetSpread: true, silentRender: true });
    }
    var raw = sessionStorage.getItem('xk_bag_state') || sessionStorage.getItem('k1a_bag_state');
    if (!raw) {
      var lastV = sessionStorage.getItem('xk_last_vol');
      if (!qVol && lastV && VOLUMES[lastV]) selectVolume(lastV, { resetSpread: true, silentRender: true });
      return;
    }
    var st = JSON.parse(raw);
    if (!qVol && st && st.vol && VOLUMES[st.vol]) {
      selectVolume(st.vol, { resetSpread: false, silentRender: true });
    }
    if (st && typeof st.spread === 'number') S.spread = Math.max(0, Math.min(curVol().spreadCount, st.spread));
    if (st && st.view === 'catalog') { setViewMode('catalog'); return; }
    if (st && (st.bagMode === 'book' || st.bagMode === 'side')) setBagMode(st.bagMode);
  } catch (e) {}
}

var SEARCH_INDEX = [];
Object.keys(VOLUMES).forEach(function (vk) {
  var v = VOLUMES[vk];
  Object.keys(v.pages).sort(function (a, b) { return (+a) - (+b); }).forEach(function (pStr) {
    var pd = v.pages[pStr];
    if (pd && pd.pos !== 'none' && pd.lid) {
      var l = v.lmap[pd.lid];
      var file = pd.file || l.id;
      SEARCH_INDEX.push({
        vol: vk,
        short: v.short,
        p: +pStr,
        sp: v.lessonSpreadMap[l.id] || 0,
        file: file,
        title: '[' + v.short + '] 第' + l.no + '课 · ' + pd.act,
        sub: 'P' + pStr + ' · ' + l.name,
        hay: (v.short + ' ' + v.label + ' p' + pStr + ' 第' + l.no + '课 ' + l.name + ' ' + pd.act + ' ' + pd.desc + ' ' + l.tags.join(' ') + ' ' + l.foot).toLowerCase()
      });
    }
  });
});
var searchIn = $('#hubSearch'), searchDrop = $('#searchDrop');
function updateSearchDrop() {
  var q = (searchIn.value || '').trim().toLowerCase();
  if (!q) { searchDrop.classList.remove('show'); return; }
  var hits = SEARCH_INDEX.filter(function (x) { return x.hay.indexOf(q) !== -1; }).slice(0, 8);
  var pm = q.match(/^p?(\d{1,2})$/i);
  var html = '';
  if (pm) {
    var v = curVol();
    var pn = Math.max(1, Math.min(v.maxPage, +pm[1]));
    var pInfo = v.pages[pn];
    var targetSp = (pInfo && pInfo.lid && v.lessonSpreadMap[pInfo.lid]) ? v.lessonSpreadMap[pInfo.lid] : 0;
    var targetTitle = targetSp > 0 ? ('第 ' + v.lessons[targetSp - 1].no + ' 课《' + v.lessons[targetSp - 1].name + '》') : '全册目录';
    html += '<button class="sdrop-item" type="button" data-search-sp="' + targetSp + '"><span>📖 翻到《' + v.short + '》' + esc(targetTitle) + '</span><small>P' + pn + '</small></button>';
  }
  hits.forEach(function (h) {
    html += '<a class="sdrop-item" href="lessons/' + h.file + '.html"><span>' + esc(h.title) + (isLiveDone(h.file, h.vol) ? ' 🌸' : '') + '</span><small>' + esc(h.sub) + '</small></a>';
  });
  if (!html) html = '<div style="padding:8px 10px;font-size:12.5px;color:#8a7b62">没有找到匹配课目，试试输入“磁铁”“纸桥”“月亮”“空气”</div>';
  searchDrop.innerHTML = html;
  searchDrop.classList.add('show');
}
searchIn.addEventListener('input', updateSearchDrop);
searchIn.addEventListener('focus', updateSearchDrop);
searchDrop.addEventListener('click', function (e) {
  var spBtn = e.target.closest('[data-search-sp]');
  if (spBtn) {
    searchDrop.classList.remove('show');
    searchIn.value = '';
    setViewMode('bag');
    setBagMode('book');
    renderSpread(+spBtn.dataset.searchSp, 'fwd');
  }
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('#dockAnchor')) closeTocDrawer();
  if (!e.target.closest('#searchWrap')) searchDrop.classList.remove('show');
});

window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeTocDrawer(); return; }
  if (document.activeElement === searchIn) return;
  if (S.view !== 'bag' || S.bagMode !== 'book') return;
  if (e.key === 'ArrowRight' && S.spread < curVol().spreadCount) renderSpread(S.spread + 1, 'fwd');
  if (e.key === 'ArrowLeft' && S.spread > 0) renderSpread(S.spread - 1, 'bwd');
});

  setViewMode: setViewMode,
  renderSpread: renderSpread,
  pullAndOpenBook: pullAndOpenBook,
  updateProgressUI: updateProgressUI,
  pyErrors: pyErrors,
  info: function () {
    return renderer ? { triangles: renderer.info.render.triangles, looping: looping, pixelRatio: renderer.getPixelRatio(), vol: S.vol } : { webgl: false, vol: S.vol };
  }
};

/* ========= 启动 ========= */
syncSoundUI();
renderVolChrome();
updateProgressUI();
window.addEventListener('pageshow', function () {
  updateProgressUI();
  renderCatalog();
  if (S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
});
window.addEventListener('focus', function () {
  updateProgressUI();
});
window.addEventListener('storage', function (e) {
  if (e.key === 'xk_k1a_progress' || e.key === 'xk_k1b_progress' || e.key === 'xk_k2a_progress') {
    updateProgressUI();
    renderCatalog();
    if (S.view === 'bag' && S.bagMode === 'book') renderSpread(S.spread, null);
  }
});
init3D();
resize3D();
renderCatalog();
restoreState();
})();
</script>
</body>
</html>
